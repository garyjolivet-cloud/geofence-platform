name: secret-scan

# Fails the run if a secret is detected in the pushed commits or the PR diff.
# This is the CI backstop; the local .githooks/pre-commit hook is the first line.
# gitleaks-action is free for personal / individual-account repos (no license key).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so a push of many commits is fully scanned
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
