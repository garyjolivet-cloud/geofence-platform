<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chase Life — Code Library</title>
<script src="role-gate.js"></script>
<script src="client-picker.js"></script>
<script>RoleGate.require(['admin']);</script>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --night:#0a1018;--slate:#141d2b;--slate-2:#1b2738;--rim:#2e3f58;--coral:#ff6a3d;
         --snow:#ffffff;--ice:#c8dff2;--fog:#8aa5bf;--hazard:#ff2f4e;--go:#38e0a6;--amber:#ffc24d; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Barlow",system-ui,sans-serif;background:var(--night);color:var(--snow);overflow:hidden}
  body{display:flex;flex-direction:column}
  .hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rim);background:rgba(10,16,24,.95);flex:0 0 auto}
  .hdr h1{font-family:"Black Han Sans";font-size:17px;margin:0;flex:0 0 auto}
  .hdr .crumb{font-family:"Barlow Condensed";font-size:13px;color:var(--fog);flex:1;min-width:0}
  .hdr a{font-family:"Barlow Condensed";font-size:13px;color:var(--ice);text-decoration:none;border:1px solid var(--rim);border-radius:7px;padding:6px 12px;white-space:nowrap}
  .hdr a:hover{border-color:var(--ice)}
  button{font-family:"Barlow Condensed";font-weight:600;text-transform:uppercase;letter-spacing:.4px;
         font-size:12px;color:var(--snow);background:var(--slate);border:1px solid var(--rim);border-radius:8px;
         padding:7px 12px;cursor:pointer}
  button.on{background:var(--coral);border-color:var(--coral);color:#1a0d07}
  button.ghost{background:none}
  button.danger{border-color:var(--hazard);color:var(--hazard)}
  button:disabled{opacity:.4;cursor:default}
  input,select{font-family:"Barlow Condensed";font-size:13px;background:var(--slate-2);
         color:var(--snow);border:1px solid var(--rim);border-radius:8px;padding:6px 9px}
  .hint{font-family:"Barlow";font-size:12px;color:var(--fog)}
  #main{flex:1;overflow-y:auto;padding:20px 24px}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .co-card{border:1px solid var(--rim);border-radius:12px;padding:14px;background:rgba(255,255,255,.02)}
  .co-card h3{margin:0 0 4px;font-family:"Barlow Condensed";font-size:15px;display:flex;align-items:center;gap:6px}
  .co-card .desc{font-family:"Barlow";font-size:12px;color:var(--fog);min-height:32px;margin-bottom:8px}
  .co-tag{display:inline-block;font-family:"Barlow Condensed";font-size:10px;text-transform:uppercase;letter-spacing:.4px;
         padding:2px 7px;border-radius:5px;border:1px solid var(--rim);color:var(--fog)}
  .co-tag.builtin{border-color:var(--amber);color:var(--amber)}
  .co-tag.custom{border-color:var(--go);color:var(--go)}
  .co-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .co-actions button{flex:1 1 auto;font-size:11px;padding:6px 8px}
  #empty{padding:40px;text-align:center;color:var(--fog);font-family:"Barlow Condensed";font-size:14px}
</style>
</head>
<body>

<div class="hdr">
  <h1>🧩 Code Library</h1>
  <span class="crumb" id="hdrCrumb">reusable behaviors — attach to hundreds of stops without rewiring each one</span>
  <nav id="clientNav" style="display:flex;align-items:center;gap:8px"></nav>
  <a href="/editor">Editor →</a>
  <a href="/studio">Audio Studio →</a>
  <a href="/chatterbox">Chatterbox Studio →</a>
  <a href="/">Home</a>
</div>

<div id="main">
  <div class="toolbar">
    <button class="on" id="btnNew">+ New Code Object</button>
    <span class="hint" id="toolbarHint"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div id="empty" style="display:none">select a customer above to see its code object library</div>
</div>

<script>
function getToken(){ return localStorage.getItem("gp.session")||""; }
function authHeaders(){ return {authorization:"Bearer "+getToken()}; }
function currentOrg(){ return (window.ClientPicker && ClientPicker.resolve()) || ""; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
async function errDetail(r){ try{ const j=await r.json(); return j.error||r.status; }catch(e){ return r.status; } }

let objects = [];

async function loadObjects(){
  const org = currentOrg();
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  if (!org){ grid.innerHTML=""; empty.style.display="block"; empty.textContent="select a customer above to see its code object library"; return; }
  empty.style.display = "none";
  grid.innerHTML = '<div class="hint">loading…</div>';
  try {
    const r = await fetch("/api/code-objects?org=" + encodeURIComponent(org), { headers: authHeaders() });
    if (!r.ok){ grid.innerHTML=""; empty.style.display="block"; empty.textContent="couldn't load: "+await errDetail(r); return; }
    objects = await r.json();
    renderGrid(org);
  } catch(e){ grid.innerHTML=""; empty.style.display="block"; empty.textContent="couldn't load: "+e.message; }
}

function renderGrid(org){
  const grid = document.getElementById("grid");
  if (!objects.length){ grid.innerHTML=""; document.getElementById("empty").style.display="block";
    document.getElementById("empty").textContent="no code objects yet — click + New Code Object, or ask an admin to grant one of the built-ins"; return; }
  document.getElementById("empty").style.display = "none";
  grid.innerHTML = "";
  objects.forEach(obj => {
    const isBuiltIn = obj.orgId == null;
    const card = document.createElement("div");
    card.className = "co-card";
    card.innerHTML =
      "<h3>" + esc(obj.icon) + " " + esc(obj.name) + "</h3>" +
      "<div class=\"desc\">" + esc(obj.description||"") + "</div>" +
      "<span class=\"co-tag " + (isBuiltIn?"builtin":"custom") + "\">" + (isBuiltIn?"built-in":"custom") + "</span> " +
      "<span class=\"co-tag\">" + esc(obj.category) + "</span> " +
      "<span class=\"co-tag\">v" + obj.version + "</span>";
    const actions = document.createElement("div");
    actions.className = "co-actions";
    const editBtn = document.createElement("button");
    editBtn.textContent = "Edit →";
    editBtn.onclick = () => location.href = "/pipeline?codeObject=" + encodeURIComponent(obj.id) + "&org=" + encodeURIComponent(org);
    actions.appendChild(editBtn);
    if (isBuiltIn) {
      const dupBtn = document.createElement("button");
      dupBtn.className = "ghost";
      dupBtn.textContent = "Duplicate as custom";
      dupBtn.onclick = () => duplicateObject(obj, org);
      actions.appendChild(dupBtn);
    } else {
      const delBtn = document.createElement("button");
      delBtn.className = "danger ghost";
      delBtn.textContent = "Delete";
      delBtn.onclick = () => deleteObject(obj, org);
      actions.appendChild(delBtn);
    }
    card.appendChild(actions);
    grid.appendChild(card);
  });
}

async function duplicateObject(obj, org){
  const name = prompt("Name for the duplicate:", obj.name + " (copy)");
  if (!name) return;
  try {
    const full = await fetch("/api/code-objects/" + encodeURIComponent(obj.id)).then(r=>r.json());
    const r = await fetch("/api/code-objects", {
      method: "POST", headers: { "content-type":"application/json", ...authHeaders() },
      body: JSON.stringify({ orgId: org, name, description: full.description, icon: full.icon,
        category: full.category, template: full.template, paramSchema: full.paramSchema })
    });
    if (!r.ok){ alert("Duplicate failed: " + await errDetail(r)); return; }
    const created = await r.json();
    location.href = "/pipeline?codeObject=" + encodeURIComponent(created.id) + "&org=" + encodeURIComponent(org);
  } catch(e){ alert("Duplicate failed: " + e.message); }
}

async function deleteObject(obj, org){
  if (!confirm("Delete \"" + obj.name + "\"? Stops that already reference it will simply stop finding a definition to execute.")) return;
  try {
    const r = await fetch("/api/code-objects/" + encodeURIComponent(obj.id), { method: "DELETE", headers: authHeaders() });
    if (!r.ok){ alert("Delete failed: " + await errDetail(r)); return; }
    loadObjects();
  } catch(e){ alert("Delete failed: " + e.message); }
}

document.getElementById("btnNew").onclick = async () => {
  const org = currentOrg();
  if (!org){ alert("Select a customer first."); return; }
  const name = prompt("Name for the new code object (e.g. \"Avalanche Warning\"):");
  if (!name) return;
  try {
    const r = await fetch("/api/code-objects", {
      method: "POST", headers: { "content-type":"application/json", ...authHeaders() },
      body: JSON.stringify({ orgId: org, name, template: { v:1, nodes:[], edges:[] }, paramSchema: [] })
    });
    if (!r.ok){ alert("Create failed: " + await errDetail(r)); return; }
    const created = await r.json();
    location.href = "/pipeline?codeObject=" + encodeURIComponent(created.id) + "&org=" + encodeURIComponent(org);
  } catch(e){ alert("Create failed: " + e.message); }
};

if (window.ClientPicker) ClientPicker.init({ navEl: document.getElementById("clientNav"), onChange: loadObjects });
loadObjects();
</script>
</body>
</html>
