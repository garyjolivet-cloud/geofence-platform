<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chase Life — Pipeline Editor</title>
<script src="role-gate.js"></script>
<script>RoleGate.require(['admin']);</script>
<script src="pipeline-runtime.js"></script>
<script src="client-picker.js"></script>
<script src="top-nav.js"></script>
<script src="code-objects.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --night:#0a1018;--slate:#141d2b;--slate-2:#1b2738;--rim:#2e3f58;--coral:#ff6a3d;
         --snow:#ffffff;--ice:#c8dff2;--fog:#8aa5bf;--hazard:#ff2f4e;--go:#38e0a6;--amber:#ffc24d; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Barlow",system-ui,sans-serif;background:var(--night);color:var(--snow);overflow:hidden}
  .hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rim);background:rgba(10,16,24,.95)}
  .hdr h1{font-family:"Black Han Sans";font-size:16px;margin:0}
  .hdr .sub{font-family:"Barlow Condensed";font-size:12px;color:var(--fog);flex:1}
  .hdr a{font-family:"Barlow Condensed";font-size:13px;color:var(--ice);text-decoration:none;border:1px solid var(--rim);border-radius:7px;padding:6px 12px}
  button{font-family:"Barlow Condensed";font-weight:600;text-transform:uppercase;letter-spacing:.4px;
         font-size:13px;color:var(--snow);background:var(--slate);border:1px solid var(--rim);border-radius:9px;
         padding:8px 14px;cursor:pointer}
  button.on{background:var(--coral);border-color:var(--coral);color:#1a0d07}
  button.ghost{background:none}
  input,select,textarea{font-family:"Barlow Condensed";font-size:13px;background:var(--slate-2);
         color:var(--snow);border:1px solid var(--rim);border-radius:8px;padding:7px 10px;width:100%}
  /* A select's own background/color style its closed box fine, but most
     browsers render the opened dropdown popup with their own default
     (usually white) background regardless — combined with the light text
     color inherited into the popup, options become near-invisible white-on-
     white ("a few white lines", confirmed live 2026-08-07 on zoneSelect
     params). Styling <option> directly fixes the popup itself where the
     browser allows it (Chrome/Edge/Firefox all honor this). */
  select option{background:var(--slate-2);color:var(--snow)}
  textarea{min-height:60px;resize:vertical;line-height:1.4}
  label.field{display:block;font-family:"Barlow Condensed";font-size:11px;text-transform:uppercase;
         letter-spacing:.5px;color:var(--fog);margin:10px 0 4px}
  .layout{display:flex;height:calc(100% - 52px)}
  .library{width:220px;min-width:160px;max-width:60vw;resize:horizontal;overflow:auto;
         border-right:1px solid var(--rim);padding:10px;flex:0 0 auto;
         display:flex;flex-direction:column;gap:8px}
  .library h3{font-family:"Barlow Condensed";font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--fog);margin:2px 0 0}
  .library-body{flex:1 1 auto;min-height:0}
  /* All three side columns use the same drag-to-resize pattern as the Audio
     Studio/Chatterbox rails (resize:horizontal + flex:0 0 auto — a fixed
     flex-basis is required or the flex layout overrides any manual resize) —
     drag the handle at each column's bottom-right corner to trade space
     between it and its neighbor. */
  .palette{width:180px;min-width:120px;max-width:50vw;resize:horizontal;overflow:auto;
         border-right:1px solid var(--rim);padding:10px;flex:0 0 auto;
         display:flex;flex-direction:column;gap:6px}
  .palette h3{font-family:"Barlow Condensed";font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--fog);margin:12px 0 6px}
  #paletteSaveRow{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  #palette{flex:1 1 auto;min-height:0}
  .blk-card{background:var(--slate);border:1px solid var(--rim);border-radius:8px;padding:8px 10px;
         margin-bottom:6px;cursor:grab;font-family:"Barlow Condensed";font-size:13px}
  .blk-card:hover{border-color:var(--coral)}
  .blk-card.cat-trigger{border-left:3px solid var(--go)}
  .blk-card.cat-data{border-left:3px solid var(--ice)}
  .blk-card.cat-logic{border-left:3px solid var(--amber)}
  .blk-card.cat-action{border-left:3px solid var(--coral)}
  .canvas-wrap{flex:1;position:relative;overflow:auto;background:
         linear-gradient(var(--slate-2) 1px,transparent 1px) 0 0/24px 24px,
         linear-gradient(90deg,var(--slate-2) 1px,transparent 1px) 0 0/24px 24px, var(--night)}
  svg{display:block;min-width:2000px;min-height:1400px}
  .pnode rect{fill:var(--slate);stroke:var(--rim);stroke-width:1.5;rx:9}
  .pnode.sel rect{stroke:var(--coral);stroke-width:2}
  .pnode text.title{fill:var(--snow);font-family:"Barlow Condensed";font-size:12px;font-weight:600}
  .pnode text.port-label{fill:var(--fog);font-family:"Barlow Condensed";font-size:10px}
  .port{cursor:crosshair}
  .port.gate{fill:var(--amber)}
  .port.value{fill:var(--ice)}
  .port:hover{stroke:var(--coral);stroke-width:2}
  .pedge{fill:none;stroke:var(--fog);stroke-width:2}
  .pedge.gate{stroke:var(--amber)}
  .pedge-temp{fill:none;stroke:var(--coral);stroke-width:2;stroke-dasharray:4 3}
  .del-x{fill:var(--hazard);cursor:pointer;font-family:"Barlow Condensed";font-size:12px}
  /* resize:horizontal always grows/shrinks a box from its *right* edge —
     fine for .library/.palette (their right edge borders the rest of the
     layout) but wrong for .props, the rightmost column, whose right edge
     is the outer window edge (dragging that corner has nowhere to go).
     direction:rtl flips which edge the native resize handle anchors to
     (left instead of right) and where it visually sits (bottom-left) —
     the useful edge here, since .props's left edge borders the canvas.
     direction:ltr on the content wrapper keeps text/layout reading normally. */
  .props{width:240px;min-width:180px;max-width:60vw;resize:horizontal;overflow:auto;
         border-left:1px solid var(--rim);padding:12px;flex:0 0 auto;direction:rtl}
  .props>*{direction:ltr}
  .props h3{font-family:"Barlow Condensed";font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px}
  .props .empty{font-family:"Barlow Condensed";font-size:12px;color:var(--fog)}
  #errBanner{display:none;background:var(--hazard);color:#fff;font-family:"Barlow Condensed";font-size:12px;
         padding:6px 16px}
  #saveMsg{font-family:"Barlow Condensed";font-size:12px;color:var(--go)}
  .insert-row{display:flex;gap:6px;align-items:center;margin-top:4px}
  .insert-row button{flex:0 0 auto;font-size:11px;padding:5px 8px}
  .field-warn{font-family:"Barlow Condensed";font-size:11px;color:var(--hazard);margin-top:4px;line-height:1.3}
  /* Chip field — the non-programmer-facing replacement for typing/seeing raw
     {{n10.pctComplete}} text. Looks/behaves like the plain textarea next to
     it (same font/colors/padding) but inserted values render as rounded
     pill tokens with a plain-English label instead of the bracket syntax;
     the underlying {{id.port}} text is only ever reconstructed on save
     (see serializeChipField) — findBrokenRefs/interpolate() never change. */
  .chip-field{min-height:60px;max-height:240px;overflow-y:auto;font-family:"Barlow Condensed";
         font-size:13px;background:var(--slate-2);color:var(--snow);border:1px solid var(--rim);
         border-radius:8px;padding:7px 10px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
  .chip-field:focus{outline:2px solid var(--coral);outline-offset:-1px}
  .chip{display:inline-flex;align-items:center;background:rgba(255,106,61,.18);border:1px solid var(--coral);
         color:var(--coral);border-radius:999px;padding:1px 9px;margin:0 1px;font-size:12px;font-weight:600;
         white-space:nowrap;cursor:default}
  .chip.broken{background:rgba(255,47,78,.18);border-color:var(--hazard);color:var(--hazard)}
  .node-id-tag{fill:var(--fog);font-family:"Barlow Condensed";font-size:9px;opacity:.7}
  .insert-menu{position:fixed;z-index:600;background:var(--slate-2);border:1px solid var(--rim);
         border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.45);min-width:220px;max-height:60vh;overflow-y:auto}
  .insert-menu button{display:block;width:100%;text-align:left;background:none;border:none;
         color:var(--snow);padding:8px 10px;font-family:"Barlow Condensed";font-size:12px;cursor:pointer;
         border-radius:0}
  .insert-menu button:hover{background:rgba(255,255,255,.06)}
  .insert-menu .port-name{color:var(--ice)}
  .insert-menu .node-hint{color:var(--fog);font-size:10px}
  .insert-menu .empty{padding:10px;color:var(--fog);font-size:12px;cursor:default}
</style>
</head>
<body>
<div class="hdr">
  <h1>Pipeline Editor</h1>
  <div class="sub" id="ctxLabel">loading…</div>
</div>
<div id="topNav"></div>
<div id="errBanner"></div>
<div class="layout">
  <div class="library" id="libraryCol" style="display:none">
    <button id="btnNewCodeObject" class="on">+ New Code Object</button>
    <h3>Code Library</h3>
    <div class="library-body" id="libraryBody"></div>
  </div>
  <div class="palette">
    <div id="paletteSaveRow">
      <button id="saveBtn" class="on">Save</button>
      <span id="saveMsg"></span>
    </div>
    <div id="palette"></div>
  </div>
  <div class="canvas-wrap">
    <svg id="svg"></svg>
  </div>
  <div class="props" id="props"><h3>Properties</h3><div class="empty">Select a node</div></div>
</div>

<script>
const qs = new URLSearchParams(location.search);
const projectId = qs.get("project");
const zoneId = qs.get("zone");
// codeObjectId is reassignable — picking a different object from the inline
// library sidebar (see showLibrary()/onCardClick below) switches modes in
// place instead of navigating to a separate page, per the merged-screen
// redesign (the standalone code-library.html this used to link to is gone).
let codeObjectId = qs.get("codeObject");
let libraryOrgId = qs.get("org") || (window.TopNav && TopNav.resolveCompany()) || "";
if(window.TopNav){
  TopNav.init({
    navEl: document.getElementById("topNav"), active: "code-library",
    onCompanyChange: (org) => { libraryOrgId = org; if (window.CodeObjects) CodeObjects.refresh(); }
  });
}

let bundle = null, zone = null, pipeline = { v: 1, nodes: [], edges: [] };
let folders = []; // [{id,parentId,name}] for zoneSelect's grouped picker — populated in load()
let selectedId = null;
let nextId = 1;
// Code-object authoring mode only: which node params are exposed for
// per-attachment override, keyed "nodeId:paramKey" -> {label}. Populated
// from the loaded paramSchema, edited via checkboxes in renderProps().
let exposedParams = {};
let codeObjectMeta = null; // {name,description,icon,category} of the object being authored

function getToken(){
  try{ const s = localStorage.getItem("gp.session"); if (s) return s; }catch(e){}
  return "";
}

function showErr(msg){
  const el = document.getElementById("errBanner");
  if (!msg){ el.style.display = "none"; return; }
  el.textContent = msg; el.style.display = "block";
}

// The library sidebar only makes sense when there's no single owning zone
// (raw zone.pipeline editing has no "library" concept) — shown for
// code-object mode and for the blank "just landed here" state, hidden in
// zone mode.
let _libraryMounted = false;
function showLibrary(){
  document.getElementById("libraryCol").style.display = "flex";
  if (!_libraryMounted && window.CodeObjects) {
    _libraryMounted = true;
    CodeObjects.mount(document.getElementById("libraryBody"), {
      embedded: true,
      getOrgId: () => libraryOrgId,
      getToken,
      onCardClick: (id) => {
        codeObjectId = id;
        history.pushState(null, "", "/pipeline?codeObject=" + encodeURIComponent(id) + "&org=" + encodeURIComponent(libraryOrgId || "") + (projectId ? "&project=" + encodeURIComponent(projectId) : ""));
        loadCodeObject();
      }
    });
  } else if (window.CodeObjects) {
    // force=true: re-fetches past the org-keyed cache every time this runs
    // (including right after this same page creates a new object via its
    // own toolbar, or edits+saves one) so the sidebar never shows stale data.
    CodeObjects.refresh(true);
  }
}
document.getElementById("btnNewCodeObject").onclick = async () => {
  if (!libraryOrgId) { alert("Select a customer first."); return; }
  const name = (prompt('Name for the new code object (e.g. "Avalanche Warning"):') || "").trim();
  if (!name) return;
  try {
    const r = await fetch("/api/code-objects", {
      method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + getToken() },
      body: JSON.stringify({ orgId: libraryOrgId, name, template: { v: 1, nodes: [], edges: [] }, paramSchema: [] })
    });
    if (!r.ok) { alert("Create failed: " + ((await r.json().catch(() => ({}))).error || r.status)); return; }
    const created = await r.json();
    codeObjectId = created.id;
    history.pushState(null, "", "/pipeline?codeObject=" + encodeURIComponent(created.id) + "&org=" + encodeURIComponent(libraryOrgId) + (projectId ? "&project=" + encodeURIComponent(projectId) : ""));
    await loadCodeObject(); // showLibrary() inside this also refreshes the sidebar so the new card appears
  } catch (e) { alert("Create failed: " + e.message); }
};

// Confirmed live (2026-08-07): arriving via the general "Code Library →"
// link (?project= present, no ?zone=) never fetched the project's bundle at
// all — so a zoneSelect param edited on any code object from that project's
// context showed an empty picker even though the project genuinely has
// stops, because bundle/folders were only ever populated in zone-pipeline
// mode. Load them whenever projectId is present, regardless of which mode
// (zone pipeline / code object / blank library browse) we end up in — the
// zone list is a reasonable thing to have available in all three.
async function loadProjectContext(){
  if (!projectId) return;
  try {
    const r = await fetch("/api/projects/" + encodeURIComponent(projectId) + "/bundle");
    if (r.ok) bundle = await r.json();
  } catch (e) {}
  if (!bundle) return;
  // Folder names for zoneSelect's grouped picker — best-effort: a token-less
  // visitor context or a fetch failure just leaves everything ungrouped
  // under "No folder" rather than blocking anything from loading.
  try {
    const fr = await fetch("/api/stop-folder?projectId=" + encodeURIComponent(projectId), { headers: { authorization: "Bearer " + getToken() } });
    folders = fr.ok ? ((await fr.json()).folders || []) : [];
  } catch (e) { folders = []; }
}

async function load(){
  await loadProjectContext();
  if (codeObjectId) return loadCodeObject();
  // zoneId is the actual gate for raw-zone-pipeline mode — projectId alone
  // (no zoneId) means we arrived from the Code Objects palette's "Code
  // Library" link, which passes ?project= just to carry context for the
  // back link, not to open one zone's pipeline. That case falls through to
  // the library browser below like the fully-blank landing does.
  if (zoneId) {
    if (!projectId){ showErr("Missing ?project= in URL"); return; }
    if (!bundle){ showErr("Could not load bundle for project " + projectId); return; }
    zone = (bundle.zones || []).find(z => z.id === zoneId);
    if (!zone){ showErr("Zone " + zoneId + " not found in this project's bundle"); return; }
    pipeline = zone.pipeline && zone.pipeline.v === 1 ? zone.pipeline : { v: 1, nodes: [], edges: [] };
    nextId = 1 + pipeline.nodes.reduce((m, n) => Math.max(m, parseInt((n.id || "n0").slice(1)) || 0), 0);
    document.getElementById("ctxLabel").textContent = (bundle.name || projectId) + " — " + zone.name;
    renderPalette();
    render();
    return;
  }
  // No zone in view — either landed blank, or arrived with just ?project=
  // for context — browse the library either way.
  document.getElementById("ctxLabel").textContent = "pick an object from the library to start editing";
  showLibrary();
  renderPalette();
  render();
}

async function loadCodeObject(){
  showLibrary();
  selectedId = null; // switching objects must not leave stale props showing for a node id that may not exist in the newly-loaded one
  const r = await fetch("/api/code-objects/" + encodeURIComponent(codeObjectId));
  if (!r.ok){ showErr("Could not load code object " + codeObjectId); return; }
  const def = await r.json();
  codeObjectMeta = { name: def.name, description: def.description, icon: def.icon, category: def.category };
  pipeline = def.template && def.template.v === 1 ? def.template : { v: 1, nodes: [], edges: [] };
  exposedParams = {};
  (def.paramSchema || []).forEach(p => { exposedParams[p.nodeId + ":" + p.paramKey] = { label: p.label, type: p.type, default: p.default }; });
  nextId = 1 + pipeline.nodes.reduce((m, n) => Math.max(m, parseInt((n.id || "n0").slice(1)) || 0), 0);
  document.getElementById("ctxLabel").textContent = "Code Object: " + def.name + " (v" + def.version + ")";
  renderPalette();
  render();
}

function renderPalette(){
  const el = document.getElementById("palette");
  el.innerHTML = "";
  const cats = { trigger: "Triggers", data: "Data", logic: "Logic", action: "Actions" };
  Object.keys(cats).forEach(cat => {
    const h = document.createElement("h3"); h.textContent = cats[cat]; el.appendChild(h);
    Object.keys(PipelineRuntime.BLOCKS).forEach(type => {
      const def = PipelineRuntime.BLOCKS[type];
      if (def.category !== cat) return;
      const card = document.createElement("div");
      card.className = "blk-card cat-" + cat;
      card.textContent = def.label;
      card.draggable = true;
      card.addEventListener("dragstart", e => e.dataTransfer.setData("blockType", type));
      el.appendChild(card);
    });
  });
}

/* ===================== SVG canvas ===================== */
const svg = document.getElementById("svg");
const NODE_W = 150, PORT_ROW_H = 18, HEADER_H = 26;

function nodeHeight(node){
  const def = PipelineRuntime.BLOCKS[node.type];
  return HEADER_H + Math.max(def.inputs.length, def.outputs.length) * PORT_ROW_H + 10;
}
function portPos(node, portId, dir){
  const def = PipelineRuntime.BLOCKS[node.type];
  const list = dir === "in" ? def.inputs : def.outputs;
  const idx = list.findIndex(p => p.id === portId);
  const y = node.y + HEADER_H + idx * PORT_ROW_H + PORT_ROW_H / 2;
  const x = dir === "in" ? node.x : node.x + NODE_W;
  return { x, y };
}
function svgPoint(evt){
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

let drag = null; // {mode:'node'|'edge', ...}

function render(){
  svg.innerHTML = "";
  const w = Math.max(2000, ...pipeline.nodes.map(n => n.x + 400));
  const h = Math.max(1400, ...pipeline.nodes.map(n => n.y + 300));
  svg.setAttribute("width", w); svg.setAttribute("height", h);

  // edges
  pipeline.edges.forEach(e => {
    const fromNode = pipeline.nodes.find(n => n.id === e.from.n);
    const toNode = pipeline.nodes.find(n => n.id === e.to.n);
    if (!fromNode || !toNode) return;
    const a = portPos(fromNode, e.from.p, "out");
    const b = portPos(toNode, e.to.p, "in");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const def = PipelineRuntime.BLOCKS[toNode.type];
    const portDef = def.inputs.find(p => p.id === e.to.p);
    path.setAttribute("class", "pedge" + (portDef && portDef.type === "gate" ? " gate" : ""));
    path.setAttribute("d", bez(a, b));
    path.dataset.edgeId = e.id;
    path.addEventListener("click", ev => { ev.stopPropagation(); pipeline.edges = pipeline.edges.filter(x => x.id !== e.id); render(); });
    svg.appendChild(path);
  });

  pipeline.nodes.forEach(node => svg.appendChild(renderNode(node)));

  if (drag && drag.mode === "edge") {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("class", "pedge-temp");
    path.setAttribute("d", bez(drag.from, drag.cur));
    svg.appendChild(path);
  }
  renderProps();
}

function bez(a, b){
  const dx = Math.max(40, Math.abs(b.x - a.x) / 2);
  return "M" + a.x + "," + a.y + " C" + (a.x + dx) + "," + a.y + " " + (b.x - dx) + "," + b.y + " " + b.x + "," + b.y;
}

function renderNode(node){
  const def = PipelineRuntime.BLOCKS[node.type];
  const hgt = nodeHeight(node);
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("class", "pnode" + (node.id === selectedId ? " sel" : ""));
  g.setAttribute("transform", "translate(" + node.x + "," + node.y + ")");
  g.dataset.nodeId = node.id;

  const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  rect.setAttribute("width", NODE_W); rect.setAttribute("height", hgt); rect.setAttribute("rx", 9);
  g.appendChild(rect);

  const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
  title.setAttribute("class", "title"); title.setAttribute("x", 10); title.setAttribute("y", 17);
  title.textContent = def.label;
  g.appendChild(title);

  // Faint node-id tag — not needed to use the graph day-to-day (the "Insert
  // value" picker never requires typing/reading one), but visible here for
  // anyone debugging a saved template directly (e.g. via the API) instead
  // of needing dev tools to find out "what is n10".
  const idTag = document.createElementNS("http://www.w3.org/2000/svg", "text");
  idTag.setAttribute("class", "node-id-tag"); idTag.setAttribute("x", 10); idTag.setAttribute("y", hgt - 6);
  idTag.textContent = node.id;
  g.appendChild(idTag);

  const delX = document.createElementNS("http://www.w3.org/2000/svg", "text");
  delX.setAttribute("class", "del-x"); delX.setAttribute("x", NODE_W - 14); delX.setAttribute("y", 17);
  delX.textContent = "✕";
  delX.addEventListener("mousedown", ev => { ev.stopPropagation(); deleteNode(node.id); });
  g.appendChild(delX);

  def.inputs.forEach((p, i) => {
    const y = HEADER_H + i * PORT_ROW_H + PORT_ROW_H / 2;
    g.appendChild(portCircle(0, y, p.type, node.id, p.id, "in"));
    g.appendChild(portLabel(8, y + 3, p.id, "start"));
  });
  def.outputs.forEach((p, i) => {
    const y = HEADER_H + i * PORT_ROW_H + PORT_ROW_H / 2;
    g.appendChild(portCircle(NODE_W, y, p.type, node.id, p.id, "out"));
    g.appendChild(portLabel(NODE_W - 8, y + 3, p.id, "end"));
  });

  g.addEventListener("mousedown", ev => {
    if (ev.target.classList.contains("port") || ev.target.classList.contains("del-x")) return;
    selectedId = node.id;
    drag = { mode: "node", id: node.id, dx: svgPoint(ev).x - node.x, dy: svgPoint(ev).y - node.y };
    render();
  });

  return g;
}
function portCircle(x, y, type, nodeId, portId, dir){
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 5);
  c.setAttribute("class", "port " + type);
  c.dataset.nodeId = nodeId; c.dataset.portId = portId; c.dataset.dir = dir; c.dataset.portType = type;
  c.addEventListener("mousedown", ev => {
    ev.stopPropagation();
    const node = pipeline.nodes.find(n => n.id === nodeId);
    const p = portPos(node, portId, dir);
    if (dir === "out") drag = { mode: "edge", from: p, fromNode: nodeId, fromPort: portId, cur: p };
    else drag = { mode: "edge", from: p, toNode: nodeId, toPort: portId, cur: p, reverse: true };
  });
  return c;
}
function portLabel(x, y, text, anchor){
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("class", "port-label"); t.setAttribute("x", x); t.setAttribute("y", y);
  t.setAttribute("text-anchor", anchor); t.textContent = text;
  return t;
}

svg.addEventListener("mousedown", ev => { if (ev.target === svg) { selectedId = null; render(); } });
document.addEventListener("mousemove", ev => {
  if (!drag) return;
  const p = svgPoint(ev);
  if (drag.mode === "node") {
    const node = pipeline.nodes.find(n => n.id === drag.id);
    node.x = Math.max(0, p.x - drag.dx); node.y = Math.max(0, p.y - drag.dy);
    render();
  } else if (drag.mode === "edge") {
    drag.cur = p; render();
  }
});
document.addEventListener("mouseup", ev => {
  if (!drag) return;
  if (drag.mode === "edge") {
    const target = ev.target;
    if (target && target.classList && target.classList.contains("port")) {
      const nodeId = target.dataset.nodeId, portId = target.dataset.portId, dir = target.dataset.dir, portType = target.dataset.portType;
      let from, to;
      if (drag.fromNode && dir === "in") { from = { n: drag.fromNode, p: drag.fromPort }; to = { n: nodeId, p: portId }; }
      else if (drag.toNode && dir === "out") { from = { n: nodeId, p: portId }; to = { n: drag.toNode, p: drag.toPort }; }
      if (from && to) {
        const fromDef = PipelineRuntime.BLOCKS[pipeline.nodes.find(n => n.id === from.n).type];
        const toDef = PipelineRuntime.BLOCKS[pipeline.nodes.find(n => n.id === to.n).type];
        const outType = (fromDef.outputs.find(p => p.id === from.p) || {}).type;
        const inType = (toDef.inputs.find(p => p.id === to.p) || {}).type;
        const compatible = outType === inType || (outType === "gate") === (inType === "gate");
        if (compatible) {
          pipeline.edges = pipeline.edges.filter(e => !(e.to.n === to.n && e.to.p === to.p)); // one source per input
          pipeline.edges.push({ id: "e" + (nextId++), from, to });
        } else {
          showErr("Incompatible ports — can't connect a data value to a gate (or vice versa)");
          setTimeout(() => showErr(null), 2500);
        }
      }
    }
  }
  drag = null; render();
});

function deleteNode(id){
  pipeline.nodes = pipeline.nodes.filter(n => n.id !== id);
  pipeline.edges = pipeline.edges.filter(e => e.from.n !== id && e.to.n !== id);
  if (selectedId === id) selectedId = null;
  render();
}

svg.parentElement.addEventListener("dragover", ev => ev.preventDefault());
svg.parentElement.addEventListener("drop", ev => {
  ev.preventDefault();

  if (!type || !PipelineRuntime.BLOCKS[type]) return;

function defaultParams(type){
  const out = {};

}

/* ===================== Property panel ===================== */
/* ===================== Interpolation helpers ===================== */
// Finds every {{nodeId.portId}} reference in text that doesn't resolve to a
// real node+output in the current graph — catches exactly the class of bug
// that made a saved Speak text silently go blank at runtime (a stale/typo'd
// node id from hand-editing) instead of only surfacing after a live test.
function findBrokenRefs(text, nodes){
  if (!text) return [];
  const byId = {}; nodes.forEach(n => byId[n.id] = n);
  const broken = [];
  const re = /\{\{(\w+)\.(\w+)\}\}/g;
  let m;
  while ((m = re.exec(text))) {
    const nodeId = m[1], portId = m[2];
    const node = byId[nodeId];
    const def = node && PipelineRuntime.BLOCKS[node.type];
    const hasPort = def && def.outputs.some(p => p.id === portId);
    if (!hasPort) broken.push(nodeId + "." + portId);
  }
  return broken;
}
/* ---- Chip field: renders {{id.port}} references as plain-English pill
   tokens instead of bracket syntax, for non-programmer editing. The stored
   value (node.params[p.id]) and everything downstream — findBrokenRefs(),
   the runtime's interpolate() — never see anything but the original
   {{id.port}} text; chips are purely a display/input convenience layered
   on top via a contenteditable div. ---- */
function chipRefText(nodeId, portId){ return "{{" + nodeId + "." + portId + "}}"; }
// What a chip should say — the block's label + the port's human label (now
// set on every output in pipeline-runtime.js's BLOCKS registry), e.g.
// "Walking Path Progress → % Complete". Falls back to the raw ids for a
// stale/broken reference so it's still identifiable (and still editable —
// selecting it and hitting Insert value replaces it with a working one).
function describeRef(nodeId, portId, nodes){
  const node = nodes.find(n => n.id === nodeId);
  const def = node && PipelineRuntime.BLOCKS[node.type];
  const port = def && def.outputs.find(p => p.id === portId);
  if (!def || !port) return { text: "⚠ " + nodeId + "." + portId, broken: true };
  return { text: def.label + " → " + (port.label || port.id), broken: false };
}
function buildChip(nodeId, portId){
  const { text, broken } = describeRef(nodeId, portId, pipeline.nodes);
  const chip = document.createElement("span");
  chip.className = "chip" + (broken ? " broken" : "");
  chip.contentEditable = "false";
  chip.dataset.nodeId = nodeId; chip.dataset.portId = portId;
  chip.textContent = text;
  return chip;
}
// Parses stored {{id.port}} text into a mix of plain text nodes + chip
// spans and fills `field` with it. Called on first render of a node's
// props, and any time the selected node changes.
function renderChipField(field, text){
  field.innerHTML = "";
  const re = /\{\{(\w+)\.(\w+)\}\}/g;
  let last = 0, m;
  while ((m = re.exec(text || ""))) {
    if (m.index > last) field.appendChild(document.createTextNode(text.slice(last, m.index)));
    field.appendChild(buildChip(m[1], m[2]));
    last = m.index + m[0].length;
  }
  if (last < (text || "").length) field.appendChild(document.createTextNode(text.slice(last)));
}
// Reverse of the above — walks the live DOM back into {{id.port}} text, the
// only form findBrokenRefs()/the runtime's interpolate() understand.
// Recurses into anything that isn't a text node or a chip — a bare
// contenteditable div wraps Enter-created lines in a new <div> (Chrome/
// Edge/Safari) or inserts a <br> (Firefox), and a paste can drop in
// arbitrary rich-HTML wrapper elements too. The original version only
// understood direct text/chip children, so any of those silently vanished
// from what got saved — walking every descendant instead means nothing
// typed is ever dropped, regardless of how the browser chose to structure
// it. Block elements (<div>/<p>) imply a line break before their own
// content, same as a literal <br>.
function serializeChipField(field){
  let out = "";
  function walk(node){
    if (node.nodeType === 3) { out += node.nodeValue; return; }
    if (node.nodeType !== 1) return; // comments etc. — nothing to save
    if (node.classList && node.classList.contains("chip")) { out += chipRefText(node.dataset.nodeId, node.dataset.portId); return; }
    if (node.tagName === "BR") { out += "\n"; return; }
    if ((node.tagName === "DIV" || node.tagName === "P") && out && !out.endsWith("\n")) out += "\n";
    node.childNodes.forEach(walk);
  }
  field.childNodes.forEach(walk);
  return out;
}
function chipAdjacentToCursor(range, dir){
  const { startContainer, startOffset } = range;
  if (startContainer.nodeType === 3) {
    if (dir === "before" && startOffset === 0) return startContainer.previousSibling;
    if (dir === "after" && startOffset === startContainer.length) return startContainer.nextSibling;
    return null;
  }
  const idx = dir === "before" ? startOffset - 1 : startOffset;
  return startContainer.childNodes[idx] || null;
}
function isChipEl(el){ return el && el.nodeType === 1 && el.classList && el.classList.contains("chip"); }
// Native contenteditable backspace next to a contenteditable=false span
// usually takes two presses (select, then delete) — not the single atomic
// delete a non-programmer expects from a "token". Intercept and remove the
// whole chip in one press instead.
function wireChipAtomicDelete(field){
  field.addEventListener("keydown", (e) => {
    if (e.key !== "Backspace" && e.key !== "Delete") return;
    const sel = document.getSelection();
    if (!sel.rangeCount || !sel.isCollapsed) return;
    const range = sel.getRangeAt(0);
    const chip = chipAdjacentToCursor(range, e.key === "Backspace" ? "before" : "after");
    if (!isChipEl(chip)) return;
    e.preventDefault();
    chip.remove();
    field.dispatchEvent(new Event("input"));
  });
}
// Tracks the last real caret position inside a chip field while it's
// focused — needed because clicking the "Insert value" button (outside the
// field) blurs it, and by the time its click handler runs there's no
// selection left inside the field to insert at.
let _chipCaret = null;
document.addEventListener("selectionchange", () => {
  const sel = document.getSelection();
  if (!sel.rangeCount) return;
  const active = document.activeElement;
  if (active && active.classList && active.classList.contains("chip-field")) {
    _chipCaret = { field: active, range: sel.getRangeAt(0).cloneRange() };
  }
});
function insertChipAtField(field, nodeId, portId){
  const chip = buildChip(nodeId, portId);
  let range = (_chipCaret && _chipCaret.field === field) ? _chipCaret.range : null;
  if (!range || !field.contains(range.startContainer)) {
    range = document.createRange();
    range.selectNodeContents(field);
    range.collapse(false);
  }
  range.deleteContents();
  range.insertNode(chip);
  const spacer = document.createTextNode(" ");
  chip.after(spacer);
  range = document.createRange();
  range.setStartAfter(spacer); range.setEndAfter(spacer);
  const sel = document.getSelection();
  sel.removeAllRanges(); sel.addRange(range);

  _chipCaret = { field, range: range.cloneRange() };
  field.dispatchEvent(new Event("input"));
}
// Every currently-available {{id.port}} value in the graph, as a pick-list —
// this is the actual "make it obvious" fix: nobody types or memorizes a node
// id, they just click what they mean. Gate-type outputs (trigger pulses,
// logic results) are left out — they're only ever true/false, not a
// meaningful thing to speak. Positioned like the small self-contained menus
// in code-objects.js (document.body + position:fixed, clamped to the
// viewport, since this page has no shared menu helper).
function openInsertMenu(anchorBtn, field){
  document.querySelectorAll(".insert-menu").forEach(m => m.remove());
  const menu = document.createElement("div");
  menu.className = "insert-menu";
  menu.style.top = "0"; menu.style.left = "0"; menu.style.visibility = "hidden";
  const options = [];
  pipeline.nodes.forEach(n => {
    const def = PipelineRuntime.BLOCKS[n.type];
    if (!def) return;
    def.outputs.filter(p => p.type !== "gate").forEach(p => options.push({ node: n, def, port: p }));
  });
  if (!options.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = "no other blocks with values on the canvas yet";
    menu.appendChild(e);
  } else {
    options.forEach(o => {
      const b = document.createElement("button"); b.type = "button";
      b.innerHTML = o.def.label + " <span class=\"port-name\">→ " + (o.port.label || o.port.id) + "</span>"
        + " <span class=\"node-hint\">(" + o.node.id + ")</span>";
      b.onclick = (e) => {
        e.stopPropagation();

  let left = Math.min(ar.left, window.innerWidth - mr.width - 4);
  menu.style.top = top + "px"; menu.style.left = Math.max(4, left) + "px"; menu.style.visibility = "visible";
}
document.addEventListener("mousedown", (e) => {
  if (!e.target.closest(".insert-menu") && !e.target.closest(".insert-row")) {
    document.querySelectorAll(".insert-menu").forEach(m => m.remove());

// Collapsible folder-tree zone picker for zoneSelect params (stop_visited,
// guide_to_zone, etc.) — deliberately mirrors the Fence Editor's own
// stop-folder tree interaction (buildStopTree()/buildStopFolderRow() in
// fence-editor.html: chevron expand/collapse, folder icon+name+count,
// search auto-expands matching branches) rather than inventing a different
// paradigm for picking the same data, per explicit user direction
// (2026-08-07) after an initial flat-grouped-list version. Not a literal
// code share (that component also does drag-drop reassignment, bulk-select
// checkboxes, and a rename/delete menu — none of which make sense in a
// picker whose only job is choosing one target zone), but the same tree
// shape and interaction. A filter box lives inside the popup, since a plain
// tree alone is still slow to hunt through at 200 stops.
function buildZoneSelectField(currentValue){
  const zones = (bundle && bundle.zones) || [];
  if (!bundle) {
    // Code Object authoring mode (no project bundle loaded — reusable
    // templates aren't tied to one project's zone list) — a live tree here
    // would look interactive but never have anything to find. Point at the
    // real mechanism instead: expose this param and pick the target zone
    // later, per attachment.
    const wrap = document.createElement("div");
    wrap.style.cssText = "font-size:12px;color:var(--fog);padding:8px 0";
    wrap.textContent = "No project loaded — check \"expose to attachments\" below to pick the target zone per-attachment instead.";
    const hidden = document.createElement("input");
    hidden.type = "hidden";
    hidden.value = currentValue || "";
    wrap.appendChild(hidden);
    wrap._hiddenInput = hidden;
    return wrap;
  }
  // Tree structure, same algorithm as fence-editor.html's buildStopTree().
  const byId = new Map();
  const root = { id: null, name: null, children: [], zones: [] };
  byId.set(null, root);
  folders.forEach(f => byId.set(f.id, { id: f.id, name: f.name, children: [], zones: [] }));
  folders.forEach(f => { const node = byId.get(f.id); (byId.get(f.parentId) || root).children.push(node); });
  zones.forEach(z => { (byId.get(z.folderId) || root).zones.push(z); });
  (function sortRec(node){
    node.children.sort((a, b) => a.name.localeCompare(b.name));
    node.zones.sort((a, b) => a.name.localeCompare(b.name));
    node.children.forEach(sortRec);
  })(root);

  const wrap = document.createElement("div");
  wrap.style.position = "relative";
  const hidden = document.createElement("input");
  hidden.type = "hidden";
  hidden.value = currentValue || "";
  const text = document.createElement("input");
  text.type = "text";
  text.readOnly = true; // tree navigation, not free typing — the filter box lives inside the popup
  text.style.cursor = "pointer";
  text.placeholder = "Click to browse stops…";
  const initZone = zones.find(z => z.id === currentValue);
  text.value = initZone ? initZone.name : "";
  const setSelected = (z) => {
    hidden.value = z.id;
    text.value = z.name;
    hidden.dispatchEvent(new Event("input"));
    closeMenu();
  };

  let menu = null, searchInput = null, treeBody = null;
  // Root (id null) starts expanded but is otherwise a node like any other —
  // toggleable, same as fence-editor.html's stopTreeExpanded=new Set([null]).
  const expanded = new Set([null]);
  const onDocDown = (e) => { if (menu && !menu.contains(e.target) && e.target !== text) closeMenu(); };
  function closeMenu(){ if (menu){ menu.remove(); menu = null; searchInput = null; treeBody = null; document.removeEventListener("mousedown", onDocDown, true); } }

  function matchesSearch(z, q){ return !q || (z.name || "").toLowerCase().includes(q); }
  function folderMatchesDeep(node, q){
    if (!q) return true;
    if (node.name && node.name.toLowerCase().includes(q)) return true;
    if (node.zones.some(z => matchesSearch(z, q))) return true;
    return node.children.some(c => folderMatchesDeep(c, q));
  }
  // Root row + indent/connector-line children wrapper deliberately match
  // fence-editor.html's buildStopFolderRow()/.sf-children (and audio-tree.js's
  // .at-children) pixel-for-pixel — one consistent tree look across the app.
  function renderNode(node, depth, q){
    const nodeWrap = document.createElement("div");
    const isRoot = node.id === null;
    const isExpanded = expanded.has(node.id) || (!!q && folderMatchesDeep(node, q));
    const row = document.createElement("div");
    row.style.cssText = "display:flex;align-items:center;gap:6px;padding:6px 8px;padding-left:" + (8 + depth * 14) + "px;"
      + "cursor:pointer;color:var(--snow)";
    const chevron = document.createElement("span"); chevron.textContent = isExpanded ? "▾" : "▸"; chevron.style.width = "10px";
    const icon = document.createElement("span"); icon.textContent = isRoot ? "📂" : "📁";
    const nameEl = document.createElement("span"); nameEl.textContent = isRoot ? (bundle.name || projectId || "All stops") : node.name; nameEl.style.flex = "1";
    const count = document.createElement("span"); count.textContent = node.zones.length; count.style.cssText = "font-size:11px;color:var(--fog)";
    row.append(chevron, icon, nameEl, count);
    row.addEventListener("mouseenter", () => { row.style.background = "rgba(255,106,61,.12)"; });
    row.addEventListener("mouseleave", () => { row.style.background = ""; });
    row.addEventListener("mousedown", (e) => {
      e.preventDefault(); e.stopPropagation();
      if (expanded.has(node.id)) expanded.delete(node.id); else expanded.add(node.id);
      renderTree(searchInput.value);
    });
    nodeWrap.appendChild(row);
    if (isExpanded) {
      const kids = document.createElement("div");
      kids.style.cssText = "margin-left:16px;border-left:1px solid var(--rim);padding-left:4px";
      const visibleChildren = q ? node.children.filter(c => folderMatchesDeep(c, q)) : node.children;
      const visibleZones = node.zones.filter(z => matchesSearch(z, q));
      visibleChildren.forEach(c => kids.appendChild(renderNode(c, depth + 1, q)));
      visibleZones.forEach(z => {
        const zrow = document.createElement("div");
        zrow.textContent = z.name;
        zrow.style.cssText = "padding:6px 8px;padding-left:" + (8 + (depth + 1) * 14) + "px;cursor:pointer;color:var(--snow)";
        zrow.addEventListener("mouseenter", () => { zrow.style.background = "rgba(255,106,61,.18)"; });
        zrow.addEventListener("mouseleave", () => { zrow.style.background = ""; });
        zrow.addEventListener("mousedown", (e) => { e.preventDefault(); setSelected(z); });
        kids.appendChild(zrow);
      });
      if (!visibleChildren.length && !visibleZones.length) {
        const empty = document.createElement("div");
        empty.textContent = "empty";
        empty.style.cssText = "padding:6px 8px;padding-left:" + (8 + (depth + 1) * 14) + "px;font-size:12px;color:var(--fog)";
        kids.appendChild(empty);
      }
      nodeWrap.appendChild(kids);
    }
    return nodeWrap;
  }
  function renderTree(filterText){
    treeBody.innerHTML = "";
    treeBody.appendChild(renderNode(root, 0, (filterText || "").trim().toLowerCase()));
  }
  function openMenu(){
    closeMenu();
    menu = document.createElement("div");
    const r = text.getBoundingClientRect();
    menu.style.cssText = "position:fixed;z-index:500;background:var(--slate-2);"
      + "border:1px solid var(--rim);border-radius:9px;max-height:320px;display:flex;flex-direction:column;"
      + "box-shadow:0 8px 24px rgba(0,0,0,.4);font-family:'Barlow Condensed';font-size:13px;"
      + "top:" + (r.bottom + 4) + "px;left:" + r.left + "px;width:" + Math.max(r.width, 240) + "px";
    searchInput = document.createElement("input");
    searchInput.type = "text"; searchInput.placeholder = "Filter…"; searchInput.autocomplete = "off";
    searchInput.style.cssText = "margin:6px;background:var(--slate);color:var(--snow);border:1px solid var(--rim);"
      + "border-radius:6px;padding:6px 8px;font-family:'Barlow Condensed';font-size:13px";
    searchInput.addEventListener("input", () => renderTree(searchInput.value));
    searchInput.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
    treeBody = document.createElement("div");
    treeBody.style.cssText = "overflow-y:auto";
    menu.append(searchInput, treeBody);
    document.body.appendChild(menu);
    document.addEventListener("mousedown", onDocDown, true);
    renderTree("");
    requestAnimationFrame(() => searchInput.focus());
  }
  text.addEventListener("mousedown", (e) => { e.preventDefault(); openMenu(); });
  wrap.appendChild(text);
  wrap.appendChild(hidden);
  wrap._hiddenInput = hidden; // renderProps() wires its save listener to this, not the visible text field
  return wrap;
}

function renderProps(){
  const el = document.getElementById("props");
  const node = pipeline.nodes.find(n => n.id === selectedId);
  if (!node){ el.innerHTML = "<h3>Properties</h3><div class=\"empty\">Select a node</div>"; return; }
  const def = PipelineRuntime.BLOCKS[node.type];
  el.innerHTML = "<h3>" + def.label + "</h3>";
  if (!def.params.length){ el.innerHTML += "<div class=\"empty\">No settings for this block</div>"; return; }
  def.params.forEach(p => {
    const label = document.createElement("label"); label.className = "field"; label.textContent = p.label || p.id;
    el.appendChild(label);
    let input;
    let isChipField = false;
    let isZoneSelect = false;
    if (p.type === "select") {
      input = document.createElement("select");
      p.options.forEach(o => { const opt = document.createElement("option"); opt.value = o; opt.textContent = o; input.appendChild(opt); });
      input.value = node.params[p.id] ?? p.default;
    } else if (p.type === "zoneSelect") {
      isZoneSelect = true;
      input = buildZoneSelectField(node.params[p.id] ?? "");
    } else if (p.type === "boolean") {
      input = document.createElement("input"); input.type = "checkbox"; input.style.width = "auto";
      input.checked = !!(node.params[p.id] ?? p.default);
    } else if (p.type === "number") {
      input = document.createElement("input"); input.type = "number"; input.value = node.params[p.id] ?? p.default;
    } else if (p.interpolatable) {
      // Chip field instead of a plain textarea — {{id.port}} references
      // render as plain-English pill tokens (see renderChipField/buildChip
      // above), so a non-programmer editing a Speak line never has to read
      // or type bracket-and-dot syntax. The underlying text (with brackets)
      // only exists again once serializeChipField() reconstructs it, on
      // every "input" event and again right before Save.
      isChipField = true;
      input = document.createElement("div");
      input.className = "chip-field"; input.contentEditable = "true";
      renderChipField(input, node.params[p.id] ?? p.default ?? "");
      wireChipAtomicDelete(input);
    } else {
      // textarea, not a single-line input — e.g. action.webhook's url,
      // which looks like free text too but is never run through
      // interpolate() so it doesn't get the chip-field treatment above.
      input = document.createElement("textarea"); input.rows = 2; input.value = node.params[p.id] ?? p.default ?? "";
    }
    if (input.tagName === "TEXTAREA") {
      const autoGrow = () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; };
      input.addEventListener("input", autoGrow);
      requestAnimationFrame(autoGrow); // sized correctly even before the first keystroke, once it's actually in the DOM
    }
    let warnEl = null;
    // Gated on isChipField, not p.interpolatable directly — this UI (and
    // serializeChipField(input) below) only makes sense when renderProps
    // actually built a chip-field for this param. Today they're always in
    // sync (only action.speak's text param, type "text", is interpolatable,
    // and "text" always falls into the chip-field branch above) — but
    // interpolatable is only read *after* the type-specific branches, so an
    // interpolatable param of type select/zoneSelect/boolean/number would
    // otherwise get this UI wired to a plain input that can't hold a chip.
    if (isChipField) {
      warnEl = document.createElement("div");
      warnEl.className = "field-warn"; warnEl.style.display = "none";
      const refreshWarn = () => {
        const broken = findBrokenRefs(serializeChipField(input), pipeline.nodes);
        if (broken.length) { warnEl.textContent = "⚠ one of the tokens above (" + broken.join(", ") + ") doesn't match any block on the canvas anymore — remove it and use \"➕ Insert value\" to add a working one."; warnEl.style.display = "block"; }
        else warnEl.style.display = "none";
      };
      input.addEventListener("input", refreshWarn);
      refreshWarn();
    }
    if (isChipField) {
      input.addEventListener("input", () => { node.params[p.id] = serializeChipField(input); });
    } else if (isZoneSelect) {
      // input is buildZoneSelectField()'s wrapper div — the real value lives
      // on its wrapped hidden input, not on the wrapper itself.
      input._hiddenInput.addEventListener("input", () => { node.params[p.id] = input._hiddenInput.value; });
    } else {
      input.addEventListener("input", () => {
        node.params[p.id] = p.type === "boolean" ? input.checked : p.type === "number" ? Number(input.value) : input.value;
      });
    }
    el.appendChild(input);
    if (isChipField) {
      const row = document.createElement("div"); row.className = "insert-row";
      const btn = document.createElement("button"); btn.type = "button"; btn.className = "ghost";
      btn.textContent = "➕ Insert value";
      btn.title = "Insert a live value from another block on the canvas";
      btn.onclick = (e) => { e.stopPropagation(); openInsertMenu(btn, input); };
      row.appendChild(btn);
      el.appendChild(row);
      el.appendChild(warnEl);
    }

    if (codeObjectId) {
      const key = node.id + ":" + p.id;
      const expRow = document.createElement("label");
      expRow.style.cssText = "display:flex;align-items:center;gap:6px;margin-top:3px;font-family:'Barlow Condensed';font-size:11px;color:var(--fog)";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.style.width = "auto";
      cb.checked = key in exposedParams;
      cb.addEventListener("change", () => {
        if (cb.checked) exposedParams[key] = { label: p.label || p.id, type: p.type, default: node.params[p.id] };
        else delete exposedParams[key];
      });
      expRow.appendChild(cb);
      expRow.appendChild(document.createTextNode("expose to attachments"));
      el.appendChild(expRow);
    }
  });
}

/* ===================== Save ===================== */
document.getElementById("saveBtn").addEventListener("click", async () => {
  const { cyclic } = PipelineRuntime.topoSort(pipeline.nodes, pipeline.edges);
  if (cyclic) { showErr("Pipeline has a cycle — remove a connection before saving"); return; }
  // Block saving a graph with a dangling {{id.port}} reference — this is the
  // exact bug class that made a previously-working Speak text silently go
  // blank after edits (a stale node id left over from an earlier version).
  // Catch it here instead of only after a live test.
  const brokenByNode = [];
  pipeline.nodes.forEach(n => {
    const def = PipelineRuntime.BLOCKS[n.type];
    (def.params || []).forEach(p => {
      if (!p.interpolatable) return;
      const broken = findBrokenRefs(n.params && n.params[p.id], pipeline.nodes);
      if (broken.length) brokenByNode.push(def.label + " (" + n.id + "): " + broken.join(", "));
    });
  });
  if (brokenByNode.length) {
    showErr("Fix before saving — these references don't match any block on the canvas: " + brokenByNode.join(" · "));
    return;
  }
  showErr(null);
  const token = getToken();
  const msg = document.getElementById("saveMsg");
  if (codeObjectId) {
    const paramSchema = Object.keys(exposedParams).map(key => {
      const [nodeId, paramKey] = key.split(":");
      const meta = exposedParams[key];
      return { id: paramKey, nodeId, paramKey, type: meta.type, default: meta.default, label: meta.label };
    });
    const r = await fetch("/api/code-objects/" + encodeURIComponent(codeObjectId), {
      method: "PATCH",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ template: pipeline, paramSchema })
    });
    if (r.ok) { msg.textContent = "Saved"; setTimeout(() => msg.textContent = "", 2000); }
    else { const e = await r.json().catch(() => ({})); showErr("Save failed: " + (e.error || r.status)); }
    return;
  }
  zone.pipeline = pipeline;
  const r = await fetch("/api/projects/" + encodeURIComponent(projectId) + "/bundle", {
    method: "PUT",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify(bundle)
  });
  if (r.ok) { msg.textContent = "Saved"; setTimeout(() => msg.textContent = "", 2000); }
  else { showErr("Save failed: " + r.status); }
});

load();
</script>
</body>
</html>
