<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Field</title>
<script src="role-gate.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--night:#0a1018;--slate:#141d2b;--slate2:#1b2738;--rim:#26344a;
      --coral:#ff6a3d;--snow:#eef4fb;--ice:#8fb6d4;--fog:#5b7088;
      --hazard:#ff2f4e;--go:#38e0a6;--amber:#ffc24d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--snow);
          font-family:"Barlow Condensed",system-ui,sans-serif;overflow:hidden}

/* ── sessions screen ── */
#screenSessions{height:100%;display:flex;flex-direction:column}
.ss-hdr{display:flex;align-items:center;justify-content:space-between;
        padding:14px 16px;background:var(--slate);border-bottom:1px solid var(--rim);flex-shrink:0}
.ss-hdr h1{font-size:18px;font-weight:700}
.ss-hdr a{color:var(--ice);text-decoration:none;font-size:13px;
          border:1px solid var(--rim);border-radius:7px;padding:4px 10px}
#sessList{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.sess-card{background:var(--slate);border:1px solid var(--rim);border-radius:14px;padding:14px}
.sess-card .sc-name{font-weight:700;font-size:16px;margin-bottom:2px}
.sess-card .sc-id{font-size:12px;color:var(--fog);margin-bottom:6px}
.sess-card .sc-meta{font-size:12px;color:var(--ice);margin-bottom:10px}
.sess-card .sc-acts{display:flex;gap:8px}
.sc-acts button,.sc-acts a{font-family:"Barlow Condensed";font-size:13px;font-weight:600;
  border-radius:9px;padding:8px 14px;cursor:pointer;text-decoration:none;text-align:center}
.sc-open{background:none;border:1px solid var(--ice);color:var(--ice);flex:1}
.sc-pub{background:var(--coral);border:none;color:#1a0d07;flex:1}
.empty-hint{color:var(--fog);font-size:14px;text-align:center;padding:40px 20px}
.fr-sm{font-family:"Barlow Condensed";font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;padding:4px 10px;border-radius:7px;cursor:pointer;border:1px solid var(--rim);background:var(--slate2);color:var(--ice)}
.fr-sm.sel{border-color:var(--coral);color:var(--snow)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-family:"Barlow Condensed";font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--fog);text-align:center;padding:4px 0}
.cal-day{min-height:66px;border:1px solid var(--rim);border-radius:9px;padding:5px 6px;background:var(--slate2);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cal-day.empty{background:none;border:none;cursor:default}
.cal-day.today{border-color:var(--ice)}
.cal-day .cd-num{font-family:"Barlow Condensed";font-weight:700;font-size:12px;color:var(--fog)}
.cal-entry{font-size:11px;border-radius:5px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--coral);color:#0a1018;font-weight:600}
.cal-day-detail{background:var(--slate);border:1px solid var(--rim);border-radius:12px;padding:12px;margin-top:12px}

/* ── field screen ── */
#screenField{height:100%;display:none;flex-direction:column}

/* signal banner */
#signalBanner{flex-shrink:0;background:var(--hazard);color:#fff;display:none;
  align-items:center;justify-content:center;gap:8px;padding:6px 14px;
  font-size:13px;font-weight:700;text-align:center}
#signalBanner.show{display:flex}
#queueBadge{background:rgba(0,0,0,.3);border-radius:99px;padding:1px 8px;font-size:12px;display:none}
#queueBadge.show{display:inline}

/* header */
#hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;
     background:var(--slate);border-bottom:1px solid var(--rim);flex-shrink:0}
#hdr a{color:var(--ice);text-decoration:none;font-size:14px;flex-shrink:0}
#projName{flex:1;min-width:0;font-weight:700;font-size:15px;text-align:center;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btnPub{padding:6px 14px;border-radius:8px;background:var(--coral);border:none;
        color:#1a0d07;font-family:"Barlow Condensed";font-weight:700;font-size:13px;
        flex-shrink:0;cursor:pointer}
#btnPub:disabled{opacity:.4;cursor:default}

/* mode strip */
#modeStrip{flex-shrink:0;background:var(--slate2);border-bottom:1px solid var(--rim);
  padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.mode-toggle{display:flex;gap:4px}
.mode-btn{height:30px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:700;
  font-family:"Barlow Condensed";border:1px solid var(--rim);background:var(--slate2);
  color:var(--fog);cursor:pointer;transition:.12s}
.mode-btn.sel{border-color:var(--coral);color:var(--coral);background:rgba(255,106,61,.10)}
#activityRow{gap:4px;display:none}
#activityRow.show{display:flex}
.act-btn{height:30px;padding:0 10px;border-radius:8px;font-size:14px;
  font-family:"Barlow Condensed";border:1px solid var(--rim);background:var(--slate2);
  color:var(--fog);cursor:pointer;transition:.12s}
.act-btn.sel{border-color:var(--amber);color:var(--amber)}

/* map */
#mapWrap{flex:1;position:relative;overflow:hidden;min-height:0}
#map{position:absolute;inset:0}

/* stop panel */
#stopPanel{flex-shrink:0;max-height:130px;overflow-y:auto;background:var(--slate);
  border-top:1px solid var(--rim);display:none;flex-direction:column}
#stopPanel.show{display:flex}
.sp-row{display:flex;align-items:center;gap:8px;padding:7px 12px;
  border-bottom:1px solid rgba(255,255,255,.04);flex-shrink:0}
.sp-row:last-child{border-bottom:none}
.sp-dot{font-size:9px;flex-shrink:0}
.sp-name{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-countdown{font-size:12px;color:var(--fog);flex-shrink:0;min-width:38px;text-align:right}
.sp-play{background:none;border:1px solid var(--rim);border-radius:6px;
  color:var(--ice);font-size:11px;padding:3px 9px;cursor:pointer;flex-shrink:0;
  font-family:"Barlow Condensed"}
.sp-play:hover{border-color:var(--ice)}

/* footer */
#ftr{flex-shrink:0;background:var(--slate);border-top:1px solid var(--rim);
     padding:10px 14px env(safe-area-inset-bottom,10px)}
#ftrBtns{display:flex;gap:10px}
.fbt{flex:1;height:58px;border-radius:14px;font-family:"Barlow Condensed";font-weight:700;
     font-size:16px;letter-spacing:.5px;border:2px solid var(--rim);
     background:var(--slate2);color:var(--snow);cursor:pointer;
     display:flex;align-items:center;justify-content:center;gap:7px}
#btnMark{border-color:var(--go);color:var(--go)}
#btnMark:disabled{opacity:.4;cursor:default}
#btnRec{border-color:var(--hazard);color:var(--hazard)}
#btnRec.active{background:var(--hazard);color:#fff}
#btnRec:disabled{opacity:.4;cursor:default}

/* live button */
#btnLive{display:none;border-color:var(--go);color:var(--go)}
#btnLive.recording{background:var(--hazard);border-color:var(--hazard);color:#fff;animation:pulse 1.2s infinite}
#btnLive.uploading{border-color:var(--amber);color:var(--amber);animation:pulse 1.2s infinite}
#btnLive:disabled{opacity:.4;cursor:default;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

#status{font-family:"Barlow Condensed";font-size:12px;color:var(--fog);
        text-align:center;margin-top:8px;min-height:16px}

/* ── sheet ── */
#sheet{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);align-items:flex-end}
#sheet.open{display:flex}
#sheetBody{width:100%;max-width:500px;margin:0 auto;background:var(--slate);
           border-radius:18px 18px 0 0;border:1px solid var(--rim);border-bottom:none;
           padding:18px;max-height:80vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#sheetBody h2{font-family:"Barlow Condensed";font-size:16px;font-weight:700;
              text-transform:uppercase;letter-spacing:.5px}
.sheet-btns{display:flex;gap:8px;margin-top:4px}
label.k{font-family:"Barlow Condensed";text-transform:uppercase;font-size:11px;
         letter-spacing:.6px;color:var(--fog);display:block;margin-bottom:4px}
input,select{width:100%;font-family:"Barlow Condensed";font-size:14px;
             background:var(--slate2);color:var(--snow);border:1px solid var(--rim);
             border-radius:8px;padding:9px 11px}
.btn-pri{background:var(--coral);border:none;color:#1a0d07;font-family:"Barlow Condensed";
         font-weight:700;font-size:14px;border-radius:9px;padding:10px 18px;
         cursor:pointer;flex:2}
.btn-sec{background:var(--slate2);border:1px solid var(--rim);color:var(--snow);
         font-family:"Barlow Condensed";font-size:13px;border-radius:9px;
         padding:9px 14px;cursor:pointer;flex:1}
.hint{font-family:"Barlow Condensed";font-size:12px;color:var(--fog);line-height:1.4}
.prog-bar{height:6px;background:var(--slate2);border-radius:3px;overflow:hidden;margin-top:6px}
.prog-fill{height:100%;background:var(--coral);border-radius:3px;transition:width .15s}
</style>
</head>
<body>

<div id="previewBanner" style="display:none;position:sticky;top:0;z-index:50;background:#ffc24d;color:#1a0d07;
     padding:10px 20px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.4px;text-transform:uppercase">
  🏢 Viewing as <b id="previewName"></b> — <a href="/clients" style="color:#1a0d07;text-decoration:underline">back to clients</a>
</div>

<!-- ── sessions screen (no ?project param) ── -->
<div id="screenSessions">
  <div class="ss-hdr">
    <h1>Field Sessions</h1>
    <div id="ssViewToggle" style="display:none;gap:4px">
      <button class="fr-sm sel" id="btnViewList" onclick="setBookingsView('list')">List</button>
      <button class="fr-sm" id="btnViewCal" onclick="setBookingsView('calendar')">Calendar</button>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <span id="whoami" style="font-size:11px;color:var(--fog)"></span>
      <a href="/">⌂ Home</a>
      <a href="#" onclick="frSignOut(event)" style="color:var(--fog);font-size:13px">Sign out</a>
    </div>
  </div>
  <div id="sessList"><div class="empty-hint">No field sessions yet.<br>Open a project and tap Field to start.</div></div>
  <div id="calList" style="display:none;flex:1;overflow-y:auto;padding:14px"></div>
</div>

<!-- ── field screen (?project param) ── -->
<div id="screenField">
  <div id="signalBanner">⚠ NO SIGNAL — stops queued <span id="queueBadge"></span></div>
  <div id="bundleWarn" style="flex-shrink:0;background:var(--hazard);color:#fff;display:none;align-items:center;justify-content:center;gap:10px;padding:6px 14px;font-size:13px;font-weight:700;text-align:center">
    ⚠ Couldn't load this project's existing stops
    <button onclick="retryBundleLoad()" style="background:rgba(255,255,255,.2);border:1px solid #fff;color:#fff;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer">Retry</button>
  </div>
  <div id="hdr">
    <a href="/field" id="backLink">◀ Sessions</a>
    <span id="roleBadge" title="" style="font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:5px;background:var(--slate2);color:var(--fog);flex-shrink:0"></span>
    <span id="projName">Field</span>
    <button id="btnQr" onclick="showFieldQr()" title="QR code to open this on your phone" style="background:none;border:none;color:var(--fog);font-size:16px;cursor:pointer;padding:4px 6px;flex-shrink:0">▦</button>
    <button id="btnClear" onclick="clearCurrentSession()" title="Clear local data" style="background:none;border:none;color:var(--fog);font-size:16px;cursor:pointer;padding:4px 6px;flex-shrink:0">⚡</button>
    <button id="btnPub" disabled>✓ Pub</button>
  </div>
  <div id="modeStrip">
    <div class="mode-toggle">
      <button id="btnModePers" class="mode-btn sel" onclick="setMode('persistent')">Persistent</button>
      <button id="btnModeLive" class="mode-btn"     onclick="setMode('live')">Live ⬤</button>
    </div>
    <div id="activityRow">
      <button id="actWalk"  class="act-btn sel" onclick="setActivity('walk')">🚶</button>
      <button id="actSki"   class="act-btn"     onclick="setActivity('ski')">⛷</button>
      <button id="actDrive" class="act-btn"     onclick="setActivity('drive')">🚗</button>
    </div>
  </div>
  <div id="mapWrap"><div id="map"></div></div>
  <div id="stopPanel"></div>
  <div id="ftr">
    <div id="ftrBtns">
      <button class="fbt" id="btnMark" disabled>📍 Mark Stop</button>
      <button class="fbt" id="btnRec"  disabled>⏺ Record</button>
      <button class="fbt" id="btnLive" disabled>🎙 Start Stop</button>
    </div>
    <div id="status">Starting up…</div>
  </div>
</div>

<!-- ── sheet (shared) ── -->
<div id="sheet">
  <div id="sheetBody">
    <h2 id="sheetTitle"></h2>
    <div id="sheetContent"></div>
    <div class="sheet-btns" id="sheetBtns"></div>
  </div>
</div>

<script>
/* ── constants ─────────────────────────────────────── */
const _qs    = new URLSearchParams(location.search);
const projId = _qs.get("project") || "";
const asClient = _qs.get("asClient") || null;

function orgQueryParam(){
  return (_me && _me.role === 'admin' && asClient) ? 'org=' + encodeURIComponent(asClient) : '';
}
function applyPreviewBanner(){
  if (!_me || _me.role !== 'admin' || !asClient) return;
  fetch('/api/clients', { headers: { authorization: 'Bearer ' + getToken() } })
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      const c = ((j && j.clients) || []).find(c => c.id === asClient);
      const el = document.getElementById('previewBanner');
      if (!el) return;
      document.getElementById('previewName').textContent = c ? c.name : asClient;
      el.style.display = 'block';
    }).catch(() => {});
}

// Auth gate: full (persistent-recording) access is admin-only. Guides get a
// live-only carve-out since running live tours is their actual job.
// operator/front_desk have no reason to be here — RoleGate sends them to
// /dashboard instead.
let _me = null;
// Awaited by init() before the sessions list renders — otherwise init()'s
// local IndexedDB setup routinely beats this network round-trip, so _me is
// still null when renderSessionsList() checks isGuide, and a guide falls
// through to the unscoped admin view (every project in their org, not just
// their assignments).
const _meReady = RoleGate.require(['admin', 'guide']).then(me => {
  _me = me;
  applyPreviewBanner();
  // Signed-in-account indicator — cheap insurance against exactly the kind of
  // mix-up that cost a long debugging session: a stale/wrong-role browser tab
  // silently rendering role-appropriate UI with no clue which account it is.
  const who = document.getElementById('whoami');
  if(who) who.textContent = (me.email||'')+' · '+me.role;
  const badge = document.getElementById('roleBadge');
  if(badge){ badge.textContent = me.role.toUpperCase(); badge.title = me.email||''; }
  if (me.role === 'guide') {
    document.querySelector('.ss-hdr h1').textContent = 'My Bookings';
    const homeLink = document.querySelector('.ss-hdr a[href="/"]');
    if (homeLink) homeLink.style.display = 'none';
    document.getElementById('ssViewToggle').style.display = 'flex';
  }
  return me;
});

/* ── guide calendar (read-only) ─────────────────────── */
let _bookingsView = 'list';
function setBookingsView(v){
  _bookingsView = v;
  document.getElementById('sessList').style.display = v==='list' ? '' : 'none';
  document.getElementById('calList').style.display = v==='calendar' ? '' : 'none';
  document.getElementById('btnViewList').classList.toggle('sel', v==='list');
  document.getElementById('btnViewCal').classList.toggle('sel', v==='calendar');
  if (v==='calendar') renderBookingsCalendar();
}
function pad2fr(n){ return String(n).padStart(2,"0"); }
async function renderBookingsCalendar(){
  await _meReady;
  const projects = await fetchGuideProjects();
  const byDay = {};
  projects.forEach(p=>{ if(!p.scheduled_date) return; (byDay[p.scheduled_date]=byDay[p.scheduled_date]||[]).push(p); });
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const firstDow = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const todayStr = year+"-"+pad2fr(month+1)+"-"+pad2fr(now.getDate());
  let html = '<div style="font-family:\'Barlow Condensed\';font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">'
    + new Date(year,month,1).toLocaleDateString(undefined,{month:"long",year:"numeric"}) + '</div>';
  html += '<div class="cal-grid">';
  html += ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>'<div class="cal-dow">'+d+'</div>').join("");
  for(let i=0;i<firstDow;i++) html += '<div class="cal-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds = year+"-"+pad2fr(month+1)+"-"+pad2fr(d);
    const entries = byDay[ds]||[];
    html += '<div class="cal-day'+(ds===todayStr?' today':'')+'" onclick="openGuideCalDay(\''+ds+'\')">'
      + '<div class="cd-num">'+d+'</div>'
      + entries.slice(0,2).map(p=>'<div class="cal-entry">'+esc(p.visitor_name||p.name||p.id)+'</div>').join('')
      + (entries.length>2?'<div style="font-size:10px;color:var(--fog)">+'+(entries.length-2)+' more</div>':'')
      + '</div>';
  }
  html += '</div><div id="calDayDetail"></div>';
  document.getElementById('calList').innerHTML = html;
  window._guideCalByDay = byDay;
}
function openGuideCalDay(ds){
  const entries = (window._guideCalByDay||{})[ds]||[];
  const title = new Date(ds+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  const body = entries.length ? entries.map(p=>`
    <div style="padding:8px 0;border-bottom:1px solid #1a2433">
      <div style="font-weight:700">${esc(p.visitor_name||p.name||p.id)}</div>
      <div style="color:var(--fog);font-size:12px">${p.scheduled_time?fmtTime12h(p.scheduled_time):"No time set"}</div>
      <a class="sc-open" href="/field?project=${esc(p.id)}" style="display:inline-block;margin-top:6px;padding:8px 14px;border-radius:9px;text-decoration:none;font-family:'Barlow Condensed';font-size:13px;font-weight:600">▶ Field Recording</a>
    </div>`).join("") : '<div class="empty-hint">No tours scheduled this day.</div>';
  document.getElementById('calDayDetail').innerHTML =
    '<div class="cal-day-detail"><div style="font-weight:700;margin-bottom:6px">'+esc(title)+'</div>'+body+'</div>';
}
const MIME   = ["audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/webm;codecs=opus","audio/webm"]
                 .find(t => MediaRecorder.isTypeSupported(t)) || "";
let liveTtlMs = 300000;                            // default 5 min; overwritten from bundle on init
const LIVE_RADIUS = {walk:25, ski:60, drive:100}; // default geofence radius per activity

/* ── state ─────────────────────────────────────────── */
let lastPos       = null;
let micStream     = null;
let mediaRec      = null;
let recChunks     = [];
let lastStop      = null;
let stops         = [];
let clips         = [];
let session       = null;
let headingBuffer = [];
let liveMode      = false;
let liveActivity  = "walk";
let liveRecState  = "idle"; // "idle" | "recording" | "uploading"
let liveStops     = [];     // successfully published live stops (in-memory for this session)
let liveNum       = 0;      // auto-increment counter for live stop names
let publishedZones = [];    // the project's real published tour stops (fence-editor zones) — reference layer, not editable here
let signalOk      = true;
let db, map;

/* ── helpers ────────────────────────────────────────── */
function circularMean(degs){
  if(!degs.length) return null;
  const rads = degs.map(d => d * Math.PI / 180);
  const sin  = rads.reduce((s,r) => s + Math.sin(r), 0);
  const cos  = rads.reduce((s,r) => s + Math.cos(r), 0);
  return Math.round(((Math.atan2(sin, cos) * 180 / Math.PI) + 360) % 360);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function fmtTime12h(t){
  const m=/^(\d{1,2}):(\d{2})/.exec(t||""); if(!m) return "";
  let h=Number(m[1]); const ap=h>=12?"PM":"AM"; h=h%12||12;
  return h+":"+m[2]+" "+ap;
}
function getToken(){ return localStorage.getItem("gp.session")||localStorage.getItem("gp.token")||""; }

/* ── IndexedDB ─────────────────────────────────────── */
function openDb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("chase-field-v2", 3);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains("sessions"))   d.createObjectStore("sessions",{keyPath:"projId"});
      if(!d.objectStoreNames.contains("stops"))      d.createObjectStore("stops",{keyPath:"id"});
      if(!d.objectStoreNames.contains("clips"))      d.createObjectStore("clips",{keyPath:"id"});
      if(!d.objectStoreNames.contains("live_queue")) d.createObjectStore("live_queue",{keyPath:"id"});
    };
    r.onsuccess = e => { db = e.target.result; res(db); };
    r.onerror   = () => rej(r.error);
  });
}
function dbPut(store, obj){
  return new Promise((res,rej)=>{
    const t = db.transaction(store,"readwrite");
    t.objectStore(store).put(obj).onsuccess = () => res();
    t.onerror = () => rej(t.error);
  });
}
function dbGet(store, key){
  return new Promise((res,rej)=>{
    const r = db.transaction(store,"readonly").objectStore(store).get(key);
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
function dbGetAll(store){
  return new Promise((res,rej)=>{
    const r = db.transaction(store,"readonly").objectStore(store).getAll();
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
function dbDelete(store, key){
  return new Promise((res,rej)=>{
    const t = db.transaction(store,"readwrite");
    t.objectStore(store).delete(key).onsuccess = () => res();
    t.onerror = () => rej(t.error);
  });
}

// Shared by both the list view and the guide's calendar view — keeps the
// ?guide=<id> scoping in exactly one place (a guide's project list must
// never fall through to the unscoped admin view; see the _meReady note above).
async function fetchGuideProjects(){
  const isGuide = _me && _me.role === 'guide';
  const _qsParts = [];
  if (isGuide) _qsParts.push('guide=' + encodeURIComponent(_me.id));
  if (orgQueryParam()) _qsParts.push(orgQueryParam());
  const _guideQ = _qsParts.length ? '?' + _qsParts.join('&') : '';
  try{
    const r = await fetch("/api/projects" + _guideQ, { headers: { authorization: "Bearer " + getToken() } });
    return r.ok ? ((await r.json()).projects || []) : [];
  }catch(e){ return []; }
}

async function renderSessionsList(){
  let sessions = await dbGetAll("sessions");
  const allStops = await dbGetAll("stops");
  const allClips = await dbGetAll("clips");
  const list = document.getElementById("sessList");

  const isGuide = _me && _me.role === 'guide';
  const serverProjects = await fetchGuideProjects();

  // Guide view: simple project + walk link cards, no session management
  if(isGuide){
    if(!serverProjects.length){
      list.innerHTML = '<div class="empty-hint">No projects assigned yet.<br>Ask your admin to assign you to a project.</div>';
      return;
    }
    const cards = await Promise.all(serverProjects.map(async p=>{
      let links = [];
      try{
        const rl = await fetch("/api/guide-links?project="+encodeURIComponent(p.id)+"&guide="+encodeURIComponent(_me.id));
        if(rl.ok){ links=(await rl.json()).links||[]; }
      }catch(_){}
      const dateStr = p.scheduled_date
        ? new Date(p.scheduled_date+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})
          +(p.scheduled_time?" · "+fmtTime12h(p.scheduled_time):"")
        : "No date set";
      const visitorsHtml = links.length
        ? links.map(lk=>`
            <div class="visitor-row" style="background:#0d1520;border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:8px">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-family:'Barlow Condensed';font-size:14px;font-weight:600;color:var(--ice);flex:1">${esc(lk.label)}</span>
                <button onclick="toggleQr(this,'${esc(lk.url)}','.visitor-row')" style="background:var(--slate2);border:1px solid var(--rim);border-radius:6px;color:var(--ice);font-family:'Barlow Condensed';font-weight:700;font-size:12px;padding:5px 10px;cursor:pointer;flex-shrink:0">QR</button>
                <button onclick="navigator.clipboard.writeText('${esc(lk.url)}').then(()=>this.textContent='✓').catch(()=>{})" style="background:var(--coral);border:none;border-radius:6px;color:#1a0d07;font-family:'Barlow Condensed';font-weight:700;font-size:12px;padding:5px 12px;cursor:pointer;flex-shrink:0">Copy</button>
              </div>
            </div>`).join("")
        : `<div style="font-family:'Barlow Condensed';font-size:13px;color:var(--fog);padding:4px 0">No visitors assigned — ask your admin to add walk links</div>`;
      return `<div class="sess-card">
        <div class="sc-name">${p.visitor_name?esc(p.visitor_name)+' <span style="color:var(--fog);font-weight:400">— '+esc(p.name||p.id)+'</span>':esc(p.name||p.id)}</div>
        <div style="font-family:'Barlow Condensed';font-size:13px;color:var(--coral);margin-bottom:10px">${dateStr}</div>
        <div style="font-family:'Barlow Condensed';font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--fog);margin-bottom:6px">Visitors${links.length?" ("+links.length+")":""}</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">${visitorsHtml}</div>
        <div class="sc-acts">
          <a class="sc-open" href="/field?project=${esc(p.id)}">▶ Field Recording</a>
        </div>
      </div>`;
    }));
    // Sort by scheduled_date ascending (soonest first)
    serverProjects.sort((a,b)=>(a.scheduled_date||"9999").localeCompare(b.scheduled_date||"9999"));
    list.innerHTML = cards.join("");
    return;
  }

  // Admin/operator view: full session management
  const liveIds = new Set(serverProjects.map(p=>p.id));
  for(const s of sessions){
    const proj = serverProjects.find(p=>p.id===s.projId);
    if(proj && proj.name !== s.name){ s.name=proj.name; await dbPut("sessions",s); }
  }
  const stale = sessions.filter(s=>!liveIds.has(s.projId));
  for(const s of stale){
    await dbDelete("sessions",s.projId);
    for(const st of allStops.filter(x=>x.projId===s.projId)) await dbDelete("stops",st.id);
    for(const c  of allClips.filter(x=>x.projId===s.projId))  await dbDelete("clips",c.id);
  }
  sessions = sessions.filter(s=>liveIds.has(s.projId));

  // Auto-remove empty sessions (no stops, no clips) — they were never used
  const emptySessions = sessions.filter(s=>{
    return !allStops.some(st=>st.projId===s.projId) && !allClips.some(c=>c.projId===s.projId);
  });
  for(const s of emptySessions){ await dbDelete("sessions",s.projId); }
  sessions = sessions.filter(s=>!emptySessions.some(e=>e.projId===s.projId));

  const sessionIds = new Set(sessions.map(s=>s.projId));
  const availableProjects = serverProjects.filter(p=>!sessionIds.has(p.id));

  if(!sessions.length && !availableProjects.length){
    list.innerHTML = '<div class="empty-hint">No projects found.<br>Create a project from <a href="/" style="color:var(--coral)">home</a> first.</div>';
    return;

  const availHtml = availableProjects.map(p=>`
    <div class="sess-card" style="opacity:.75">

        <button class="sc-open" onclick="toggleQr(this,'${location.origin}/field?project=${esc(p.id)}','.sess-card')">QR</button>
      </div>
    </div>`).join("");

  const sessHtml = sessions.sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).map(s=>{
    const sStops  = allStops.filter(st=>st.projId===s.projId);
    const sClips  = allClips.filter(c=>c.projId===s.projId);
    const pending = sClips.filter(c=>!c.audioUrl&&c.blob).length;
    const meta    = sStops.length+" stop"+(sStops.length!==1?"s":"")
                  +" · "+sClips.length+" clip"+(sClips.length!==1?"s":"")
                  +(pending?" · "+pending+" not yet uploaded":"");
    const hasPub = sClips.length > 0;
    return `<div class="sess-card">
      <div class="sc-name">${esc(s.name)}</div>
      <div class="sc-id">${esc(s.projId)}</div>
      <div class="sc-meta">${meta}</div>
      <div class="sc-acts">
        <a class="sc-open" href="/field?project=${esc(s.projId)}">Open</a>
        <button class="sc-open" onclick="toggleQr(this,'${location.origin}/field?project=${esc(s.projId)}','.sess-card')">QR</button>
        ${hasPub?`<button class="sc-pub" onclick="pubFromList('${esc(s.projId)}','${esc(s.name)}')">✓ Pub</button>`:''}
        <button class="sc-del" onclick="deleteSession('${esc(s.projId)}','${esc(s.name)}')" style="background:none;border:1px solid rgba(255,47,78,.35);color:rgba(255,47,78,.6);border-radius:9px;padding:8px 12px;cursor:pointer;font-family:'Barlow Condensed';font-size:13px;font-weight:600">✕</button>
      </div>
    </div>`;
  }).join("");

  list.innerHTML = sessHtml + (availHtml ? `
    <div style="font-family:'Barlow Condensed';font-size:11px;text-transform:uppercase;
                letter-spacing:1px;color:var(--fog);padding:10px 4px 4px">Available projects</div>
    ${availHtml}` : "");
}

async function deleteSession(pid, pname){
  if(!confirm("Clear all local data for \""+pname+"\"?\n\nThis removes stops, clips and session from this device only. Published data on the server is unaffected.")) return;
  const allStops = await dbGetAll("stops");
  const allClips = await dbGetAll("clips");
  for(const s of allStops.filter(s=>s.projId===pid)) await dbDelete("stops",s.id);
  for(const c of allClips.filter(c=>c.projId===pid)) await dbDelete("clips",c.id);
  await dbDelete("sessions",pid);
  await renderSessionsList();
}

async function pubFromList(pid, pname){
  const allStops = await dbGetAll("stops");

  stops = allStops.filter(s=>s.projId===pid);
  clips = allClips;
  const token = getToken();
  openSheet("Publish · "+pname,
    `<div class="hint">${stops.length} stop(s) for <strong>${esc(pid)}</strong></div>`+
    (!token?`<label class="k" style="margin-top:10px">API token</label>
             <input id="pubTok" type="password" placeholder="your-api-key" autocomplete="off">`:"")+
    `<div id="pubStatus" style="margin-top:8px;display:none">
       <div class="hint" id="pubMsg"></div>
       <div class="prog-bar"><div class="prog-fill" id="pubFill" style="width:0%"></div></div>
     </div>`,
    async () => {
      const tok = (document.getElementById("pubTok")?.value || token).trim();
      document.getElementById("pubStatus").style.display = "block";
      if(!tok){ setProg("Enter an API token above",0); return; }
      if(!token) localStorage.setItem("gp.token",tok);
      await doPublish(pid, pname, tok);
    }, "✓ Publish", true);
}

/* ── map ───────────────────────────────────────────── */
function circleRing(lat,lon,rM,n=48){
  const pts=[];
  for(let i=0;i<=n;i++){
    const a=(2*Math.PI*i)/n;
    pts.push([lon+(rM/(111320*Math.cos(lat*Math.PI/180)))*Math.cos(a),lat+(rM/111320)*Math.sin(a)]);
  }
  return pts;
}

function initMap(){
  map = new maplibregl.Map({
    container:"map",
    style:{version:8,
      sources:{base:{type:"raster",
        tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        tileSize:256,attribution:"Esri"}},
      layers:[{id:"base",type:"raster",source:"base"}]},
    center:[0,0], zoom:2
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-left");
  map.on("load",()=>{
    // published tour stops (from the fence editor) — a read-only reference layer so
    // anyone live in this project, guide or admin, can see the real stops on the map
    // even if this browser has never locally recorded anything for this project
    map.addSource("published-zones",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
    map.addLayer({id:"published-fill",type:"fill",source:"published-zones",
      filter:["==",["geometry-type"],"Polygon"],
      paint:{"fill-color":"#8fb6d4","fill-opacity":.30}});
    map.addLayer({id:"published-line",type:"line",source:"published-zones",
      paint:{"line-color":"#8fb6d4","line-width":3,"line-dasharray":[2,2]}});
    map.addLayer({id:"published-lbl",type:"symbol",source:"published-zones",
      layout:{"text-field":["get","name"],"text-size":11,"text-anchor":"bottom","text-offset":[0,-0.6]},
      paint:{"text-color":"#8fb6d4","text-halo-color":"#0a1018","text-halo-width":1.5}});

    map.addSource("zones",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
    map.addSource("dot",  {type:"geojson",data:{type:"Feature",geometry:{type:"Point",coordinates:[0,0]}}});
    map.addLayer({id:"zone-fill",type:"fill",source:"zones",
      paint:{
        "fill-color":["case",["get","isLive"],"#ff2f4e",["get","hasClip"],"#38e0a6","#ff6a3d"],
        "fill-opacity":.18
      }});
    map.addLayer({id:"zone-line",type:"line",source:"zones",
      paint:{
        "line-color":["case",["get","isLive"],"#ff2f4e",["get","hasClip"],"#38e0a6","#ff6a3d"],
        "line-width":2
      }});
    map.addLayer({id:"zone-lbl",type:"symbol",source:"zones",
      layout:{"text-field":["get","name"],"text-size":12,"text-anchor":"top","text-offset":[0,0.5]},
      paint:{"text-color":"#eef4fb","text-halo-color":"#0a1018","text-halo-width":1.5}});
    map.addLayer({id:"gps-dot",type:"circle",source:"dot",
      paint:{"circle-color":"#ff6a3d","circle-radius":10,"circle-stroke-color":"#fff","circle-stroke-width":2.5}});
    map.addSource("walkers",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
    map.addLayer({id:"walker-dot",type:"circle",source:"walkers",
      paint:{"circle-color":"#ffc24d","circle-radius":8,"circle-stroke-color":"#fff","circle-stroke-width":2}});
    map.addLayer({id:"walker-lbl",type:"symbol",source:"walkers",
      layout:{"text-field":["get","label"],"text-size":11,"text-anchor":"bottom","text-offset":[0,-1.2]},
      paint:{"text-color":"#ffc24d","text-halo-color":"#0a1018","text-halo-width":1.5}});
    refreshMap();
    refreshPublishedZones();
    // Safety net independent of GPS (which may be slow, denied, or indoors):
    // isStyleLoaded() can still be false right at 'load' on a slow connection
    // (base map tiles still fetching), so the very first attempt above can
    // silently no-op. A couple of delayed retries catch that without waiting
    // on a location fix that might not come for a while.
    setTimeout(refreshPublishedZones, 2000);
    setTimeout(refreshPublishedZones, 6000);
  });
}

// Field recorder is often used on a weak trail/resort signal, so a single-shot
// fetch here would silently leave existing stops missing with zero indication
// anything failed — retry once, and flag it visibly (with a manual retry) if
// it still doesn't load, instead of just showing an empty list forever.
async function _fetchBundleOnce(){
  const br = await fetch("/api/projects/"+encodeURIComponent(projId)+"/bundle",{cache:"no-store"});
  if(!br.ok) throw new Error("HTTP "+br.status);
  return br.json();
}
async function loadPublishedBundle(){
  const warn = document.getElementById("bundleWarn");
  let ref = null;
  try{
    let b;
    try{ b = await _fetchBundleOnce(); }
    catch(e){ await new Promise(r=>setTimeout(r,1500)); b = await _fetchBundleOnce(); }
    if(b.liveTtlMs>=30000) liveTtlMs=b.liveTtlMs;
    if(Array.isArray(b.ref)) ref=b.ref;
    publishedZones=Array.isArray(b.zones)?b.zones:[];
    refreshPublishedZones(); renderStopList();
    if(warn) warn.style.display="none";
  }catch(e){
    if(warn) warn.style.display="flex";
  }
  return {ref};
}
function retryBundleLoad(){ loadPublishedBundle(); }

function refreshPublishedZones(){
  if(!map||!map.isStyleLoaded()) return;
  const feats=[];
  publishedZones.forEach(z=>{
    if(!z.center) return;
    const tgt=(z.layers||[]).find(l=>l.kind==="target");
    if(!tgt) return;
    if(tgt.radiusM!=null){
      feats.push({type:"Feature",properties:{name:z.name},
        geometry:{type:"Polygon",coordinates:[circleRing(z.center[0],z.center[1],tgt.radiusM)]}});
    } else if(tgt.geometry && tgt.geometry.type==="polygon"){
      feats.push({type:"Feature",properties:{name:z.name},
        geometry:{type:"Polygon",coordinates:[tgt.geometry.coords.map(c=>[c[1],c[0]])]}});
    } else if(tgt.geometry && tgt.geometry.type==="tripline"){
      feats.push({type:"Feature",properties:{name:z.name},
        geometry:{type:"LineString",coordinates:[[tgt.geometry.from[1],tgt.geometry.from[0]],[tgt.geometry.to[1],tgt.geometry.to[0]]]}});
    }
  });
  map.getSource("published-zones")?.setData({type:"FeatureCollection",features:feats});
  renderStopList();
}

function refreshMap(){
  if(!map||!map.isStyleLoaded()) return;
  const now = Date.now();
  const allFeatures = [
    ...stops.map(s=>({
      type:"Feature",
      properties:{name:s.name, hasClip:!!s.clipId, isLive:false},
      geometry:{type:"Polygon",coordinates:[circleRing(s.lat,s.lon,s.radiusM||12)]}
    })),
    ...liveStops.filter(s=>s.expiresAt>now).map(s=>({
      type:"Feature",
      properties:{name:s.name, hasClip:true, isLive:true},
      geometry:{type:"Polygon",coordinates:[circleRing(s.lat,s.lon,s.radiusM||25)]}
    }))
  ];
  map.getSource("zones")?.setData({type:"FeatureCollection",features:allFeatures});
  if(lastPos) map.getSource("dot")?.setData({type:"Feature",geometry:{type:"Point",coordinates:[lastPos.lon,lastPos.lat]}});
}

function startPresencePoll(pid){

    try{
      const r=await fetch('/api/projects/'+encodeURIComponent(pid)+'/presence',{cache:'no-store'});
      if(!r.ok) return;

/* ── stop panel ─────────────────────────────────────── */
function renderStopList(){
  const panel = document.getElementById("stopPanel");
  const now = Date.now();

  // Live stops, then every locally recorded stop, then already-published stops
  // this session hasn't touched — the panel itself already scrolls
  // (#stopPanel, max-height:130px), so there's no need to window this down.
  // Published stops are shown (not just drawn on the map) and playable so
  // they read as real, active content, not just a faint backdrop.
  const activeLive = liveStops.filter(s => s.expiresAt > now);
  const localIds = new Set(stops.map(s=>s.id));
  const published = publishedZones
    .filter(z=>z.center && !localIds.has(z.id))
    .map(z=>({id:z.id, name:z.name, audioUrl:z.audioUrl, _published:true}));
  const allItems = [
    ...activeLive.map(s=>({...s, _live:true})),
    ...stops.map(s=>({...s, _live:false})),
    ...published
  ];

  if(!allItems.length){ panel.classList.remove("show"); return; }
  panel.classList.add("show");

  panel.innerHTML = allItems.map(s => {
    const audioUrl = s._live || s._published ? s.audioUrl : clips.find(c=>c.id===s.clipId&&c.audioUrl)?.audioUrl;
    const playBtn  = audioUrl
      ? `<button class="sp-play" onclick="playStopAudio('${esc(audioUrl)}')">▶</button>`
      : "";
    if(s._live){
      const rem  = Math.max(0, s.expiresAt - now);
      const mins = Math.floor(rem/60000);
      const secs = String(Math.floor((rem%60000)/1000)).padStart(2,"0");
      return `<div class="sp-row">
        <span class="sp-dot" style="color:var(--hazard)">⬤</span>
        <span class="sp-name">${esc(s.name)}</span>
        <span class="sp-countdown" data-expires="${s.expiresAt}">${mins}:${secs}</span>
        ${playBtn}
      </div>`;
    } else if(s._published){
      return `<div class="sp-row">
        <span class="sp-dot" style="color:var(--ice)" title="Already published">◈</span>
        <span class="sp-name">${esc(s.name)}</span>
        <span class="sp-countdown"></span>
        ${playBtn}
      </div>`;
    } else {
      return `<div class="sp-row">
        <span class="sp-dot" style="color:var(--go)">●</span>
        <span class="sp-name">${esc(s.name)}</span>
        <span class="sp-countdown"></span>
        ${playBtn}
      </div>`;
    }
  }).join("");
}

// Tick countdowns every second, remove expired
setInterval(()=>{
  const now = Date.now();
  let changed = false;
  document.querySelectorAll(".sp-countdown[data-expires]").forEach(el=>{
    const rem = Math.max(0, parseInt(el.dataset.expires) - now);
    if(rem === 0){
      liveStops = liveStops.filter(s => s.expiresAt > now - 1000);
      changed = true;
    } else {
      const mins = Math.floor(rem/60000);
      const secs = String(Math.floor((rem%60000)/1000)).padStart(2,"0");
      el.textContent = `${mins}:${secs}`;
    }
  });
  if(changed){ renderStopList(); refreshMap(); }
}, 1000);

let _playingAudio = null, _playingUrl = null;
function playStopAudio(url){
  if(_playingAudio && _playingUrl === url){
    _playingAudio.pause();
    _playingAudio = null; _playingUrl = null;
    return;
  }
  if(_playingAudio){ _playingAudio.pause(); }
  const a = new Audio(url);
  a.onended = () => { if(_playingAudio===a){ _playingAudio=null; _playingUrl=null; } };
  a.play().catch(e => setStatus("Playback: "+e.message));
  _playingAudio = a; _playingUrl = url;
}

/* ── permissions ────────────────────────────────────── */
async function initPermissions(){
  setStatus("Requesting mic & GPS…");
  if(!MIME){ setStatus("Browser can't record audio — use Chrome or Safari"); return; }

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio:{channelCount:2,sampleRate:48000,echoCancellation:false,noiseSuppression:false,autoGainControl:true},
      video:false
    });
  } catch(e){
    setStatus("Mic permission denied — enable in browser settings");
    return;
  }

  document.getElementById("btnRec").disabled  = false;
  document.getElementById("btnLive").disabled = false;
  setStatus("GPS…");

  navigator.geolocation.watchPosition(
    pos => {
      const {latitude:lat,longitude:lon,accuracy:acc,heading,speed} = pos.coords;
      const first = !lastPos;
      lastPos = {lat,lon,acc};
      if(heading != null && !isNaN(heading) && (speed||0) > 0.5){
        headingBuffer.push(heading);
        if(headingBuffer.length > 10) headingBuffer.shift();
      }
      document.getElementById("btnMark").disabled = false;
      refreshMap();
      // refreshPublishedZones() only ever got one shot (map 'load' event) and
      // silently no-oped if the style wasn't fully loaded yet (slow tiles on
      // a weak trail signal) — piggyback on every GPS fix, same as refreshMap,
      // so it keeps retrying until it actually succeeds instead of just once.
      refreshPublishedZones();
      if(first){ map.flyTo({center:[lon,lat],zoom:17}); setStatus("Ready"); }
    },
    err => setStatus("GPS: "+err.message),
    {enableHighAccuracy:true,maximumAge:2000,timeout:30000}
  );
}

window.addEventListener("pagehide",()=>{ micStream?.getTracks().forEach(t=>t.stop()); });

/* ── persistent record ──────────────────────────────── */
const btnRec = document.getElementById("btnRec");
btnRec.onclick = () => mediaRec?.state === "recording" ? stopRec() : startRec();

function startRec(){
  if(!micStream) return;
  recChunks=[];
  const bCtx = new AudioContext({sampleRate:48000});
  const src  = bCtx.createMediaStreamSource(micStream);
  const gain = bCtx.createGain(); gain.gain.value = 4;
  const dest = bCtx.createMediaStreamDestination();
  src.connect(gain); gain.connect(dest);

  mediaRec = new MediaRecorder(dest.stream,{mimeType:MIME,audioBitsPerSecond:192000});
  mediaRec.ondataavailable = e => { if(e.data.size>0) recChunks.push(e.data); };
  mediaRec.onstop = async () => { bCtx.close().catch(()=>{}); await saveClip(); };
  mediaRec.start(1000);
  btnRec.textContent = "⏹ Stop";
  btnRec.classList.add("active");
  setStatus("Recording"+(lastStop?" · "+lastStop.name:" — mark a stop first"));
}

function stopRec(){
  if(mediaRec?.state === "recording") mediaRec.stop();
  btnRec.textContent = "⏺ Record";
  btnRec.classList.remove("active");
}

async function saveClip(){
  if(!recChunks.length) return;
  const blob = new Blob(recChunks,{type:MIME||"audio/mp4"});
  const clip = {id:uid(), projId, stopId:lastStop?.id||null, blob, audioUrl:null};
  clips.push(clip);
  await dbPut("clips", clip);
  if(lastStop){
    lastStop.clipId = clip.id;
    await dbPut("stops", lastStop);
    refreshMap();
    renderStopList();
    setStatus("✓ "+lastStop.name+" — audio saved");
  } else {
    setStatus("✓ Clip saved — tap Mark Stop to assign a location");
  }
  document.getElementById("btnPub").disabled = false;
  touchSession();
}

/* ── live stop flow ─────────────────────────────────── */
const btnLive = document.getElementById("btnLive");
btnLive.onclick = () => {
  if(liveRecState === "idle")      startLiveStop();
  else if(liveRecState === "recording") stopLiveStop();
};

async function startLiveStop(){
  if(!micStream){ setStatus("Mic not ready"); return; }
  if(!lastPos){ setStatus("No GPS yet"); return; }

  liveNum++;
  const stop = {
    id:        "live_"+uid(),
    name:      "Live "+liveNum,
    lat:       lastPos.lat,
    lon:       lastPos.lon,
    radiusM:   LIVE_RADIUS[liveActivity] || 25,
    bearingDeg: circularMean(headingBuffer),
    live:      true,
    expiresAt: Date.now() + liveTtlMs
  };

  recChunks = [];
  const bCtx = new AudioContext({sampleRate:48000});
  const src  = bCtx.createMediaStreamSource(micStream);
  const gain = bCtx.createGain(); gain.gain.value = 4;
  const dest = bCtx.createMediaStreamDestination();
  src.connect(gain); gain.connect(dest);

  mediaRec = new MediaRecorder(dest.stream,{mimeType:MIME,audioBitsPerSecond:192000});
  mediaRec.ondataavailable = e => { if(e.data.size>0) recChunks.push(e.data); };
  mediaRec.onstop = async () => { bCtx.close().catch(()=>{}); await finishLiveStop(stop); };
  mediaRec.start(1000);

  liveRecState = "recording";
  updateLiveBtn();
  setStatus("⏺ Recording "+stop.name+"…");
}

function stopLiveStop(){
  if(mediaRec?.state === "recording") mediaRec.stop();
  liveRecState = "uploading";
  updateLiveBtn();
  setStatus("Uploading…");
}

async function finishLiveStop(stop){
  const tok = getToken();
  if(!tok){
    setStatus("No API token — switch to Persistent mode to set one");
    liveRecState = "idle";
    updateLiveBtn();
    return;
  }
  const blob = new Blob(recChunks,{type:MIME||"audio/mp4"});
  const ext  = MIME.includes("webm") ? "webm" : "mp4";
  const key  = `${projId}/${stop.id}.${ext}`;

  try {
    const r = await fetch("/api/audio/"+key,{
      method:"PUT",
      headers:{"Content-Type":MIME||"audio/mp4","Authorization":"Bearer "+tok},
      body:blob
    });
    if(!r.ok) throw new Error("audio upload "+r.status);

    stop.audioUrl = "/api/audio/"+key;
    const zone = buildLiveZone(stop);

    const zr = await fetch(`/api/projects/${encodeURIComponent(projId)}/zones`,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},
      body:JSON.stringify({zone, ttlMs:liveTtlMs})
    });
    if(!zr.ok) throw new Error("zone publish "+zr.status);

    liveStops.push(stop);
    renderStopList();
    refreshMap();
    const _dm=Math.floor(liveTtlMs/60000), _ds=String(Math.floor((liveTtlMs%60000)/1000)).padStart(2,'0');
    setStatus("✓ "+stop.name+" LIVE — "+_dm+":"+_ds);
    touchSession();
  } catch(e) {
    await queueLiveStop(stop, blob, liveTtlMs);
    updateQueueBadge();
    setStatus("Queued — will upload when signal returns");
  } finally {
    liveRecState = "idle";
    updateLiveBtn();
  }
}

function buildLiveZone(stop){
  const genR = Math.max(50, (stop.radiusM||25)*2.5);
  return {
    id:         stop.id,
    name:       stop.name,
    center:     [stop.lat, stop.lon],
    audibleFromM: 40,
    bearingDeg: stop.bearingDeg ?? null,
    layers:     [{kind:"general",radiusM:genR},{kind:"target",radiusM:stop.radiusM||25}],
    triggers:   [{event:"enter",action:"play"},{event:"exit",action:"fadeout"}],
    audioUrl:   stop.audioUrl,
    expiresAt:  stop.expiresAt
  };
}

function updateLiveBtn(){
  const btn = document.getElementById("btnLive");
  btn.classList.remove("recording","uploading");
  if(liveRecState === "recording"){
    btn.textContent = "⏹ Stop Recording";
    btn.classList.add("recording");
    btn.disabled = false;
  } else if(liveRecState === "uploading"){
    btn.textContent = "⏳ Uploading…";
    btn.classList.add("uploading");
    btn.disabled = true;
  } else {
    btn.textContent = "🎙 Start Stop";
    btn.disabled = false;
  }
}

/* ── offline queue ──────────────────────────────────── */
async function queueLiveStop(stop, blob, ttlMs){
  const reader = new FileReader();
  const b64 = await new Promise(res=>{
    reader.onload = e => res(e.target.result.split(",")[1]);
    reader.readAsDataURL(blob);
  });
  await dbPut("live_queue",{
    id:stop.id, stop:{...stop}, blobB64:b64, mimeType:MIME||"audio/mp4",
    projId, ttlMs, queuedAt:Date.now()
  });
}

async function retryQueue(){
  const tok = getToken();
  if(!tok) return;
  const entries = (await dbGetAll("live_queue")).filter(e=>e.projId===projId);
  for(const entry of entries){
    const elapsed     = Date.now() - entry.queuedAt;
    const remainingTtl = entry.ttlMs - elapsed;
    if(remainingTtl <= 0){ await dbDelete("live_queue",entry.id); updateQueueBadge(); continue; }
    try{
      const ext  = entry.mimeType.includes("webm")?"webm":"mp4";
      const key  = `${projId}/${entry.stop.id}.${ext}`;
      const blob = b64toBlob(entry.blobB64, entry.mimeType);

      const r = await fetch("/api/audio/"+key,{
        method:"PUT",
        headers:{"Content-Type":entry.mimeType,"Authorization":"Bearer "+tok},
        body:blob
      });
      if(!r.ok) continue;

      entry.stop.audioUrl = "/api/audio/"+key;
      entry.stop.expiresAt = Date.now() + remainingTtl;
      const zone = buildLiveZone(entry.stop);

      const zr = await fetch(`/api/projects/${encodeURIComponent(projId)}/zones`,{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},
        body:JSON.stringify({zone, ttlMs:remainingTtl})
      });
      if(!zr.ok) continue;

      await dbDelete("live_queue",entry.id);
      liveStops.push(entry.stop);
      renderStopList();
      refreshMap();
      updateQueueBadge();
    }catch(e){ /* still offline */ }
  }
}

function b64toBlob(b64, type){
  const bytes = atob(b64);
  const arr   = new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr],{type});
}

async function updateQueueBadge(){
  const entries = (await dbGetAll("live_queue")).filter(e=>e.projId===projId);
  const badge   = document.getElementById("queueBadge");
  if(entries.length){
    badge.textContent = entries.length+" queued";
    badge.classList.add("show");
  } else {
    badge.classList.remove("show");
  }
}

function onSignalRestored(){
  if(signalOk) return;
  signalOk = true;

function playSignalChime(ascending){
  try{
    const ctx   = new AudioContext();
    const freqs = ascending ? [440,880] : [880,440];
    freqs.forEach((freq,i)=>{
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq; osc.type = "sine";
      gain.gain.setValueAtTime(0.4, ctx.currentTime + i*0.25);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.25 + 0.3);
      osc.start(ctx.currentTime + i*0.25);
      osc.stop( ctx.currentTime + i*0.25 + 0.3);
    });
    setTimeout(()=>ctx.close(), 1500);
  }catch(e){}
}

/* ── core publish logic ─────────────────────────────── */
async function doPublish(pid, pname, token){
  // Guard: project must already exist on server — guide cannot create projects
  try{
    const chk = await fetch("/api/projects"+(orgQueryParam()?"?"+orgQueryParam():""),{cache:"no-store",headers:{authorization:"Bearer "+token}});
    if(chk.ok){
      const data = await chk.json();
      if(!(data.projects||[]).find(p=>p.id===pid)){
        setProg("Project not found on server — create it from home first",0);
        return;
      }
    }
  }catch(e){ /* offline — allow attempt, server will validate */ }

  const hdr     = {"Authorization":"Bearer "+token};
  const myStops = stops.filter(s=>s.projId===pid);
  const toUp    = clips.filter(c=>c.projId===pid&&!c.audioUrl&&c.blob);
  let done = 0;

  for(const cl of toUp){
    setProg(`Uploading audio ${done+1}/${toUp.length}…`, done/Math.max(toUp.length,1)*0.8);
    const key = `${pid}/${cl.id}.mp4`;
    const r   = await fetch("/api/audio/"+key,{
      method:"PUT",headers:{...hdr,"Content-Type":MIME||"audio/mp4"},body:cl.blob});
    if(!r.ok){ setProg("Upload failed ("+r.status+") — check API token",0); return; }
    cl.audioUrl = `/api/audio/${key}`;
    await dbPut("clips", cl);
    done++;
  }

  setProg("Publishing bundle…", 0.88);
  const newZones = myStops.map(s=>{
    const cl   = clips.find(c=>c.id===s.clipId&&c.audioUrl);
    const genR = Math.max(30,(s.radiusM||12)*2.5);
    return {
      id:s.id, name:s.name, center:[s.lat,s.lon], audibleFromM:40, bearingDeg:s.bearingDeg??null,
      layers:[{kind:"general",radiusM:genR},{kind:"target",radiusM:s.radiusM||12}],
      triggers:[{event:"enter",action:"play"},{event:"exit",action:"fadeout"}],
      ...(cl?{audioUrl:cl.audioUrl}:{})
    };
  });

  // Merge, don't replace: the bundle PUT endpoint overwrites the whole zones
  // array, and this project may have real content from the fence editor
  // (bots, hazards, custom triggers) that field recorder knows nothing about.
  // Pull the live bundle, keep every zone this session didn't touch, and only
  // add/update the stops recorded here.
  let base = {};
  try{
    const gb = await fetch(`/api/projects/${encodeURIComponent(pid)}/bundle`,{cache:"no-store"});
    if(gb.ok) base = await gb.json();
  }catch(e){ /* no existing bundle yet — publishing for the first time */ }
  const existingZones = Array.isArray(base.zones) ? base.zones : [];
  const newIds = new Set(newZones.map(z=>z.id));
  const zones = [...existingZones.filter(z=>!newIds.has(z.id)), ...newZones];

  const bp = await fetch(`/api/projects/${encodeURIComponent(pid)}/bundle`,{
    method:"PUT",headers:{...hdr,"Content-Type":"application/json"},
    body:JSON.stringify({...base, name:pname, zones, version:1})
  });
  if(!bp.ok){
    const msg = await bp.text().catch(()=>"");
    setProg("Publish failed ("+bp.status+"): "+msg.slice(0,80),0);
    return;
  }
  setProg("Done! "+myStops.length+" stops live",1);
  setTimeout(()=>{ closeSheet(); setStatus("✓ Published — "+myStops.length+" stops live"); renderStopList(); }, 800);
}

function setProg(msg,frac){
  document.getElementById("pubMsg").textContent = msg;
  document.getElementById("pubFill").style.width = (frac*100)+"%";
}

async function touchSession(){
  if(!session) return;
  session.updatedAt = new Date().toISOString();

async function clearCurrentSession(){
  if(!projId) return;
  const name = session?.name || projId;
  if(!confirm("Clear all local data for \""+name+"\"?\n\nStops, clips and session will be removed from this device. Published server data is unaffected.")) return;
  for(const s of stops) await dbDelete("stops",s.id);
  for(const c of clips.filter(c=>c.projId===projId)) await dbDelete("clips",c.id);
  await dbDelete("sessions",projId);
  stops=[]; clips=[]; liveStops=[]; lastStop=null; session=null; publishedZones=[];
  document.getElementById("btnPub").disabled=true;
  refreshMap();
  refreshPublishedZones();
  renderStopList();

}

/* ── init ───────────────────────────────────────────── */
async function init(){
  await openDb();
  await _meReady;

  if(!projId){
    document.getElementById("screenSessions").style.display = "flex";
    await renderSessionsList();
    return;
  }

  // Verify project exists on server and get its name
  let projectName = null;
  try{
    const r = await fetch("/api/projects"+(orgQueryParam()?"?"+orgQueryParam():""),{cache:"no-store",headers:{authorization:"Bearer "+getToken()}});
    if(r.ok){
      const data = await r.json();
      const proj = (data.projects||[]).find(p=>p.id===projId);
      if(proj){
        projectName = proj.name;
      } else {
        // Project not found on server (e.g. after nuke) — clear local data and redirect
        const localStops = (await dbGetAll("stops")).filter(s=>s.projId===projId);
        const localClips = (await dbGetAll("clips")).filter(c=>c.projId===projId);
        for(const s of localStops) await dbDelete("stops",s.id);
        for(const c of localClips)  await dbDelete("clips",c.id);
        await dbDelete("sessions",projId);
        document.getElementById("screenSessions").style.display = "flex";
        document.getElementById("sessList").innerHTML =
          `<div class="empty-hint">Project <strong>${esc(projId)}</strong> not found on server.<br><br>
           <a href="/" style="color:var(--coral)">← Return to home to select a project</a></div>`;
        return;
      }
    }
    // offline — continue with local data, projectName stays null
  }catch(e){}

  // Read project settings (liveTtlMs) + real published stops from published bundle.
  const _bundleRefBox = await loadPublishedBundle();
  const _bundleRef = _bundleRefBox.ref;

  document.getElementById("screenSessions").style.display = "none";
  document.getElementById("screenField").style.display = "flex";

  session  = await dbGet("sessions", projId);
  stops    = (await dbGetAll("stops")).filter(s=>s.projId===projId);
  clips    =  await dbGetAll("clips");
  lastStop = stops.length ? stops[stops.length-1] : null;

  // Create/update local session using server name (no user prompt)
  const displayName = projectName || session?.name || projId;
  if(!session || (projectName && session.name !== projectName)){
    session = {projId, name:displayName, updatedAt:new Date().toISOString()};
    await dbPut("sessions", session);
  }

  document.getElementById("projName").textContent = displayName;

  // Guides are live-only: persistent stops/audio (which never expire) are
  // admin/operator only. Guides can only create Live stops/audio, which
  // auto-delete after their set TTL.
  if(_me && _me.role === "guide"){
    document.getElementById("btnModePers").style.display = "none";
    document.getElementById("btnModeLive").style.display = "none";
    document.getElementById("btnPub").style.display = "none";
    liveMode = true; // force live before updateModeUI
  } else {
    // Publish is now a safe merge (see doPublish), so it's always usable —
    // no more "disabled until you record something new" confusion.
    document.getElementById("btnPub").disabled = false;
    // Admin/operator exiting a project should land back on the actual site
    // homepage, not field recorder's own session list — guides keep going
    // back to their "My Bookings" list, since they don't have a homepage.
    const backLink = document.getElementById("backLink");
    if(backLink){ backLink.href = "/"; backLink.textContent = "◀ Home"; }
  }

  updateModeUI();
  // Selecting a project surfaces its QR code first — this tool needs GPS/mic,
  // so the common path from the main menu (often a laptop) is: pick a project,
  // scan the QR to continue on your phone. Dismissing it reveals Mark Stop/Record.
  showFieldQr();
  updateQueueBadge();
  initConnectivity();
  initMap();
  map.on("load", () => {
    map.resize(); refreshMap(); renderStopList();
    // Center on the tour's own location immediately — don't leave the map
    // sitting at the [0,0] world-view default while waiting on a GPS fix,
    // which may be slow, denied, or never arrive at all.
    if(_bundleRef) map.jumpTo({center:[_bundleRef[1],_bundleRef[0]], zoom:16});
  });
  startPresencePoll(projId);
  await initPermissions();
}

init();
async function frSignOut(e){
  e.preventDefault();
  const s=localStorage.getItem("gp.session");
  if(s) await fetch("/api/auth/logout",{method:"POST",headers:{authorization:"Bearer "+s}}).catch(()=>{});
  localStorage.removeItem("gp.session"); localStorage.removeItem("gp.user");
  location.href="/login";
}
</script>
