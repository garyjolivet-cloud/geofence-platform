<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chase Life — Geofence Platform</title>
<script src="role-gate.js"></script>
<script>RoleGate.require(['admin']);</script>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --night:#0a1018;--slate:#141d2b;--slate-2:#1b2738;--rim:#2e3f58;--coral:#ff6a3d;
         --snow:#ffffff;--ice:#c8dff2;--fog:#8aa5bf;--hazard:#ff2f4e;--go:#38e0a6;--amber:#ffc24d; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:
    radial-gradient(1200px 600px at 80% -10%,rgba(255,106,61,.10),transparent 60%),
    radial-gradient(900px 500px at -10% 10%,rgba(56,224,166,.07),transparent 55%),var(--night);
    color:var(--snow);font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:900px;margin:0 auto;padding:28px 22px 64px}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
         padding:14px 0 22px;border-bottom:1px solid var(--rim)}
  .brand{display:flex;align-items:center;gap:13px}
  .glyph{width:42px;height:42px;border-radius:12px;flex:0 0 auto;
         background:linear-gradient(150deg,var(--coral),#ff9166);position:relative;
         box-shadow:0 6px 22px rgba(255,106,61,.30)}
  .glyph::after{content:"";position:absolute;inset:12px;border-radius:50%;border:2.5px solid #1a0d07}
  .glyph::before{content:"";position:absolute;left:50%;top:7px;width:2.5px;height:13px;
                 background:#1a0d07;transform:translateX(-50%);border-radius:2px}
  .brand h1{font-family:"Black Han Sans";font-weight:400;font-size:22px;margin:0;letter-spacing:.3px}
  .brand p{margin:1px 0 0;font-family:"Barlow Condensed";font-size:12px;letter-spacing:1.2px;
           text-transform:uppercase;color:var(--fog)}
  nav{display:flex;gap:8px;flex-wrap:wrap}
  nav a{font-family:"Barlow Condensed";font-weight:600;font-size:13px;letter-spacing:.4px;
        text-transform:uppercase;padding:9px 14px;border:1px solid var(--rim);border-radius:10px;
        color:var(--ice);transition:.15s;background:rgba(20,29,43,.5)}
  nav a:hover{border-color:var(--coral);color:var(--snow)}
  nav a.primary{background:var(--coral);border-color:var(--coral);color:#1a0d07}
  nav a.primary:hover{filter:brightness(1.07)}

  /* clients */
  .clients{display:flex;flex-direction:column;gap:20px;margin-top:24px}
  .client{background:linear-gradient(180deg,rgba(20,29,43,.9),rgba(16,25,38,.7));
          border:1px solid var(--rim);border-radius:18px;overflow:hidden}
  .client-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--rim)}
  .client-icon{width:38px;height:38px;border-radius:10px;background:rgba(255,106,61,.12);
               border:1px solid rgba(255,106,61,.25);display:flex;align-items:center;
               justify-content:center;font-size:18px;flex:0 0 auto}
  .client-name{font-family:"Barlow Condensed";font-size:20px;font-weight:700;color:var(--snow);flex:1}
  .client-meta{font-family:"Barlow Condensed";font-size:12px;color:var(--fog);letter-spacing:.4px}
  .client-actions{display:flex;gap:8px}
  .client-actions button{background:none;border:1px solid var(--rim);border-radius:8px;
                         color:var(--fog);font-family:"Barlow Condensed";font-size:12px;
                         padding:5px 10px;cursor:pointer;transition:.12s}
  .client-actions button:hover{border-color:var(--ice);color:var(--ice)}

  /* tours grid */
  .tours{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:14px}
  .tour{background:rgba(255,255,255,.03);border:1px solid var(--rim);border-radius:12px;
        padding:14px;display:flex;flex-direction:column;gap:10px;transition:.15s;position:relative}
  .tour:hover{border-color:#3d5472;background:rgba(255,255,255,.05)}
  .tour-name{font-family:"Barlow Condensed";font-size:17px;font-weight:600;color:var(--snow);line-height:1.2}
  .tour-meta{font-family:"Barlow Condensed";font-size:11px;color:var(--fog);letter-spacing:.3px}
  .badge{display:inline-block;font-family:"Barlow Condensed";font-size:10px;font-weight:600;
         letter-spacing:.6px;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid}
  .badge.live{color:var(--go);border-color:rgba(56,224,166,.4);background:rgba(56,224,166,.08)}
  .badge.draft{color:var(--amber);border-color:rgba(255,194,77,.4);background:rgba(255,194,77,.06)}
  .tour-btns{display:flex;gap:6px}
  .tour-btns a{flex:1;text-align:center;font-family:"Barlow Condensed";font-weight:600;font-size:12px;
               letter-spacing:.3px;text-transform:uppercase;padding:7px 4px;border-radius:8px;
               border:1px solid var(--rim);color:var(--ice);transition:.15s}
  .tour-btns a:hover{border-color:var(--coral);color:var(--snow)}
  .tour-btns a.go{background:var(--coral);border-color:var(--coral);color:#1a0d07}
  .tour-btns a.go:hover{filter:brightness(1.07)}

  /* add tour tile */
  .tour.add{border-style:dashed;cursor:pointer;align-items:center;justify-content:center;
            min-height:100px;color:var(--fog)}
  .tour.add:hover{border-color:var(--coral);color:var(--coral);background:rgba(255,106,61,.04)}
  .tour.add span{font-family:"Barlow Condensed";font-size:13px;letter-spacing:.4px;text-transform:uppercase}

  /* empty / unsorted */
  .no-tours{padding:14px 18px;font-family:"Barlow Condensed";font-size:13px;color:var(--fog)}
  .unsorted-head{display:flex;align-items:center;gap:10px;padding:14px 18px 4px;
                 font-family:"Barlow Condensed";font-size:11px;text-transform:uppercase;
                 letter-spacing:1px;color:var(--fog)}

  /* new client */
  .new-client{border:1px dashed var(--rim);border-radius:18px;padding:20px;text-align:center;
              cursor:pointer;transition:.15s;margin-top:4px}
  .new-client:hover{border-color:var(--coral);background:rgba(255,106,61,.03)}
  .new-client span{font-family:"Barlow Condensed";font-size:14px;letter-spacing:.5px;
                   text-transform:uppercase;color:var(--fog)}
  .new-client:hover span{color:var(--coral)}

  .state{border:1px dashed var(--rim);border-radius:16px;padding:34px 22px;text-align:center;
         color:var(--fog);font-family:"Barlow Condensed";font-size:15px;margin-top:20px}
  .state b{color:var(--snow)} .state a{color:var(--coral);font-weight:600}

  footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--rim);
         font-family:"Barlow Condensed";font-size:12px;color:var(--fog);
         display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  footer a{color:var(--ice)} footer a:hover{color:var(--coral)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fog);
       margin-right:6px;vertical-align:middle}
  .dot.ok{background:var(--go)} .dot.bad{background:var(--hazard)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="glyph" aria-hidden="true"></div>
      <div>
        <h1>Chase Life</h1>
        <p>Location-aware tour platform</p>
      </div>
    </div>
    <nav>
      <a href="/clients" class="primary">Clients</a>
      <a href="/field">Guide</a>
      <a href="/editor">Editor</a>
      <a href="/bots">Bots</a>
      <a href="/dashboard">Dashboard</a>
    </nav>
  </header>

  <div id="main"></div>

  <footer>
    <span><span class="dot" id="apidot"></span><span id="apitext">checking…</span></span>
    <span><a href="/editor">Editor</a> · <a href="/bots">Bots</a> · <a href="/engine">Engine</a> · <a href="/field">Guide</a></span>
  </footer>
</div>

<script>
"use strict";
const mainEl=document.getElementById("main");

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function when(iso){ if(!iso)return ""; const d=new Date(iso); if(isNaN(d))return "";
  const days=Math.floor((Date.now()-d)/86400000);
  return days<=0?"today":days===1?"yesterday":days+" days ago"; }
function clientIcon(name){ const icons={"resort":"⛷️","mountain":"🏔️","ski":"⛷️","golden":"🏙️","town":"🏙️","village":"🏘️","river":"🌊","trail":"🥾","park":"🌲","bike":"🚴","horse":"🐴","kicking":"🐴"};
  const low=(name||"").toLowerCase();
  for(const [k,v] of Object.entries(icons)) if(low.includes(k)) return v;
  return "📍"; }

function tourCard(p, appId){
  const id=esc(p.id);
  const live=p.status==="live";
  const badge=live?'<span class="badge live">live</span>':'<span class="badge draft">draft</span>';
  const meta=[("v"+(p.bundleVersion||1)), when(p.updatedAt)].filter(Boolean).join(" · ");
  return `<div class="tour">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
      <div class="tour-name">${esc(p.name||p.id)}</div>${badge}
    </div>
    <div class="tour-meta">${meta}</div>
    <div class="tour-btns">
      <a class="go" href="/engine?project=${id}">▶ Walk</a>
      <a href="/field">Guide</a>
      <a href="/editor?project=${id}">Edit</a>
      <a href="/sim?project=${id}">Test</a>
    </div>
  </div>`;
}

function addTourTile(appId){
  return `<div class="tour add" onclick="newTour('${esc(appId||"")}')"><span>+ New tour</span></div>`;
}

function clientBlock(app, tours){
  const icon=clientIcon(app.name);
  const count=tours.length+(tours.length===1?" tour":" tours");
  const toursHtml=tours.map(p=>tourCard(p,app.id)).join("")+addTourTile(app.id);
  return `<div class="client">
    <div class="client-head">
      <div class="client-icon">${icon}</div>
      <div style="flex:1">
        <div class="client-name">${esc(app.name)}</div>
        ${app.description?`<div class="client-meta">${esc(app.description)}</div>`:`<div class="client-meta">${count}</div>`}
      </div>
      <div class="client-actions">
        <button onclick="renameClient('${esc(app.id)}','${esc(app.name)}')">Rename</button>
        <button onclick="deleteClient('${esc(app.id)}','${esc(app.name)}')" style="color:rgba(255,47,78,.5);border-color:rgba(255,47,78,.2)">✕</button>
      </div>
    </div>
    <div class="tours">${toursHtml}</div>
  </div>`;
}

function sessionAuthHeader(){
  const t=localStorage.getItem("gp.session");
  return t?{authorization:"Bearer "+t}:{};
}
async function load(){
  try{
    const h={headers:sessionAuthHeader()};
    const [ra,rp]=await Promise.all([fetch("/api/apps",h),fetch("/api/projects",h)]);
    const apps=(await ra.json()).apps||[];
    const projects=(await rp.json()).projects||[];
    setApi(true, apps.length+" workspace"+(apps.length===1?"":"s")+" · "+projects.length+" tour"+(projects.length===1?"":"s"));

    let html='<div class="clients">';
    apps.forEach(a=>{
      const mine=projects.filter(p=>p.appId===a.id);
      html+=clientBlock(a,mine);
    });
    html+='</div>';

    // Safety net: projects not matched to any known app still show
    const orphans=projects.filter(p=>!p.appId||!apps.find(a=>a.id===p.appId));
    if(orphans.length) html+=clientBlock({id:null,name:'Unsorted'},orphans);

    if(!apps.length&&!projects.length){
      html=`<div class="state">No workspaces yet.<br><br>
        New customer/company? Go to <a href="/clients" style="color:var(--coral)">Clients</a> instead — that's where you add a company.<br>
        A <b>workspace</b> here is just a project folder <i>inside</i> a customer you've already created — e.g. <i>Winter Programs</i>, <i>Summer Trails</i>.<br><br>
        <a onclick="newClient()" style="cursor:pointer;color:var(--coral);font-weight:600">+ Create a workspace →</a></div>`;
    }

    mainEl.innerHTML=html;

    // new workspace button
    if(apps.length){
      mainEl.innerHTML+=`<div class="new-client" onclick="newClient()"><span>+ New workspace</span></div>`;
    }
  }catch(e){
    setApi(false,"platform unreachable");
    mainEl.innerHTML=`<div class="state">Couldn't reach the platform. Tools still work directly: <a href="/editor">Editor</a>, <a href="/sim">Simulator</a>, <a href="/engine">Engine</a>.</div>`;
  }
}

function getToken(){ try{ return localStorage.getItem("gp.admin")||""; }catch(e){ return ""; } }
async function askToken(){ let t=getToken(); if(t)return t;
  t=(prompt("Admin token:")||"").trim();
  if(t){try{localStorage.setItem("gp.admin",t);}catch(e){}} return t; }

async function newClient(){
  if(!confirm("This creates a WORKSPACE — a project folder inside an existing customer, not a new customer/company.\n\nAdding a new customer? Cancel this and use /clients instead.\n\nContinue creating a workspace?")) return;
  const name=(prompt("Workspace name (a project grouping, e.g. \"Winter Programs\" or \"Summer Trails\")")||"").trim();
  if(!name)return;
  const token=await askToken(); if(!token)return;
  try{
    const r=await fetch("/api/apps",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+token},body:JSON.stringify({name})});
    if(r.ok) load();
    else{ const j=await r.json().catch(()=>({})); alert("Couldn't create workspace: "+(j.error||r.status));
      if(r.status===401) try{localStorage.removeItem("gp.admin");}catch(e){} }
  }catch(e){ alert("Failed: "+e.message); }
}

async function renameClient(id, current){
  const name=(prompt("New name for this workspace:", current)||"").trim();
  if(!name||name===current)return;
  const token=await askToken(); if(!token)return;
  try{
    const r=await fetch("/api/apps/"+encodeURIComponent(id),{method:"PUT",headers:{"content-type":"application/json","authorization":"Bearer "+token},body:JSON.stringify({name})});
    if(r.ok) load();
    else{ const j=await r.json().catch(()=>({})); alert("Rename failed: "+(j.error||r.status));
      if(r.status===401) try{localStorage.removeItem("gp.admin");}catch(e){} }
  }catch(e){ alert("Failed: "+e.message); }
}

function newTour(appId){
  let url="/editor";
  if(appId) url+="?app="+encodeURIComponent(appId);
  location.href=url;
}

async function deleteClient(id,name){
  if(!confirm("Delete workspace \""+name+"\" and all its tours? Cannot be undone."))return;
  const token=await askToken(); if(!token)return;
  try{
    const r=await fetch("/api/apps/"+encodeURIComponent(id)+"?cascade=true",{method:"DELETE",headers:{"authorization":"Bearer "+token}});
    if(r.ok) load();
    else{ const j=await r.json().catch(()=>({})); alert("Delete failed: "+(j.error||r.status)); }
  }catch(e){ alert("Failed: "+e.message); }
}

function setApi(ok,text){
  document.getElementById("apidot").className="dot "+(ok?"ok":"bad");
  document.getElementById("apitext").textContent=text;
}
load();
</script>
</body>
</html>
