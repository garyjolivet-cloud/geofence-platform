<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Chase Life</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--night:#0a1018;--slate:#141d2b;--rim:#2e3f58;--coral:#ff6a3d;--snow:#eef4fb;--ice:#8fb6d4;--fog:#5b7088;--go:#38e0a6}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100vh;background:var(--night);color:var(--snow);font-family:"Barlow",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  .card{width:100%;max-width:380px;background:var(--slate);border:1px solid var(--rim);border-radius:18px;padding:36px 32px 32px;margin:24px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
  .glyph{width:32px;height:32px;border-radius:9px;background:linear-gradient(150deg,var(--coral),#ff9166);position:relative;flex-shrink:0}
  .glyph::after{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid #1a0d07}
  .brand h1{font-family:"Black Han Sans";font-weight:400;font-size:18px;margin:0;line-height:1}
  .brand p{margin:0;font-family:"Barlow Condensed";font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--fog)}
  h2{font-family:"Barlow Condensed";font-weight:700;font-size:22px;letter-spacing:.5px;margin:0 0 22px;color:var(--snow)}
  label{display:block;font-family:"Barlow Condensed";font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--fog);margin-bottom:5px}
  input{display:block;width:100%;background:#0d1623;border:1px solid var(--rim);color:var(--snow);border-radius:9px;padding:10px 12px;font-family:"Barlow";font-size:15px;margin-bottom:16px;outline:none;transition:border-color .15s}
  input:focus{border-color:var(--coral)}
  button.go{display:block;width:100%;background:var(--coral);border:none;color:#1a0d07;font-family:"Barlow Condensed";font-weight:700;font-size:15px;letter-spacing:.5px;text-transform:uppercase;border-radius:9px;padding:12px;cursor:pointer;margin-top:4px;transition:opacity .15s}
  button.go:hover{opacity:.88}
  button.go:disabled{opacity:.45;cursor:not-allowed}
  .err{color:#ff6a6a;font-family:"Barlow Condensed";font-size:13px;margin-bottom:12px;display:none}
  .foot{margin-top:20px;text-align:center;font-family:"Barlow Condensed";font-size:13px;color:var(--fog)}
  .foot a{color:var(--coral);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="glyph"></div>
    <div><h1>Chase Life</h1><p>Guide Platform</p></div>
  </div>
  <h2>Sign in</h2>
  <div class="err" id="err"></div>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
  <button class="go" id="btn">Sign in</button>
  <div class="foot"><a href="/">← Back to home</a></div>
</div>
<script>
"use strict";
const next = new URLSearchParams(location.search).get("next") || "/";
const err = document.getElementById("err");
const btn = document.getElementById("btn");

async function login() {
  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("pw").value;
  if (!email || !pw) { showErr("Enter your email and password."); return; }
  btn.disabled = true; btn.textContent = "Signing in…"; err.style.display = "none";
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ email, password: pw })
    });
    const j = await r.json();
    if (!r.ok) { showErr(j.error || "Sign-in failed."); return; }
    localStorage.setItem("gp.session", j.token);
    localStorage.setItem("gp.user", JSON.stringify(j.user));
    location.href = next;
  } catch(e) { showErr("Network error — try again."); }
  finally { btn.disabled = false; btn.textContent = "Sign in"; }
}
function showErr(msg) { err.textContent = msg; err.style.display = "block"; }
btn.addEventListener("click", login);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
document.getElementById("email").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("pw").focus(); });

// Redirect if already logged in
const existing = localStorage.getItem("gp.session");
if (existing) {
  fetch("/api/auth/me", { headers: { authorization: "Bearer " + existing } })
    .then(r => { if (r.ok) location.href = next; }).catch(() => {});
}
</script>
</body>
</html>
