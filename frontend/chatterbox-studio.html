<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chase Life — Chatterbox Studio</title>
<script src="role-gate.js"></script>
<script src="client-picker.js"></script>
<script>RoleGate.require(['admin']);</script>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --night:#0a1018;--slate:#141d2b;--slate-2:#1b2738;--rim:#2e3f58;--coral:#ff6a3d;
         --snow:#ffffff;--ice:#c8dff2;--fog:#8aa5bf;--hazard:#ff2f4e;--go:#38e0a6;--amber:#ffc24d; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Barlow",system-ui,sans-serif;background:var(--night);color:var(--snow);overflow:hidden}
  body{display:flex;flex-direction:column}
  .hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rim);background:rgba(10,16,24,.95);flex:0 0 auto}
  .hdr h1{font-family:"Black Han Sans";font-size:17px;margin:0;flex:0 0 auto}
  .hdr .crumb{font-family:"Barlow Condensed";font-size:13px;color:var(--fog);flex:1;min-width:0}
  .hdr a,.hdr button.linklike{font-family:"Barlow Condensed";font-size:13px;color:var(--ice);text-decoration:none;border:1px solid var(--rim);border-radius:7px;padding:6px 12px;white-space:nowrap;background:none;cursor:pointer}
  .hdr a:hover,.hdr button.linklike:hover{border-color:var(--ice)}
  button{font-family:"Barlow Condensed";font-weight:600;text-transform:uppercase;letter-spacing:.4px;
         font-size:12px;color:var(--snow);background:var(--slate);border:1px solid var(--rim);border-radius:8px;
         padding:7px 12px;cursor:pointer}
  button.on{background:var(--coral);border-color:var(--coral);color:#1a0d07}
  button.ghost{background:none}
  button.danger{border-color:var(--hazard);color:var(--hazard)}
  button:disabled{opacity:.4;cursor:default}
  input,select,textarea{font-family:"Barlow Condensed";font-size:13px;background:var(--slate-2);
         color:var(--snow);border:1px solid var(--rim);border-radius:8px;padding:6px 9px}
  .hint{font-family:"Barlow";font-size:12px;color:var(--fog)}

  #svcBanner{flex:0 0 auto;padding:8px 16px;font-family:"Barlow Condensed";font-size:12px;
         background:rgba(255,47,78,.12);color:var(--hazard);border-bottom:1px solid var(--hazard);display:none}
  #svcBanner.ok{display:none}
  #svcBanner.down{display:block}

  #main{flex:1;display:flex;min-height:0}

  /* ---- voice palette (left rail) ---- */
  .rail{width:260px;flex:0 0 260px;border-right:1px solid var(--rim);display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.01)}
  .rail h2{font-family:"Barlow Condensed";font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--fog);margin:12px 12px 6px}
  .rail-body{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px;min-height:0}
  #voiceUpload{border:1px dashed var(--rim);border-radius:9px;padding:12px;text-align:center;cursor:pointer;font-family:"Barlow Condensed";font-size:12px;color:var(--fog)}
  #voiceUpload.dragover{border-color:var(--coral);color:var(--coral);background:rgba(255,106,61,.06)}
  #voiceNameInput{width:100%;margin-top:6px}
  .voice-card{border:1px solid var(--rim);border-radius:9px;padding:8px 10px;display:flex;align-items:center;gap:8px;cursor:grab;background:rgba(255,255,255,.02)}
  .voice-card.dragging{opacity:.4}
  .voice-card .vc-name{flex:1;font-family:"Barlow Condensed";font-size:13px}
  .voice-card button{padding:3px 7px;font-size:10px}

  /* ---- script editor (main) ---- */
  #editorPane{flex:1;display:flex;flex-direction:column;min-height:0}
  #scriptToolbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--rim)}
  #scriptToolbar input{flex:1}
  #scriptImport{flex:0 0 auto;padding:14px 16px}
  #scriptImport textarea{width:100%;height:140px;font-family:"Barlow";font-size:13px}
  #scriptBody{flex:1;overflow-y:auto;padding:16px 24px;font-family:"Barlow";font-size:15px;line-height:1.7;white-space:pre-wrap}
  #scriptBody.dragover{background:rgba(255,106,61,.04)}
  .vox-run{border-radius:4px;padding:1px 2px;position:relative}
  .vox-run.tagged{background:rgba(255,106,61,.14);box-shadow:inset 0 -2px 0 var(--coral)}
  .vox-run.generated{box-shadow:inset 0 -2px 0 var(--go)}
  .vox-tag{position:absolute;top:-16px;left:0;font-family:"Barlow Condensed";font-size:9px;text-transform:uppercase;
         letter-spacing:.4px;color:var(--coral);white-space:nowrap;pointer-events:none}
  .vox-actions{display:inline-flex;gap:4px;margin-left:4px;vertical-align:middle}
  .vox-actions button{padding:2px 6px;font-size:9px}
  #genAllBar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--rim)}
  #genAllBar .hint{flex:1}
</style>
</head>
<body>

<div class="hdr">
  <h1>🎙️ Chatterbox Studio</h1>
  <span class="crumb" id="hdrCrumb">local voice cloning — Macbeth-to-park-tour narration</span>
  <nav id="clientNav" style="display:flex;align-items:center;gap:8px"></nav>
  <a href="/library">Library →</a>
  <a href="/editor">Editor →</a>
</div>

<div id="svcBanner"></div>

<div id="main">
  <div class="rail">
    <h2>Voice Palette</h2>
    <div class="rail-body">
      <div id="voiceUpload">
        Drop an audio sample here<br>or click to choose a file
        <input type="text" id="voiceNameInput" placeholder="Voice name (e.g. Witch #1)">
        <input type="file" id="voiceFileInput" accept="audio/*" style="display:none">
      </div>
      <div id="voiceList"></div>
    </div>
  </div>

  <div id="editorPane">
    <div id="scriptImport">
      <div class="hint" style="margin-bottom:6px">Paste a script (e.g. Macbeth), then import it below.</div>
      <textarea id="scriptRaw" placeholder="MACBETH: Is this a dagger which I see before me..."></textarea>
      <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
        <input type="text" id="scriptSlugInput" placeholder="Script name (used as the Library folder)" style="flex:1">
        <button class="on" id="btnImportScript">Import Script</button>
      </div>
    </div>

    <div id="scriptToolbar" style="display:none">
      <div class="hint">Highlight text, then drag a voice card onto the highlighted passage.</div>
      <button class="ghost" id="btnReimport">← New script</button>
    </div>
    <div id="scriptBody" style="display:none"></div>
    <div id="genAllBar" style="display:none">
      <div class="hint" id="genAllHint"></div>
      <button id="btnGenerateAll">Generate All Tagged</button>
    </div>
  </div>
</div>

<script>
const LOCAL_SVC = "http://127.0.0.1:8799";
function getToken(){ return localStorage.getItem("gp.session")||""; }
function currentOrg(){ return (window.ClientPicker && ClientPicker.resolve()) || ""; }
function slug(s){ return (s||"").toString().toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60); }

/* ---- mp3 encoding (same lamejs pipeline as audio-studio.html/library.html/
   fence-editor.html) — the local service returns wav; every clip in this
   app's Library is stored as mp3, so re-encode client-side before upload. */
let _lame=null;
async function _loadLame(){
  if(_lame) return _lame;
  try{ const mod=await import('https://esm.sh/@breezystack/lamejs@1.2.7'); _lame=mod.Mp3Encoder; return _lame; }catch(e){ return null; }
}
function _pcm16(f){ const out=new Int16Array(f.length); for(let i=0;i<f.length;i++){ const v=Math.max(-1,Math.min(1,f[i])); out[i]=v<0?v*0x8000:v*0x7fff; } return out; }
async function _encodeMp3(buf){
  const Mp3Encoder=await _loadLame();
  if(!Mp3Encoder) throw new Error("mp3 encoder failed to load — check your connection and try again");
  const nch=buf.numberOfChannels>1?2:1, sr=buf.sampleRate;
  const left=_pcm16(buf.getChannelData(0)), right=nch>1?_pcm16(buf.getChannelData(1)):null;
  const enc=new Mp3Encoder(nch,sr,128); const chunks=[], block=1152;
  for(let i=0;i<left.length;i+=block){
    const out=right?enc.encodeBuffer(left.subarray(i,i+block),right.subarray(i,i+block)):enc.encodeBuffer(left.subarray(i,i+block));
    if(out.length) chunks.push(out);
  }
  const tail=enc.flush(); if(tail.length) chunks.push(tail);
  return new Blob(chunks,{type:"audio/mpeg"});
}
async function _wavBlobToMp3(wavBlob){
  const ab=await wavBlob.arrayBuffer();
  const ctx=new AudioContext();
  const buf=await ctx.decodeAudioData(ab);
  await ctx.close();
  return _encodeMp3(buf);
}

/* ============================================================
   Service health check — this page only works talking to the
   local Chatterbox service, and only when opened via the local
   dev server (browsers block an https page fetching http://localhost).
   ============================================================ */
async function checkService(){
  const banner=document.getElementById("svcBanner");
  const isLocalPage = location.hostname==="127.0.0.1" || location.hostname==="localhost";
  if(!isLocalPage){
    banner.className="down";
    banner.textContent="⚠ Chatterbox Studio needs the local generation service and only works when this page itself is opened at http://127.0.0.1:8787/chatterbox (run `npx wrangler dev`) — not the production URL.";
    return false;
  }
  try{
    const r=await fetch(LOCAL_SVC+"/health");
    const j=await r.json();
    if(j.engine_loaded){ banner.className="ok"; return true; }
    banner.className="down";
    banner.textContent="⏳ Local Chatterbox service is up but still loading the model — try again in a moment.";
    return false;
  }catch(e){
    banner.className="down";
    banner.textContent="⚠ Can't reach the local Chatterbox service at "+LOCAL_SVC+" — run `python server.py` from chatterbox-local/ first.";
    return false;
  }
}

/* ============================================================
   Voice Palette — backed entirely by the local service.
   ============================================================ */
async function loadVoices(){
  const list=document.getElementById("voiceList");
  try{
    const r=await fetch(LOCAL_SVC+"/voices");
    const voices=await r.json();
    list.innerHTML="";
    voices.forEach(v=>{
      const card=document.createElement("div");
      card.className="voice-card"; card.draggable=true; card.dataset.voiceId=v.id;
      card.innerHTML='<div class="vc-name">'+v.name+'</div><button class="danger" data-del="'+v.id+'">✕</button>';
      card.ondragstart=e=>{ e.dataTransfer.setData("voiceid",v.id); e.dataTransfer.setData("voicename",v.name); card.classList.add("dragging"); };
      card.ondragend=()=>card.classList.remove("dragging");
      card.querySelector("[data-del]").onclick=async(ev)=>{
        ev.stopPropagation();
        await fetch(LOCAL_SVC+"/voices/"+v.id,{method:"DELETE"});
        loadVoices();
      };
      list.appendChild(card);
    });
  }catch(e){ /* service down — banner already shows this */ }
}

async function uploadVoice(file){
  const name=(document.getElementById("voiceNameInput").value||file.name).trim();
  if(!name){ alert("Give the voice a name first."); return; }
  const fd=new FormData();
  fd.append("name",name); fd.append("file",file);
  const r=await fetch(LOCAL_SVC+"/voices",{method:"POST",body:fd});
  if(!r.ok){ alert("Voice upload failed."); return; }
  document.getElementById("voiceNameInput").value="";
  loadVoices();
}

(function(){
  const drop=document.getElementById("voiceUpload");
  const fileInput=document.getElementById("voiceFileInput");
  drop.addEventListener("click",(e)=>{ if(e.target!==document.getElementById("voiceNameInput")) fileInput.click(); });
  fileInput.addEventListener("change",()=>{ if(fileInput.files[0]) uploadVoice(fileInput.files[0]); });
  drop.addEventListener("dragover",e=>{ e.preventDefault(); drop.classList.add("dragover"); });
  drop.addEventListener("dragleave",()=>drop.classList.remove("dragover"));
  drop.addEventListener("drop",e=>{
    e.preventDefault(); drop.classList.remove("dragover");
    const f=e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) uploadVoice(f);
  });
})();

/* ============================================================
   Script Editor — import, highlight, drag-drop voice, generate.
   ============================================================ */
let scriptSlug="";
let lineSeq=0;

function importScript(){
  const raw=document.getElementById("scriptRaw").value.trim();
  if(!raw){ alert("Paste some script text first."); return; }
  scriptSlug=slug(document.getElementById("scriptSlugInput").value)||"script";

  const body=document.getElementById("scriptBody");
  body.innerHTML="";
  raw.split(/\n+/).filter(l=>l.trim()).forEach(line=>{
    const p=document.createElement("div");
    p.style.marginBottom="10px";
    const span=document.createElement("span");
    span.className="vox-run"; span.dataset.lineId="ln"+(lineSeq++);
    span.textContent=line;
    p.appendChild(span);
    body.appendChild(p);
  });

  document.getElementById("scriptImport").style.display="none";
  document.getElementById("scriptToolbar").style.display="flex";
  body.style.display="block";
  document.getElementById("genAllBar").style.display="flex";
  updateGenAllHint();
}

function updateGenAllHint(){
  const spans=[...document.querySelectorAll(".vox-run")];
  const tagged=spans.filter(s=>s.dataset.voiceId && !s.dataset.audioUrl);
  document.getElementById("genAllHint").textContent =
    spans.filter(s=>s.dataset.voiceId).length+" tagged, "+tagged.length+" waiting to generate";
}

/* ---- highlighting: wrap the current selection in a fresh .vox-run ---- */
document.getElementById("scriptBody").addEventListener("mouseup",()=>{
  const sel=window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount===0) return;
  const range=sel.getRangeAt(0);
  if(!document.getElementById("scriptBody").contains(range.commonAncestorContainer)) return;
  if(range.toString().trim()==="") return;

  const span=document.createElement("span");
  span.className="vox-run"; span.dataset.lineId="ln"+(lineSeq++);
  try{
    range.surroundContents(span);
  }catch(e){
    // Selection crosses existing span boundaries — rebuild from the
    // extracted fragment's text instead (loses any nested voice tags
    // within the reselected range, which is expected: re-highlighting
    // re-assigns).
    const text=range.toString();
    range.deleteContents();
    span.textContent=text;
    range.insertNode(span);
  }
  sel.removeAllRanges();
});

/* ---- drop target: dragging a voice card onto a highlighted span ---- */
const scriptBody=document.getElementById("scriptBody");
scriptBody.addEventListener("dragover",e=>{
  if(e.dataTransfer.types.includes("voiceid")){ e.preventDefault(); scriptBody.classList.add("dragover"); }
});
scriptBody.addEventListener("dragleave",()=>scriptBody.classList.remove("dragover"));
scriptBody.addEventListener("drop",e=>{
  e.preventDefault(); scriptBody.classList.remove("dragover");
  const voiceId=e.dataTransfer.getData("voiceid");
  const voiceName=e.dataTransfer.getData("voicename");
  if(!voiceId) return;
  const target=e.target.closest(".vox-run");
  if(!target) return;

  target.dataset.voiceId=voiceId;
  target.dataset.voiceName=voiceName;
  delete target.dataset.audioUrl;
  target.classList.add("tagged"); target.classList.remove("generated");
  let tag=target.querySelector(".vox-tag");
  if(!tag){ tag=document.createElement("span"); tag.className="vox-tag"; target.prepend(tag); }
  tag.textContent=voiceName;
  renderRunActions(target);
  updateGenAllHint();
});

function renderRunActions(span){
  let actions=span.querySelector(".vox-actions");
  if(actions) actions.remove();
  actions=document.createElement("span");
  actions.className="vox-actions"; actions.contentEditable="false";
  const genBtn=document.createElement("button");
  genBtn.textContent="Generate"; genBtn.onclick=(e)=>{ e.stopPropagation(); generateRun(span); };
  actions.appendChild(genBtn);
  span.appendChild(actions);
}

async function generateRun(span){
  if(!(await checkService())) return;
  const voiceId=span.dataset.voiceId;
  const text=span.textContent.replace(/Generate|▶/g,"").trim();
  if(!voiceId || !text) return;

  const actions=span.querySelector(".vox-actions");
  const genBtn=actions && actions.querySelector("button");
  if(genBtn){ genBtn.textContent="…"; genBtn.disabled=true; }

  try{
    const fd=new FormData();
    fd.append("voiceId",voiceId); fd.append("text",text);
    const r=await fetch(LOCAL_SVC+"/generate",{method:"POST",body:fd});
    if(!r.ok) throw new Error("generation failed");
    const wavBlob=await r.blob();
    if(genBtn) genBtn.textContent="mp3…";
    const mp3Blob=await _wavBlobToMp3(wavBlob);

    const org=currentOrg();
    if(!org){ alert("Pick a client (top right) before generating — the clip needs an org to save under."); return; }
    const key="library/"+org+"/chatterbox-"+scriptSlug+"/"+slug(span.dataset.voiceName)+"-"+span.dataset.lineId+"-"+Date.now().toString(36)+".mp3";

    const token=getToken();
    const putRes=await fetch("/api/audio/"+key,{
      method:"PUT",
      headers:{ "authorization":"Bearer "+token, "content-type":"audio/mpeg" },
      body:mp3Blob
    });
    if(!putRes.ok) throw new Error("upload failed");
    const putJson=await putRes.json().catch(()=>({}));

    span.dataset.audioUrl = putJson.url || ("/api/audio/"+key);
    span.classList.add("generated");
    if(genBtn){ genBtn.textContent="▶ Play"; genBtn.disabled=false; genBtn.onclick=(e)=>{ e.stopPropagation(); new Audio(span.dataset.audioUrl).play(); }; }
  }catch(e){
    if(genBtn){ genBtn.textContent="✕ retry"; genBtn.disabled=false; }
    alert("Generation failed: "+e.message);
  }
  updateGenAllHint();
}

async function generateAllTagged(){
  const spans=[...document.querySelectorAll(".vox-run")].filter(s=>s.dataset.voiceId && !s.dataset.audioUrl);
  const CONCURRENCY=2;
  let idx=0;
  async function worker(){
    while(idx<spans.length){
      const span=spans[idx++];
      await generateRun(span);
    }
  }
  await Promise.all(Array.from({length:CONCURRENCY},worker));
}

document.getElementById("btnImportScript").onclick=importScript;
document.getElementById("btnReimport").onclick=()=>{
  document.getElementById("scriptImport").style.display="block";
  document.getElementById("scriptToolbar").style.display="none";
  document.getElementById("scriptBody").style.display="none";
  document.getElementById("genAllBar").style.display="none";
};
document.getElementById("btnGenerateAll").onclick=generateAllTagged;

/* ============================================================
   Init
   ============================================================ */
checkService();
loadVoices();
setInterval(checkService,15000);
if(window.ClientPicker){ ClientPicker.init({navEl:document.getElementById("clientNav")}); }
</script>
</body>
</html>
