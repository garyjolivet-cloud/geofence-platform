<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chase Life — Chatterbox Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --night:#0a1018;--slate:#141d2b;--slate-2:#1b2738;--rim:#2e3f58;--coral:#ff6a3d;
         --snow:#ffffff;--ice:#c8dff2;--fog:#8aa5bf;--hazard:#ff2f4e;--go:#38e0a6;--amber:#ffc24d; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Barlow",system-ui,sans-serif;background:var(--night);color:var(--snow);overflow:hidden}
  body{display:flex;flex-direction:column}
  .hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rim);background:rgba(10,16,24,.95);flex:0 0 auto}
  .hdr h1{font-family:"Black Han Sans";font-size:17px;margin:0;flex:0 0 auto}
  .hdr .crumb{font-family:"Barlow Condensed";font-size:13px;color:var(--fog);flex:1;min-width:0}
  .hdr a,.hdr button.linklike{font-family:"Barlow Condensed";font-size:13px;color:var(--ice);text-decoration:none;border:1px solid var(--rim);border-radius:7px;padding:6px 12px;white-space:nowrap;background:none;cursor:pointer}
  .hdr a:hover,.hdr button.linklike:hover{border-color:var(--ice)}
  button{font-family:"Barlow Condensed";font-weight:600;text-transform:uppercase;letter-spacing:.4px;
         font-size:12px;color:var(--snow);background:var(--slate);border:1px solid var(--rim);border-radius:8px;
         padding:7px 12px;cursor:pointer}
  button.on{background:var(--coral);border-color:var(--coral);color:#1a0d07}
  button.ghost{background:none}
  button.danger{border-color:var(--hazard);color:var(--hazard)}
  button:disabled{opacity:.4;cursor:default}
  input,select,textarea{font-family:"Barlow Condensed";font-size:13px;background:var(--slate-2);
         color:var(--snow);border:1px solid var(--rim);border-radius:8px;padding:6px 9px}
  .hint{font-family:"Barlow";font-size:12px;color:var(--fog)}

  #svcBanner{flex:0 0 auto;padding:8px 16px;font-family:"Barlow Condensed";font-size:12px;
         background:rgba(255,47,78,.12);color:var(--hazard);border-bottom:1px solid var(--hazard);display:none}
  #svcBanner.ok{display:none}
  #svcBanner.down{display:block}

  #main{flex:1;display:flex;min-height:0}

  /* ---- voice palette (left rail) ---- */
  .rail{width:260px;flex:0 0 260px;border-right:1px solid var(--rim);display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.01)}
  .rail h2{font-family:"Barlow Condensed";font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--fog);margin:12px 12px 6px}
  .rail-body{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px;min-height:0}
  #voiceUpload{border:1px dashed var(--rim);border-radius:9px;padding:12px;text-align:center;cursor:pointer;font-family:"Barlow Condensed";font-size:12px;color:var(--fog)}
  #voiceUpload.dragover{border-color:var(--coral);color:var(--coral);background:rgba(255,106,61,.06)}
  #voiceNameInput{width:100%;margin-top:6px}
  /* ---- Library palette (pick-from-library, adapted from audio-studio.html's rail) ---- */
  #libraryPalette{display:flex;flex-direction:column;gap:8px;padding:8px;border:1px solid var(--rim);border-radius:9px;background:rgba(255,255,255,.01)}
  .crumb-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
  .folder-tile{border:1px solid var(--rim);border-radius:9px;padding:8px 6px;text-align:center;cursor:pointer;background:rgba(255,255,255,.02);
         font-family:'Barlow Condensed';font-size:11px;color:var(--ice);display:flex;flex-direction:column;align-items:center;gap:4px}
  .folder-tile .fi{font-size:18px}
  .folder-tile:hover,.folder-tile.dragover{border-color:var(--coral);background:rgba(255,106,61,.08)}
  .folder-tile.current{border-color:var(--coral);color:var(--snow)}
  .clip-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto}
  .clip-tile{display:flex;align-items:center;gap:6px;padding:6px 7px;border:1px solid #26344a;border-radius:8px;cursor:grab;background:rgba(255,255,255,.02)}
  .clip-tile:hover{border-color:var(--ice)}
  .clip-tile .ct-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Barlow Condensed';font-size:12px}
  .clip-tile button{flex:0 0 auto;padding:3px 7px;font-size:11px}
  .rail-empty{font-family:'Barlow Condensed';font-size:12px;color:var(--fog);padding:6px 2px}

  .voice-card{border:1px solid var(--rim);border-radius:9px;padding:8px 10px;background:rgba(255,255,255,.02)}
  .voice-card.dragging{opacity:.4}
  .vc-row{display:flex;align-items:center;gap:8px;cursor:grab}
  .voice-card .vc-name{flex:1;font-family:"Barlow Condensed";font-size:13px}
  .voice-card button{padding:3px 7px;font-size:10px}

  /* ---- per-voice settings panel ---- */
  .vc-settings{display:none;flex-direction:column;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--rim)}
  .vc-settings.open{display:flex}
  .vc-setting-row{display:flex;flex-direction:column;gap:2px}
  .vc-setting-row label{font-family:"Barlow Condensed";font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--fog);display:flex;justify-content:space-between}
  .vc-setting-row label .val{color:var(--ice);text-transform:none;letter-spacing:0}
  .vc-setting-row input[type="range"]{width:100%;accent-color:var(--coral);background:none;border:none;padding:0}
  .vc-seed-row{display:flex;gap:6px;align-items:center}
  .vc-seed-row input[type="number"]{flex:1;width:0}
  .vc-seed-row button{padding:5px 8px}
  .vc-settings-save{align-self:flex-end}
  .vc-preview-row{display:flex;align-items:center;gap:8px}
  .vc-name[data-name]{cursor:text}
  .vc-name input{width:100%}

  /* ---- script editor (main) ---- */
  #editorPane{flex:1;display:flex;flex-direction:column;min-height:0}
  #scriptToolbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--rim)}
  #scriptToolbar input{flex:1}
  #scriptImport{flex:0 0 auto;padding:14px 16px}
  #scriptImport textarea{width:100%;height:140px;font-family:"Barlow";font-size:13px}
  #scriptBody{flex:1;overflow-y:auto;padding:16px 24px;font-family:"Barlow";font-size:15px;line-height:1.7;white-space:pre-wrap}
  #scriptBody.dragover{background:rgba(255,106,61,.04)}
  .vox-run{border-radius:4px;padding:1px 2px;position:relative}
  .vox-run.tagged{background:rgba(255,106,61,.14);box-shadow:inset 0 -2px 0 var(--coral)}
  .vox-run.generated{box-shadow:inset 0 -2px 0 var(--go)}
  .vox-tag{position:absolute;top:-16px;left:0;font-family:"Barlow Condensed";font-size:9px;text-transform:uppercase;
         letter-spacing:.4px;color:var(--coral);white-space:nowrap;pointer-events:none}
  .vox-actions{display:inline-flex;gap:4px;margin-left:4px;vertical-align:middle}
  .vox-actions button{padding:2px 6px;font-size:9px}
  .vox-progress{align-items:center;gap:6px;margin-left:4px;vertical-align:middle}
  .vox-progress-track{display:inline-block;width:50px;height:6px;border-radius:3px;background:var(--rim);
         position:relative;overflow:hidden;vertical-align:middle}
  .vox-progress-bar{display:block;height:100%;width:0;background:var(--coral);border-radius:3px;
         transition:width .4s linear}
  .vox-progress-label{font-family:"Barlow Condensed";font-size:9px;color:var(--fog);white-space:nowrap}
  #genAllBar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--rim)}
  #genAllBar .hint{flex:1}
</style>
</head>
<body>

<div class="hdr">
  <h1>🎙️ Chatterbox Studio</h1>
  <span class="crumb" id="hdrCrumb">local voice cloning — Macbeth-to-park-tour narration</span>
  <nav id="clientNav" style="display:flex;align-items:center;gap:8px"></nav>
  <a href="/library">Library →</a>
  <a href="/editor">Editor →</a>
  <a href="/">Home</a>
</div>

<div id="svcBanner"></div>

<div id="main">
  <div class="rail">
    <h2>Voice Palette</h2>
    <div class="rail-body">
      <div id="voiceUpload">
        Drop an audio sample here<br>or click to choose a file
        <input type="text" id="voiceNameInput" placeholder="Voice name (e.g. Witch #1)">
        <input type="file" id="voiceFileInput" accept="audio/*" style="display:none">
      </div>
      <button class="ghost" id="btnBrowseLibrary" style="width:100%">📁 Browse Library</button>
      <div id="libraryPalette" style="display:none"></div>
      <div id="voiceList"></div>
    </div>
  </div>

  <div id="editorPane">
    <div id="scriptImport">
      <div class="hint" style="margin-bottom:6px">Paste a script (e.g. Macbeth), then import it below.</div>
      <textarea id="scriptRaw" placeholder="MACBETH: Is this a dagger which I see before me..."></textarea>
      <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
        <input type="text" id="scriptSlugInput" placeholder="Script name (used as the Library folder)" style="flex:1">
        <button class="on" id="btnImportScript">Import Script</button>
      </div>
    </div>

    <div id="scriptToolbar" style="display:none">
      <div class="hint">Highlight text, then drag a voice card onto the highlighted passage.</div>
      <button class="ghost" id="btnReimport">← New script</button>
    </div>
    <div id="scriptBody" style="display:none"></div>
    <div id="genAllBar" style="display:none">
      <div class="hint" id="genAllHint"></div>
      <button id="btnGenerateAll">Generate All Tagged</button>
    </div>
  </div>
</div>

<script>
// Reaches the local Chatterbox service running on gary's laptop through a
// Cloudflare Tunnel (cloudflared quick tunnel — see chatterbox-local/README.md),
// so this page works from any origin, including production, not just
// localhost. NOTE: quick tunnel URLs are ephemeral — they change any time
// the tunnel process restarts. If generation stops working, get a fresh
// URL from the cloudflared terminal output and update this constant.
const LOCAL_SVC = "https://mediterranean-duck-chan-tests.trycloudflare.com";
function getToken(){ return localStorage.getItem("gp.session")||""; }
function currentOrg(){ return (window.ClientPicker && ClientPicker.resolve()) || ""; }
function slug(s){ return (s||"").toString().toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* The voice tag label and Generate/progress buttons are rendered as child
   elements inside the same .vox-run span as the passage text, so a plain
   span.textContent read would pull their text in too (e.g. "REALVOICE" or
   "encoding mp3…" ending up spoken as part of the generated line). This
   strips known injected-UI children before reading the text — used as a
   fallback if dataset.text wasn't captured for some reason. */
function _cleanSpanText(span){
  const clone=span.cloneNode(true);
  clone.querySelectorAll(".vox-tag,.vox-actions").forEach(el=>el.remove());
  return clone.textContent.trim();
}

/* Cancels any in-flight generation for this span and bumps its generation
   token, so that call's completion handlers (which check the token after
   every await) know to discard their result instead of racing whatever
   happens to this span next. Must be called anywhere a span's tagged
   voice/UI is about to be replaced or the span is about to be removed —
   re-tagging (renderRunActions) and re-highlighting-over (mouseup handler)
   both do this; without it the old generation keeps running against
   detached/orphaned DOM nodes and can win a race to set dataset.audioUrl
   with the wrong voice's audio. */
function _invalidateSpanGeneration(span){
  if(span._genAbort){ span._genAbort.abort(); span._genAbort=null; }
  span._genToken=(span._genToken||0)+1;
}

/* ---- mp3 encoding (same lamejs pipeline as audio-studio.html/library.html/
   fence-editor.html) — the local service returns wav; every clip in this
   app's Library is stored as mp3, so re-encode client-side before upload. */
let _lame=null;
async function _loadLame(){
  if(_lame) return _lame;
  try{ const mod=await import('https://esm.sh/@breezystack/lamejs@1.2.7'); _lame=mod.Mp3Encoder; return _lame; }catch(e){ return null; }
}
function _pcm16(f){ const out=new Int16Array(f.length); for(let i=0;i<f.length;i++){ const v=Math.max(-1,Math.min(1,f[i])); out[i]=v<0?v*0x8000:v*0x7fff; } return out; }
async function _encodeMp3(buf){
  const Mp3Encoder=await _loadLame();
  if(!Mp3Encoder) throw new Error("mp3 encoder failed to load — check your connection and try again");
  const nch=buf.numberOfChannels>1?2:1, sr=buf.sampleRate;
  const left=_pcm16(buf.getChannelData(0)), right=nch>1?_pcm16(buf.getChannelData(1)):null;
  const enc=new Mp3Encoder(nch,sr,128); const chunks=[], block=1152;
  for(let i=0;i<left.length;i+=block){
    const out=right?enc.encodeBuffer(left.subarray(i,i+block),right.subarray(i,i+block)):enc.encodeBuffer(left.subarray(i,i+block));
    if(out.length) chunks.push(out);
  }
  const tail=enc.flush(); if(tail.length) chunks.push(tail);
  return new Blob(chunks,{type:"audio/mpeg"});
}
async function _wavBlobToMp3(wavBlob){
  const ab=await wavBlob.arrayBuffer();
  const ctx=new AudioContext();
  const buf=await ctx.decodeAudioData(ab);
  await ctx.close();
  return _encodeMp3(buf);
}

/* ============================================================
   Service health check — LOCAL_SVC is reachable over real HTTPS (via a
   Cloudflare Tunnel to gary's laptop), so this works from any origin,
   production included, as long as the tunnel + local service are running.
   ============================================================ */
async function checkService(){
  const banner=document.getElementById("svcBanner");
  try{
    const r=await fetch(LOCAL_SVC+"/health");
    const j=await r.json();
    if(j.engine_loaded){ banner.className="ok"; return true; }
    banner.className="down";
    banner.textContent="⏳ Local Chatterbox service is up but still loading the model — try again in a moment.";
    return false;
  }catch(e){
    banner.className="down";
    banner.textContent="⚠ Can't reach the local Chatterbox service at "+LOCAL_SVC+" — run `python server.py` from chatterbox-local/ first.";
    return false;
  }
}

/* ============================================================
   Voice Palette — backed entirely by the local service.
   ============================================================ */
const VOICE_SETTINGS_DEFAULTS={repetitionPenalty:1.2, temperature:0, seed:null};

async function loadVoices(){
  const list=document.getElementById("voiceList");
  try{
    const r=await fetch(LOCAL_SVC+"/voices");
    const voices=await r.json();
    list.innerHTML="";
    voices.forEach(v=>{
      const settings=Object.assign({},VOICE_SETTINGS_DEFAULTS,v.settings||{});

      const card=document.createElement("div");
      card.className="voice-card"; card.dataset.voiceId=v.id;

      const row=document.createElement("div");
      row.className="vc-row"; row.draggable=true;
      row.innerHTML='<div class="vc-name" data-name title="Click to rename">'+esc(v.name)+'</div>'+
        '<button class="ghost" data-gear title="Voice settings">⚙</button>'+
        '<button class="danger" data-del>✕</button>';
      row.ondragstart=e=>{ e.dataTransfer.setData("voiceid",v.id); e.dataTransfer.setData("voicename",v.name); card.classList.add("dragging"); };
      row.ondragend=()=>card.classList.remove("dragging");
      card.appendChild(row);

      const nameEl=row.querySelector("[data-name]");
      nameEl.onclick=(ev)=>{ ev.stopPropagation(); startVoiceRename(v,nameEl); };

      const panel=document.createElement("div");
      panel.className="vc-settings";
      panel.innerHTML=
        '<div class="vc-setting-row"><label>Repetition Penalty <span class="val" data-rpval></span></label>'+
        '<input type="range" min="1.0" max="2.0" step="0.05" data-rp></div>'+
        '<div class="vc-setting-row"><label>Temperature <span class="val" data-tval></span></label>'+
        '<input type="range" min="0" max="1.5" step="0.05" data-temp>'+
        '<span class="hint">0 = most stable delivery, higher = more varied (note: even at 0, tiny run-to-run variation is normal on this hardware)</span></div>'+
        '<div class="vc-setting-row"><label>Seed <span class="hint">blank = random each time; a seed nudges similar results, not guaranteed identical</span></label>'+
        '<div class="vc-seed-row"><input type="number" placeholder="random" data-seed>'+
        '<button data-randseed title="Randomize seed">🎲</button></div></div>'+
        '<div class="vc-setting-row"><label>Preview text</label>'+
        '<input type="text" data-previewtext value="Testing this voice."></div>'+
        '<div class="vc-preview-row">'+
        '<button class="ghost" data-preview>▶ Preview</button>'+
        '<button class="ghost" data-replay style="display:none">🔁 Replay</button>'+
        '<span class="vox-progress" data-previewprog style="display:none">'+
        '<span class="vox-progress-track"><span class="vox-progress-bar" data-previewbar></span></span>'+
        '<span class="vox-progress-label" data-previewlabel></span></span>'+
        '</div>'+
        '<button class="on vc-settings-save" data-save>Save</button>';
      card.appendChild(panel);

      const rpInput=panel.querySelector("[data-rp]"), rpVal=panel.querySelector("[data-rpval]");
      const tempInput=panel.querySelector("[data-temp]"), tempVal=panel.querySelector("[data-tval]");
      const seedInput=panel.querySelector("[data-seed]");
      const previewTextInput=panel.querySelector("[data-previewtext]");
      const replayBtn=panel.querySelector("[data-replay]");
      rpInput.value=settings.repetitionPenalty; rpVal.textContent=(+settings.repetitionPenalty).toFixed(2);
      tempInput.value=settings.temperature; tempVal.textContent=(+settings.temperature).toFixed(2);
      seedInput.value=settings.seed==null?"":settings.seed;
      // A rendered preview stays replayable as-is until something that
      // would actually change the audio is touched — only then is the
      // cached clip stale and the Replay button hidden again.
      const invalidateReplay=()=>{ replayBtn.style.display="none"; if(replayBtn._url){ URL.revokeObjectURL(replayBtn._url); replayBtn._url=null; } };
      rpInput.oninput=()=>{ rpVal.textContent=parseFloat(rpInput.value).toFixed(2); invalidateReplay(); };
      tempInput.oninput=()=>{ tempVal.textContent=parseFloat(tempInput.value).toFixed(2); invalidateReplay(); };
      seedInput.oninput=invalidateReplay;
      previewTextInput.oninput=invalidateReplay;
      panel.querySelector("[data-randseed]").onclick=()=>{ seedInput.value=Math.floor(Math.random()*1e9); invalidateReplay(); };
      replayBtn.onclick=(ev)=>{ ev.stopPropagation(); if(replayBtn._url) new Audio(replayBtn._url).play(); };

      row.querySelector("[data-gear]").onclick=(ev)=>{ ev.stopPropagation(); panel.classList.toggle("open"); };
      row.querySelector("[data-del]").onclick=async(ev)=>{
        ev.stopPropagation();
        await fetch(LOCAL_SVC+"/voices/"+v.id,{method:"DELETE"});
        loadVoices();
      };
      panel.querySelector("[data-save]").onclick=async(ev)=>{
        ev.stopPropagation();
        const saveBtn=ev.currentTarget; saveBtn.textContent="Saving…"; saveBtn.disabled=true;
        const seedVal=seedInput.value.trim();
        try{
          await fetch(LOCAL_SVC+"/voices/"+v.id+"/settings",{
            method:"PUT",
            headers:{"content-type":"application/json"},
            body:JSON.stringify({
              repetitionPenalty:parseFloat(rpInput.value),
              temperature:parseFloat(tempInput.value),
              seed:seedVal===""?null:parseInt(seedVal,10)
            })
          });
          saveBtn.textContent="Saved ✓";
        }catch(e){
          saveBtn.textContent="✕ failed";
        }
        setTimeout(()=>{ saveBtn.textContent="Save"; saveBtn.disabled=false; },1500);
      };
      panel.querySelector("[data-preview]").onclick=(ev)=>{
        ev.stopPropagation();
        previewVoice(v, {
          previewBtn: panel.querySelector("[data-preview]"),
          replayBtn,
          textInput: previewTextInput,
          rpInput, tempInput, seedInput,
          prog: panel.querySelector("[data-previewprog]"),
          progBar: panel.querySelector("[data-previewbar]"),
          progLabel: panel.querySelector("[data-previewlabel]")
        });
      };

      list.appendChild(card);
    });
  }catch(e){ /* service down — banner already shows this */ }
}

function startVoiceRename(v,nameEl){
  if(nameEl.querySelector("input")) return; // already renaming this card
  const oldName=v.name;
  nameEl.innerHTML='<input type="text" maxlength="60">';
  const inp=nameEl.querySelector("input"); inp.value=oldName; inp.focus(); inp.select();
  let done=false;
  const commit=async()=>{
    if(done) return; done=true;
    const newName=inp.value.trim();
    if(!newName || newName===oldName){ loadVoices(); return; }
    try{
      await fetch(LOCAL_SVC+"/voices/"+v.id,{
        method:"PATCH", headers:{"content-type":"application/json"},
        body:JSON.stringify({name:newName})
      });
    }catch(e){ /* reload shows whatever actually got saved either way */ }
    loadVoices();
  };
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter") commit();
    if(e.key==="Escape"){ done=true; loadVoices(); }
  });
  inp.addEventListener("blur",commit);
}

async function previewVoice(v,els){
  if(!(await checkService())) return;
  const text=els.textInput.value.trim();
  if(!text) return;

  els.previewBtn.disabled=true; els.previewBtn.textContent="…";
  els.prog.style.display="inline-flex";
  els.progBar.style.width="0%"; els.progLabel.textContent="0s";

  const jobId=(crypto.randomUUID?crypto.randomUUID():("prev"+Date.now()+Math.random()));
  const stopPolling=pollProgress(jobId,(elapsedS,step,total)=>{
    const pct=Math.min(96,Math.round((step/total)*100));
    els.progBar.style.width=pct+"%";
    els.progLabel.textContent=Math.round(elapsedS)+"s";
  });

  try{
    const fd=new FormData();
    fd.append("voiceId",v.id); fd.append("text",text); fd.append("jobId",jobId);
    fd.append("repetitionPenalty",els.rpInput.value);
    fd.append("temperature",els.tempInput.value);
    // overrideSeed=true always, even when the field is blank — a blank
    // seed here means "use random for this preview", not "fall back to
    // whatever this voice's saved seed happens to be".
    fd.append("overrideSeed","true");
    const seedVal=els.seedInput.value.trim();
    if(seedVal!=="") fd.append("seed",seedVal);
    const r=await fetch(LOCAL_SVC+"/generate",{method:"POST",body:fd});
    stopPolling();
    if(!r.ok) throw new Error("preview failed");
    const wavBlob=await r.blob();
    // Cached on the Replay button (not revoked on end) so this exact
    // render can be played again and again without re-generating —
    // invalidated (see invalidateReplay()) only when a slider/text
    // actually changes, since only then is it genuinely stale.
    if(els.replayBtn._url) URL.revokeObjectURL(els.replayBtn._url);
    els.replayBtn._url=URL.createObjectURL(wavBlob);
    els.replayBtn.style.display="";
    new Audio(els.replayBtn._url).play();
    els.previewBtn.textContent="▶ Preview";
  }catch(e){
    els.previewBtn.textContent="✕ failed";
    setTimeout(()=>{ els.previewBtn.textContent="▶ Preview"; },1500);
  }finally{
    stopPolling();
    els.prog.style.display="none";
    els.previewBtn.disabled=false;
  }
}

async function uploadVoice(file){
  const name=(document.getElementById("voiceNameInput").value||file.name).trim();
  if(!name){ alert("Give the voice a name first."); return; }
  const fd=new FormData();
  fd.append("name",name); fd.append("file",file);
  const r=await fetch(LOCAL_SVC+"/voices",{method:"POST",body:fd});
  if(!r.ok){ alert("Voice upload failed."); return; }
  document.getElementById("voiceNameInput").value="";
  loadVoices();
}

async function createVoiceFromLibrary(name,absoluteUrl){
  const r=await fetch(LOCAL_SVC+"/voices/from-library",{
    method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify({name,url:absoluteUrl})
  });
  if(!r.ok){ alert("Couldn't create voice from that clip: "+(await r.text().catch(()=>r.statusText))); return; }
  loadVoices();
}

/* ============================================================
   Library palette — browse this org's Library to pick an existing
   recording as a voice reference, instead of only uploading fresh
   files. Folder browsing adapted from audio-studio.html's rail
   (refreshRail/renderRail/buildFolderTile — same /api/audio-list call,
   same crumb+folder-tile+clip-list shape), Library-only since Chatterbox
   Studio has no "current project" concept to offer a second tab for.
   ============================================================ */
let libFolder="", libKnownFolders=new Set();

async function refreshLibraryPalette(){
  const pal=document.getElementById("libraryPalette");
  const org=currentOrg();
  if(!org){ pal.innerHTML='<div class="rail-empty">pick a client (top right) first</div>'; return; }
  pal.innerHTML='<div class="rail-empty">loading…</div>';
  try{
    const qs="scope=library&org="+encodeURIComponent(org)+(libFolder?"&folder="+encodeURIComponent(libFolder):"");
    const r=await fetch("/api/audio-list?"+qs,{headers:{authorization:"Bearer "+getToken()}});
    const j=r.ok?await r.json():{objects:[],folders:[]};
    if(!libFolder) libKnownFolders=new Set(j.folders||[]);
    renderLibraryPalette(j.objects||[]);
  }catch(e){ pal.innerHTML='<div class="rail-empty">error: '+esc(e.message)+'</div>'; }
}

function renderLibraryPalette(objects){
  const pal=document.getElementById("libraryPalette");
  pal.innerHTML="";

  const crumb=document.createElement("div"); crumb.className="crumb-row";
  const lbl=document.createElement("span"); lbl.className="hint";
  lbl.textContent=libFolder?("📁 "+libFolder):"📁 Library (root)";
  crumb.appendChild(lbl);
  pal.appendChild(crumb);

  const grid=document.createElement("div"); grid.className="tile-grid";
  grid.appendChild(buildLibFolderTile("","Root"));
  [...libKnownFolders].sort().forEach(f=>grid.appendChild(buildLibFolderTile(f)));
  pal.appendChild(grid);

  const list=document.createElement("div"); list.className="clip-list";
  if(!objects.length){ list.innerHTML='<div class="rail-empty">no clips in this folder</div>'; }
  else objects.forEach(o=>list.appendChild(buildLibClipTile(o)));
  pal.appendChild(list);
}

function buildLibFolderTile(name,label){
  const t=document.createElement("div"); t.className="folder-tile"+(name===libFolder?" current":"");
  t.innerHTML='<span class="fi">📁</span><span>'+esc(label!=null?label:name)+'</span>';
  t.onclick=()=>{ libFolder=name; refreshLibraryPalette(); };
  return t;
}

function buildLibClipTile(o){
  const row=document.createElement("div"); row.className="clip-tile"; row.draggable=true;
  row.addEventListener("dragstart",e=>{ e.dataTransfer.setData("audiourl",o.url); e.dataTransfer.setData("audiokey",o.key); });
  const nm=document.createElement("span"); nm.className="ct-name"; nm.textContent=o.key.split("/").pop();
  const useBtn=document.createElement("button"); useBtn.textContent="+ Use"; useBtn.title="Create a voice from this clip";
  useBtn.onclick=()=>{
    const defaultName=o.key.split("/").pop().replace(/\.[^.]+$/,"").replace(/-[a-z0-9]{6,}$/i,"");
    const name=(prompt("Name this voice:",defaultName)||"").trim();
    if(!name) return; // covers both Cancel (prompt returns null) and an empty typed name — a blank name is never valid here, unlike library.html's folder-move prompt where blank is a real destination
    createVoiceFromLibrary(name,location.origin+o.url);
  };
  row.appendChild(nm); row.appendChild(useBtn);
  return row;
}

document.getElementById("btnBrowseLibrary").onclick=()=>{
  const pal=document.getElementById("libraryPalette");
  const showing=pal.style.display!=="none";
  pal.style.display=showing?"none":"flex";
  pal.style.flexDirection="column";
  if(!showing) refreshLibraryPalette();
};

(function(){
  const drop=document.getElementById("voiceUpload");
  const fileInput=document.getElementById("voiceFileInput");
  drop.addEventListener("click",(e)=>{ if(e.target!==document.getElementById("voiceNameInput")) fileInput.click(); });
  fileInput.addEventListener("change",()=>{ if(fileInput.files[0]) uploadVoice(fileInput.files[0]); });
  drop.addEventListener("dragover",e=>{
    if(e.dataTransfer.types.includes("audiourl")||e.dataTransfer.types.includes("Files")){ e.preventDefault(); drop.classList.add("dragover"); }
  });
  drop.addEventListener("dragleave",()=>drop.classList.remove("dragover"));
  drop.addEventListener("drop",e=>{
    e.preventDefault(); drop.classList.remove("dragover");
    const audioUrl=e.dataTransfer.getData("audiourl");
    if(audioUrl){
      // Dropped from the in-page Library palette rather than the OS —
      // same drop target, second drag source, distinguished by the typed
      // dataTransfer key this app uses everywhere else for in-app drags.
      const key=e.dataTransfer.getData("audiokey")||audioUrl;
      const defaultName=key.split("/").pop().replace(/\.[^.]+$/,"").replace(/-[a-z0-9]{6,}$/i,"");
      const name=(document.getElementById("voiceNameInput").value||prompt("Name this voice:",defaultName)||"").trim();
      if(!name) return;
      createVoiceFromLibrary(name,audioUrl.startsWith("http")?audioUrl:location.origin+audioUrl);
      document.getElementById("voiceNameInput").value="";
      return;
    }
    const f=e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) uploadVoice(f);
  });
})();

/* ============================================================
   Script Editor — import, highlight, drag-drop voice, generate.
   ============================================================ */
let scriptSlug="";
let lineSeq=0;

function importScript(){
  const raw=document.getElementById("scriptRaw").value.trim();
  if(!raw){ alert("Paste some script text first."); return; }
  scriptSlug=slug(document.getElementById("scriptSlugInput").value)||"script";

  const body=document.getElementById("scriptBody");
  body.innerHTML="";
  raw.split(/\n+/).filter(l=>l.trim()).forEach(line=>{
    const p=document.createElement("div");
    p.style.marginBottom="10px";
    const span=document.createElement("span");
    span.className="vox-run"; span.dataset.lineId="ln"+(lineSeq++);
    span.textContent=line;
    span.dataset.text=line; // captured now, before any voice tag/button UI gets injected into this span
    p.appendChild(span);
    body.appendChild(p);
  });

  document.getElementById("scriptImport").style.display="none";
  document.getElementById("scriptToolbar").style.display="flex";
  body.style.display="block";
  document.getElementById("genAllBar").style.display="flex";
  updateGenAllHint();
}

function updateGenAllHint(){
  const spans=[...document.querySelectorAll(".vox-run")];
  const tagged=spans.filter(s=>s.dataset.voiceId && !s.dataset.audioUrl);
  document.getElementById("genAllHint").textContent =
    spans.filter(s=>s.dataset.voiceId).length+" tagged, "+tagged.length+" waiting to generate";
}

/* ---- highlighting: wrap the current selection in a fresh .vox-run ---- */
document.getElementById("scriptBody").addEventListener("mouseup",()=>{
  const sel=window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount===0) return;
  const range=sel.getRangeAt(0);
  if(!document.getElementById("scriptBody").contains(range.commonAncestorContainer)) return;
  if(range.toString().trim()==="") return;

  const span=document.createElement("span");
  span.className="vox-run"; span.dataset.lineId="ln"+(lineSeq++);
  try{
    range.surroundContents(span);
  }catch(e){
    // Selection crosses existing span boundaries — rebuild from the
    // extracted fragment's text instead (loses any nested voice tags
    // within the reselected range, which is expected: re-highlighting
    // re-assigns). Any of those spans might have a generation in flight —
    // invalidate them before they're removed from the DOM, or they keep
    // running against orphaned nodes.
    document.querySelectorAll(".vox-run").forEach(el=>{
      if(el!==span && range.intersectsNode(el)) _invalidateSpanGeneration(el);
    });
    const text=range.toString();
    range.deleteContents();
    span.textContent=text;
    range.insertNode(span);
  }
  // Capture the clean passage text now, before a voice tag label or
  // Generate/progress UI gets injected as children of this same span —
  // generateRun() must send only this to the model, never span.textContent
  // (which would otherwise include that injected UI's text too).
  span.dataset.text=_cleanSpanText(span);
  sel.removeAllRanges();
});

/* ---- drop target: dragging a voice card onto a highlighted span ---- */
const scriptBody=document.getElementById("scriptBody");
scriptBody.addEventListener("dragover",e=>{
  if(e.dataTransfer.types.includes("voiceid")){ e.preventDefault(); scriptBody.classList.add("dragover"); }
});
scriptBody.addEventListener("dragleave",()=>scriptBody.classList.remove("dragover"));
scriptBody.addEventListener("drop",e=>{
  e.preventDefault(); scriptBody.classList.remove("dragover");
  const voiceId=e.dataTransfer.getData("voiceid");
  const voiceName=e.dataTransfer.getData("voicename");
  if(!voiceId) return;
  const target=e.target.closest(".vox-run");
  if(!target) return;

  target.dataset.voiceId=voiceId;
  target.dataset.voiceName=voiceName;
  delete target.dataset.audioUrl;
  target.classList.add("tagged"); target.classList.remove("generated");
  let tag=target.querySelector(".vox-tag");
  if(!tag){ tag=document.createElement("span"); tag.className="vox-tag"; target.prepend(tag); }
  tag.textContent=voiceName;
  renderRunActions(target);
  updateGenAllHint();
});

function renderRunActions(span){
  _invalidateSpanGeneration(span); // re-tagging cancels/orphans any prior generation on this span
  let actions=span.querySelector(".vox-actions");
  if(actions) actions.remove();
  actions=document.createElement("span");
  actions.className="vox-actions"; actions.contentEditable="false";
  const genBtn=document.createElement("button");
  genBtn.textContent="Generate"; genBtn.onclick=(e)=>{ e.stopPropagation(); generateRun(span); };
  actions.appendChild(genBtn);
  const prog=document.createElement("span");
  prog.className="vox-progress"; prog.style.display="none";
  const progTrack=document.createElement("span"); progTrack.className="vox-progress-track";
  const progBar=document.createElement("span"); progBar.className="vox-progress-bar";
  progTrack.appendChild(progBar);
  const progLabel=document.createElement("span"); progLabel.className="vox-progress-label";
  prog.appendChild(progTrack); prog.appendChild(progLabel);
  actions.appendChild(prog);
  span.appendChild(actions);
}

/* ---- generation progress: elapsed time + step-based bar + rough ETA.
   The server tracks real autoregressive step count per jobId; we poll it
   while the (long-running, blocking) POST /generate is in flight. Total
   step budget (max_new_tokens=1024) is rarely reached — most generations
   stop early via STOP_SPEECH_TOKEN — so the bar is capped visually and the
   ETA is explicitly framed as approximate, self-correcting as it goes. ---- */
function pollProgress(jobId, onTick){
  const t0=Date.now();
  const timer=setInterval(async()=>{
    const elapsedS=(Date.now()-t0)/1000;
    let step=0,total=1024;
    try{
      const r=await fetch(LOCAL_SVC+"/progress/"+jobId);
      const j=await r.json();
      step=j.step||0; total=j.total||1024;
    }catch(e){ /* keep showing elapsed time even if a poll fails */ }
    onTick(elapsedS, step, total);
  },750);
  return ()=>clearInterval(timer);
}

async function generateRun(span){
  if(!(await checkService())) return;
  const voiceId=span.dataset.voiceId;
  const text=span.dataset.text || _cleanSpanText(span);
  if(!voiceId || !text) return;
  // Checked before any UI state changes, so a missing client never leaves
  // the busy/progress UI stuck on with no way to recover from it.
  const org=currentOrg();
  if(!org){ alert("Pick a client (top right) before generating — the clip needs an org to save under."); return; }

  const actions=span.querySelector(".vox-actions");
  const genBtn=actions && actions.querySelector("button");
  const prog=actions && actions.querySelector(".vox-progress");
  const progBar=prog && prog.querySelector(".vox-progress-bar");
  const progLabel=prog && prog.querySelector(".vox-progress-label");

  // Cancel any generation already running for this span and mint a fresh
  // token — every await below re-checks span._genToken===myToken so a
  // superseded run (re-tagged or re-highlighted mid-flight) discards its
  // result instead of racing whatever's current.
  _invalidateSpanGeneration(span);
  const controller=new AbortController();
  span._genAbort=controller;
  const myToken=span._genToken;

  if(genBtn){ genBtn.style.display="none"; }
  if(prog){
    if(progBar) progBar.style.width="0%";
    if(progLabel) progLabel.textContent="0s";
    prog.style.display="inline-flex";
  }

  const jobId=(crypto.randomUUID?crypto.randomUUID():("job"+Date.now()+Math.random()));
  const stopPolling=pollProgress(jobId,(elapsedS,step,total)=>{
    if(span._genToken!==myToken) return; // superseded — a newer generation owns this span's UI now
    if(!progLabel) return;
    const pct=Math.min(96, Math.round((step/total)*100)); // capped — most runs stop well before `total`
    if(progBar) progBar.style.width=pct+"%";
    let etaTxt="";
    if(step>3){
      const secPerStep=elapsedS/step;
      const stepsLeft=Math.max(0,total-step);
      const etaS=Math.round(secPerStep*Math.min(stepsLeft, step*3)); // don't project wildly past what we've already seen
      etaTxt=" · ~"+etaS+"s left";
    }
    progLabel.textContent=Math.round(elapsedS)+"s"+etaTxt;
  });

  try{
    const fd=new FormData();
    fd.append("voiceId",voiceId); fd.append("text",text); fd.append("jobId",jobId);
    const r=await fetch(LOCAL_SVC+"/generate",{method:"POST",body:fd,signal:controller.signal});
    // The generation phase is over the moment this settles (success or
    // throw) — stop polling now rather than waiting for encode+upload too,
    // or a late tick can flicker "encoding mp3…"/100% back to stale data.
    stopPolling();
    if(span._genToken!==myToken) return; // superseded while the request was in flight
    if(!r.ok) throw new Error("generation failed");
    const wavBlob=await r.blob();
    if(progLabel) progLabel.textContent="encoding mp3…";
    if(progBar) progBar.style.width="100%";
    const mp3Blob=await _wavBlobToMp3(wavBlob);
    if(span._genToken!==myToken) return; // superseded during mp3 encoding

    const key="library/"+org+"/chatterbox-"+scriptSlug+"/"+slug(span.dataset.voiceName)+"-"+span.dataset.lineId+"-"+Date.now().toString(36)+".mp3";
    const token=getToken();
    const putRes=await fetch("/api/audio/"+key,{
      method:"PUT",
      headers:{ "authorization":"Bearer "+token, "content-type":"audio/mpeg" },
      body:mp3Blob
    });
    if(!putRes.ok) throw new Error("upload failed");
    const putJson=await putRes.json().catch(()=>({}));
    if(span._genToken!==myToken) return; // superseded during upload — discard, don't overwrite a newer result

    span.dataset.audioUrl = putJson.url || ("/api/audio/"+key);
    span.classList.add("generated");
    if(prog) prog.style.display="none";
    if(genBtn){ genBtn.style.display=""; genBtn.textContent="▶ Play"; genBtn.disabled=false; genBtn.onclick=(e)=>{ e.stopPropagation(); new Audio(span.dataset.audioUrl).play(); }; }
  }catch(e){
    stopPolling();
    if(span._genToken!==myToken) return; // superseded — the newer generation owns error/retry UI now
    if(controller.signal.aborted) return; // cancelled intentionally by a re-tag, not a real failure
    if(prog) prog.style.display="none";
    if(genBtn){ genBtn.style.display=""; genBtn.textContent="✕ retry"; genBtn.disabled=false; }
    alert("Generation failed: "+e.message);
  }finally{
    stopPolling();
    if(span._genAbort===controller) span._genAbort=null;
  }
  updateGenAllHint();
}

async function generateAllTagged(){
  const spans=[...document.querySelectorAll(".vox-run")].filter(s=>s.dataset.voiceId && !s.dataset.audioUrl);
  const CONCURRENCY=2;
  let idx=0;
  async function worker(){
    while(idx<spans.length){
      const span=spans[idx++];
      await generateRun(span);
    }
  }
  await Promise.all(Array.from({length:CONCURRENCY},worker));
}

document.getElementById("btnImportScript").onclick=importScript;
document.getElementById("btnReimport").onclick=()=>{
  document.getElementById("scriptImport").style.display="block";
  document.getElementById("scriptToolbar").style.display="none";
  document.getElementById("scriptBody").style.display="none";
  document.getElementById("genAllBar").style.display="none";
};
document.getElementById("btnGenerateAll").onclick=generateAllTagged;

/* ============================================================
   Init
   ============================================================ */
checkService();
loadVoices();
setInterval(checkService,15000);
if(window.ClientPicker){ ClientPicker.init({navEl:document.getElementById("clientNav")}); }
</script>
