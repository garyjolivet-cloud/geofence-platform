<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script>RoleGate.require(['admin','operator']);</script>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --night:#0a1018;--slate:#141d2b;--slate-2:#1b2738;--rim:#2e3f58;--coral:#ff6a3d;
         --snow:#ffffff;--ice:#c8dff2;--fog:#8aa5bf;--hazard:#ff2f4e;--go:#38e0a6;--amber:#ffc24d; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Barlow",system-ui,sans-serif;background:var(--night);color:var(--snow);overflow:hidden}
  body{display:flex;flex-direction:column}
  .hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rim);background:rgba(10,16,24,.95);flex:0 0 auto}
  .hdr h1{font-family:"Black Han Sans";font-size:17px;margin:0;flex:0 0 auto}
  .hdr .crumb{font-family:"Barlow Condensed";font-size:13px;color:var(--fog);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button{font-family:"Barlow Condensed";font-weight:600;text-transform:uppercase;letter-spacing:.4px;
         font-size:12px;color:var(--snow);background:var(--slate);border:1px solid var(--rim);border-radius:8px;
         padding:7px 12px;cursor:pointer}
  button.on{background:var(--coral);border-color:var(--coral);color:#1a0d07}
  button.ghost{background:none}
  button:disabled{opacity:.4;cursor:default}
  input,select{font-family:"Barlow Condensed";font-size:13px;background:var(--slate-2);
         color:var(--snow);border:1px solid var(--rim);border-radius:8px;padding:6px 9px;width:100%}
  input[type=range]{padding:0;accent-color:var(--coral)}
  .hint{font-family:"Barlow";font-size:12px;color:var(--fog)}
  label.k{font-family:"Barlow Condensed";text-transform:uppercase;font-size:10px;letter-spacing:.6px;color:var(--fog);display:block;margin:8px 0 3px}

  #noProjectHint{padding:20px;text-align:center}

  #gpxScreen{flex:1;display:none;min-height:0}
  #gpxScreen.show{display:flex}

  .rail{width:280px;flex:0 0 auto;border-right:1px solid var(--rim);display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.01);
        resize:horizontal;overflow:auto;min-width:220px;max-width:60vw}
  .rail .railHead{padding:10px 12px;border-bottom:1px solid var(--rim);display:flex;gap:6px;align-items:center;flex:0 0 auto}
  .rail .railHead .ttl{font-family:"Barlow Condensed";font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.5px;color:var(--ice);flex:1}
  #gpxTreeHost{flex:1;overflow-y:auto;padding:6px}

  #mapWrap{flex:1;min-width:0;position:relative}
  #map{position:absolute;inset:0}

  .side{width:300px;flex:0 0 auto;border-left:1px solid var(--rim);display:flex;flex-direction:column;min-height:0;
        background:rgba(255,255,255,.01);overflow-y:auto;padding:12px;resize:horizontal;min-width:240px;max-width:60vw}
  .side h2{font-family:"Barlow Condensed";font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--ice);margin:0 0 8px}
  .elevLabels{display:flex;justify-content:space-between;font-family:"Barlow Condensed";font-size:12px;color:var(--fog);margin-top:4px}
  .elevLabels b{color:var(--snow);font-size:13px}
  #totalGain{text-align:center;font-family:"Barlow Condensed";font-size:15px;color:var(--go);margin-bottom:6px}
  #chartWrap{position:relative;border:1px solid var(--rim);border-radius:8px;background:var(--slate-2);overflow:hidden}
  #chartSvg{display:block;width:100%;height:140px}
  #chartEmpty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--fog);font-size:12px;text-align:center;padding:10px}
  .row{display:flex;gap:6px;margin:8px 0}
  .row button{flex:1}
  #filterRow{display:flex;align-items:center;gap:8px;margin:10px 0 2px}
  #filterStats{font-family:"Barlow Condensed";font-size:11px;color:var(--fog);flex:1}
  #selStats{font-family:"Barlow Condensed";font-size:11px;color:var(--fog);margin-top:2px}
  hr{border:none;border-top:1px solid var(--rim);margin:12px 0}

  #scrubBar{position:fixed;left:0;right:0;bottom:0;height:56px;background:rgba(10,16,24,.95);border-top:1px solid var(--rim);
            display:none;align-items:center;gap:12px;padding:0 16px;z-index:50}
  #scrubBar.show{display:flex}
  #scrubRange{flex:1}
  #scrubKm,#scrubElev{font-family:"Barlow Condensed";font-size:13px;color:var(--ice);white-space:nowrap;min-width:70px}
</style>
</head>
<body>
<div class="hdr">
  <h1>GPX Editor</h1>
  <span class="crumb" id="hdrCrumb"></span>
  <div id="topNav" style="display:flex;gap:8px;align-items:center"></div>
</div>

<div id="noProjectHint" class="hint">Pick a company and project above to load its Paths &amp; Corridors library.</div>

<div id="gpxScreen">
  <div class="rail">
    <div class="railHead">
      <span class="ttl">Paths &amp; Corridors</span>
      <button id="importBtn" class="ghost" title="Import a GPX file">&#8593; Import</button>
      <button id="treeRefreshBtn" class="ghost" title="Refresh">&#8635;</button>
    </div>
    <input type="file" id="importInput" accept=".gpx,application/gpx+xml" style="display:none">
    <div id="gpxTreeHost"></div>
  </div>

  <div id="mapWrap"><div id="map"></div></div>

  <div class="side">
    <h2>Elevation</h2>
    <div id="totalGain">—</div>
    <div id="chartWrap">
      <svg id="chartSvg" viewBox="0 0 1000 140" preserveAspectRatio="none"></svg>
      <div id="chartEmpty">no elevation data in this track</div>
    </div>
    <div class="elevLabels"><span>start<br><b id="startElev">—</b></span><span style="text-align:right">end<br><b id="endElev">—</b></span></div>

    <div id="filterRow">
      <button id="filterToggle" class="on">Noise Filter</button>
      <span id="filterStats" class="hint"></span>
    </div>

    <hr>
    <label class="k">Trim / delete a range</label>
    <input type="range" id="selStart" min="0" max="1" value="0">
    <input type="range" id="selEnd" min="0" max="1" value="1">
    <div id="selStats" class="hint"></div>
    <div class="row">
      <button id="trimBtn">Trim to Selection</button>
      <button id="deleteBtn">Delete Selection</button>
    </div>

    <div class="row">
      <button id="reverseBtn">&#8645; Reverse Direction</button>
    </div>

    <hr>
    <div class="row">
      <button id="saveBtn" class="on" disabled>Save</button>
    </div>
    <div class="row">
      <button id="saveAsPathBtn">Save as Path…</button>
      <button id="saveAsCorridorBtn">Save as Corridor…</button>
    </div>
  </div>
</div>

<div id="scrubBar">
  <span id="scrubKm">0.00 km</span>
  <input type="range" id="scrubRange" min="0" max="1" value="0">
  <span id="scrubElev">—</span>
</div>

<script>
"use strict";
/* =====================================================================
   GPX EDITOR — import a recorded GPX track (or reopen a saved Path/
   Corridor), clean it up with the noise filter, trim/cut sections,
   reverse direction, and save into the app-scoped Paths & Corridors
   library (walking_path / corridor tables) that fence-editor.html's own
   Paths & Corridors palette and Walking Path picker already read from.
   Point convention throughout: [lon,lat,elevM|null,tMs|null] — matches
   fence-editor.html's [lon,lat,elevM] Walking Path points exactly, plus
   an optional 4th element (parsed GPX <time>) used only by the noise
   filter; never sent to the backend (walking_path/corridor both store
   3-element points).
   ===================================================================== */

function getToken(){ return localStorage.getItem("gp.session")||""; }
function currentOrg(){ return (window.ClientPicker && ClientPicker.resolve()) || ""; }

/* ---- geometry / GPX helpers — editor-local copies (see fence-editor.html
   for the canonical versions this was ported from); this copy never needs
   to stay in sync with the runtime engine or the Fence Editor, same
   reasoning already documented for the sim's own pathCumLens/pathCumElev
   copy. ---- */
function haversineM(a,b){ const R=6371000, toR=Math.PI/180;
  const dLat=(b[1]-a[1])*toR, dLon=(b[0]-a[0])*toR, la1=a[1]*toR, la2=b[1]*toR;
  const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x)); }

function pathCumLens(pts){
  const cum=[0];
  for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+haversineM(pts[i-1],pts[i]));
  return cum;
}
// Same 2m noise-floor threshold-diff as Field Recorder's elevGainLoss()/
// geofence-engine.html's pathCumElev — running gain/loss arrays so the
// chart and the start/end/total labels all read off the same computation.
function pathCumElev(elevArr, noiseFloorM){
  noiseFloorM = noiseFloorM==null ? 2 : noiseFloorM;
  const gain=[0], loss=[0];
  let ref = elevArr.length ? elevArr[0] : null;
  for(let i=1;i<elevArr.length;i++){
    let g=gain[i-1], l=loss[i-1];
    const e=elevArr[i];
    if(e!=null){
      if(ref!=null){ const d=e-ref; if(Math.abs(d)>=noiseFloorM){ if(d>0) g+=d; else l-=d; ref=e; } }
      else ref=e;
    }
    gain.push(g); loss.push(l);
  }
  return { gain, loss };
}
function computeBounds(pts){
  let minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
  for(const p of pts){ if(p[0]<minLon)minLon=p[0]; if(p[0]>maxLon)maxLon=p[0]; if(p[1]<minLat)minLat=p[1]; if(p[1]>maxLat)maxLat=p[1]; }
  return {minLon,maxLon,minLat,maxLat};
}
// Accepts a <trk>/<trkseg>/<trkpt> track or falls back to a <rte>/<rtept>
// route, same as fence-editor.html's parseGPX — extended here to also read
// each point's <time> (ISO 8601), which that copy doesn't, because the
// noise filter below needs per-point timestamps to compute speed.
function parseGPX(xmlText){
  const doc=new DOMParser().parseFromString(xmlText,"application/xml");
  if(doc.querySelector("parsererror")) throw new Error("couldn't parse this file as GPX/XML");
  let nodes=[...doc.querySelectorAll("trkpt")];
  if(!nodes.length) nodes=[...doc.querySelectorAll("rtept")];
  if(!nodes.length) throw new Error("no track or route points found in this GPX file");
  const points=nodes.map(n=>{
    const lat=parseFloat(n.getAttribute("lat")), lon=parseFloat(n.getAttribute("lon"));
    const eleEl=n.querySelector("ele");
    const ele=eleEl?parseFloat(eleEl.textContent):NaN;
    const timeEl=n.querySelector("time");
    const tMs=timeEl?Date.parse(timeEl.textContent):NaN;
    return [lon,lat,isNaN(ele)?null:ele,isNaN(tMs)?null:tMs];
  }).filter(p=>!isNaN(p[0])&&!isNaN(p[1]));
  if(points.length<2) throw new Error("not enough valid points in this GPX file");
  const nameEl=doc.querySelector("trk > name")||doc.querySelector("rte > name")||doc.querySelector("metadata > name");
  return { points, name: nameEl?nameEl.textContent.trim():"" };
}
// Ported from field-recorder.html's filterImpossibleJumps() — drops any
// point implying faster-than-walking/hiking-pace travel from the last KEPT
// point (not the last raw one, so one bad fix can't cascade into rejecting
// everything after it). Same default threshold, same logic, adapted from
// {lat,lon,t} objects to this file's [lon,lat,ele,tMs] tuples.
function filterImpossibleJumps(pts, maxSpeedMps){
  maxSpeedMps = maxSpeedMps || 8;
  if(pts.length<2) return pts.slice();
  const kept=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const prev=kept[kept.length-1], cur=pts[i];
    const dt=(cur[3]-prev[3])/1000;
    if(!(dt>0)) continue; // duplicate/out-of-order/missing timestamp — skip rather than divide by zero
    const speed=haversineM(prev,cur)/dt;
    if(speed<=maxSpeedMps) kept.push(cur);
  }
  return kept;
}

/* ---- state ---- */
let appId=null;
let basePoints=[];   // current baseline (post most-recent structural edit), may include tMs
let points=[];       // active/displayed set — basePoints, or filterImpossibleJumps(basePoints) when the filter is on
let filterOn=true, filterAvailable=false;
let cumLens=[0], cumGain=[0], cumLoss=[0];
let bounds=null;
let loadedFrom=null; // {kind:'path'|'corridor', id, name, widthM} once opened from/saved to the tree
let mapReady=false, playheadMarker=null;
const MAX_SPEED_MPS=8;

function setBase(newPoints){
  basePoints = newPoints;
  refreshActive();
}
function refreshActive(){
  const withTime = basePoints.filter(p=>p[3]!=null).length;
  filterAvailable = basePoints.length>1 && withTime >= basePoints.length*0.9;
  if(!filterAvailable) filterOn=false;
  points = (filterOn && filterAvailable) ? filterImpossibleJumps(basePoints, MAX_SPEED_MPS) : basePoints.slice();
  recompute();
  updateFilterUI();
}
function recompute(){
  cumLens = pathCumLens(points);
  const ge = pathCumElev(points.map(p=>p[2]));
  cumGain = ge.gain; cumLoss = ge.loss;
  bounds = points.length ? computeBounds(points) : null;
  renderMapLine();
  renderChart();
  updateLabels();
  updateTrimUI();
  positionScrubberFromIdx(0);
  document.getElementById("scrubBar").classList.toggle("show", points.length>1);
  document.getElementById("saveBtn").disabled = !loadedFrom;
}

/* ---- noise filter UI ---- */
function updateFilterUI(){
  const btn=document.getElementById("filterToggle"), stats=document.getElementById("filterStats");
  btn.classList.toggle("on", filterOn);
  btn.disabled = !filterAvailable;
  if(!basePoints.length){ stats.textContent=""; return; }
  if(!filterAvailable){ stats.textContent="no timestamps in this track"; return; }
  if(!filterOn){ stats.textContent="Filter OFF"; return; }
  const removed = basePoints.length - points.length;
  const pct = basePoints.length ? (removed/basePoints.length*100).toFixed(1) : "0";
  stats.textContent = "removed "+removed+" of "+basePoints.length+" points ("+pct+"%)";
}
document.getElementById("filterToggle").onclick=()=>{
  if(!filterAvailable) return;
  filterOn=!filterOn;
  refreshActive();
};

/* ---- labels ---- */
function fmtElev(v){ return v==null ? "—" : Math.round(v)+" m"; }
function updateLabels(){
  document.getElementById("startElev").textContent = points.length ? fmtElev(points[0][2]) : "—";
  document.getElementById("endElev").textContent = points.length ? fmtElev(points[points.length-1][2]) : "—";
  const hasElev = points.some(p=>p[2]!=null);
  document.getElementById("totalGain").textContent = hasElev ? ("▲ "+Math.round(cumGain[cumGain.length-1]||0)+" m gain") : "—";
}

/* ---- elevation-vs-distance chart (hand-rolled inline SVG — no chart
   library exists anywhere in this codebase, consistent with the app's
   no-external-dependency convention for its own hand-rolled UI, e.g.
   pipeline-editor.html's node canvas). ---- */
function renderChart(){
  const svg=document.getElementById("chartSvg"), empty=document.getElementById("chartEmpty");
  const hasElev = points.length>1 && points.some(p=>p[2]!=null);
  empty.style.display = hasElev ? "none" : "flex";
  if(!hasElev){ svg.innerHTML=""; return; }
  const W=1000,H=140,pad=6;
  const totalDist = cumLens[cumLens.length-1]||1;
  let minE=Infinity,maxE=-Infinity;
  for(const p of points){ if(p[2]!=null){ if(p[2]<minE)minE=p[2]; if(p[2]>maxE)maxE=p[2]; } }
  if(minE===maxE){ minE-=1; maxE+=1; }
  const xAt=i=>pad+(cumLens[i]/totalDist)*(W-2*pad);
  const yAt=e=>H-pad-((e-minE)/(maxE-minE))*(H-2*pad);
  let lastY=H-pad, d="";
  points.forEach((p,i)=>{
    const x=xAt(i), y=p[2]!=null?yAt(p[2]):lastY;
    d += (i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1)+" ";
    lastY=y;
  });
  svg.innerHTML =
    '<path d="'+d+'" fill="none" stroke="#ff6a3d" stroke-width="2"></path>'+
    '<line id="chartPlayhead" x1="0" y1="0" x2="0" y2="'+H+'" stroke="#38e0a6" stroke-width="2"></line>';
}
function moveChartPlayhead(idx){
  const line=document.getElementById("chartPlayhead"); if(!line) return;
  const total=cumLens[cumLens.length-1]||1;
  const x=6+(cumLens[idx]/total)*(1000-12);
  line.setAttribute("x1",x); line.setAttribute("x2",x);
}

/* ---- map ---- */
const map=new maplibregl.Map({
  container:"map",
  style:{version:8,
    sources:{base:{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"],tileSize:256,attribution:"Esri"}},
    layers:[{id:"base",type:"raster",source:"base"}]},
  center:[-117.0547,51.3027], zoom:12
});
map.addControl(new maplibregl.NavigationControl());
map.on("load",()=>{ mapReady=true; renderMapLine(); });

function renderMapLine(){
  if(!mapReady) return;
  const coords=points.map(p=>[p[0],p[1]]);
  // A LineString needs >=2 positions — under that, use an empty
  // FeatureCollection instead so MapLibre never sees an invalid geometry.
  const geojson = coords.length>=2
    ? {type:"Feature",geometry:{type:"LineString",coordinates:coords}}
    : {type:"FeatureCollection",features:[]};
  if(map.getSource("track")) map.getSource("track").setData(geojson);
  else{
    map.addSource("track",{type:"geojson",data:geojson});
    map.addLayer({id:"track-line",type:"line",source:"track",paint:{"line-color":"#ff6a3d","line-width":4}});
  }
  if(coords.length){
    if(!playheadMarker) playheadMarker=new maplibregl.Marker({color:"#38e0a6"}).addTo(map);
    playheadMarker.setLngLat(coords[0]);
  } else if(playheadMarker){
    playheadMarker.remove(); playheadMarker=null;
  }
  if(bounds && isFinite(bounds.minLon) && (bounds.minLon!==bounds.maxLon || bounds.minLat!==bounds.maxLat)){
    map.fitBounds([[bounds.minLon,bounds.minLat],[bounds.maxLon,bounds.maxLat]],{padding:50,duration:300});
  } else if(coords.length===1){
    map.flyTo({center:coords[0],zoom:15});
  }
}

/* ---- scrubber ---- */
function idxAtFraction(frac){
  if(points.length<2) return 0;
  const target=frac*(cumLens[cumLens.length-1]||0);
  let lo=0,hi=cumLens.length-1;
  while(lo<hi){ const mid=(lo+hi)>>1; if(cumLens[mid]<target) lo=mid+1; else hi=mid; }
  return lo;
}
function fractionAtIdx(idx){ const total=cumLens[cumLens.length-1]||1; return (cumLens[idx]||0)/total; }
function positionScrubberFromIdx(idx){
  if(!points.length) return;
  idx=Math.max(0,Math.min(points.length-1,idx));
  const range=document.getElementById("scrubRange");
  range.value = Math.round(fractionAtIdx(idx)*1000);
  updateScrubberUI(idx);
}
function updateScrubberUI(idx){
  const p=points[idx]; if(!p) return;
  document.getElementById("scrubKm").textContent = (cumLens[idx]/1000).toFixed(2)+" km";
  document.getElementById("scrubElev").textContent = fmtElev(p[2]);
  if(playheadMarker) playheadMarker.setLngLat([p[0],p[1]]);
  moveChartPlayhead(idx);
}
document.getElementById("scrubRange").min="0";
document.getElementById("scrubRange").max="1000";
document.getElementById("scrubRange").oninput=e=>{
  const idx=idxAtFraction((+e.target.value)/1000);
  updateScrubberUI(idx);
};

/* ---- trim / delete selection ---- */
function updateTrimUI(){
  const s0=document.getElementById("selStart"), s1=document.getElementById("selEnd");
  const maxIdx=Math.max(0,points.length-1);
  s0.max=maxIdx; s1.max=maxIdx;
  s0.value=0; s1.value=maxIdx;
  updateSelStats();
}
function selRange(){
  const s0=document.getElementById("selStart"), s1=document.getElementById("selEnd");
  let i0=+s0.value, i1=+s1.value;
  if(i0>i1){ const t=i0; i0=i1; i1=t; }
  return {i0,i1};
}
function updateSelStats(){
  const {i0,i1}=selRange();
  const distKm = points.length ? ((cumLens[i1]-cumLens[i0])/1000).toFixed(2) : "0.00";
  document.getElementById("selStats").textContent = (i1-i0+1)+" pts selected · "+distKm+" km";
}
document.getElementById("selStart").oninput=updateSelStats;
document.getElementById("selEnd").oninput=updateSelStats;
document.getElementById("trimBtn").onclick=()=>{
  const {i0,i1}=selRange();
  if(i0<=0 && i1>=points.length-1) return; // nothing outside the selection to trim
  setBase(points.slice(i0,i1+1));
};
document.getElementById("deleteBtn").onclick=()=>{
  const {i0,i1}=selRange();
  const remaining=points.slice(0,i0).concat(points.slice(i1+1));
  if(remaining.length<2){ alert("Can't delete — at least 2 points must remain."); return; }
  setBase(remaining);
};

/* ---- reverse direction ---- */
// Timestamps travel WITH each point, not with array position — reversing
// point order without clearing them would leave every consecutive dt
// negative (the filter's dt<=0 guard would then drop nearly everything).
// Direction reversal genuinely invalidates the recorded timing anyway (you
// didn't walk it that direction), so timestamps are dropped and the filter
// disables itself (via refreshActive()'s own availability check) until the
// next import.
document.getElementById("reverseBtn").onclick=()=>{
  if(points.length<2) return;
  setBase(points.slice().reverse().map(p=>[p[0],p[1],p[2],null]));
};

/* ---- import from Downloads ---- */
document.getElementById("importBtn").onclick=()=>document.getElementById("importInput").click();
document.getElementById("importInput").onchange=async()=>{
  const input=document.getElementById("importInput");
  const f=input.files[0]; input.value="";
  if(!f) return;
  try{
    const text=await f.text();
    const {points:parsed}=parseGPX(text);
    loadedFrom=null;
    setBase(parsed);
  }catch(e){ alert("Import failed: "+e.message); }
};

/* ---- open an existing tree item ---- */
async function openTreeItem(item){
  try{
    const ep=(item.kind==="path"?"/api/walking-path/":"/api/corridor/")+item.id;
    const r=await fetch(ep,{headers:{authorization:"Bearer "+getToken()}});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||r.statusText);
    const j=await r.json();
    const pts=(j.points||[]).map(p=>[p[0],p[1],p[2]==null?null:p[2],null]);
    if(pts.length<2){ alert("This "+item.kind+" doesn't have enough points."); return; }
    loadedFrom={kind:item.kind, id:item.id, name:j.name, widthM:j.widthM};
    document.getElementById("hdrCrumb").textContent = j.name+(item.kind==="path"?".p":".c");
    setBase(pts);
  }catch(e){ alert("Open failed: "+e.message); }
}

/* ---- tree mount ---- */
const gpxTree=GpxTree.mount(document.getElementById("gpxTreeHost"),{
  appId:null,
  getToken,
  readOnly:false,
  onError:msg=>alert(msg),
  onPick: openTreeItem
});
document.getElementById("treeRefreshBtn").onclick=()=>gpxTree.refresh({appId});

/* ---- save ---- */
function currentTotals(){
  return { distanceM: cumLens[cumLens.length-1]||0, elevGainM: cumGain[cumGain.length-1]||0, elevLossM: cumLoss[cumLoss.length-1]||0 };
}
async function patchJson(url, body){
  const r=await fetch(url,{method:"PATCH",headers:{authorization:"Bearer "+getToken(),"content-type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||r.statusText);
  return r.json();
}
async function postJson(url, body){
  const r=await fetch(url,{method:"POST",headers:{authorization:"Bearer "+getToken(),"content-type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||r.statusText);
  return r.json();
}
document.getElementById("saveBtn").onclick=async()=>{
  if(!loadedFrom) return;
  const {distanceM,elevGainM,elevLossM}=currentTotals();
  const flatPoints=points.map(p=>[p[0],p[1],p[2]]);
  try{
    if(loadedFrom.kind==="path"){
      await patchJson("/api/walking-path/"+loadedFrom.id,{points:flatPoints,distanceM,elevGainM,elevLossM});
    } else {
      await patchJson("/api/corridor/"+loadedFrom.id,{points:flatPoints,distanceM,widthM:loadedFrom.widthM||10});
    }
    gpxTree.refresh({appId});
    alert("Saved.");
  }catch(e){ alert("Save failed: "+e.message); }
};
document.getElementById("saveAsPathBtn").onclick=async()=>{
  if(!appId){ alert("Pick a company and project first."); return; }
  if(points.length<2) return;
  const name=(prompt("Name this path:", (loadedFrom&&loadedFrom.name)||"")||"").trim();
  if(!name) return;
  const target=gpxTree.getUploadTarget();
  const folderId = (target&&target.kind==="path") ? target.folderId : null;
  const {distanceM,elevGainM,elevLossM}=currentTotals();
  try{
    const j=await postJson("/api/walking-path",{appId,name,points:points.map(p=>[p[0],p[1],p[2]]),folderId,distanceM,elevGainM,elevLossM});
    loadedFrom={kind:"path", id:j.id, name};
    document.getElementById("hdrCrumb").textContent=name+".p";
    document.getElementById("saveBtn").disabled=false;
    gpxTree.refresh({appId});
  }catch(e){ alert("Save failed: "+e.message); }
};
document.getElementById("saveAsCorridorBtn").onclick=async()=>{
  if(!appId){ alert("Pick a company and project first."); return; }
  if(points.length<2) return;
  const name=(prompt("Name this corridor:", (loadedFrom&&loadedFrom.name)||"")||"").trim();
  if(!name) return;
  const widthM=+(prompt("Corridor width (meters):","10")||10)||10;
  const target=gpxTree.getUploadTarget();
  const folderId = (target&&target.kind==="corridor") ? target.folderId : null;
  const {distanceM}=currentTotals();
  try{
    const j=await postJson("/api/corridor",{appId,name,points:points.map(p=>[p[0],p[1],p[2]]),folderId,widthM,distanceM});
    loadedFrom={kind:"corridor", id:j.id, name, widthM};
    document.getElementById("hdrCrumb").textContent=name+".c";
    document.getElementById("saveBtn").disabled=false;
    gpxTree.refresh({appId});
  }catch(e){ alert("Save failed: "+e.message); }
};

/* ---- project/app resolution — walking_path/corridor are app-scoped (not
   project-scoped), same as fence-editor.html's afAppId()/loadWalkingPaths();
   a project only needs to be selected to resolve which app owns the
   library, matching record.html's own project-gated screen pattern. ---- */
function showGpxScreen(){
  document.getElementById("noProjectHint").style.display="none";
  document.getElementById("gpxScreen").classList.add("show");
}
function showNoProject(){
  document.getElementById("noProjectHint").style.display="block";
  document.getElementById("gpxScreen").classList.remove("show");
  document.getElementById("scrubBar").classList.remove("show");
}
async function resolveAppIdFallback(id){
  try{
    const r=await fetch("/api/projects?org="+encodeURIComponent(currentOrg()),{headers:{authorization:"Bearer "+getToken()}});
    const j=r.ok?await r.json():{projects:[]};
    const p=(j.projects||[]).find(x=>x.id===id);
    if(p&&p.appId) return p.appId;
  }catch(e){}
  return null;
}
async function enterProject(id, proj){
  appId = (proj && proj.appId) || null;
  if(!appId) appId = await resolveAppIdFallback(id);
  document.getElementById("hdrCrumb").textContent = (proj&&proj.name)||id;
  loadedFrom=null;
  setBase([]);
  showGpxScreen();
  if(!appId){ document.getElementById("gpxTreeHost").innerHTML='<div class="hint">couldn\'t determine this project\'s workspace</div>'; return; }
  gpxTree.refresh({appId});
}

if(window.TopNav){
  TopNav.init({
    navEl: document.getElementById("topNav"),
    active: "gpx",
    onCompanyChange: ()=>{ appId=null; showNoProject(); },
    onProjectChange: (id, proj)=>{ if(id) enterProject(id, proj); else showNoProject(); }
  });
}
const _initialProjectId = window.TopNav && TopNav.resolveProject && TopNav.resolveProject();
if(_initialProjectId) enterProject(_initialProjectId, null);
else showNoProject();
</script>
