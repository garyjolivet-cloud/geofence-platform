<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chase Life — GPX Editor</title>
<script src="role-gate.js"></script>
<script src="client-picker.js"></script>
<script src="top-nav.js"></script>
<script src="corridor-tree.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script>RoleGate.require(['admin','operator']);</script>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --night:#0a1018;--slate:#141d2b;--slate-2:#1b2738;--rim:#2e3f58;--coral:#ff6a3d;
         --snow:#ffffff;--ice:#c8dff2;--fog:#8aa5bf;--hazard:#ff2f4e;--go:#38e0a6;--amber:#ffc24d; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Barlow",system-ui,sans-serif;background:var(--night);color:var(--snow);overflow:hidden}
  body{display:flex;flex-direction:column}
  .hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rim);background:rgba(10,16,24,.95);flex:0 0 auto}
  .hdr h1{font-family:"Black Han Sans";font-size:17px;margin:0;flex:0 0 auto}
  .hdr .crumb{font-family:"Barlow Condensed";font-size:13px;color:var(--fog);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button{font-family:"Barlow Condensed";font-weight:600;text-transform:uppercase;letter-spacing:.4px;
         font-size:12px;color:var(--snow);background:var(--slate);border:1px solid var(--rim);border-radius:8px;
         padding:7px 12px;cursor:pointer}
  button.on{background:var(--coral);border-color:var(--coral);color:#1a0d07}
  button.ghost{background:none}
  button:disabled{opacity:.4;cursor:default}
  input,select{font-family:"Barlow Condensed";font-size:13px;background:var(--slate-2);
         color:var(--snow);border:1px solid var(--rim);border-radius:8px;padding:6px 9px;width:100%}
  input[type=range]{padding:0;accent-color:var(--coral)}
  .hint{font-family:"Barlow";font-size:12px;color:var(--fog)}
  label.k{font-family:"Barlow Condensed";text-transform:uppercase;font-size:10px;letter-spacing:.6px;color:var(--fog);display:block;margin:8px 0 3px}

  #noProjectHint{padding:20px;text-align:center}

  #gpxScreen{flex:1;display:none;min-height:0}
  #gpxScreen.show{display:flex}

  .rail{width:280px;flex:0 0 auto;border-right:1px solid var(--rim);display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.01);
        resize:horizontal;overflow:auto;min-width:220px;max-width:60vw}
  .rail .railHead{padding:10px 12px;border-bottom:1px solid var(--rim);display:flex;gap:6px;align-items:center;flex:0 0 auto}
  .rail .railHead .ttl{font-family:"Barlow Condensed";font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.5px;color:var(--ice);flex:1}
  #gpxTreeHost{flex:1;overflow-y:auto;padding:6px}

  #mapWrap{flex:1;min-width:0;position:relative}
  #map{position:absolute;inset:0}

  .side{width:300px;flex:0 0 auto;border-left:1px solid var(--rim);display:flex;flex-direction:column;min-height:0;
        background:rgba(255,255,255,.01);overflow-y:auto;padding:12px;resize:horizontal;min-width:240px;max-width:60vw}
  .side h2{font-family:"Barlow Condensed";font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--ice);margin:0 0 8px}
  /* .side is a flex column with overflow-y:auto — without this, an overflowing
     panel compresses its tallest shrinkable child (the elevation chart) instead
     of scrolling. Pin every child to its natural height and let the panel scroll. */
  .side > *{flex:0 0 auto}
  .elevLabels{display:flex;justify-content:space-between;font-family:"Barlow Condensed";font-size:12px;color:var(--fog);margin-top:4px}
  .elevLabels b{color:var(--snow);font-size:13px}
  #totalGain{text-align:center;font-family:"Barlow Condensed";font-size:15px;color:var(--go);margin-bottom:6px}
  #chartWrap{position:relative;border:1px solid var(--rim);border-radius:8px;background:var(--slate-2);overflow:hidden}
  #chartSvg{display:block;width:100%;height:140px}
  #chartEmpty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--fog);font-size:12px;text-align:center;padding:10px}
  .row{display:flex;gap:6px;margin:8px 0}
  .row button{flex:1}
  #filterRow{display:flex;align-items:center;gap:8px;margin:10px 0 2px}
  #filterStats{font-family:"Barlow Condensed";font-size:11px;color:var(--fog);flex:1}
  #selStats{font-family:"Barlow Condensed";font-size:11px;color:var(--fog);margin-top:2px}
  hr{border:none;border-top:1px solid var(--rim);margin:12px 0}

  #scrubBar{position:fixed;left:0;right:0;bottom:0;height:56px;background:rgba(10,16,24,.95);border-top:1px solid var(--rim);
            display:none;align-items:center;gap:12px;padding:0 16px;z-index:50}
  #scrubBar.show{display:flex}
  /* the fixed scrub bar (shown once a track loads) is full-width and sits on
     top of the bottom of both side columns — pad them so their last controls
     (notably Save As…) clear it instead of being hidden behind it */
  body:has(#scrubBar.show) .side{padding-bottom:68px}
  body:has(#scrubBar.show) #gpxTreeHost{padding-bottom:62px}
  #scrubRange{flex:1}
  #scrubKm,#scrubElev{font-family:"Barlow Condensed";font-size:13px;color:var(--ice);white-space:nowrap;min-width:70px}
</style>
</head>
<body>
<div class="hdr">
  <h1>GPX Editor</h1>
  <span class="crumb" id="hdrCrumb"></span>
  <div id="topNav" style="display:flex;gap:8px;align-items:center"></div>
</div>

<div id="noProjectHint" class="hint">Pick a company and project above to load its Corridors library.</div>

<div id="gpxScreen">
  <div class="rail">
    <div class="railHead">
      <span class="ttl">Corridors</span>
      <button id="importBtn" class="ghost" title="Import a GPX file">&#8593; Import</button>
      <button id="treeRefreshBtn" class="ghost" title="Refresh">&#8635;</button>
    </div>
    <input type="file" id="importInput" accept=".gpx,application/gpx+xml" style="display:none">
    <div id="gpxTreeHost"></div>
  </div>

  <div id="mapWrap"><div id="map"></div></div>

  <div class="side">
    <h2>Elevation</h2>
    <div id="totalGain">—</div>
    <div id="chartWrap">
      <svg id="chartSvg" viewBox="0 0 1000 140" preserveAspectRatio="none"></svg>
      <div id="chartEmpty">
        <span>no elevation data in this track</span>
        <button id="backfillElevBtn" class="ghost">Backfill Elevation from Terrain</button>
      </div>
    </div>
    <div class="elevLabels"><span>start<br><b id="startElev">—</b></span><span style="text-align:right">end<br><b id="endElev">—</b></span></div>

    <div id="filterRow">
      <button id="filterToggle" class="on">Noise Filter</button>
      <span id="filterStats" class="hint"></span>
    </div>

    <hr>
    <label class="k">Trim / delete a range</label>
    <input type="range" id="selStart" min="0" max="1" value="0">
    <input type="range" id="selEnd" min="0" max="1" value="1">
    <div id="selStats" class="hint"></div>
    <div class="row">
      <button id="trimBtn">Trim to Selection</button>
      <button id="deleteBtn">Delete Selection</button>
    </div>
    <div class="row">
      <button id="undoBtn" class="ghost" disabled title="Undo the last Trim/Delete/Reverse">&#8617; Undo Last Edit</button>
    </div>

    <div class="row">
      <button id="reverseBtn">&#8645; Reverse Direction</button>
    </div>

    <hr>
    <div class="row">
      <button id="saveBtn" class="on" disabled>Save</button>
      <button id="widthBtn" class="ghost" disabled title="Set the trigger-band width for the currently loaded corridor">&#8960; Width&hellip;</button>
    </div>
    <div class="row">
      <button id="saveAsBtn">Save As&hellip;</button>
    </div>
  </div>
</div>

<div id="scrubBar">
  <span id="scrubKm">0.00 km</span>
  <input type="range" id="scrubRange" min="0" max="1" value="0">
  <span id="scrubElev">—</span>
</div>

<script>
"use strict";
/* =====================================================================
   GPX EDITOR — import a recorded GPX track (or reopen a saved corridor),
   clean it up with the noise filter, trim/cut sections, reverse
   direction, and save into the app-scoped Corridors library (corridor
   table) that fence-editor.html's own Corridors palette reads from.
   Point convention throughout: [lon,lat,elevM|null,tMs|null] — matches
   fence-editor.html's [lon,lat,elevM] corridor points exactly, plus an
   optional 4th element (parsed GPX <time>) used only by the noise
   filter; never sent to the backend (corridor stores 3-element points).
   ===================================================================== */

function getToken(){ return localStorage.getItem("gp.session")||""; }
function currentOrg(){ return (window.ClientPicker && ClientPicker.resolve()) || ""; }

/* ---- geometry / GPX helpers — editor-local copies (see fence-editor.html
   for the canonical versions this was ported from); this copy never needs
   to stay in sync with the runtime engine or the Fence Editor, same
   reasoning already documented for the sim's own pathCumLens/pathCumElev
   copy. ---- */
function haversineM(a,b){ const R=6371000, toR=Math.PI/180;
  const dLat=(b[1]-a[1])*toR, dLon=(b[0]-a[0])*toR, la1=a[1]*toR, la2=b[1]*toR;
  const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x)); }

function pathCumLens(pts){
  const cum=[0];
  for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+haversineM(pts[i-1],pts[i]));
  return cum;
}
// Same 2m noise-floor threshold-diff as Field Recorder's elevGainLoss()/
// geofence-engine.html's pathCumElev — running gain/loss arrays so the
// chart and the start/end/total labels all read off the same computation.
function pathCumElev(elevArr, noiseFloorM){
  noiseFloorM = noiseFloorM==null ? 2 : noiseFloorM;
  const gain=[0], loss=[0];
  let ref = elevArr.length ? elevArr[0] : null;
  for(let i=1;i<elevArr.length;i++){
    let g=gain[i-1], l=loss[i-1];
    const e=elevArr[i];
    if(e!=null){
      if(ref!=null){ const d=e-ref; if(Math.abs(d)>=noiseFloorM){ if(d>0) g+=d; else l-=d; ref=e; } }
      else ref=e;
    }
    gain.push(g); loss.push(l);
  }
  return { gain, loss };
}
function computeBounds(pts){
  let minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
  for(const p of pts){ if(p[0]<minLon)minLon=p[0]; if(p[0]>maxLon)maxLon=p[0]; if(p[1]<minLat)minLat=p[1]; if(p[1]>maxLat)maxLat=p[1]; }
  return {minLon,maxLon,minLat,maxLat};
}
// Accepts a <trk>/<trkseg>/<trkpt> track or falls back to a <rte>/<rtept>
// route, same as fence-editor.html's parseGPX — extended here to also read
// each point's <time> (ISO 8601), which that copy doesn't, because the
// noise filter below needs per-point timestamps to compute speed.
function parseGPX(xmlText){
  const doc=new DOMParser().parseFromString(xmlText,"application/xml");
  if(doc.querySelector("parsererror")) throw new Error("couldn't parse this file as GPX/XML");
  let nodes=[...doc.querySelectorAll("trkpt")];
  if(!nodes.length) nodes=[...doc.querySelectorAll("rtept")];
  if(!nodes.length) throw new Error("no track or route points found in this GPX file");
  const points=nodes.map(n=>{
    const lat=parseFloat(n.getAttribute("lat")), lon=parseFloat(n.getAttribute("lon"));
    const eleEl=n.querySelector("ele");
    const ele=eleEl?parseFloat(eleEl.textContent):NaN;
    const timeEl=n.querySelector("time");
    const tMs=timeEl?Date.parse(timeEl.textContent):NaN;
    return [lon,lat,isNaN(ele)?null:ele,isNaN(tMs)?null:tMs];
  }).filter(p=>!isNaN(p[0])&&!isNaN(p[1]));
  if(points.length<2) throw new Error("not enough valid points in this GPX file");
  const nameEl=doc.querySelector("trk > name")||doc.querySelector("rte > name")||doc.querySelector("metadata > name");
  return { points, name: nameEl?nameEl.textContent.trim():"" };
}
// Ported from field-recorder.html's filterImpossibleJumps() — drops any
// point implying faster-than-walking/hiking-pace travel from the last KEPT
// point (not the last raw one, so one bad fix can't cascade into rejecting
// everything after it). Same default threshold, same logic, adapted from
// {lat,lon,t} objects to this file's [lon,lat,ele,tMs] tuples.
function filterImpossibleJumps(pts, maxSpeedMps){
  maxSpeedMps = maxSpeedMps || 8;
  if(pts.length<2) return pts.slice();
  const kept=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const prev=kept[kept.length-1], cur=pts[i];
    const dt=(cur[3]-prev[3])/1000;
    if(!(dt>0)) continue; // duplicate/out-of-order/missing timestamp — skip rather than divide by zero
    const speed=haversineM(prev,cur)/dt;
    if(speed<=maxSpeedMps) kept.push(cur);
  }
  return kept;
}

/* ---- state ---- */
let appId=null;
let basePoints=[];   // current baseline (post most-recent structural edit), may include tMs
let points=[];       // active/displayed set — basePoints, or filterImpossibleJumps(basePoints) when the filter is on
let filterOn=true, filterAvailable=false;
let cumLens=[0], cumGain=[0], cumLoss=[0];
let bounds=null;
let loadedFrom=null; // {kind:'corridor', id, name, widthM} once opened from/saved to the tree — widthM is always a number (the trigger-band width; default 10)
let undoStack=[];    // snapshots of basePoints from before each structural edit (Trim/Delete/Reverse) — lets Undo reverse one if the result isn't liked; cleared whenever a different track is opened, since undoing across tracks makes no sense
let mapReady=false, playheadMarker=null, resizePending=false, renderQueued=false;
// setBase()->recompute() and map's own "load" handler can each independently
// want to call renderMapLine() around the same moment (a track opened right
// as the map finishes initializing). Two back-to-back fitBounds() calls —
// even with animate:false — hit a real MapLibre reentrancy bug (confirmed
// live 2026-08-21: "Attempting to run(), but is already running"/undefined
// .lng flood, map goes blank). Route every trigger through this single-flight
// scheduler so at most one renderMapLine() runs per frame, however many
// callers asked for one.
function scheduleRenderMapLine(){
  if(renderQueued) return;
  renderQueued=true;
  requestAnimationFrame(()=>{ renderQueued=false; renderMapLine(); });
}
const MAX_SPEED_MPS=8;

function setBase(newPoints, opts){
  opts = opts||{};
  // resetHistory:true is for opening a *different* track (import, tree pick,
  // enterProject) — undoing across tracks makes no sense, so history starts
  // clean. Otherwise (Trim/Delete/Reverse) this is a structural edit of the
  // *same* track, so snapshot the pre-edit points onto the undo stack first.
  if(opts.resetHistory) undoStack=[];
  else undoStack.push(basePoints);
  basePoints = newPoints;
  refreshActive();
  updateUndoUI();
}
function undoEdit(){
  if(!undoStack.length) return;
  basePoints = undoStack.pop();
  refreshActive();
  updateUndoUI();
}
function updateUndoUI(){
  const btn=document.getElementById("undoBtn");
  if(btn) btn.disabled = !undoStack.length;
}
function refreshActive(){
  const withTime = basePoints.filter(p=>p[3]!=null).length;
  filterAvailable = basePoints.length>1 && withTime >= basePoints.length*0.9;
  if(!filterAvailable) filterOn=false;
  points = (filterOn && filterAvailable) ? filterImpossibleJumps(basePoints, MAX_SPEED_MPS) : basePoints.slice();
  recompute();
  updateFilterUI();
}
function recompute(){
  cumLens = pathCumLens(points);
  const ge = pathCumElev(points.map(p=>p[2]));
  cumGain = ge.gain; cumLoss = ge.loss;
  bounds = points.length ? computeBounds(points) : null;
  // Side-panel updates first (cheap, pure DOM) — renderMapLine() below can
  // trigger a burst of new tile fetches + GL buffer rebuild for a large
  // track, which can occupy the main thread for a couple of seconds.
  // Updating the chart/labels/trim UI before that starts means the browser
  // gets a chance to paint the correct panel state even if the map itself
  // stays visibly busy for a moment.
  renderChart();
  updateLabels();
  updateTrimUI();
  positionScrubberFromIdx(0);
  document.getElementById("scrubBar").classList.toggle("show", points.length>1);
  document.getElementById("saveBtn").disabled = !loadedFrom;
  updateWidthBtn();
  // Deferred a frame (not called inline) — reordering alone doesn't force
  // an intermediate paint, since the browser only paints after the whole
  // synchronous call stack unwinds. requestAnimationFrame actually yields
  // first, so the panel updates above get on screen before the heavier
  // map/tile work below has a chance to occupy the main thread.
  scheduleRenderMapLine();
}

/* ---- noise filter UI ---- */
function updateFilterUI(){
  const btn=document.getElementById("filterToggle"), stats=document.getElementById("filterStats");
  btn.classList.toggle("on", filterOn);
  btn.disabled = !filterAvailable;
  if(!basePoints.length){ stats.textContent=""; return; }
  if(!filterAvailable){ stats.textContent="no timestamps in this track"; return; }
  if(!filterOn){ stats.textContent="Filter OFF"; return; }
  const removed = basePoints.length - points.length;
  const pct = basePoints.length ? (removed/basePoints.length*100).toFixed(1) : "0";
  stats.textContent = "removed "+removed+" of "+basePoints.length+" points ("+pct+"%)";
}
document.getElementById("filterToggle").onclick=()=>{
  if(!filterAvailable) return;
  filterOn=!filterOn;
  refreshActive();
};

/* ---- backfill elevation from terrain DEM — for tracks with no elevation
   at all. Field Recorder recordings almost always end up this way: they
   only carry phone GPS altitude unless a BLE barometer was connected, and
   field-recorder.html's smoothElevation() wipes elevation for the *entire*
   track (not just the gaps) whenever fewer than half the points got a real
   altitude reading — which is the common case without a barometer. This
   queries the same free Terrarium DEM (elevation-tiles-prod) already used
   elsewhere in this app for ground elevation, via MapLibre's own
   queryTerrainElevation() — briefly turns terrain on just long enough for
   the relevant DEM tiles (covering the current view, already fit to the
   whole track) to load, queries every point, then turns terrain back off
   since this file has no 3D/tilt mode of its own. Goes through setBase()
   like any other structural edit, so it's undoable via "Undo Last Edit" if
   the result isn't wanted. ---- */
document.getElementById("backfillElevBtn").onclick=()=>{
  if(basePoints.length<2){ alert("Load a track first."); return; }
  if(!mapReady){ alert("Map isn't ready yet — try again in a moment."); return; }
  const btn=document.getElementById("backfillElevBtn");
  btn.disabled=true; btn.textContent="Looking up elevation…";
  map.setTerrain({source:"terrain-dem",exaggeration:1});
  map.once("idle",()=>{
    let got=0;
    const withElev=basePoints.map(p=>{
      const e=map.queryTerrainElevation([p[0],p[1]]);
      if(e!=null) got++;
      return [p[0],p[1],e!=null?Math.round(e):null,p[3]];
    });
    map.setTerrain(null);
    btn.disabled=false; btn.textContent="Backfill Elevation from Terrain";
    if(!got){ alert("Couldn't look up elevation for this track — the terrain tiles may not have finished loading. Try again."); return; }
    // Hold-nearest-known fill (forward then back) for any point the DEM
    // couldn't cover — usually just the edge of the loaded tile set — same
    // gap-holding idea as field-recorder.html's smoothElevation(), so the
    // chart never shows a sudden drop to "no data" mid-track.
    let lastKnown=null;
    for(const p of withElev){ if(p[2]!=null) lastKnown=p[2]; else if(lastKnown!=null) p[2]=lastKnown; }
    lastKnown=null;
    for(let i=withElev.length-1;i>=0;i--){ const p=withElev[i]; if(p[2]!=null) lastKnown=p[2]; else if(lastKnown!=null) p[2]=lastKnown; }
    setBase(withElev);
    alert("Backfilled elevation for "+got+" of "+withElev.length+" points.");
  });
};

/* ---- labels ---- */
function fmtElev(v){ return v==null ? "—" : Math.round(v)+" m"; }
function updateLabels(){
  document.getElementById("startElev").textContent = points.length ? fmtElev(points[0][2]) : "—";
  document.getElementById("endElev").textContent = points.length ? fmtElev(points[points.length-1][2]) : "—";
  const hasElev = points.some(p=>p[2]!=null);
  document.getElementById("totalGain").textContent = hasElev ? ("▲ "+Math.round(cumGain[cumGain.length-1]||0)+" m gain") : "—";
}

/* ---- elevation-vs-distance chart (hand-rolled inline SVG — no chart
   library exists anywhere in this codebase, consistent with the app's
   no-external-dependency convention for its own hand-rolled UI, e.g.
   pipeline-editor.html's node canvas). ---- */
function renderChart(){
  const svg=document.getElementById("chartSvg"), empty=document.getElementById("chartEmpty");
  const hasElev = points.length>1 && points.some(p=>p[2]!=null);
  empty.style.display = hasElev ? "none" : "flex";
  if(!hasElev){ svg.innerHTML=""; return; }
  const W=1000,H=140,pad=6;
  const totalDist = cumLens[cumLens.length-1]||1;
  let minE=Infinity,maxE=-Infinity;
  for(const p of points){ if(p[2]!=null){ if(p[2]<minE)minE=p[2]; if(p[2]>maxE)maxE=p[2]; } }
  if(minE===maxE){ minE-=1; maxE+=1; }
  const xAt=i=>pad+(cumLens[i]/totalDist)*(W-2*pad);
  const yAt=e=>H-pad-((e-minE)/(maxE-minE))*(H-2*pad);
  let lastY=H-pad, d="";
  points.forEach((p,i)=>{
    const x=xAt(i), y=p[2]!=null?yAt(p[2]):lastY;
    d += (i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1)+" ";
    lastY=y;
  });
  svg.innerHTML =
    '<rect id="chartSelBand" x="0" y="0" width="0" height="'+H+'" fill="#ffd23d" opacity="0.15"></rect>'+
    '<path d="'+d+'" fill="none" stroke="#ff6a3d" stroke-width="2"></path>'+
    '<line id="chartSelStart" x1="0" y1="0" x2="0" y2="'+H+'" stroke="#ffd23d" stroke-width="2" stroke-dasharray="4,3"></line>'+
    '<line id="chartSelEnd" x1="0" y1="0" x2="0" y2="'+H+'" stroke="#ff3b30" stroke-width="2" stroke-dasharray="4,3"></line>'+
    '<line id="chartPlayhead" x1="0" y1="0" x2="0" y2="'+H+'" stroke="#38e0a6" stroke-width="2"></line>';
}
function moveChartPlayhead(idx){
  const line=document.getElementById("chartPlayhead"); if(!line) return;
  const total=cumLens[cumLens.length-1]||1;
  const x=6+(cumLens[idx]/total)*(1000-12);
  line.setAttribute("x1",x); line.setAttribute("x2",x);
}
// Trim/Delete selection playhead — mirrors moveChartPlayhead()'s x-mapping so
// the dashed start/end lines + shaded band line up exactly with the main
// elevation curve regardless of window width (viewBox is a fixed 1000x140).
function moveChartSel(i0,i1){
  const s0=document.getElementById("chartSelStart"), s1=document.getElementById("chartSelEnd"), band=document.getElementById("chartSelBand");
  if(!s0||!s1||!band) return;
  const total=cumLens[cumLens.length-1]||1;
  const xAt=idx=>6+(cumLens[idx]/total)*(1000-12);
  const x0=xAt(i0), x1=xAt(i1);
  s0.setAttribute("x1",x0); s0.setAttribute("x2",x0);
  s1.setAttribute("x1",x1); s1.setAttribute("x2",x1);
  band.setAttribute("x",Math.min(x0,x1)); band.setAttribute("width",Math.max(1,Math.abs(x1-x0)));
}

/* ---- map ---- */
const map=new maplibregl.Map({
  container:"map",
  style:{version:8,
    sources:{base:{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"],tileSize:256,attribution:"Esri"}},
    layers:[{id:"base",type:"raster",source:"base"}]},
  center:[-117.0547,51.3027], zoom:12
});
map.addControl(new maplibregl.NavigationControl());
map.on("load",()=>{
  mapReady=true;
  // A resize() requested while the map was still mid-initialization (style/
  // sprite/glyphs not yet loaded) is deferred here rather than dropped —
  // see showGpxScreen()'s comment for why resize() is needed at all.
  if(resizePending){ resizePending=false; map.resize(); }
  // Terrain DEM source for the Backfill Elevation button below — same free
  // Terrarium tile convention already used in fence-editor.html/
  // geofence-sim.html/geofence-engine.html/field-recorder.html/record.html.
  // Not set as the active terrain by default (setTerrain() below is only
  // called for the duration of a backfill query, then cleared right after)
  // — this file has no 3D/tilt mode, so the map should never visibly tilt.
  map.addSource("terrain-dem",{type:"raster-dem",
    tiles:["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
    tileSize:256,encoding:"terrarium",maxzoom:15});
  scheduleRenderMapLine();
});

function renderMapLine(){
  if(!mapReady) return;
  const coords=points.map(p=>[p[0],p[1]]);
  // A LineString needs >=2 positions — under that, use an empty
  // FeatureCollection instead so MapLibre never sees an invalid geometry.
  const geojson = coords.length>=2
    ? {type:"Feature",geometry:{type:"LineString",coordinates:coords}}
    : {type:"FeatureCollection",features:[]};
  if(map.getSource("track")) map.getSource("track").setData(geojson);
  else{
    map.addSource("track",{type:"geojson",data:geojson});
    map.addLayer({id:"track-line",type:"line",source:"track",paint:{"line-color":"#ff6a3d","line-width":4}});
  }
  if(coords.length){
    // setLngLat() before addTo(), not after — a fresh Marker's _lngLat is
    // undefined until setLngLat() is called (MapLibre never defaults it in
    // the constructor), but addTo() synchronously runs its own internal
    // _update() immediately (marker.ts) to position the DOM element, which
    // calls smartWrap(this._lngLat, ...) — with _lngLat still undefined at
    // that point, smartWrap's very first line (`new LngLat(lngLat.lng,
    // lngLat.lat)`) threw "Cannot read properties of undefined (reading
    // 'lng')" (smart_wrap.ts), uncaught, aborting the rest of this function
    // — which is why fitBounds() below never ran and the view never fit the
    // track. Confirmed against the actual v5.24.0 source (marker.ts:358
    // calls _update() at the end of addTo(), before this file's own
    // setLngLat() call ever got a chance to run). MapLibre's own docs show
    // the correct order: new Marker().setLngLat(...).addTo(map).
    if(!playheadMarker) playheadMarker=new maplibregl.Marker({color:"#38e0a6"}).setLngLat(coords[0]).addTo(map);
    else playheadMarker.setLngLat(coords[0]);
  } else if(playheadMarker){
    playheadMarker.remove(); playheadMarker=null;
  }
  if(bounds && isFinite(bounds.minLon) && (bounds.minLon!==bounds.maxLon || bounds.minLat!==bounds.maxLat)){
    // animate:false alone does NOT make fitBounds synchronous — confirmed by
    // reading MapLibre 5.24.0's own source (camera.ts): fitBounds()'s
    // internal _fitInternal() picks easeTo() vs flyTo() based on
    // options.linear, NOT options.animate — without linear:true it always
    // calls flyTo(), and flyTo() ignores the animate option entirely (it
    // only special-cases prefers-reduced-motion). So every "instant" jump
    // here was actually a real multi-frame flyTo animation with a nonzero
    // duration computed from its van-Wijk flight-curve math. Opening a
    // second track (or the same one again) before that flight finished
    // started an overlapping flyTo on the same camera/render-task-queue
    // state — that collision is the actual source of the
    // "Attempting to run(), but is already running" (map.ts) /
    // "Cannot read properties of undefined (reading 'lng')" (smart_wrap.ts)
    // flood, and since that internal task queue's "currently running" flag
    // never resets once it throws mid-run, every frame after that first
    // collision throws too — permanently freezing the map until reload.
    // linear:true forces the easeTo() path instead, where animate:false
    // genuinely sets duration=0 (a true single-frame jump, no flight-curve
    // math, nothing left in flight for a later call to collide with).
    map.fitBounds([[bounds.minLon,bounds.minLat],[bounds.maxLon,bounds.maxLat]],{padding:50,animate:false,linear:true});
  } else if(coords.length===1){
    map.flyTo({center:coords[0],zoom:15});
  }
  updateSelVisuals();
}

/* ---- trim/delete selection playhead (map side) — a highlighted sub-line
   plus start/end markers so dragging the Trim/Delete range sliders shows
   exactly which points are selected, instead of editing blind. Mirrors the
   chart-side moveChartSel() above. ---- */
let selStartMarker=null, selEndMarker=null;
function ensureSelLayer(){
  if(!mapReady || map.getSource("trimSel")) return;
  map.addSource("trimSel",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  // Draw below the main track line (thicker + translucent) so it reads as a
  // highlighted stretch of the same line rather than a separate track.
  const before = map.getLayer("track-line") ? "track-line" : undefined;
  map.addLayer({id:"trimSel-line",type:"line",source:"trimSel",paint:{"line-color":"#ffd23d","line-width":9,"line-opacity":0.45}}, before);
}
function moveMapSel(i0,i1){
  if(!mapReady) return;
  if(points.length<2){
    if(map.getSource("trimSel")) map.getSource("trimSel").setData({type:"FeatureCollection",features:[]});
    if(selStartMarker){ selStartMarker.remove(); selStartMarker=null; }
    if(selEndMarker){ selEndMarker.remove(); selEndMarker=null; }
    return;
  }
  ensureSelLayer();
  const seg=points.slice(i0,i1+1).map(p=>[p[0],p[1]]);
  const geojson = seg.length>=2 ? {type:"Feature",geometry:{type:"LineString",coordinates:seg}} : {type:"FeatureCollection",features:[]};
  map.getSource("trimSel").setData(geojson);
  const p0=points[i0], p1=points[i1];
  if(!p0||!p1) return;
  // setLngLat() before addTo() — see the identical comment above on
  // playheadMarker for why the order matters (uninitialized _lngLat crash).
  if(!selStartMarker) selStartMarker=new maplibregl.Marker({color:"#ffd23d"}).setLngLat([p0[0],p0[1]]).addTo(map);
  else selStartMarker.setLngLat([p0[0],p0[1]]);
  if(!selEndMarker) selEndMarker=new maplibregl.Marker({color:"#ff3b30"}).setLngLat([p1[0],p1[1]]).addTo(map);
  else selEndMarker.setLngLat([p1[0],p1[1]]);
}

/* ---- scrubber ---- */
function idxAtFraction(frac){
  if(points.length<2) return 0;
  const target=frac*(cumLens[cumLens.length-1]||0);
  let lo=0,hi=cumLens.length-1;
  while(lo<hi){ const mid=(lo+hi)>>1; if(cumLens[mid]<target) lo=mid+1; else hi=mid; }
  return lo;
}
function fractionAtIdx(idx){ const total=cumLens[cumLens.length-1]||1; return (cumLens[idx]||0)/total; }
function positionScrubberFromIdx(idx){
  if(!points.length) return;
  idx=Math.max(0,Math.min(points.length-1,idx));
  const range=document.getElementById("scrubRange");
  range.value = Math.round(fractionAtIdx(idx)*1000);
  updateScrubberUI(idx);
}
function updateScrubberUI(idx){
  const p=points[idx]; if(!p) return;
  document.getElementById("scrubKm").textContent = (cumLens[idx]/1000).toFixed(2)+" km";
  document.getElementById("scrubElev").textContent = fmtElev(p[2]);
  if(playheadMarker) playheadMarker.setLngLat([p[0],p[1]]);
  moveChartPlayhead(idx);
}
document.getElementById("scrubRange").min="0";
document.getElementById("scrubRange").max="1000";
document.getElementById("scrubRange").oninput=e=>{
  const idx=idxAtFraction((+e.target.value)/1000);
  updateScrubberUI(idx);
};

/* ---- trim / delete selection ---- */
function updateTrimUI(){
  const s0=document.getElementById("selStart"), s1=document.getElementById("selEnd");
  const maxIdx=Math.max(0,points.length-1);
  s0.max=maxIdx; s1.max=maxIdx;
  s0.value=0; s1.value=maxIdx;
  updateSelVisuals();
}
function selRange(){
  const s0=document.getElementById("selStart"), s1=document.getElementById("selEnd");
  let i0=+s0.value, i1=+s1.value;
  if(i0>i1){ const t=i0; i0=i1; i1=t; }
  return {i0,i1};
}
function updateSelStats(){
  const {i0,i1}=selRange();
  const distKm = points.length ? ((cumLens[i1]-cumLens[i0])/1000).toFixed(2) : "0.00";
  document.getElementById("selStats").textContent = (i1-i0+1)+" pts selected · "+distKm+" km";
}
// The Trim/Delete range sliders had no visual feedback at all — dragging
// them gave no indication of where those points actually are. This ties the
// stats text, the chart's dashed start/end lines + shaded band, and a
// highlighted map sub-line + two colored markers all to the same selection,
// same pattern as the main scrubber's updateScrubberUI().
function updateSelVisuals(){
  updateSelStats();
  const {i0,i1}=selRange();
  moveChartSel(i0,i1);
  moveMapSel(i0,i1);
}
document.getElementById("selStart").oninput=updateSelVisuals;
document.getElementById("selEnd").oninput=updateSelVisuals;
document.getElementById("trimBtn").onclick=()=>{
  const {i0,i1}=selRange();
  if(i0<=0 && i1>=points.length-1) return; // nothing outside the selection to trim
  setBase(points.slice(i0,i1+1));
};
document.getElementById("deleteBtn").onclick=()=>{
  const {i0,i1}=selRange();
  const remaining=points.slice(0,i0).concat(points.slice(i1+1));
  if(remaining.length<2){ alert("Can't delete — at least 2 points must remain."); return; }
  setBase(remaining);
};

/* ---- reverse direction ---- */
// Timestamps travel WITH each point, not with array position — reversing
// point order without clearing them would leave every consecutive dt
// negative (the filter's dt<=0 guard would then drop nearly everything).
// Direction reversal genuinely invalidates the recorded timing anyway (you
// didn't walk it that direction), so timestamps are dropped and the filter
// disables itself (via refreshActive()'s own availability check) until the
// next import.
document.getElementById("reverseBtn").onclick=()=>{
  if(points.length<2) return;
  setBase(points.slice().reverse().map(p=>[p[0],p[1],p[2],null]));
};

/* ---- undo last structural edit (Trim/Delete/Reverse) ---- */
document.getElementById("undoBtn").onclick=undoEdit;

/* ---- import from Downloads ---- */
document.getElementById("importBtn").onclick=()=>document.getElementById("importInput").click();
document.getElementById("importInput").onchange=async()=>{
  const input=document.getElementById("importInput");
  const f=input.files[0]; input.value="";
  if(!f) return;
  try{
    const text=await f.text();
    const {points:parsed}=parseGPX(text);
    loadedFrom=null;
    setBase(parsed, {resetHistory:true});
  }catch(e){ alert("Import failed: "+e.message); }
};

/* ---- open an existing tree item (a corridor row). ---- */
async function openTreeItem(item){
  try{
    const r=await fetch("/api/corridor/"+item.id,{headers:{authorization:"Bearer "+getToken()}});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||r.statusText);
    const j=await r.json();
    const pts=(j.points||[]).map(p=>[p[0],p[1],p[2]==null?null:p[2],null]);
    if(pts.length<2){ alert("This corridor doesn't have enough points."); return; }
    loadedFrom={kind:"corridor", id:item.id, name:j.name, widthM:j.widthM};
    updateHdrCrumb();
    updateWidthBtn();
    setBase(pts, {resetHistory:true});
  }catch(e){ alert("Open failed: "+e.message); }
}
function updateHdrCrumb(){
  if(!loadedFrom) return;
  document.getElementById("hdrCrumb").textContent = loadedFrom.name;
}
function updateWidthBtn(){
  const btn=document.getElementById("widthBtn");
  btn.disabled = !loadedFrom;
  btn.textContent = "⌀ "+(loadedFrom&&loadedFrom.widthM!=null ? "Width: "+loadedFrom.widthM+"m…" : "Width…");
}

/* ---- tree mount ---- */
const gpxTree=CorridorTree.mount(document.getElementById("gpxTreeHost"),{
  appId:null,
  getToken,
  readOnly:false,
  onError:msg=>alert(msg),
  onPick: openTreeItem
});
document.getElementById("treeRefreshBtn").onclick=()=>gpxTree.refresh({appId});

/* ---- save ---- */
function currentTotals(){
  return { distanceM: cumLens[cumLens.length-1]||0, elevGainM: cumGain[cumGain.length-1]||0, elevLossM: cumLoss[cumLoss.length-1]||0 };
}
async function patchJson(url, body){
  const r=await fetch(url,{method:"PATCH",headers:{authorization:"Bearer "+getToken(),"content-type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||r.statusText);
  return r.json();
}
async function postJson(url, body){
  const r=await fetch(url,{method:"POST",headers:{authorization:"Bearer "+getToken(),"content-type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||r.statusText);
  return r.json();
}
document.getElementById("saveBtn").onclick=async()=>{
  if(!loadedFrom) return;
  const {distanceM,elevGainM,elevLossM}=currentTotals();
  const flatPoints=points.map(p=>[p[0],p[1],p[2]]);
  try{
    await patchJson("/api/corridor/"+loadedFrom.id,{points:flatPoints,distanceM,elevGainM,elevLossM});
    gpxTree.refresh({appId});
    alert("Saved.");
  }catch(e){ alert("Save failed: "+e.message); }
};
// Save As… — one name prompt plus an optional width prompt (every corridor
// has a width; blank keeps the default 10 m trigger band).
document.getElementById("saveAsBtn").onclick=async()=>{
  if(!appId){ alert("Pick a company and project first."); return; }
  if(points.length<2) return;
  const name=(prompt("Name this corridor:", (loadedFrom&&loadedFrom.name)||"")||"").trim();
  if(!name) return;
  const widthStr=(prompt("Trigger-band width in meters (blank = 10):", loadedFrom&&loadedFrom.widthM!=null?String(loadedFrom.widthM):"")||"").trim();
  const widthM=widthStr?(+widthStr||10):10;
  const target=gpxTree.getUploadTarget();
  const folderId = target ? target.folderId : null;
  const {distanceM,elevGainM,elevLossM}=currentTotals();
  try{
    const j=await postJson("/api/corridor",{appId,name,points:points.map(p=>[p[0],p[1],p[2]]),folderId,widthM,distanceM,elevGainM,elevLossM});
    loadedFrom={kind:"corridor", id:j.id, name, widthM};
    updateHdrCrumb();
    updateWidthBtn();
    document.getElementById("saveBtn").disabled=false;
    gpxTree.refresh({appId});
  }catch(e){ alert("Save failed: "+e.message); }
};
// Change the trigger-band width of the currently loaded corridor in place.
document.getElementById("widthBtn").onclick=async()=>{
  if(!loadedFrom) return;
  const widthStr=(prompt("Trigger-band width in meters (blank = 10):", loadedFrom.widthM!=null?String(loadedFrom.widthM):"")||"").trim();
  const widthM=widthStr?(+widthStr||10):10;
  try{
    await patchJson("/api/corridor/"+loadedFrom.id,{widthM});
    loadedFrom.widthM=widthM;
    updateHdrCrumb();
    updateWidthBtn();
    gpxTree.refresh({appId});
  }catch(e){ alert("Save failed: "+e.message); }
};

/* ---- project/app resolution — corridor is app-scoped (not
   project-scoped), same as fence-editor.html's afAppId();
   a project only needs to be selected to resolve which app owns the
   library, matching record.html's own project-gated screen pattern. ---- */
function showGpxScreen(){
  document.getElementById("noProjectHint").style.display="none";
  document.getElementById("gpxScreen").classList.add("show");
  // The map is constructed at page-load time (see `const map=new
  // maplibregl.Map(...)` above), while #gpxScreen — its container's
  // ancestor — is still display:none by default. MapLibre reads the
  // container's box at construction time, so it initializes against a 0x0
  // element; tiles still paint on a later redraw, but the internal
  // pan/zoom transform stays wrong until an explicit resize() runs against
  // the now-visible box. Without this, drag-to-pan and scroll-wheel zoom
  // silently compute against the stale 0x0 transform — confirmed live
  // (2026-08-21): map tiles rendered fine, but neither gesture worked.
  // requestAnimationFrame so the .show class's layout change has actually
  // reflowed before resize() reads the container's real size.
  //
  // Confirmed live (2026-08-21): calling resize() before the map's own
  // "load" event has fired (style/sprite/glyphs still initializing) was
  // triggering an internal MapLibre reentrancy error ("Attempting to run(),
  // but is already running", task_queue.ts) that left the map blank and
  // uninteractive — resize() collided with the map's own in-flight init
  // work. If the map isn't ready yet, defer the resize itself to the
  // "load" handler (see map.on("load",...) above) instead of firing it
  // early.
  if(mapReady) requestAnimationFrame(()=>map.resize());
  else resizePending=true;
}
function showNoProject(){
  document.getElementById("noProjectHint").style.display="block";
  document.getElementById("gpxScreen").classList.remove("show");
  document.getElementById("scrubBar").classList.remove("show");
}
async function resolveAppIdFallback(id){
  try{
    const r=await fetch("/api/projects?org="+encodeURIComponent(currentOrg()),{headers:{authorization:"Bearer "+getToken()}});
    const j=r.ok?await r.json():{projects:[]};
    const p=(j.projects||[]).find(x=>x.id===id);
    if(p&&p.appId) return p.appId;
  }catch(e){}
  return null;
}
async function enterProject(id, proj){
  appId = (proj && proj.appId) || null;
  if(!appId) appId = await resolveAppIdFallback(id);
  document.getElementById("hdrCrumb").textContent = (proj&&proj.name)||id;
  loadedFrom=null;
  setBase([], {resetHistory:true});
  showGpxScreen();
  if(!appId){ document.getElementById("gpxTreeHost").innerHTML='<div class="hint">couldn\'t determine this project\'s workspace</div>'; return; }
  gpxTree.refresh({appId});
}

if(window.TopNav){
  TopNav.init({
    navEl: document.getElementById("topNav"),
    active: "gpx",
    onCompanyChange: ()=>{ appId=null; showNoProject(); },
    onProjectChange: (id, proj)=>{ if(id) enterProject(id, proj); else showNoProject(); }
  });
}
const _initialProjectId = window.TopNav && TopNav.resolveProject && TopNav.resolveProject();
if(_initialProjectId) enterProject(_initialProjectId, null);
else showNoProject();
</script>
</body>
