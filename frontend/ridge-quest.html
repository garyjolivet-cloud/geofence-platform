    });
  }else{
    map.on("click","runLines-hit",e=>showRunPopup(e.features&&e.features[0], e.lngLat)); // long-press.js not loaded — fall back to tap-only
  }
  map.on("mouseenter","runLines-hit",()=>{ map.getCanvas().style.cursor="pointer"; });
  map.on("mouseleave","runLines-hit",()=>{ map.getCanvas().style.cursor=""; });

  // First-run discoverability hint — only once, only when nothing is armed
  // yet (an experienced rider who already has a chute armed doesn't need
  // reminding every time they open the map).
  if(!Quest.guardedCorridors.size && !localStorage.getItem("rq.guardHintShown")){
    try{ localStorage.setItem("rq.guardHintShown","1"); }catch(e){}
    setTimeout(()=>rqToast("Press and hold a run to have Corridor Guard watch it"), 1200);
  }
}

function renderFogMap(){
  if(!Quest.ref){
    app.innerHTML =
      '<div class="fogMapOverlay"><button class="ghost fogMapBack" id="fogBack">← Back</button>'
      +'<div class="msg" style="padding-top:120px">Map isn’t available yet — this resort’s runs haven’t been configured.</div></div>';
    document.getElementById("fogBack").onclick=()=>{ Quest.onPosition=null; renderHome(); };
    return;
  }
  // Live friends layer state — the ≤RQ_MAX_TRACK checked in the Friends
  // screen, polled every 5s. Declared out here so the #fogBack handler
  // (bound before the map, on purpose — see below) can tear them down.
  let friendPoll=null;
  const friendMarkers=new Map(); // playerId -> maplibregl.Marker (name label)
  // Held so the #fogBack handler (bound before the map exists) can call
  // map.remove() on the way out — the map is heavier with DEM terrain and a
  // fresh one is built every time "My map" opens.
  let mapInstance=null;
  // DeviceHeading.onChange unsubscribe — declared out here so the #fogBack
  // handler (bound before the map) can call it; reassigned once the marker exists.
  let _unbindHeading = function(){};
  const use3D = !!Quest.threeDEnabled;
  const winter = Quest.season === "winter"; // uniform trigger across every map view
  // R11 — completion % is a number derived from tracking (Quest.fogCells),
  // not a fog VISUAL — deliberately NOT gated behind RQ_FOG_ENABLED the way
  // the legend below is, matching R5's own contract that fog tracking never
  // stops, only the shroud/hex drawing does. Both sets are already loaded
  // by the time this screen can even be reached (Home awaits them before
  // "My map" is clickable), so this is a plain sync call, no fetch needed.
  const previewCells = corridorPreviewCells();
  const completionPct = questCompletionPct(previewCells, Quest.fogCells);
  app.innerHTML =
    '<div class="fogMapOverlay"><div id="fogMap"></div>'
    +'<button class="ghost fogMapBack" id="fogBack">← Back</button>'
    +(use3D ? '<button class="ghost fogMapTilt" id="fogTilt">3D</button>' : '')
    +'<button class="ghost fogMapRecenter" id="fogRecenter" style="top:'+(use3D?102:58)+'px;display:none" title="Recenter map on your location">⌖</button>'
    +'<button class="ghost fogMapBattery" id="fogBattery" title="Battery Saver — pauses 3D/compass while riding a lift. Tap to cycle Auto/On/Off.">🔋 Auto</button>'
    +(completionPct!=null ? '<div class="fogMapLegend" style="left:auto;right:14px">'+Math.round(completionPct*100)+'% explored</div>' : '')
    +(RQ_FOG_ENABLED ? '<div class="fogMapLegend"><span><i style="background:var(--go)"></i>Skied</span><span><i style="background:var(--ice)"></i>Seen</span><span><i style="background:var(--ice);opacity:.3"></i>Trail map</span></div>' : '')
    +'</div>';
  // Bind Back FIRST, before anything that can throw (maplibregl failing to
  // load over a spotty connection, WebGL unavailable, etc.) — otherwise an
  // exception here aborts the script before the button's handler is ever
  // attached, leaving a dead "← Back" button with no way out of the map.
  document.getElementById("fogBack").onclick=()=>{
    Quest.onFogUpdated=null; Quest.onPosition=null;
    Quest.onLiftModeChange=null;
    _unbindHeading();
    // Battery (2026-09-17) — this screen is the only place device heading is
    // ever actually shown (the arrow wedge / compass-mode bearing); nothing
    // on Home reads it. Stop the sensor here so it doesn't keep being read
    // and smoothed for the rest of the session just because tracking is
    // still on. Re-started below on the way back in.
    if(window.DeviceHeading) DeviceHeading.stop();
    if(friendPoll){ clearInterval(friendPoll); friendPoll=null; }
    friendMarkers.forEach(m=>m.remove()); friendMarkers.clear();
    if(mapInstance){ try{ mapInstance.remove(); }catch(e){} mapInstance=null; }
    renderHome();
  };
  try{
    // If the splash just played, open exactly where its flyby ended
    // instead of the usual whole-network framing below — otherwise "My
    // map" feels like an abrupt jump right after the splash. Reused for
    // every "My map" open this session, not just the first.
    const map = new maplibregl.Map(Object.assign({
      container:"fogMap",
      style:{ version:8,
        sources:{ base:{ type:"raster",
          tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
          tileSize:256, attribution:"Esri, Maxar" } },
        layers:[{ id:"base", type:"raster", source:"base" }] },
      center:[Quest.ref[1], Quest.ref[0]], zoom:13,
      maxBounds: questPanBounds() || undefined
    }, _splashEndCamera ? { center:_splashEndCamera.center, zoom:_splashEndCamera.zoom, pitch:_splashEndCamera.pitch, bearing:_splashEndCamera.bearing } : {}));
    mapInstance = map;
    if(!_splashEndCamera){
      const initialBounds = questMapBounds();
      if(initialBounds) map.fitBounds(initialBounds, { padding:70, maxZoom:17, duration:0 });
    }
    // 3D terrain (workspace flag) — OFF by default (battery, 2026-09-17).
    // MapLibre's terrain mode forces a continuous per-frame WebGL repaint
    // for as long as it's on, even sitting idle (needed to keep re-sampling
    // elevation for hillshading) — real, ongoing GPU/battery cost regardless
    // of whether anyone's actively looking at the relief. Previously auto-
    // enabled (DEM + sky + forced pitch) the instant this screen opened, for
    // every visitor, whether they wanted the 3D look or not. Now opt-in via
    // #fogTilt, which the workspace flag still gates (no button, no terrain,
    // for a workspace that never authored 3D support at all).
    const reducedMotionQ = (()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } })();
    let terrainOn = false;
    let userWantsTerrain = false; // the rider's own #fogTilt choice, separate from terrainOn's "what the map is actually showing right now" — Battery Saver pauses/resumes terrainOn without touching this, so leaving a lift restores whatever the rider actually chose
    const tiltBtn = document.getElementById("fogTilt");
    function setTerrainOn(on){
      // setTerrain()/addSource() throw if the style isn't loaded yet — the
      // splash-camera path below can call this before "load" has fired
      // (right after the map's own construction), so defer rather than
      // assume; a button click happens well after load in practice, but
      // isStyleLoaded() makes that an actual guarantee instead of a hope.
      const run = ()=>{
        terrainOn = on;
        Terrain3D.setEnabled(map, on, { sky:true });
        if(on){
          map.easeTo({ pitch:60, duration: reducedMotionQ ? 0 : 700 });
          // The winter DEM hillshade/snowline layers (applyWinter's opts.dem
          // branch) silently no-op until the DEM source actually exists —
          // harmless when terrain was never turned on, but means a re-call
          // is needed now that it just was, or winter mode never gets its
          // relief shading for a visitor who opts into 3D after the map's
          // already open.
          if(winter) Terrain3D.applyWinter(map, { dem:true });
        }
        if(tiltBtn) tiltBtn.textContent = on ? "2D" : "3D";
      };
      if(map.isStyleLoaded && map.isStyleLoaded()) run(); else map.once("load", run);
    }
    if(use3D && tiltBtn){
      tiltBtn.textContent = "3D";
      tiltBtn.onclick = ()=>{ userWantsTerrain = !terrainOn; setTerrainOn(userWantsTerrain); };
      // _splashEndCamera already opened the map at a real pitched/terrain
      // camera as part of the splash flyby — matching that with actual
      // terrain (not just an empty pitched view over the flat basemap) is
      // the one case still worth defaulting on, since the visual it's
      // already showing needs it, not a fresh choice made on this visitor's
      // behalf.
      if(_splashEndCamera){ userWantsTerrain = true; setTerrainOn(true); }
    }

    // Battery Saver ("lift mode") — override button + pause/resume wiring.
    // Always shown (unlike #fogTilt) since it also pauses the compass and
    // Chute Guard's sync poll, useful even for a workspace with 3D off.
    const batteryBtn = document.getElementById("fogBattery");
    // The override button only ever showed the MODE (Auto/On/Off), not
    // whether Battery Saver is actually doing anything right now — with only
    // a ~3s toast marking the moment it engages, there was no way to glance
    // at the screen mid-ride and confirm it's live (real field confusion,
    // 2026-09-20: "still tracking while on Catamount" — tracking itself was
    // never supposed to change, see _onFix()'s own comment on GPS being left
    // alone, but there was no persistent way to see anything HAD changed
    // either). Now appends "· Saving" whenever Quest.liftModeActive is true,
    // in Auto mode too, so engagement is verifiable at a glance, not just at
    // the instant the toast happened to be visible.
    function renderBatteryBtn(){
      if(!batteryBtn) return;
      const mode = Quest.liftModeOverride==="on" ? "On" : Quest.liftModeOverride==="off" ? "Off" : "Auto";
      batteryBtn.textContent = "🔋 " + mode + (Quest.liftModeActive ? " · Saving" : "");
    }
    renderBatteryBtn();
    if(batteryBtn) batteryBtn.onclick = ()=>{
      const next = Quest.liftModeOverride==="auto" ? "on" : Quest.liftModeOverride==="on" ? "off" : "auto";
      Quest.setLiftModeOverride(next);
      renderBatteryBtn();
    };
    // Only true while Battery Saver itself is the reason terrain got turned
    // off — without this, the resume branch below would call setTerrainOn()
    // (which forces pitch:0 via an easeTo) unconditionally on every lift
    // disengage, even for a workspace with 3D never enabled, or a rider who
    // manually pitched the map some other way — neither of those has
    // anything to do with Battery Saver and shouldn't be touched by it.
    let terrainPausedByBattery = false;
    Quest.onLiftModeChange = (active)=>{
      if(active){
        if(terrainOn){ terrainPausedByBattery = true; setTerrainOn(false); }
        if(window.DeviceHeading) DeviceHeading.stop();
      }else{
        if(terrainPausedByBattery){ terrainPausedByBattery = false; setTerrainOn(userWantsTerrain); }
        if(window.DeviceHeading) DeviceHeading.start();
      }
      renderBatteryBtn();
    };
    // Pick up whatever liftModeActive already is (e.g. override is "on" from
    // a previous session, or the rider re-opened "My map" mid-lift-ride) —
    // fire the same pause/resume logic once up front instead of waiting for
    // the next fix to happen to change it.
    if(Quest.liftModeActive) Quest.onLiftModeChange(true);
    function syncSource(){
      const shroudSrc = map.getSource("shroud");
      if(shroudSrc) shroudSrc.setData(shroudFeatureCollection());
      const src = map.getSource("fog");
      if(src) src.setData(fogFeatureCollection());
    }
    map.on("load", ()=>{
      // Named peak reference labels — independent of fog/tile-art mode
      // (unlike drawAllRuns()'s run-network overlay below, these are always
      // useful orientation context regardless of how the resort's own runs
      // are rendered).
      drawNamedPeaks(map);
      // R5 — admin-gated: fogFeatureCollection()/shroudFeatureCollection()
      // stay pure/untouched either way (Quest.fogCells itself is never
      // gated — only whether it gets DRAWN here is).
      if(!RQ_FOG_ENABLED){
        // Fog off: if tile art is ALSO off for this project, draw every run
        // as a labelled line + its activity ribbon graphic so the skier can
        // see the whole network. If tile art is on, leave the bare
        // satellite basemap (that path renders its own thing elsewhere).
        if(!Quest.tileArtEnabled) drawAllRuns(map);
        return;
      }
      // Shroud goes in FIRST (and its layer added first) so it paints
      // underneath the colored fog-fill/fog-line layers below.
      map.addSource("shroud", { type:"geojson", data: shroudFeatureCollection() });
      map.addLayer({ id:"shroud-fill", type:"fill", source:"shroud",
        paint:{ "fill-color":"#050810", "fill-opacity":0.72 } });
      // R10 — dim, always-on corridor-network outline, drawn ON TOP of the
      // shroud (so it's visible through the dark) but UNDER the real
      // fog-fill/fog-line below (so actually-earned progress stays the most
      // prominent thing on screen). Static for the life of this map screen —
      // Quest.corridors doesn't change mid-session, so unlike shroud/fog
      // this never needs a place in syncSource()'s live-redraw.
      map.addSource("corridorPreview", { type:"geojson", data: corridorPreviewFeatureCollection(previewCells) });
      map.addLayer({ id:"corridorPreview-fill", type:"fill", source:"corridorPreview",
        paint:{ "fill-color":"#8fb6d4", "fill-opacity":0.14 } });
      map.addLayer({ id:"corridorPreview-line", type:"line", source:"corridorPreview",
        paint:{ "line-color":"#8fb6d4", "line-width":1, "line-opacity":0.3 } });
      map.addSource("fog", { type:"geojson", data: fogFeatureCollection() });
      map.addLayer({ id:"fog-fill", type:"fill", source:"fog",
        paint:{ "fill-color":["match",["get","state"],2,"#38e0a6",1,"#8fb6d4","transparent"], "fill-opacity":0.5 } });
      map.addLayer({ id:"fog-line", type:"line", source:"fog",
        paint:{ "line-color":["match",["get","state"],2,"#38e0a6",1,"#8fb6d4","transparent"], "line-width":1.5, "line-opacity":0.8 } });
    });
    // Winter look for the ski map — GPU-cheap raster recolor + (in 3D) a DEM
    // hillshade / elevation snowline + a cool wash + faint grain, all static.
    // Registered LAST so shroud-fill / runLines-* already exist for the helper
    // to anchor beneath (it's defensive about ordering regardless).
    if(winter) map.on("load", ()=>{ Terrain3D.applyWinter(map, { dem: use3D }); });
    // Live redraw as new cells get revealed WHILE this screen is open
    // (tracking may already be running from Home) — cleared on back-out so
    // a later fix, after navigating away, doesn't try to touch a torn-down
    // map instance. Left null when fog is admin-disabled: there's no source
    // to sync into (map.on("load") returned early above), and Quest itself
    // keeps tracking regardless — this only controls the redraw callback.
    if(RQ_FOG_ENABLED) Quest.onFogUpdated = syncSource;
    // Live "you are here" directional avatar. follow:'edge' keeps the
    // fitBounds() run-network framing above and only re-centres if the player
    // walks off screen. Driven from _onFix -> Quest.onPosition (real fixes
    // and ?sim=1 "Simulate walk" both). Torn down by the #fogBack handler
    // nulling Quest.onPosition, same lifecycle as onFogUpdated.
    // Site gate: a fix >10 km outside the run network hides the avatar,
    // stops the map chasing it, and pauses fog reveal / corridor ticks /
    // position sharing (Quest._offsite, set in the onSite callback).
    const QBOUNDS = questContentBounds();
    const fogRecenterBtn = document.getElementById("fogRecenter");
    const here = HereMarker.attach(map, { follow:'edge',
      bounds: QBOUNDS, bufferM: 10000,
      onSite: (on, initial)=>{ Quest._offsite = !on; if(on && !initial) GPSFilter.reset(); },
      // Explicit lock + recenter button (battery/UX, 2026-09-17): the old
      // 2s-cooldown auto-follow snapped the map back to the GPS dot the
      // instant a fix landed after that window, even mid-scan for a distant
      // chute — outdoor fixes can be 15-20s apart, so the cooldown never
      // stood a chance of covering a real "looking around" pause. Now any
      // manual pan/zoom/rotate/pitch turns follow off for good until this
      // button is tapped.
      onFollowChange: following=>{ if(fogRecenterBtn) fogRecenterBtn.style.display = following ? "none" : "flex"; } });
    if(fogRecenterBtn) fogRecenterBtn.onclick = ()=> here.recenter();
    // Resume the sensor #fogBack stopped on the way out of a previous "My
    // map" visit (battery — see its own comment). Harmless no-op if it was
    // never granted in the first place, or if it's already running because
    // "Start tracking" primed it earlier this session and this is the very
    // first time My map has opened.
    if(window.DeviceHeading) DeviceHeading.start();
    // Auto-orientation (2026-09-19) — replaces the old manual "Compass
    // mode" toggle + MapLibre's stock NavigationControl (zoom/PTZ widget)
    // with fully automatic behavior: whenever no one is touching the map,
    // it rotates (bearing) to match the phone's own compass heading, so
    // whatever's drawn toward the top of the screen is genuinely in front
    // of the player — the "point your phone at a chute and see it's ahead
    // of you, not behind or to the side" use case a north-up map can't give
    // you. The instant a finger touches the map, full pan/zoom/rotate/pitch
    // gesture control hands back to the player (dragRotate etc. are never
    // disabled); auto-orient resumes on its own AUTO_RESUME_MS after every
    // finger lifts. Pan/zoom/pitch set by a gesture are never touched by
    // auto-orient — it only ever calls setBearing, so whatever the player
    // last set with their fingers (zoom level, pitch/tilt, pan position)
    // stays exactly as they left it through every future compass-driven
    // rotation, same as it already did for pan/zoom before this feature.
    let autoOrient = true;                 // on by default — no button to turn it on
    let orientResumeTimer = null;
    const AUTO_RESUME_MS = 2500;
    const activePointers = new Set();
    function disableAutoOrient(){
      if(orientResumeTimer){ clearTimeout(orientResumeTimer); orientResumeTimer=null; }
      autoOrient = false;
    }
    function scheduleOrientResume(){
      if(orientResumeTimer) clearTimeout(orientResumeTimer);
      orientResumeTimer = setTimeout(()=>{
        orientResumeTimer = null;
        autoOrient = true;
        map.easeTo({ bearing:(DeviceHeading.heading||0), duration:500 });
      }, AUTO_RESUME_MS);
    }
    // Raw pointer events (not MapLibre's dragstart/zoomstart/etc.) so even a
    // stationary tap — not just a drag/pinch — suspends auto-orient; those
    // semantic events only fire for an actual camera-changing gesture.
    // Never fired by our own programmatic easeTo/setBearing calls below, so
    // there's no feedback loop.
    const fogCanvas = map.getCanvasContainer();
    fogCanvas.addEventListener("pointerdown", e=>{ activePointers.add(e.pointerId); disableAutoOrient(); });
    ["pointerup","pointercancel"].forEach(ev=>fogCanvas.addEventListener(ev, e=>{
      activePointers.delete(e.pointerId);
      if(activePointers.size===0 && !autoOrient) scheduleOrientResume();
    }));
    // While auto-orient has the map pointed "which way I'm facing" by
    // construction, the avatar wedge pointing anywhere but straight up
    // would be redundant at best, misleading at worst (see setWedge()'s own
    // doc: it rotates true-north-relative, i.e. relative to a north-up map
    // specifically). 0 here means "straight up" in wedge terms.
    const wedgeHeadingFor = raw => autoOrient ? 0 : raw;
    // Real-time compass -> needle (gesture mode) or map bearing (auto-
    // orient), off the orientation event. This screen is rebuilt each time
    // "My map" opens, so _unbindHeading (declared above) is called in the
    // #fogBack teardown. h can be null on a device that never resolves a
    // heading (see device-heading.js) — applied only when present, never
    // coerced into setBearing/setHeading as null/NaN. Tilt (2nd arg) drives
    // only the DeviceHeading.tilt property for any future consumer — pitch
    // itself is gesture-only here, per the comment above.
    if(window.DeviceHeading) _unbindHeading = DeviceHeading.onChange(h=>{
      if(autoOrient && h!=null) map.setBearing(h);
      if(h!=null) here.setHeading(wedgeHeadingFor(h));
    });
    Quest.onPosition = p => here.update({ lon:p.lon, lat:p.lat,
      // Device compass (which way the phone points) when we have it, else
      // the GPS travel heading (which way you're moving) — wedgeHeadingFor
      // collapses to "straight up" instead when compass mode has already
      // pointed the whole map that way (see its own comment above).
      headingDeg:wedgeHeadingFor((window.DeviceHeading && DeviceHeading.heading!=null) ? DeviceHeading.heading : p.headingTravel),
      accM:p.acc });

    // --- Live friends ---------------------------------------------------
    // GET /api/presence/friends every 5s (same cadence as the tour
    // engine's walker poll). It only ever returns friends who are sharing
    // today AND fresh, and returns [] unless YOU'RE sharing too (strict
    // mutual, enforced server-side). We further keep just the ≤6 checked in
    // the Friends screen. Names are HTML markers, not a symbol layer — the
    // raster basemap has no glyphs (same reason drawAllRuns uses markers).
    const trackIds = getTrackFriends();
    if(trackIds.length){
      const FRIEND_COLORS = ["#ff6a3d","#38e0a6","#8fb6d4","#c9a4ff","#ffd166","#ff5d8f"];
      const colorFor = (id)=>{ let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0; return FRIEND_COLORS[h%FRIEND_COLORS.length]; };
      const STALE_MS = 45000;
      function drawFriends(list){
        // A friend is only drawn when THEY are inside the run network + 10 km
        // (same box as the self site gate).
        const fresh = (list||[]).filter(f=>trackIds.includes(f.playerId)
          && HereMarker.withinBounds(QBOUNDS, f.lat, f.lon));
        const now = Date.now();
        const src = map.getSource("friends");
        if(src) src.setData({ type:"FeatureCollection", features: fresh.map(f=>({
          type:"Feature",
          properties:{ color:colorFor(f.playerId), stale:(now-f.updatedAt > STALE_MS)?1:0 },
          geometry:{ type:"Point", coordinates:[f.lon, f.lat] }
        })) });
        const seen=new Set();
        fresh.forEach(f=>{
          seen.add(f.playerId);
          const ageMin = Math.floor((now-f.updatedAt)/60000);
          let m = friendMarkers.get(f.playerId);
          if(!m){
            const el=document.createElement("div"); el.className="friendLabel";
            m=new maplibregl.Marker({ element:el, anchor:"bottom", offset:[0,-9] });
            m.setLngLat([f.lon,f.lat]).addTo(map);
            friendMarkers.set(f.playerId, m);
          } else {
            m.setLngLat([f.lon,f.lat]);
          }
          const el=m.getElement();
          el.textContent = f.name + (ageMin>=1 ? ' · '+ageMin+'m ago' : '');
          el.style.color = colorFor(f.playerId);
          el.style.opacity = (now-f.updatedAt > STALE_MS) ? "0.4" : "1";
        });
        friendMarkers.forEach((m,id)=>{ if(!seen.has(id)){ m.remove(); friendMarkers.delete(id); } });
      }
      const pollFriends = async ()=>{
        try{ const j = await api("/api/presence/friends"); drawFriends(j.friends); }
        catch(e){ /* transient — next tick retries */ }
      };
      map.on("load", ()=>{
        if(!map.getSource("friends")){
          map.addSource("friends", { type:"geojson", data:{ type:"FeatureCollection", features:[] } });
          map.addLayer({ id:"friends-dot", type:"circle", source:"friends", paint:{
            "circle-radius":7,
            "circle-color":["get","color"],
            "circle-opacity":["case",["==",["get","stale"],1],0.35,0.95],
            "circle-stroke-width":2, "circle-stroke-color":"#0a1018"
          }});
        }
        pollFriends();
        if(!friendPoll) friendPoll = setInterval(pollFriends, 5000);
      });
    }
  }catch(e){
    document.getElementById("fogMap").outerHTML =
      '<div class="msg" style="padding-top:120px">Map couldn’t load (connection or device issue) — try again from a better signal.</div>';
  }
}

/* ============================== BOOT ============================== */
/* ============================ SPLASH (CPR Ridge flyby) ============================
   Plays once per page load, before boot()'s first real screen — a real
   MapLibre render (same Esri satellite + Terrarium DEM stack renderFogMap()
   uses, via Terrain3D). _splashPlayed guards against boot()'s several
   re-entries (after workspace/project pick, after login) replaying it
   mid-session — it must fire exactly once per page load, not once per
   boot() call.

   The flight itself is a chain of admin-authored camera keyframes
   (frontend/splash-flight.js, shared with the Fence Editor's "Splash
   Flyby" tool that captures them) — bundle.splashKeyframes, fetched
   before the splash starts (see boot()). Every project/resort gets its
   own: there is no single hardcoded default location any more — a
   project with no authored flight yet falls back to a plain push-in
   centered on THAT project's own bundle.ref (the same generic per-
   project "map center" reference point questContentBounds() etc.
   already use), not on any one specific resort. Reported live: the
   original fallback was hardcoded to Kicking Horse's own gondola
   coordinates, which centered the splash on the wrong mountain entirely
   for every other project. The fallback's pitch/zoom are deliberately
   conservative (near-overhead, no lateral movement) since — unlike a
   hand-tuned per-resort flight — there's no way to know this project's
   terrain is safe at a more dramatic angle; SPLASH_BASE/SPLASH_TOP below
   exist only as the very last resort, if a project has neither an
   authored flight NOR a ref point (bundle fetch failed entirely). */
const SPLASH_BASE = [-117.048466, 51.297713]; // [lon,lat] Kicking Horse gondola base — last-resort fallback only, see above
const SPLASH_TOP   = [-117.077867, 51.27508];  // Kicking Horse gondola top — same
function _splashLerpLL(u){ return [ SPLASH_BASE[0]+(SPLASH_TOP[0]-SPLASH_BASE[0])*u, SPLASH_BASE[1]+(SPLASH_TOP[1]-SPLASH_BASE[1])*u ]; }
// Holds the end-card (last frame + title) for this long before auto-
// advancing — Skip (bound for the whole overlay's lifetime, including
// this hold) still exits immediately regardless.
const SPLASH_END_CARD_MS = 15000;
function _splashFallbackKeyframes(refLonLat){
  const center = refLonLat || _splashLerpLL(0.85); // last resort — see header comment
  return [
    { lon:center[0], lat:center[1], zoom:11.8, pitch:28, bearing:0, ms:0 },
    { lon:center[0], lat:center[1], zoom:13.0, pitch:38, bearing:0, ms:2500 }
  ];
}
// Was temporarily false to isolate the real cause of an earlier
// flicker/black-screen report: confirmed it was the camera (raw per-tick
// jumpTo against live 3D terrain, plus pitch/zoom that clipped into the
// mountain), never the recolor itself. Left on.
const SPLASH_WINTER_ENABLED = true;
let _splashPlayed = false;
// Set once the splash's own map is torn down — the last keyframe actually
// flown (custom or fallback), not read back from the live map: an
// in-progress map.easeTo() can still report a stale position if read
// mid-transition. renderFogMap() ("My map") opens here instead of its
// usual whole-network fitBounds framing. Stays null (falls back to that
// normal framing) for reduced-motion sessions, where no splash map is
// ever created.
let _splashEndCamera = null;
// customKeyframes/refLonLat: bundle.splashKeyframes and bundle.ref, both
// fetched by boot() before calling this (or null/too-short if none
// authored yet / the project has no ref / the fetch didn't land in time)
// — either way this falls back to _splashFallbackKeyframes(refLonLat), a
// generic push-in centered on THIS project, so the splash always has
// somewhere sensible to fly regardless of which resort it's running for.
function playSplash(customKeyframes, refLonLat){
  return new Promise(resolve=>{
    const keyframes = (Array.isArray(customKeyframes) && customKeyframes.length >= 2) ? customKeyframes : _splashFallbackKeyframes(refLonLat);
    const rm = (()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } })();
    const overlay = document.createElement("div");
    overlay.className = "splashOverlay";
    overlay.innerHTML =
      '<div id="splashMap"></div>'
      +'<div class="splashTitle" id="splashTitle"><h1>Ridge Quest</h1><p>Live to Ski Ski to Live</p></div>'
      +'<button class="splashSkip" id="splashSkip">Skip &rsaquo;</button>';
    document.body.appendChild(overlay);

    let map=null, endTimer=null, revealTimer=null, done=false;
    function finish(){
      if(done) return; done=true;
      if(endTimer) clearTimeout(endTimer);
      if(revealTimer) clearTimeout(revealTimer);
      if(map){
        try{ map.jumpTo(_splashEndCamera || SplashFlight.cameraFor(keyframes[keyframes.length-1])); }catch(e){}
        try{ map.remove(); }catch(e){}
      }
      overlay.remove();
      resolve();
    }
    document.getElementById("splashSkip").onclick=finish;

    // Reduced motion: no camera animation, no map — just a brief branded
    // pause, same spirit as terrain-3d.js's own reducedMotion() gating.
    if(rm){ endTimer=setTimeout(finish, 600); return; }

    const startCam = SplashFlight.cameraFor(keyframes[0]);
    map = new maplibregl.Map({
      container:"splashMap",
      style:{ version:8,
        sources:{ base:{ type:"raster",
          tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
          tileSize:256, attribution:"Esri, Maxar" } },
        layers:[{ id:"base", type:"raster", source:"base" }] },
      center:startCam.center, zoom:startCam.zoom,
      pitch:startCam.pitch, bearing:startCam.bearing,
      interactive:false, attributionControl:false
    });
    // Reported live: "the first few seconds are corrupt glittery no snow
    // then last few seconds are great" — root cause was SplashFlight.play()
    // getting kicked off immediately, in parallel with map creation,
    // instead of waiting for "load": the camera was already flying through
    // several keyframes before the style had even finished loading, let
    // alone before Terrain3D.setEnabled/applyWinter below had run — so the
    // whole opening stretch of the flight played over a bare, half-loaded
    // basemap with no terrain/snow at all, only looking right once "load"
    // (and then a few frames of tile streaming) finally caught up partway
    // through. startFlight() below now only ever runs AFTER terrain+winter
    // are already in place. flightStarted guards against double-starting —
    // both the real "load" event and the offline/blocked-tiles fallback
    // timer call it, and only the first one should count.
    let flightStarted = false, fallbackTimer = null;
    function startFlight(){
      if(flightStarted) return;
      flightStarted = true;
      if(fallbackTimer) clearTimeout(fallbackTimer);
      // A short, fixed hold before revealing the map at all — "load" firing
      // (or the fallback timer below) only means the STYLE is ready; the
      // terrain/winter layers just added above still need a real paint
      // pass, and their DEM tiles are still an async network fetch on top
      // of that, worse on a slow mobile connection. #splashMap starts
      // css-opacity:0 (revealing the overlay's own dark background
      // instead); fading it in here, after this buffer, hides whatever
      // partial/glitchy frame rendered in between rather than showing it.
      revealTimer = setTimeout(()=>{
        const mapEl = document.getElementById("splashMap");
        if(mapEl) mapEl.classList.add("ready");
        // Shared with the Fence Editor's "Splash Flyby" Preview button (see
        // frontend/splash-flight.js) — the exact same chained-easeTo
        // player, so what's previewed there is what plays here. Returns
        // the flight's total duration so the end-card timing matches
        // however many keyframes were actually authored.
        const flightMs = SplashFlight.play(map, keyframes);
        _splashEndCamera = SplashFlight.cameraFor(keyframes[keyframes.length-1]);
        endTimer = setTimeout(()=>{
          const titleEl=document.getElementById("splashTitle");
          if(titleEl) titleEl.classList.add("show");
          endTimer = setTimeout(finish, SPLASH_END_CARD_MS);
        }, flightMs);
      }, 150);
    }
    map.on("load", ()=>{
      try{
        Terrain3D.setEnabled(map, true, { sky:true });
        // Real satellite imagery here is bare rock/dirt/forest, not snow —
        // same winter recolor (blue-white basemap + DEM elevation
        // snowline) every other project-facing map already uses when
        // season==='winter' (this project's bundle already reports
        // winter). Applied unconditionally rather than fetched/gated —
        // the splash is bespoke hardcoded content for this one project,
        // not bundle-driven, and fetching just to check a season flag
        // would undercut the "starts instantly, no network dependency"
        // point of the whole splash. Gated behind SPLASH_WINTER_ENABLED —
        // see that const's comment.
        if(SPLASH_WINTER_ENABLED) Terrain3D.applyWinter(map, { dem:true });
      }catch(e){} // offline/blocked tiles — startFlight()'s own fallback timer still fires below
      startFlight();
    });
    // Fallback in case "load" never fires at all (fully offline/blocked
    // tiles) — the splash must still finish within a bounded time
    // regardless; boot() can never block on tiles.
    endTimer = setTimeout(startFlight, 2500);
  });
}

async function boot(){
  // R7 resolution, in order: explicit URL params always win (unchanged from
  // before this phase) > a remembered rq.workspace pick > an existing
  // session's own appId (so a player who's already active before this
  // phase shipped isn't dropped back to a picker on their next visit — it
  // only needs to ask for a PROJECT, not force a fresh login). A
  // project-only URL (?project= with no ?app=) — the exact shape of every
  // link handed out earlier this session — keeps resolving to
  // "golden-nordic" as a narrow backward-compat default, so those links
  // don't break; a truly bare /quest with NEITHER param falls through to
  // the full picker instead, which is the actual point of this phase.
  //
  // Hoisted to run BEFORE the splash (it used to run after) so the splash
  // can look up this project's own bundle.splashKeyframes below — none of
  // this requires login, so it resolves the same way for a first-time
  // visitor as before; only reachable difference is a resolvable project
  // now gets its authored flight instead of always the hardcoded fallback.
  if(!RQ_APP_ID || !RQ_PROJECT_ID){
    const w = getWorkspace();
    if(w){
      if(!RQ_APP_ID && w.appId) RQ_APP_ID = w.appId;
      if(!RQ_PROJECT_ID && w.projectId) RQ_PROJECT_ID = w.projectId;
    }
  }
  if(!RQ_APP_ID){
    const existing = getSession();
    if(existing && existing.token && existing.player && existing.player.appId) RQ_APP_ID = existing.player.appId;
  }
  if(!RQ_APP_ID && RQ_PROJECT_ID) RQ_APP_ID = "golden-nordic";

  // Reported live: "still goes to kicking horse even though vancouver and
  // dans test is selected." Root cause — this check used to run AFTER the
  // splash block below: a brand-new visitor with no remembered workspace
  // reaches this function with RQ_APP_ID/RQ_PROJECT_ID both still null, so
  // the splash played immediately using the absolute-last-resort Kicking
  // Horse coordinates (nothing else to center on yet) — then the picker
  // appeared, and once a resort/project was actually picked,
  // renderProjectPicker()'s click handler calls boot() again, but
  // _splashPlayed already latched true on that very first call, so the
  // splash never got a second chance to play now-correctly-centered.
  // Moved here, before the splash, so it can never even attempt to play
  // until a project is actually known — for a returning visitor (URL
  // params or a remembered workspace) that's still immediately, same as
  // before; for a brand-new one, the splash now plays right after they
  // pick a resort/project (this same function, called again from
  // renderProjectPicker()) instead of showing a guess beforehand.
  if(!RQ_APP_ID || !RQ_PROJECT_ID){ renderWorkspacePicker(); return; }

  if(!_splashPlayed){
    _splashPlayed = true;
    // Best-effort fetch of this project's authored splash keyframes AND
    // its own reference point (bundle.ref, [lat,lon] — the same generic
    // per-project "map center" every other project already carries,
    // used by "My map"'s own questContentBounds()), raced against a
    // short timeout so a slow/offline network never meaningfully delays
    // the splash. Without this, the no-custom-flight fallback used to be
    // hardcoded to Kicking Horse's own gondola coordinates regardless of
    // which project/resort was actually loading — centering on THIS
    // project's own ref instead is what makes the fallback correct for
    // every resort, not just the one it happened to be built against.
    let splashKeyframes = null, projectRefLonLat = null;
    if(RQ_PROJECT_ID){
      try{
        const ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
        const timeout = new Promise(res=>setTimeout(res, 1200, null));
        const fetchP = (async ()=>{
          const r = await fetch(API+"/api/projects/"+encodeURIComponent(RQ_PROJECT_ID)+"/bundle", ctrl ? {signal:ctrl.signal} : undefined);
          if(!r.ok) return null;
          const b = await r.json();
          // [0,0] is this codebase's existing convention for "never set"
          // (bundle.ref defaults to [0,0], same null-island check
          // questContentBounds() already applies) — treat it as absent.
          const hasRef = Array.isArray(b.ref) && b.ref.length===2 && !(b.ref[0]===0 && b.ref[1]===0);
          return {
            splashKeyframes: Array.isArray(b.splashKeyframes) ? b.splashKeyframes : null,
            ref: hasRef ? [b.ref[1], b.ref[0]] : null // [lat,lon] -> [lon,lat]
          };
        })();
        fetchP.catch(()=>{}); // a late/aborted response must never surface as an unhandled rejection once the timeout has already won the race below
        const result = await Promise.race([fetchP, timeout]);
        if(result){ splashKeyframes = result.splashKeyframes; projectRefLonLat = result.ref; }
        if(ctrl) try{ ctrl.abort(); }catch(e){}
      }catch(e){}
    }
    await playSplash(splashKeyframes, projectRefLonLat);
  }

  const s=getSession();
  if(!s || !s.token){ renderAuth("login"); return; }
  app.innerHTML = '<div class="msg">Loading…</div>';
  let me;
  try{
    me = await api("/api/players/me"); // validates the session is still live
  }catch(e){
    clearSession(); renderAuth("login"); return;
  }
  RQ_FOG_ENABLED = me.fogEnabled !== false;
  RQ_SHARE_UNTIL = me.shareUntil || null;
  // Session/reconciliation: player_account is unique per (app_id,email),
  // not globally — switching workspace means switching account. If the
  // session's own appId no longer matches the currently-resolved
  // RQ_APP_ID (e.g. just picked a different resort), there's no cross-app
  // account linking by design — force fresh login/signup under the new app.
  if(me.appId !== RQ_APP_ID){ clearSession(); renderAuth("login"); return; }
  // A friend-invite link (?addfriend=<playerId>.<token>) — fire the request
  // once now that we know we're signed into the right resort, then strip the
  // param so a refresh doesn't re-send it.
  const addFriendTok = new URLSearchParams(location.search).get("addfriend");
  if(addFriendTok){
    try{ await api("/api/friends/request", {method:"POST", body:JSON.stringify({inviteToken:addFriendTok})}); rqToast("Friend request sent"); }
    catch(e){ rqToast(e.message); }
    try{ const u=new URL(location.href); u.searchParams.delete("addfriend"); history.replaceState(null,"",u); }catch(e){}
  }
  const gateOk = await runGate();
  if(!gateOk) return; // runGate's own screens handle re-entry
  renderConditions(renderHome);
}
boot();
</script>
</body>
