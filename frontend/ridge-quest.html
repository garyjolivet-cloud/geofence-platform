<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridge Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Google Identity Services — client-side Sign in with Google. The button
     returns a signed ID token directly to this page; the actual identity
     verification happens server-side (verifyGoogleIdToken() in worker.js),
     this script only renders the button and hands us that token. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- R1: shared GPS smoothing module, same EKF every other GPS-consuming
     page in this codebase already loads. Reused as-is, not modified. -->
<script src="/kalman-filter.js"></script>
<!-- R2: H3 geo-indexing (disk-reveal math) and MapLibre (personal fog-map
     rendering) — same MapLibre version geofence-engine.html/fence-editor.html
     already use elsewhere in this codebase. -->
<script src="https://unpkg.com/h3-js@4/dist/h3-js.umd.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root{ --night:#0a1018;--slate:#141d2b;--rim:#26344a;--coral:#ff6a3d;--snow:#eef4fb;--ice:#8fb6d4;--fog:#5b7088;--go:#38e0a6;--hazard:#ff2f4e; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--night);color:var(--snow);font-family:"Barlow",system-ui,sans-serif}
  a{color:inherit}
  .wrap{max-width:520px;margin:0 auto;padding:26px 20px 60px}
  header{display:flex;align-items:center;gap:11px;padding:8px 0 18px;border-bottom:1px solid var(--rim);margin-bottom:22px}
  .glyph{width:36px;height:36px;border-radius:10px;background:linear-gradient(150deg,var(--coral),#ff9166);position:relative}
  .glyph::after{content:"";position:absolute;inset:10px;border-radius:50%;border:2px solid #1a0d07}
  header h1{font-family:"Black Han Sans";font-weight:400;font-size:19px;margin:0}
  header p{margin:0;font-family:"Barlow Condensed";font-size:11.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--fog)}
  .card{background:linear-gradient(180deg,var(--slate),#10192640);border:1px solid var(--rim);border-radius:18px;padding:24px}
  h2{font-family:"Barlow Condensed";font-weight:600;font-size:22px;margin:0 0 6px}
  p.lead{color:var(--ice);font-size:14px;line-height:1.5;margin:0 0 18px}
  label{display:block;font-family:"Barlow Condensed";font-size:12.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--fog);margin:14px 0 6px}
  input[type=email],input[type=password],input[type=text]{width:100%;background:var(--night);border:1px solid var(--rim);color:var(--snow);border-radius:10px;padding:11px 13px;font-family:"Barlow";font-size:15px}
  input:focus{outline:none;border-color:var(--coral)}
  button{font-family:"Barlow Condensed";font-weight:700;font-size:14px;letter-spacing:.4px;text-transform:uppercase;border:none;border-radius:10px;padding:12px 18px;cursor:pointer;width:100%;margin-top:18px}
  button.primary{background:var(--coral);color:#1a0d07}
  button.primary:hover:not(:disabled){filter:brightness(1.07)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--rim);color:var(--ice);margin-top:10px}
  button.danger{background:transparent;border:1px solid var(--hazard);color:var(--hazard);margin-top:10px}
  .switcher{text-align:center;margin-top:16px;font-size:13.5px;color:var(--fog)}
  .orDivider{display:flex;align-items:center;gap:10px;color:var(--fog);font-family:"Barlow Condensed";font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin:14px 0}
  .orDivider::before,.orDivider::after{content:"";flex:1;height:1px;background:var(--rim)}
  .switcher a{color:var(--ice);cursor:pointer;text-decoration:underline}
  .err{background:#2a0f14;border:1px solid var(--hazard);color:#ff9aab;border-radius:10px;padding:10px 13px;font-size:13.5px;margin-top:14px}
  .msg{color:var(--fog);font-family:"Barlow Condensed";text-align:center;padding:40px 10px}
  .doc{max-height:min(46vh,380px);overflow-y:auto;background:var(--night);border:1px solid var(--rim);border-radius:12px;padding:16px 18px;font-size:13.5px;line-height:1.65;color:var(--ice);margin-bottom:6px}
  .doc h3{font-family:"Barlow Condensed";font-size:15px;color:var(--snow);margin:14px 0 6px}
  .doc h3:first-child{margin-top:0}
  .doc ol{margin:0;padding-left:20px}
  .doc li{margin-bottom:8px}
  .doc .placeholder{background:#2a1f0f;border:1px solid #5a4520;color:#ffcf7a;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:12px}
  .scrollhint{text-align:center;font-family:"Barlow Condensed";font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--fog);margin:8px 0 0}
  .steps{display:flex;gap:6px;margin-bottom:16px}
  .steps span{flex:1;height:4px;border-radius:2px;background:var(--rim)}
  .steps span.done{background:var(--go)}
  .steps span.active{background:var(--coral)}
  .now{display:flex;gap:18px;margin-bottom:16px}
  .now .stat{flex:1;background:var(--night);border:1px solid var(--rim);border-radius:12px;padding:12px;text-align:center}
  .now .stat b{display:block;font-family:"Barlow Condensed";font-size:22px;color:var(--snow)}
  .now .stat span{font-size:11px;color:var(--fog);text-transform:uppercase;letter-spacing:.4px}
  .welcome{text-align:center;padding:20px 6px}
  .welcome .go{font-family:"Black Han Sans";font-size:26px;color:var(--go);margin:0 0 6px}
  .trackBtn{background:var(--go);color:#052018}
  .trackBtn.tracking{background:var(--hazard);color:#2a0f14}
  .runlist{margin-top:16px}
  .runlist h3{font-family:"Barlow Condensed";font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--fog);margin:18px 0 8px}
  .runrow{display:flex;align-items:center;gap:10px;background:var(--night);border:1px solid var(--rim);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
  .runrow .badge{flex:0 0 auto;font-family:"Barlow Condensed";font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:3px 8px;border-radius:6px;background:var(--rim);color:var(--snow)}
  .runrow .badge.ski{background:var(--coral);color:#1a0d07}
  .runrow .badge.lift{background:var(--ice);color:#08202f}
  .runrow .badge.hike{background:var(--go);color:#052018}
  .runrow .badge.bike{background:var(--go);color:#052018}
  .runrow .badge.drive{background:var(--fog);color:#0b1420}
  .runrow .badge.xcski{background:#c9a4ff;color:#1a0d3d}
  .runrow .name{flex:1;color:var(--snow)}
  .runrow .meta{color:var(--fog);font-size:12px;white-space:nowrap}
  .empty{color:var(--fog);font-size:13px;text-align:center;padding:10px 0}
  /* R2 — fog map screen: a full-viewport overlay, deliberately OUTSIDE
     .wrap's 520px max-width (a map needs the whole screen, not a card). */
  .fogMapOverlay{position:fixed;inset:0;background:var(--night);z-index:1000}
  #fogMap{position:absolute;inset:0}
  .fogMapBack{position:absolute;top:14px;left:14px;z-index:2;width:auto;margin:0;padding:9px 16px;background:var(--slate);border:1px solid var(--rim);color:var(--snow);border-radius:10px}
  .fogMapLegend{position:absolute;bottom:14px;left:14px;z-index:2;background:var(--slate);border:1px solid var(--rim);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--ice);display:flex;gap:14px}
  .fogMapLegend span{display:flex;align-items:center;gap:6px}
  .fogMapLegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="glyph"></div><div><h1>Ridge Quest</h1><p>Fog-of-war terrain game</p></div></header>
  <div id="app"></div>
</div>

<script>
"use strict";
const API = location.origin;
// R7 — resolved at boot() now, not fixed: explicit URL params always win
// (staff test links / QR codes keep working unchanged); else a remembered
// rq.workspace pick; else derived from an existing session; else null,
// which is boot()'s own signal to show the public workspace/project picker.
let RQ_APP_ID = new URLSearchParams(location.search).get("app") || null;
// Public by design (Google's own docs) — safe to ship in frontend JS, not
// a secret. Must match backend's GOOGLE_OAUTH_CLIENT_ID (worker.js) exactly.
const RQ_GOOGLE_CLIENT_ID = "228254697293-80gino7h5nfbbth1tlui3ndided7bjr8.apps.googleusercontent.com";
const app = document.getElementById("app");
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---- session storage — deliberately separate keys from the staff
   RoleGate session (localStorage["gp.session"]). Players are a wholly
   different, non-staff auth domain (see worker.js's playerAuth()), so this
   never touches or checks RoleGate at all. ---- */
function getSession(){ try{ return JSON.parse(localStorage.getItem("rq.session")||"null"); }catch(e){ return null; } }
function setSession(token, player){ localStorage.setItem("rq.session", JSON.stringify({token, player})); }
function clearSession(){ localStorage.removeItem("rq.session"); }

/* R7 — the last resort+project a player picked, so a return visit to bare
   /quest (no URL params) doesn't re-show the picker every time. */
function getWorkspace(){ try{ return JSON.parse(localStorage.getItem("rq.workspace")||"null"); }catch(e){ return null; } }
function setWorkspace(appId, appName, projectId, projectName){ localStorage.setItem("rq.workspace", JSON.stringify({appId, appName, projectId, projectName})); }

async function api(path, opts){
  const s = getSession();
  const headers = Object.assign({"Content-Type":"application/json"}, (opts&&opts.headers)||{});
  if(s && s.token) headers.authorization = "Bearer "+s.token;
  const r = await fetch(API+path, Object.assign({}, opts, {headers}));
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || ("request failed ("+r.status+")"));
  return j;
}

/* ===================== WORKSPACE/PROJECT PICKER (R7) =====================
   Shown when boot() can't resolve both RQ_APP_ID and RQ_PROJECT_ID from the
   URL/localStorage/an existing session. Calls the two PUBLIC discovery
   routes (no staff token, no player auth needed) — deliberately separate
   endpoints from the staff-gated /api/apps and /api/projects, gated by the
   two-level quest_enabled(app)+quest_public(project) opt-in. */
async function renderWorkspacePicker(){
  app.innerHTML = '<div class="card"><h2>Choose your resort</h2><p class="lead">Pick where you’re playing Ridge Quest.</p><div id="wpList"><div class="empty">Loading…</div></div></div>';
  const listEl = document.getElementById("wpList");
  try{
    const j = await (await fetch(API+"/api/quest-workspaces")).json();
    const workspaces = j.workspaces||[];
    listEl.innerHTML = workspaces.length
      ? workspaces.map(w=>'<button class="ghost" data-id="'+esc(w.id)+'" data-name="'+esc(w.name)+'" style="display:block;width:100%;text-align:left">'+esc(w.name)+'</button>').join("")
      : '<div class="empty">No resorts are open for Ridge Quest right now.</div>';
    listEl.querySelectorAll("button[data-id]").forEach(btn=>{
      btn.onclick=()=>renderProjectPicker(btn.dataset.id, btn.dataset.name);
    });
  }catch(e){ listEl.innerHTML = '<div class="empty">Couldn’t load resorts — check your connection.</div>'; }
}
async function renderProjectPicker(appId, appName){
  app.innerHTML = '<div class="card"><h2>'+esc(appName||appId)+'</h2><p class="lead">Which map?</p><div id="ppList"><div class="empty">Loading…</div></div><button class="ghost" id="ppBack">← Back</button></div>';
  document.getElementById("ppBack").onclick=renderWorkspacePicker;
  const listEl = document.getElementById("ppList");
  try{
    const j = await (await fetch(API+"/api/quest-projects?app="+encodeURIComponent(appId))).json();
    const projects = j.projects||[];
    listEl.innerHTML = projects.length
      ? projects.map(p=>'<button class="ghost" data-id="'+esc(p.id)+'" data-name="'+esc(p.name)+'" style="display:block;width:100%;text-align:left">'+esc(p.name)+'</button>').join("")
      : '<div class="empty">This resort has no maps open yet.</div>';
    listEl.querySelectorAll("button[data-id]").forEach(btn=>{
      btn.onclick=()=>{
        // Switching workspace means switching ACCOUNT: player_account is
        // unique per (app_id,email), not globally, so there's no cross-app
        // account linking — if a session already exists under a different
        // app, it has to be cleared and re-authed under the new one.
        const s = getSession();
        if(s && s.player && s.player.appId !== appId) clearSession();
        RQ_APP_ID = appId; RQ_PROJECT_ID = btn.dataset.id;
        setWorkspace(appId, appName, btn.dataset.id, btn.dataset.name);
        boot();
      };
    });
  }catch(e){ listEl.innerHTML = '<div class="empty">Couldn’t load maps — check your connection.</div>'; }
}

/* ============================= AUTH VIEW ============================= */
function renderAuth(mode){
  mode = mode || "login";
  app.innerHTML =
    '<div class="card">'
    +'<h2>'+(mode==="login"?"Log in":"Create your account")+'</h2>'
    +'<p class="lead">Track every run, chute, bowl and ridge you ski — and reveal the mountain as you go.</p>'
    +'<div id="authErr"></div>'
    +'<div id="googleBtn" style="margin:4px 0 4px;display:flex;justify-content:center"></div>'
    +'<div class="orDivider" id="orDivider">or</div>'
    +(mode==="signup" ? '<label for="fName">Display name</label><input id="fName" type="text" autocomplete="nickname" placeholder="Trail name">' : '')
    +'<label for="fEmail">Email</label><input id="fEmail" type="email" autocomplete="email">'
    +'<label for="fPass">Password</label><input id="fPass" type="password" autocomplete="'+(mode==="login"?"current-password":"new-password")+'">'
    +'<button class="primary" id="btnGo">'+(mode==="login"?"Log in":"Create account")+'</button>'
    +'<div class="switcher">'
      +(mode==="login" ? 'New here? <a id="toSignup">Create an account</a>' : 'Already playing? <a id="toLogin">Log in</a>')
    +'</div>'
    +(mode==="login" ? '<div class="switcher"><a id="toForgot">Forgot password?</a></div>' : '')
    +'</div>';
  const toSignup=document.getElementById("toSignup"); if(toSignup) toSignup.onclick=()=>renderAuth("signup");
  const toLogin=document.getElementById("toLogin"); if(toLogin) toLogin.onclick=()=>renderAuth("login");
  const toForgot=document.getElementById("toForgot"); if(toForgot) toForgot.onclick=()=>renderForgotEmail();
  renderGoogleButton(async(credential)=>{
    const errEl=document.getElementById("authErr"); errEl.innerHTML="";
    try{
      const j = await api("/api/players/oauth/google", {method:"POST", body:JSON.stringify({credential, appId:RQ_APP_ID})});
      setSession(j.token, j.player);
      boot();
    }catch(e){
      errEl.innerHTML='<div class="err">'+esc(e.message)+'</div>';
    }
  });
  document.getElementById("btnGo").onclick=async()=>{
    const email=document.getElementById("fEmail").value.trim();
    const password=document.getElementById("fPass").value;
    const errEl=document.getElementById("authErr");
    errEl.innerHTML="";
    if(!email || !password){ errEl.innerHTML='<div class="err">Email and password are required.</div>'; return; }
    const btn=document.getElementById("btnGo"); btn.disabled=true;
    try{
      const body={email, password, appId:RQ_APP_ID};
      if(mode==="signup") body.displayName=(document.getElementById("fName").value||"").trim()||null;
      const j = await api(mode==="signup" ? "/api/players/signup" : "/api/players/login", {method:"POST", body:JSON.stringify(body)});
      setSession(j.token, j.player);
      boot();
    }catch(e){
      errEl.innerHTML='<div class="err">'+esc(e.message)+'</div>';
    }finally{ btn.disabled=false; }
  };
}
// Google's GIS script is loaded async/defer (see <head>), so it may not be
// ready yet the instant this runs — poll briefly rather than assume.
// Fails silently (hides the button+divider, password form still works)
// rather than erroring if it never loads (blocked network, offline, etc).
function renderGoogleButton(onCredential){
  const el=document.getElementById("googleBtn");
  const divider=document.getElementById("orDivider");
  if(!el) return;
  function tryInit(attemptsLeft){
    if(window.google && google.accounts && google.accounts.id){
      google.accounts.id.initialize({client_id:RQ_GOOGLE_CLIENT_ID, callback:(resp)=>onCredential(resp.credential)});
      google.accounts.id.renderButton(el, {theme:"filled_black", size:"large", width:280, text:"continue_with"});
      return;
    }
    if(attemptsLeft<=0){ el.style.display="none"; if(divider) divider.style.display="none"; return; }
    setTimeout(()=>tryInit(attemptsLeft-1), 300);
  }
  tryInit(15);
}

/* ===================== FORGOT / RESET PASSWORD ===================== */
// Three steps: email -> 6-digit code (emailed, 15 min) -> new password.
// The code is re-validated server-side at the final submit regardless of
// verify-reset-code's own check — see worker.js's own comment on why that
// intermediate check is a UX nicety, not a security boundary.
function renderForgotEmail(){
  app.innerHTML =
    '<div class="card">'
    +'<h2>Reset your password</h2>'
    +'<p class="lead">We’ll send a 6-digit code to your email. It’s good for 15 minutes.</p>'
    +'<div id="fpErr"></div>'
    +'<label for="fpEmail">Email</label><input id="fpEmail" type="email" autocomplete="email">'
    +'<button class="primary" id="fpSend">Send code</button>'
    +'<div class="switcher"><a id="fpBack">Back to log in</a></div>'
    +'</div>';
  document.getElementById("fpBack").onclick=()=>renderAuth("login");
  document.getElementById("fpSend").onclick=async()=>{
    const email=document.getElementById("fpEmail").value.trim();
    const errEl=document.getElementById("fpErr"); errEl.innerHTML="";
    if(!email){ errEl.innerHTML='<div class="err">Enter your email.</div>'; return; }
    const btn=document.getElementById("fpSend"); btn.disabled=true;
    try{
      await api("/api/players/forgot-password", {method:"POST", body:JSON.stringify({email, appId:RQ_APP_ID})});
      renderForgotCode(email);
    }catch(e){
      errEl.innerHTML='<div class="err">'+esc(e.message)+'</div>';
    }finally{ btn.disabled=false; }
  };
}
function renderForgotCode(email){
  app.innerHTML =
    '<div class="card">'
    +'<h2>Enter your code</h2>'
    +'<p class="lead">We sent a 6-digit code to '+esc(email)+'. It expires in 15 minutes.</p>'
    +'<div id="fcErr"></div>'
    +'<label for="fcCode">6-digit code</label>'
    +'<input id="fcCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" style="letter-spacing:6px;font-size:22px;text-align:center">'
    +'<button class="primary" id="fcVerify">Continue</button>'
    +'<div class="switcher"><a id="fcResend">Resend code</a> &nbsp;·&nbsp; <a id="fcBack">Back</a></div>'
    +'</div>';
  document.getElementById("fcBack").onclick=()=>renderForgotEmail();
  document.getElementById("fcResend").onclick=async()=>{
    try{ await api("/api/players/forgot-password", {method:"POST", body:JSON.stringify({email, appId:RQ_APP_ID})}); }catch(e){}
    const errEl=document.getElementById("fcErr"); errEl.innerHTML='<div class="err" style="background:#0f2a1f;border-color:var(--go);color:#9af0c8">New code sent.</div>';
  };
  document.getElementById("fcVerify").onclick=async()=>{
    const code=document.getElementById("fcCode").value.trim();
    const errEl=document.getElementById("fcErr"); errEl.innerHTML="";
    if(!/^\d{6}$/.test(code)){ errEl.innerHTML='<div class="err">Enter the 6-digit code.</div>'; return; }
    const btn=document.getElementById("fcVerify"); btn.disabled=true;
    try{
      const j = await api("/api/players/verify-reset-code", {method:"POST", body:JSON.stringify({email, appId:RQ_APP_ID, code})});
      if(!j.ok){ errEl.innerHTML='<div class="err">That code is wrong or expired.</div>'; btn.disabled=false; return; }
      renderResetPassword(email, code);
    }catch(e){
      errEl.innerHTML='<div class="err">'+esc(e.message)+'</div>'; btn.disabled=false;
    }
  };
}
function renderResetPassword(email, code){
  app.innerHTML =
    '<div class="card">'
    +'<h2>Set a new password</h2>'
    +'<div id="rpErr"></div>'
    +'<label for="rpPass">New password</label><input id="rpPass" type="password" autocomplete="new-password">'
    +'<button class="primary" id="rpSave">Save new password</button>'
    +'</div>';
  document.getElementById("rpSave").onclick=async()=>{
    const password=document.getElementById("rpPass").value;
    const errEl=document.getElementById("rpErr"); errEl.innerHTML="";
    if(!password || password.length<8){ errEl.innerHTML='<div class="err">Password must be at least 8 characters.</div>'; return; }
    const btn=document.getElementById("rpSave"); btn.disabled=true;
    try{
      await api("/api/players/reset-password", {method:"POST", body:JSON.stringify({email, appId:RQ_APP_ID, code, password})});
      app.innerHTML='<div class="card welcome"><p class="go">Password updated.</p><p class="lead">Log in with your new password.</p></div>';
      setTimeout(()=>renderAuth("login"), 1400);
    }catch(e){
      errEl.innerHTML='<div class="err">'+esc(e.message)+'</div>'; btn.disabled=false;
    }
  };
}

/* ========================= ONBOARDING GATE ========================= */
// Server-side REQUIRED_CONSENT versions (worker.js) are the source of
// truth for whether a version is CURRENT; the text below is what the
// player actually reads. Keep the ordering (privacy -> liability ->
// responsibility code) and the version strings in lockstep with worker.js.
const GATE_SCOPES = [
  {
    scope: "data-privacy", version: "1", title: "Your data",
    body: '<div class="placeholder">Placeholder copy — replace with the resort’s reviewed privacy notice before this goes live to the public.</div>'
      +'<p>To play Ridge Quest we collect your GPS location while a session is active, and derive from it: which runs/chutes/bowls/ridges/lifts you used, your vertical descended, and your day-by-day and season stats. We use this to show your own map, your stats, and leaderboards (your display name and points may be visible to other players).</p>'
      +'<p>We keep this data for as long as your account exists. You can permanently delete your account and everything derived from your GPS history at any time from Account settings — this is a real deletion, not a deactivation.</p>'
      +'<p>We do not sell your location data.</p>'
  },
  {
    scope: "liability-waiver", version: "1", title: "Risk & liability",
    body: '<div class="placeholder">Placeholder copy — this MUST be reviewed and finalized by the resort’s own legal counsel before this ships. Skiing/snowboarding is an inherently dangerous activity and this screen carries real liability weight.</div>'
      +'<p>Skiing and snowboarding carry inherent and significant risks of injury or death, including risks from terrain, weather, snow conditions, collisions, lift use, and other skiers.</p>'

function renderGateScreen(g, onDone){
  const idx = GATE_SCOPES.indexOf(g);
  app.innerHTML =
    '<div class="card">'
    +'<div class="steps">'+GATE_SCOPES.map((s,i)=>'<span class="'+(i<idx?"done":i===idx?"active":"")+'"></span>').join('')+'</div>'
    +'<h2>'+esc(g.title)+'</h2>'
    +'<p class="lead">Step '+(idx+1)+' of '+GATE_SCOPES.length+' — required before you can play.</p>'
    +'<div class="doc" id="docBody">'+g.body+'</div>'
    +'<div class="scrollhint" id="scrollHint">Scroll to the bottom to continue</div>'
    +'<button class="primary" id="btnAccept" disabled>I have read and accept</button>'
    +'</div>';
  const doc=document.getElementById("docBody");
  const btn=document.getElementById("btnAccept");
  const hint=document.getElementById("scrollHint");
  function checkScrolled(){
    // 4px slack for sub-pixel rounding across browsers.
    const atBottom = doc.scrollTop + doc.clientHeight >= doc.scrollHeight - 4;
    if(atBottom){ btn.disabled=false; hint.style.visibility="hidden"; }
  }
  doc.addEventListener("scroll", checkScrolled);
  // A short document that never needs scrolling shouldn't trap the player —
  // check once on render too.
  checkScrolled();
  btn.onclick=async()=>{
    btn.disabled=true;
    try{
      const s=getSession();
      await api("/api/players/"+s.player.id+"/consent", {method:"POST", body:JSON.stringify({scope:g.scope})});
      onDone();
    }catch(e){
      btn.disabled=false;
      const errDiv=document.createElement("div"); errDiv.className="err"; errDiv.textContent=e.message;
      doc.parentElement.insertBefore(errDiv, hint);
    }
  };
}

async function runGate(){
  const s=getSession();
  const status = await api("/api/players/"+s.player.id+"/consent");
  if(status.complete){ return true; }
  return new Promise((resolve)=>{
    function next(){
      const pending = GATE_SCOPES.find(g=>status.missing.includes(g.scope));
      if(!pending){ resolve(true); return; }
      renderGateScreen(pending, ()=>{
        status.missing = status.missing.filter(sc=>sc!==pending.scope);
        next();
      });
    }
    next();
  });
}
