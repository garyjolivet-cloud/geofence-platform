  // R11 — completion % needs BOTH corridors (the denominator) and fog
  // cells (the numerator) actually loaded, not just fired off — awaited
  // here instead of the old fire-and-forget pair so the stat has real data
  // by the time it paints, without fetching either one twice.
  (async ()=>{
    await Promise.all([Quest.loadCorridors(), Quest.loadFogCells(s.player.id)]);
    // Re-load on every Home render, same as applyActivityFilter() below —
    // corridors may have just changed (a different resort/project).
    // ChuteGuard.load() is cheap/idempotent AND preserves any live
    // excursion's state across a same-corridor reload (see its own header
    // comment) — this used to just rebuild coverage tracking, but a reload
    // mid-alarm would now otherwise wipe an in-progress escalation.
    // Real bug found 2026-09-20 (field report: "Catamount chair is not
    // activating battery saver"): this used to load [] instead of the real
    // zones whenever Quest.chuteGuardEnabled was off (a per-workspace admin
    // flag for the AUDIBLE off-course alarm feature) — which also emptied
    // chute-guard.js's internal liftCorridors, since that's populated from
    // the exact same load() call. Battery Saver's ChuteGuard.isOnLift() then
    // silently had nothing to detect, for every workspace that simply never
    // opted into the (unrelated) off-course alarm. Now always loads the real
    // geometry so isOnLift() works regardless; chuteGuardEnabled instead
    // gates the actual alarm sound/toast/log at their own call sites (see
    // syncCgAlarm() and chuteGuardCallbacks() below) so a workspace with it
    // off still gets exactly the same silence as before.
    if(typeof ChuteGuard!=="undefined") ChuteGuard.load(chuteGuardZonesFor(Quest.corridors), chuteGuardCallbacks());
    Quest.onNarrate = narrateCorridor;
    const el = document.getElementById("exploredPct");
    if(!el) return; // navigated away before this resolved
    const pct = questCompletionPct(corridorPreviewCells(), Quest.fogCells);
    el.textContent = pct==null ? "" : Math.round(pct*100)+"% of this map explored (lifetime)";
    // R12 — corridors just (re)loaded, so Quest.allowedActivities now
    // reflects THIS project. Re-apply the filter now that it's fresh (the
    // earlier synchronous call below used whatever was cached from a
    // previous project, if any — harmless flash, corrected here).
    if(typeof applyActivityFilter==="function") applyActivityFilter();
  })();
  const trackBtn=document.getElementById("btnTrack");
  const statusEl=document.getElementById("gpsStatus");
  const coverageEl=document.getElementById("coverageStatus");
  document.getElementById("btnExportCgLog").onclick=exportCgLog;
  const onStatus=(st)=>{
    // Real bug, 2026-09-17: a permission-denied GPS error used to only ever
    // update this status text — Quest.start()'s stop() call (see its own
    // comment) now correctly clears watchId when this fires, but the
    // Start/Stop button and the activity picker still need telling, or they
    // stay visually stuck in "tracking" (Stop tracking / dimmed, unclickable
    // activity buttons) even though tracking has actually already stopped.
    if(st.stopped && trackBtn){
      trackBtn.textContent="Start tracking"; trackBtn.classList.remove("tracking");
      activityBtns.forEach(b=>b.style.opacity="1");
      releaseWakeLock();
    }
    if(!statusEl) return;
    statusEl.textContent = st.ok
      ? "last fix "+new Date(st.t).toLocaleTimeString()+", ±"+Math.round(st.acc)+"m"
      : "location error: "+st.message+" — check your browser's location permission for this site";
  };
  // R9 — surfaces every band-exit's coverage check, not just the ones that
  // logged a run: a clipped/partial crossing used to vanish silently the
  // same way a too-short flicker always has, with no way to tell them
  // apart. Sticks until the next crossing (not cleared on Stop) so a player
  // who just finished sees the result of their last run before it scrolls
  // into Today's list.
  const onCoverage=(name, pct, passed)=>{
    if(!coverageEl) return;
    const pctStr = Math.round(pct*100)+"%";
    coverageEl.textContent = passed
      ? name+" — "+pctStr+" ✓ logged"
      : name+" — "+pctStr+" (not enough of it covered to count)";
  };
  // Debug audit, 2026-08-21 — POST /api/quest-runs failing used to be a
  // silent no-op (bare .catch(()=>{})): a real crossing (real vertical/
  // distance/points) would just never appear in Today's list or the
  // leaderboard, with onCoverage having already told the player "✓ logged"
  // moments earlier. Corrects that message rather than leaving it wrong.
  Quest.onSaveError = (name)=>{
    if(!coverageEl) return;
    coverageEl.textContent = name+" — couldn't save to the server (check your connection); this run may not count.";
  };
  // Live-tick the "Vertical today" tile as checkpoints credit descent, so it
  // moves during a session instead of only on the next refreshStats().
  Quest.onCheckpointVertical = (totalM)=>{
    const el = document.querySelector('#statsTiles .vtoday b');
    if(el) el.textContent = Math.round(totalM)+'m';
  };
  // R8 — manual activity choice, remembered across visits so re-selecting
  // "Bike" every session isn't required. Buttons are disabled while
  // tracking is active: switching mid-run would split one crossing's
  // classification across two activities, which _classifyAndLog has no way
  // to reconcile (it only sees the buffer, not a mid-buffer activity change).
  let selectedActivity = localStorage.getItem("rq.activity") || "ski";
  const activityBtns = [...document.querySelectorAll("#activityPicker button")];
  function paintActivityButtons(){
    activityBtns.forEach(b=>{ b.style.borderColor = (b.dataset.activity===selectedActivity) ? "var(--coral)" : ""; });
  }
  // R12 — hides activity buttons this project's staff-set quest_activities
  // filter excludes (null = show all, unchanged default). If the player's
  // REMEMBERED choice (localStorage, could've been set at a different
  // project) isn't in this project's allowed list, fall back to the first
  // allowed one — otherwise the picker would show no selected button at
  // all, and tracking would silently classify under a hidden activity.
  function applyActivityFilter(){
    const allowed = Quest.allowedActivities;
    activityBtns.forEach(b=>{ b.style.display = (!allowed || allowed.includes(b.dataset.activity)) ? "" : "none"; });
    if(allowed && allowed.length && !allowed.includes(selectedActivity)){
      selectedActivity = allowed[0];
      localStorage.setItem("rq.activity", selectedActivity);
    }
    paintActivityButtons();
  }
  applyActivityFilter();
  activityBtns.forEach(b=>{
    b.onclick=()=>{
      if(Quest.active()) return; // disabled while tracking, see comment above
      selectedActivity = b.dataset.activity;
      localStorage.setItem("rq.activity", selectedActivity);
      paintActivityButtons();
    };
  });
  trackBtn.onclick=()=>{
    if(Quest.active()){
      Quest.stop();
      trackBtn.textContent="Start tracking"; trackBtn.classList.remove("tracking");
      statusEl.textContent="";
      activityBtns.forEach(b=>b.style.opacity="1");
      releaseWakeLock();
      // Stopping tracking tears down watchPosition, so no more GPS fixes
      // (and therefore no more chute-guard.js ticks) will ever arrive —
      // chuteGuardStopSync() stops the sync loop itself, not just the tone,
      // so nothing keeps polling a corridor set that's about to be gone.
      chuteGuardStopSync();
    } else {
      statusEl.textContent="waiting for GPS…";
      coverageEl.textContent="";
      if(window.DeviceHeading) DeviceHeading.start();  // compass for the "you are here" arrow — this tap is the iOS permission gesture
      chuteGuardPrimeAudio();  // this tap is also the iOS AudioContext-unlock gesture for the chute-guard fallback tone
      unlockSayAudio();        // and the iOS <audio>-element-unlock gesture for spoken corridor narration
      acquireWakeLock();       // and the user-gesture context Wake Lock needs on some browsers — see its own comment
      const ok=Quest.start(()=>{ refreshRuns(s.player.id); refreshStats(s.player.id); }, null, onStatus, selectedActivity, onCoverage);
      if(!ok){ alert("This device/browser doesn’t support GPS tracking."); releaseWakeLock(); return; }
      chuteGuardStartSync();
      trackBtn.textContent="Stop tracking"; trackBtn.classList.add("tracking");
      activityBtns.forEach(b=>b.style.opacity="0.4");
    }
  };
  if(IS_SIM_MODE){
    const simBtn=document.getElementById("btnSim");
    simBtn.onclick=()=>{
      if(simBtn.dataset.running){ Quest.cancelSim(); simBtn.textContent="Simulate walk (test mode)"; delete simBtn.dataset.running; statusEl.textContent=""; return; }
      simBtn.dataset.running="1"; simBtn.textContent="Simulating… (tap to cancel)";
      // simulateWalk() doesn't route through start(), so onCoverage needs
      // setting directly here to see the coverage readout during a sim run.
      Quest.onCoverage = onCoverage;
      // Bike needs a pace above BIKE_SPEED_MIN_MPS to actually classify as
      // bike rather than falling back to hike; ski/hike/drive keep the
      // original walking-pace default (drive doesn't speed-gate at all).
      const simSpeed = selectedActivity==="bike" ? 4 : 1.5;
      Quest.simulateWalk(simSpeed,
        (i,total)=>{ statusEl.textContent="simulating: "+i+"/"+total; },
        (err)=>{
          simBtn.textContent="Simulate walk (test mode)"; delete simBtn.dataset.running;
          statusEl.textContent = err ? "simulation: "+err : "simulation complete";
          refreshRuns(s.player.id); refreshStats(s.player.id);
        }, selectedActivity);
    };
  }
  document.getElementById("btnMap").onclick=()=>renderFogMap();
  document.getElementById("btnLeaderboard").onclick=()=>renderLeaderboard();
  document.getElementById("btnChutes").onclick=()=>renderYourChutes();
  document.getElementById("btnFriends").onclick=()=>renderFriends();
  // "Share my location with friends today" — POST /api/share sets/clears
  // share_until server-side; RQ_SHARE_UNTIL mirrors it so the label + the
  // Quest.onShare gate below stay right without a round-trip.
  const shareBtn=document.getElementById("btnShare");
  function paintShareBtn(){
    const on = RQ_SHARE_UNTIL && RQ_SHARE_UNTIL > Date.now();
    shareBtn.textContent = on ? "Sharing my location with friends — tap to stop" : "Share my location with friends today";
    shareBtn.style.borderColor = on ? "var(--coral)" : "";
  }
  paintShareBtn();
  shareBtn.onclick=async()=>{
    const turningOn = !(RQ_SHARE_UNTIL && RQ_SHARE_UNTIL > Date.now());
    shareBtn.disabled=true;
    try{
      const j = await api("/api/share", {method:"POST", body:JSON.stringify({on:turningOn})});
      RQ_SHARE_UNTIL = j.shareUntil || null;
      rqToast(turningOn ? "Sharing until tonight" : "Location sharing off");
    }catch(e){ rqToast(e.message); }
    finally{ shareBtn.disabled=false; paintShareBtn(); }
  };
  // Piggyback the fix stream (no second watchPosition). Guarded by
  // RQ_SHARE_UNTIL and throttled; the POST itself is refused server-side
  // unless share_until is live, so a stale RQ_SHARE_UNTIL just wastes one call.
  Quest.onShare = (p)=>{
    if(!(RQ_SHARE_UNTIL && RQ_SHARE_UNTIL > Date.now())) return;
    const now = Date.now();
    if(now - rqLastShareAt < 7000) return;
    rqLastShareAt = now;
    api("/api/presence", {method:"POST", body:JSON.stringify({lat:p.lat, lon:p.lon, heading:p.headingTravel, acc:p.acc})}).catch(()=>{});
  };
  document.getElementById("btnConditions").onclick=()=>renderConditions(renderHome);
  document.getElementById("btnSwitchResort").onclick=()=>{ Quest.stop(); renderWorkspacePicker(); };
  document.getElementById("btnLogout").onclick=async()=>{
    Quest.stop(); Quest.onShare=null;
    try{ await api("/api/players/logout",{method:"POST"}); }catch(e){}
    clearSession(); renderAuth("login");
  };
  document.getElementById("btnDelete").onclick=async()=>{
    if(!confirm("This permanently deletes your Ridge Quest account and everything derived from it. This cannot be undone. Continue?")) return;
    try{
      Quest.stop();
      await api("/api/players/"+s.player.id+"/forget", {method:"POST"});
      clearSession(); renderAuth("login");
    }catch(e){ alert(e.message); }
  };
}

/* ========================= LEADERBOARD (R3-core) ========================= */
// activityFilter drives which stat shows next to points — the API always
// returns both verticalM and distanceM on a per-activity board (never on
// the combined "All" board, which has no distanceM at all), but a per-
// activity row's OTHER field isn't necessarily zero (a ski run's own
// distanceM is real ground covered, just not what scored it) — so which
// one to show is a property of the ACTIVITY, not of which field happens
// to be nonzero. "All" shows points only, same as before this existed.
function leaderboardRowHtml(row, meId, rank, activityFilter){
  const mine = row.playerId===meId;
  const parts = [Math.round(row.points)+' pts'];
  if(activityFilter){
    const usesDistance = activityFilter==="bike"||activityFilter==="drive"||activityFilter==="xcski";
    if(usesDistance && row.distanceM!=null) parts.push((Math.round(row.distanceM/100)/10)+'km');
    else if(!usesDistance && row.verticalM!=null) parts.push(Math.abs(Math.round(row.verticalM))+'m vert');
    if(row.runsCount!=null) parts.push(row.runsCount+(row.runsCount===1?' run':' runs'));
  }
  return '<div class="runrow"'+(mine?' style="border-color:var(--coral)"':'')+'>'
    +'<span class="badge" style="background:var(--rim)">#'+rank+'</span>'
    +'<span class="name">'+esc(row.name)+(mine?' (you)':'')+'</span>'
    +'<span class="meta">'+esc(parts.join(' · '))+'</span></div>';
}
async function renderLeaderboard(mode, activityFilter){
  mode = mode || "daily";
  const s=getSession();
  app.innerHTML =
    '<div class="card">'
    +'<h2>Leaderboard</h2>'
    +'<div style="display:flex;gap:10px;margin-bottom:10px">'
      +'<button class="ghost" id="lbDailyBtn" style="margin:0;'+(mode==="daily"?"border-color:var(--coral)":"")+'">Today</button>'
      +'<button class="ghost" id="lbSeasonBtn" style="margin:0;'+(mode==="season"?"border-color:var(--coral)":"")+'">Season</button>'
    +'</div>'
    // R8 — optional per-activity view, reusing R6's ?activity= filter.
    // "All" (no filter) stays the default, unchanged combined board. R12 —
    // tabs are filtered by this project's quest_activities the same way
    // Home's picker is (null=all); "All" itself always shows regardless,
    // since it's the combined board, not a single activity.
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">'
      +[{key:"",label:"All"}].concat(QUEST_ACTIVITIES.filter(a=>!Quest.allowedActivities || Quest.allowedActivities.includes(a.key)))
        .map(a=>'<button class="ghost" data-act="'+a.key+'" style="margin:0;font-size:12px;padding:6px 10px;'+((activityFilter||"")===a.key?"border-color:var(--coral)":"")+'">'+a.label+'</button>').join('')
    +'</div>'
    +'<div id="lbList"><div class="empty">Loading…</div></div>'
    +'<button class="ghost" id="lbBack">← Back</button>'
    +'</div>';
  document.getElementById("lbBack").onclick=renderHome;
  document.getElementById("lbDailyBtn").onclick=()=>renderLeaderboard("daily", activityFilter);
  document.getElementById("lbSeasonBtn").onclick=()=>renderLeaderboard("season", activityFilter);
  document.querySelectorAll("button[data-act]").forEach(btn=>{
    btn.onclick=()=>renderLeaderboard(mode, btn.dataset.act || null);
  });
  const listEl=document.getElementById("lbList");
  try{
    const base = mode==="daily" ? "/api/leaderboard/daily" : "/api/leaderboard/season";
    const j = await api(activityFilter ? base+"?activity="+encodeURIComponent(activityFilter) : base);
    const board = j.board||[];
    listEl.innerHTML = board.length
      ? board.map((row,i)=>leaderboardRowHtml(row, s.player.id, i+1, activityFilter)).join("")
      : '<div class="empty">No runs logged yet '+(mode==="daily"?"today":"this season")+'.</div>';
  }catch(e){
    listEl.innerHTML = '<div class="empty">Couldn’t load the leaderboard.</div>';
  }
}

/* ============================ YOUR CHUTES ============================
   Personal lap counts per chute (run_type==='chute'), Today vs this
   season — GET /api/players/:id/chutes/daily|season. Mirrors
   renderLeaderboard()'s daily/season toggle exactly. */
function difficultyMarkHtml(diff){
  if(diff==="green") return '<span class="chuteMark" style="color:#57e06f">●</span>';
  if(diff==="blue")  return '<span class="chuteMark" style="color:#6bb6ff">●</span>';
  if(diff==="double-black") return '<span class="chuteMark">◆◆</span>';
  return '<span class="chuteMark">◆</span>'; // black, or no difficulty set
}
function chuteRowHtml(c, maxCount){
  const pct = maxCount>0 ? Math.round((c.count/maxCount)*100) : 0;
  return '<div class="chuteRow">'
    +'<div class="chuteTop">'
      +difficultyMarkHtml(c.difficulty)
      +'<span class="name">'+esc(c.name)+'</span>'
      +'<span class="count">×'+c.count+'</span>'
    +'</div>'
    +'<div class="chuteBar"><i style="width:'+pct+'%"></i></div>'
  +'</div>';
}
async function renderYourChutes(mode){
  mode = mode || "daily";
  const s=getSession();
  app.innerHTML =
    '<div class="card">'
    +'<h2>Your chutes</h2>'
    +'<div style="display:flex;gap:10px;margin-bottom:14px">'
      +'<button class="ghost" id="chDailyBtn" style="margin:0;'+(mode==="daily"?"border-color:var(--coral)":"")+'">Today</button>'
      +'<button class="ghost" id="chSeasonBtn" style="margin:0;'+(mode==="season"?"border-color:var(--coral)":"")+'">Season</button>'
    +'</div>'
    +'<div id="chList"><div class="empty">Loading…</div></div>'
    +'<button class="ghost" id="chBack">← Back</button>'
    +'</div>';
  document.getElementById("chBack").onclick=renderHome;
  document.getElementById("chDailyBtn").onclick=()=>renderYourChutes("daily");
  document.getElementById("chSeasonBtn").onclick=()=>renderYourChutes("season");
  const listEl=document.getElementById("chList");
  try{
    const j = await api("/api/players/"+s.player.id+"/chutes/"+mode);
    const chutes = j.chutes||[];
    const maxCount = chutes.length ? chutes[0].count : 0;
    listEl.innerHTML = chutes.length
      ? chutes.map(c=>chuteRowHtml(c, maxCount)).join("")
      : '<div class="empty">No chutes skied yet '+(mode==="daily"?"today":"this season")+'.</div>';
  }catch(e){
    listEl.innerHTML = '<div class="empty">Couldn’t load your chutes.</div>';
  }
}

/* ============================== FRIENDS ==============================
   Persistent per-resort friends list (add by email or personal invite
   link, accept/decline/remove) + the daily "share my location" toggle
   also lives on Home. Friends checked here (max RQ_MAX_TRACK) are drawn
   live on "My map" — see renderFogMap's friends layer. The checked set
   persists in localStorage["rq.trackFriends"], same idea as rq.activity.
   Visibility is STRICT MUTUAL server-side: you only see a friend on a day
   you're BOTH sharing (GET /api/presence/friends returns [] otherwise). */
async function renderFriends(){
  app.innerHTML =
    '<div class="card">'
    +'<h2>Friends</h2>'
    +'<p class="lead">Add friends by email or your invite link. On a day you’re <em>both</em> sharing, up to '+RQ_MAX_TRACK+' checked friends show live on your map.</p>'
    +'<div id="friendsErr"></div>'
    +'<label for="fAddEmail">Add a friend by email</label>'
    +'<div style="display:flex;gap:8px"><input id="fAddEmail" type="email" autocomplete="off" placeholder="friend@email.com" style="flex:1">'
      +'<button class="ghost" id="fAddBtn" style="width:auto;margin:0;white-space:nowrap">Send</button></div>'
    +'<button class="ghost" id="fInviteBtn">Show my invite link</button>'
    +'<div id="fInviteBox"></div>'
    +'<div id="fRequests"></div>'
    +'<div class="runlist"><h3>Your friends</h3><div id="fList"><div class="empty">Loading…</div></div></div>'
    +'<button class="ghost" id="fBack">← Back</button>'
    +'</div>';
  document.getElementById("fBack").onclick=renderHome;
  const errEl=document.getElementById("friendsErr");
  const showErr=(m)=>{ errEl.innerHTML='<div class="err">'+esc(m)+'</div>'; };

  document.getElementById("fAddBtn").onclick=async()=>{
    const email=(document.getElementById("fAddEmail").value||"").trim();
    if(!email){ showErr("Enter an email address."); return; }
    errEl.innerHTML="";
    try{
      await api("/api/friends/request", {method:"POST", body:JSON.stringify({email})});
      document.getElementById("fAddEmail").value="";
      // Deliberately vague — the server never confirms whether that email
      // has an account here (no enumeration), so neither does this.
      rqToast("If they play here, a request is on its way");
      loadFriends();
    }catch(e){ showErr(e.message); }
  };

  document.getElementById("fInviteBtn").onclick=async()=>{
    const box=document.getElementById("fInviteBox");
    box.innerHTML='<div class="empty">Loading…</div>';
    try{
      const j = await api("/api/friends/invite");
      const url = j.inviteUrl;
      box.innerHTML =
        '<div class="inviteBox">'
        +'<img alt="Invite QR code" width="180" height="180" src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=12&ecc=L&data='+encodeURIComponent(url)+'">'
        +'<input id="fInviteUrl" type="text" readonly value="'+esc(url)+'">'
        +'<div style="display:flex;gap:8px">'
          +'<button class="ghost" id="fCopyBtn" style="margin:0">Copy link</button>'
          +(navigator.share ? '<button class="ghost" id="fShareBtn" style="margin:0">Share…</button>' : '')
        +'</div></div>';
      document.getElementById("fCopyBtn").onclick=()=>{
        const inp=document.getElementById("fInviteUrl"); inp.focus(); inp.select();
        const done=()=>rqToast("Link copied");
        if(navigator.clipboard) navigator.clipboard.writeText(url).then(done, ()=>{ try{ document.execCommand("copy"); done(); }catch(e){} });
        else { try{ document.execCommand("copy"); done(); }catch(e){} }
      };
      const sb=document.getElementById("fShareBtn");
      if(sb) sb.onclick=()=>navigator.share({title:"Add me on Ridge Quest", url}).catch(()=>{});
    }catch(e){ box.innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
  };

  async function loadFriends(){
    const reqEl=document.getElementById("fRequests");
    const listEl=document.getElementById("fList");
    if(!listEl) return; // navigated away
    let j;
    try{ j = await api("/api/friends"); }
    catch(e){ listEl.innerHTML='<div class="empty">Couldn’t load your friends.</div>'; return; }

    const inc=j.incoming||[], out=j.outgoing||[];
    reqEl.innerHTML = (inc.length||out.length)
      ? '<div class="runlist"><h3>Requests</h3>'
        + inc.map(r=>'<div class="runrow" style="flex-wrap:wrap"><span class="name">'+esc(r.name)+'</span>'
            +'<button class="ghost fAccept" data-id="'+esc(r.playerId)+'" style="width:auto;margin:0;padding:6px 12px">Accept</button>'
            +'<button class="ghost fDecline" data-id="'+esc(r.playerId)+'" style="width:auto;margin:0;padding:6px 12px">Decline</button></div>').join("")
        + out.map(r=>'<div class="runrow" style="flex-wrap:wrap"><span class="name">'+esc(r.name)+'</span><span class="meta">waiting…</span>'
            +'<button class="ghost fDecline" data-id="'+esc(r.playerId)+'" style="width:auto;margin:0;padding:6px 12px">Cancel</button></div>').join("")
        + '</div>'
      : "";
    reqEl.querySelectorAll(".fAccept").forEach(b=>b.onclick=async()=>{
      try{ await api("/api/friends/"+encodeURIComponent(b.dataset.id)+"/accept",{method:"POST"}); loadFriends(); }catch(e){ showErr(e.message); }
    });
    reqEl.querySelectorAll(".fDecline").forEach(b=>b.onclick=async()=>{
      try{ await api("/api/friends/"+encodeURIComponent(b.dataset.id)+"/decline",{method:"POST"}); loadFriends(); }catch(e){ showErr(e.message); }
    });

    const friends=j.friends||[];
    // Drop any tracked id that's no longer a friend, then persist the pruned set.
    setTrackFriends(getTrackFriends().filter(id=>friends.some(f=>f.playerId===id)));
    const tracked=getTrackFriends();
    if(!friends.length){ listEl.innerHTML='<div class="empty">No friends yet — add one above.</div>'; return; }
    listEl.innerHTML = friends.map(f=>{
      const dot = f.online ? 'var(--go)' : 'var(--fog)';
      const hint = f.sharing ? 'sharing today' : (f.online ? 'online' : 'offline');
      return '<div class="runrow" style="flex-wrap:wrap">'
        +'<input type="checkbox" class="fTrack" data-id="'+esc(f.playerId)+'"'+(tracked.includes(f.playerId)?' checked':'')
          +' style="width:16px;height:16px;flex:0 0 auto;accent-color:var(--coral)">'
        +'<span class="name">'+esc(f.name)

/* =========================== FOG MAP (R2) ===========================
   Personal fog-of-war map — renders Quest.fogCells (already loaded/kept
   live by the Quest module, tracking or not) as a MapLibre fill layer over
   the same Esri World_Imagery raster basemap geofence-engine.html already
   uses (plain OSM raster tiles have no CORS headers and silently fail —
   see the discovery-osm-tile-cors-block memory, already worked around
   elsewhere in this codebase). A fixed full-viewport overlay, deliberately
   outside .wrap's 520px card width — a map needs the whole screen. */
function fogFeatureCollection(){
  const features=[];
  Quest.fogCells.forEach((state, cell)=>{
    const ring = h3.cellToBoundary(cell, true); // geoJson:true -> [lon,lat] pairs, already closed
    features.push({ type:"Feature", properties:{ state }, geometry:{ type:"Polygon", coordinates:[ring] } });
  });
  return { type:"FeatureCollection", features };
}
// The actual "fog of war" look: fogFeatureCollection() above only ever
// emits a shape for cells you've ALREADY revealed — unrevealed terrain has
// no feature at all, so it just showed the plain satellite basemap,
// indistinguishable from "nothing is fogged." This draws the inverse: one
// world-covering polygon with a hole punched out for every revealed cell,
// so unexplored terrain reads as genuinely dark and revealed terrain shows
// the basemap through (plus the colored fog-fill/fog-line layers on top
// for the skied/seen tint). One hole per cell is fine as disjoint H3 hexes
// never overlap, so nothing here needs union/dissolve logic.
function shroudFeatureCollection(){
  const world = [[-180,-85],[180,-85],[180,85],[-180,85],[-180,-85]];
  const holes=[];
  Quest.fogCells.forEach((state, cell)=>{ holes.push(h3.cellToBoundary(cell, true)); });
  return { type:"FeatureCollection", features:[
    { type:"Feature", properties:{}, geometry:{ type:"Polygon", coordinates:[world, ...holes] } }
  ]};
}
// R10 — "normalize the project so the tiles are over the entire project":
// a player who's only ever walked ONE of a project's several corridors used
// to see one bright hex strip floating alone in an otherwise featureless
// black void — no sense of the project's actual size/shape. Precomputes
// every corridor's own H3 footprint (same k=1 "torch radius" disk
// _revealFog() would eventually paint if you walked it, so the shape never
// jumps when a preview cell later gets genuinely revealed) and renders it as
// a dim, always-on outline UNDER the real fog-fill/fog-line layers. Purely
// client-side/visual — never touches Quest.fogCells, never written to
// player_fog_cell, so R4's viewpoint semantics (state=1 = "seen from a
// viewpoint") stay exactly what they were; this is a third, visually
// distinct layer, not a new fog state.
function corridorPreviewCells(){
  const cells = new Set();
  if(typeof h3 === "undefined") return cells;
  Quest.corridors.forEach(corridor=>{
    QGeo.resamplePath(corridor.path, QUEST_TUNING.CORRIDOR_SAMPLE_STEP_M).forEach(([lat,lon])=>{
      const origin = h3.latLngToCell(lat, lon, QUEST_TUNING.FOG_RESOLUTION);
      h3.gridDisk(origin, 1).forEach(c=>cells.add(c));
    });
  });
  return cells;
}
// cells is optional — pass the already-computed Set when a caller (like
// renderFogMap()) needs both this and questCompletionPct() in the same
// pass, so a project's whole corridor network (every corridor resampled +
// h3'd) isn't walked twice per map open. Falls back to computing it fresh
// so this still works as a standalone call.
function corridorPreviewFeatureCollection(cells){
  const features=[];
  (cells || corridorPreviewCells()).forEach(cell=>{
    const ring = h3.cellToBoundary(cell, true);
    features.push({ type:"Feature", properties:{}, geometry:{ type:"Polygon", coordinates:[ring] } });
  });
  return { type:"FeatureCollection", features };
}
// R11 — "complete %": what fraction of THIS project's own corridor network
// (previewCells — same set corridorPreviewCells() above already computes)
// has this player actually skied/walked (state===2), not just seen from a
// viewpoint (state===1, R4) — a viewpoint grant must never let someone
// "complete" a swath they never set foot on. previewCells IS the
// denominator deliberately (not a looser/tighter buffer): it's the exact
// same k=1-disk shape _revealFog() paints when you actually walk a
// corridor, so 100% is genuinely reachable (a real GPS track is denser
// than the 25m sampling that builds previewCells) without being trivially
// overshootable. Returns null (not 0) for an empty set — a project with no
// corridors, or a bundle that hasn't loaded yet, has no meaningful
// percentage, and null lets the caller hide the stat instead of showing a
// misleading "0%". Pure/no h3 dependency — takes the already-built sets as
// plain arguments so this needs no stubbing to unit-test.
function questCompletionPct(previewCells, fogCells){
  if(!previewCells.size) return null;
  let revealed=0;
  previewCells.forEach(cell=>{ if((fogCells.get(cell)||0)===2) revealed++; });
  return revealed/previewCells.size;
}
// A revealed patch can be a handful of ~66m hexes — easy to miss entirely
// against a fixed zoom:13 view of the whole resort. Fits the initial view to
// the UNION of the corridor network's full extent (so the whole project is
// always in frame, per the same "normalize... entire project" request
// corridorPreviewCells() above addresses) and any actually-revealed cells
// (so real progress reachable outside a corridor — plain GPS wandering,
// _revealFog() has no proximity check — is never cropped out even though it
// isn't part of that union on its own). Falls back to null (caller keeps
// the old fixed ref/zoom view) only when the project has neither.
// bbox of just the authored project content ([[minLon,minLat],[maxLon,maxLat]]) —
// corridor paths + viewpoints + ref, NO revealed fog. Used for HereMarker's
// site gate (a fix / friend outside this + buffer isn't shown) and as the
// base for questMapBounds().
function questContentBounds(){
  const ll=[];
  Quest.corridors.forEach(c=>(c.path||[]).forEach(([lat,lon])=>ll.push([lon,lat])));
  (Quest.viewpoints||[]).forEach(v=>{ if(Array.isArray(v.center)) ll.push([v.center[1], v.center[0]]); });
  if(Array.isArray(Quest.ref)) ll.push([Quest.ref[1], Quest.ref[0]]);
  if(!ll.length) return null;
  let minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
  ll.forEach(([lon,lat])=>{
    if(lon<minLon)minLon=lon; if(lon>maxLon)maxLon=lon;
    if(lat<minLat)minLat=lat; if(lat>maxLat)maxLat=lat;
  });
  if(minLat===0&&maxLat===0&&minLon===0&&maxLon===0) return null;
  return [[minLon,minLat],[maxLon,maxLat]];
}
function questMapBounds(){
  const lonlats=[];
  Quest.corridors.forEach(c=>(c.path||[]).forEach(([lat,lon])=>lonlats.push([lon,lat])));
  Quest.fogCells.forEach((state, cell)=>{ h3.cellToBoundary(cell, true).forEach(pt=>lonlats.push(pt)); });
  if(!lonlats.length) return null;
  let minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
  lonlats.forEach(([lon,lat])=>{
    if(lon<minLon)minLon=lon; if(lon>maxLon)maxLon=lon;
    if(lat<minLat)minLat=lat; if(lat>maxLat)maxLat=lat;
  });
  return [[minLon,minLat],[maxLon,maxLat]];
}
// Pan/zoom-out boundary for "My map" — the resort's own authored footprint
// (questContentBounds(): corridors + viewpoints + ref, not the
// fog-cell-inflated questMapBounds() above, which grows as a player
// wanders) padded generously past the edges. Passed as MapLibre's
// maxBounds, which does double duty: it stops panning past the box AND
// (per MapLibre's own behavior) keeps the camera from zooming out far
// enough to show area outside it — the "set a boundary you can pan or
// zoom out" ask is really one setting, not two.
// Reported live: relative-only padding left "My map" unpannable past a
// sparsely-corridored resort's own drawn footprint (Kicking Horse's real
// terrain is much bigger than whatever's been drawn as corridors so far),
// i.e. "can't pan wide enough... need to move over the mountain". Fix:
// guarantee at least a QUEST_PAN_MIN_RADIUS_KM-radius circle around the
// content's own center, unioned with the pre-existing relative padding
// (so a resort with generous corridor coverage keeps its current, possibly
// larger, bounds — this only ever widens them).
const QUEST_PAN_MIN_RADIUS_KM = 50;
function questPanBounds(){
  const b = questContentBounds();
  if(!b) return null;
  const [[minLon,minLat],[maxLon,maxLat]] = b;
  const padLon = Math.max((maxLon-minLon)*0.9, 0.01);
  const padLat = Math.max((maxLat-minLat)*0.9, 0.01);
  let outMinLon = minLon-padLon, outMinLat = minLat-padLat;
  let outMaxLon = maxLon+padLon, outMaxLat = maxLat+padLat;
  const cLat = (minLat+maxLat)/2, cLon = (minLon+maxLon)/2;
  const dLat = QUEST_PAN_MIN_RADIUS_KM/111.32;
  const dLon = QUEST_PAN_MIN_RADIUS_KM/(111.32*Math.cos(cLat*Math.PI/180));
  outMinLon = Math.min(outMinLon, cLon-dLon); outMinLat = Math.min(outMinLat, cLat-dLat);
  outMaxLon = Math.max(outMaxLon, cLon+dLon); outMaxLat = Math.max(outMaxLat, cLat+dLat);
  return [[outMinLon, outMinLat],[outMaxLon, outMaxLat]];
}

// "Show all runs" overlay for the fog-off + tile-art-off "My map": every
// corridor drawn as a clean trail-map line — thin dark casing so it reads
// on satellite imagery, colour by difficulty, dash pattern by activity so a
// skier can tell downhill / XC / bike / hike / lift apart. Tap for details.
// (The tile-art activity RIBBON graphic isn't used here — at this map's
// zoomed-out framing it tiles into beads and its casing blobs on a
// self-crossing recorded track; a plain line is the readable trail-map fit.)
// "Piste glow" run styling. Downhill runs colour by ski difficulty (black /
// double-black get a graphite core + steel/rose halo and a ◆/◆◆ badge at
// the top); the other trail types (XC ski / bike / hike / city walk / lift)
// get their own hue + dash rhythm. line-dasharray isn't data-driven, so the
// dashed cores are separate filtered layers keyed on a `dash` feature prop.
// `halo` is the soft outer glow colour, `col` the crisp inner stroke. Values
// are tuned to read on bright alpine satellite (snow / pale rock), not just
// dark forest — black / double-black use a white core over a strong near-
// black casing (classic piste-map look) with a saturated steel / rose glow.
const RUN_STYLE_DIFF = {
  "green":        { col:"#57e06f", halo:"#22c246", tier:"" },
  "blue":         { col:"#6bb6ff", halo:"#2f86ff", tier:"" },
  "black":        { col:"#ffffff", halo:"#89b4ff", tier:"black" },
  "double-black": { col:"#ffffff", halo:"#ff6f91", tier:"dblack" },
  "":             { col:"#ffd166", halo:"#ffab1f", tier:"" }   // no difficulty set
};
const RUN_STYLE_ACT = {
  "xcountry":     { col:"#cbb0ff", halo:"#9a63ff", dash:"xc" },
  "bike":         { col:"#ffab5e", halo:"#ff7a1a", dash:"bike" },
  "walking_city": { col:"#bcd8ee", halo:"#79b3dc", dash:"foot" },
  "hike":         { col:"#b3e37f", halo:"#63c23a", dash:"foot" }
};
const RUN_DASH = { "xc":[7,5], "bike":[2.5,3.5], "foot":[1,3.4], "lift":[0.4,2.4] };
// zoom-scaled line width so the glow stays legible from resort-wide framing
// down to a single run.
const _runW = (a,b,c) => ["interpolate",["linear"],["zoom"], 12,a, 15,b, 18,c];
function runStyleFor(c){
  const act = c.activityType || (c.runType === "hike" ? "hike" : "");
  if(RUN_STYLE_ACT[act]){ const s = RUN_STYLE_ACT[act]; return { col:s.col, halo:s.halo, dash:s.dash, tier:"" }; }
  if(c.runType === "lift") return { col:"#c2cec9", halo:"#8ea79c", dash:"lift", tier:"" };
  const s = RUN_STYLE_DIFF[c.difficulty || ""] || RUN_STYLE_DIFF[""];
  return { col:s.col, halo:s.halo, dash:"", tier:s.tier };

// Name label + ◆/◆◆ badge markers — viewport-scoped, and only revealed at
// all once a limited number of corridors are actually in view (rebuilt on
// moveend). This resort's real corridor set (38) never gets anywhere near
// fence-editor.html's Test Mode cap of 60 (_rebuildSimCorridorMarkers()/
// SIM_RUN_MARKER_CAP — a top-N-nearest cap that only helps once a network
// is much bigger than its visible viewport), so a raised cap wouldn't fix
// this: the whole resort-wide "My map" framing shows every corridor at
// once regardless of count. Below RUN_LABEL_MAX_VISIBLE in view, show all
// of them; above it, show none — zoom in to reveal names rather than
// packing an arbitrary top-N of large text labels into a small area.
//
// "In view" is screen-space (map.project() -> pixel coords checked against
// the container), NOT map.getBounds() -- confirmed live that getBounds()'s
// lat/lon box is computed from the four corners of the viewport, and on a
// PITCHED camera (this screen opens tilted) the corners near the horizon
// project to ground points arbitrarily far away, so that box swings
// wildly with tiny pitch/bearing changes — the actual bug behind labels
// reappearing inconsistently on zoom-in. Screen-space projection is
// perspective-correct regardless of pitch/bearing.
const RUN_LABEL_MAX_VISIBLE = 10;
let _runLabelMarkers = [];
let _runLabelMoveTimer = null;
function _rebuildRunLabels(map, cors){
  _runLabelMarkers.forEach(m=>m.remove()); _runLabelMarkers=[];
  if(!cors.length) return;
  const w = map.getContainer().clientWidth, h = map.getContainer().clientHeight;
  const onScreen=c=>{
    const mid=c.path[Math.floor(c.path.length/2)]; // [lat,lon]
    const pt=map.project([mid[1], mid[0]]);
    return pt.x>=0 && pt.x<=w && pt.y>=0 && pt.y<=h;
  };
  const vis=cors.filter(c=>(c.path||[]).length>=2 && onScreen(c));
  if(vis.length>RUN_LABEL_MAX_VISIBLE) return; // too many on screen — zoom in to reveal names
  vis.forEach(c=>{

    const mid = path[Math.floor(path.length/2)];

    _runLabelMarkers.push(new maplibregl.Marker({ element:lbl, anchor:"center" }).setLngLat([mid[1], mid[0]]).addTo(map));
    // ◆ / ◆◆ badge keyed on the run's DIFFICULTY only — an activityType
    // (now NOT NULL DEFAULT 'hike' since migration 0059) used to make

    const tier = (RUN_STYLE_DIFF[c.difficulty || ""] || {}).tier || "";

    }
