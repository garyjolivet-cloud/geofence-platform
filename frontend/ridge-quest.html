// ww_* fields (weather_cache/snow_history) are the White Wall top station —
// confirmed against the scraper (backend/worker.js's scrapeWeather()
// column comment) rather than assumed. Simple 4-way compass direction, per
// request — not the raw degree bearing.
const COMPASS4 = ["N","E","S","W"];
function compass4(deg){ return deg==null ? null : COMPASS4[Math.round(deg/90)%4]; }
function sumSnow(rows,n){
  const slice = rows.slice(0, n); // rows arrive newest-first from /api/snow-history
  if(!slice.length || slice.every(r=>r.hn24_cm==null)) return null;
  return Math.round(slice.reduce((s,r)=>s+(r.hn24_cm||0),0)*10)/10;
}

async function renderConditions(onContinue){
  app.innerHTML = '<div class="card"><h2>Conditions</h2><p class="lead">Loading…</p></div>';
  let now=null, history=[];
  try{ now = await api("/api/weather"); }catch(e){}
  try{ history = await api("/api/snow-history"); }catch(e){ history=[]; }
  const snow24 = history.length ? history[0].hn24_cm : null;
  const snow7 = sumSnow(history,7);
  const snow14 = sumSnow(history,14);
  const dir = now && !now.error ? compass4(now.ww_wind_dir_deg) : null;
  app.innerHTML =
    '<div class="card">'
    +'<h2>Conditions</h2>'
    +'<p class="lead">Check before you head out. Only look at this while stopped and off the trail — see the risk notice you just accepted.</p>'
    +'<div class="now">'
      +'<div class="stat"><b>'+(now&&!now.error&&now.ww_temp_c!=null?now.ww_temp_c+'°':'—')+'</b><span>White Wall top</span></div>'
      +'<div class="stat"><b>'+(now&&!now.error&&now.ww_wind_spd_kph!=null?Math.round(now.ww_wind_spd_kph):'—')+'</b><span>Wind kph'+(dir?' '+dir:'')+'</span></div>'
      +'</div>'
    +'<div class="now">'
      +'<div class="stat"><b>'+(snow24!=null?snow24+'cm':'—')+'</b><span>Last 24h</span></div>'
      +'<div class="stat"><b>'+(snow7!=null?snow7+'cm':'—')+'</b><span>Last 7 days</span></div>'
      +'<div class="stat"><b>'+(snow14!=null?snow14+'cm':'—')+'</b><span>Last 14 days</span></div>'
      +'</div>'
    +'<button class="primary" id="btnCont">Continue</button>'
    +'</div>';
  document.getElementById("btnCont").onclick=onContinue;
}

/* ================ CORRIDOR CROSSING DETECTOR (R1) ================
   Self-contained — local copies of the corridor signed-distance math and
   haversine (same math Geofencer.sd()'s corridor branch and Geo.hav() use
   in geofence-engine.html, copied not imported), same "no coupling to a
   host page's globals" pattern ar-view.js already established. GPSFilter
   (kalman-filter.js) IS reused as-is — that's a real shared module every
   GPS-consuming page in this codebase already loads, not a local copy.

   Zero changes to geofence-engine.html/geofence-sim.html/fence-editor.html:
   this reads corridor geometry from the existing PUBLIC bundle endpoint
   (the same one Fence Editor publishes to and the tour engine reads), and
   classification (ski/lift/hike, direction, speed, vertical) happens here,
   client-side — the server just stores what this reports, same trust model
   this whole platform already uses for zone behavior (Pipeline System:
   "executed locally on the visitor's device", per CLAUDE.md). */

// Which project's corridors to read — separate from RQ_APP_ID (that's the
// player-account app; a project's corridors can live in any project under
// it). Needs a real project id once the mountain's runs are drawn in Fence
// Editor — not a blocker to building this detector.
// R7 — let, not const: renderProjectPicker()'s button handler and boot()'s
// localStorage-fallback resolution both reassign this after the picker
// ships. RQ_APP_ID got the same const->let change at the time (see below);
// this one was missed, so every picker project button silently threw
// "Assignment to constant variable" the instant it tried to reassign this —
// the click handler died right there, RQ_APP_ID had already been set (it's
// the first of the two assignments on that line) but RQ_PROJECT_ID never
// updated, and boot() was never reached. From the outside this looked like
// the button doing nothing at all.
// Real bug found in a 2026-08-21 QA pass: this used to default to the
// literal placeholder string "REPLACE_WITH_QUEST_PROJECT_ID" (a leftover
// from before R7's public picker existed, when a developer had to
// hand-edit this file per deployment). That string is truthy, so boot()'s
// `if(!RQ_APP_ID || !RQ_PROJECT_ID){ renderWorkspacePicker(); return; }`
// check never fired for a genuinely fresh visitor (no URL params, no
// localStorage) — they'd skip the picker entirely and silently try to
// load corridors for a project id that doesn't exist. null matches
// RQ_APP_ID's own default one line above and lets that check work as
// R7 intended.
let RQ_PROJECT_ID = new URLSearchParams(location.search).get("project") || null;
// ?sim=1 reveals the dev-only "Simulate walk" button on Home (Quest.simulateWalk) —
// never shown to a real player by default, opt-in via URL only.
const IS_SIM_MODE = new URLSearchParams(location.search).get("sim") === "1";
// R5 — per-app admin toggle (GET /api/players/me's fogEnabled), set once at
// boot(). Gates ONLY renderFogMap()'s visual layers; Quest._revealFog()'s H3
// tracking and POST /api/fog-cells persistence are never gated by this.
let RQ_FOG_ENABLED = true;

const QUEST_TUNING = {
  MIN_DURATION_S: 8,       // shorter than this = flicker/false start, discard (no run logged)
  MAX_DURATION_S: 5400,    // 90 min — something went wrong (GPS stuck in-band), discard
  SKI_SPEED_MIN_MPS: 2.5,  // ~9 km/h; below this while descending a run = skinning/walking it, not skiing it
  BIKE_SPEED_MIN_MPS: 3.0, // R8 — ~11 km/h; below this while descending a trail = walking/pushing the bike, not riding it
  COOLDOWN_MS: 4000,       // avoid double-counting a lingering crossing at the band edge
  ACCURACY_CAP_M: 40,      // R2: fixes worse than this don't drive fog reveal — same value/reasoning as geofence-engine.html's TUNING.ACCURACY_CAP_M
  FOG_RESOLUTION: 10,      // R2: H3 resolution for fog cells (~66m edge) — see the plan's GPS-accuracy-vs-grid-size reasoning
  VIEWPOINT_RADIUS_M: 15,  // R4: a viewpoint is a spot to stand at, not a zone to cross — small trigger radius
  FOG_CELLS_POST_CHUNK: 500, // R4: /api/fog-cells caps at 500 cells/call; a full viewshed grant is chunked to this size
  // R9 — tripline fix: a corridor only counts as "run" (points logged) once
  // this fraction of ITS OWN length was actually traversed by the crossing,
  // not just clipped. Sampled every CORRIDOR_SAMPLE_STEP_M along the
  // corridor's authored path; a sample counts as hit if the crossing's
  // buffer track passed within corridor width/2 + CORRIDOR_GPS_TOLERANCE_M
  // of it. Fixes the "traverse a bowl, clip 3 chutes" over-crediting bug —
  // a brief clip covers only a sliver of any one chute's own length, well
  // under this threshold, while actually descending it covers nearly all
  // of it. 0.5 is a starting point, not measured: it zeros mid-run drop-ins
  // (traverse in, ski only the bottom half) by design — tune after field
  // testing, same as every other QUEST_TUNING constant.
  CORRIDOR_SAMPLE_STEP_M: 25,
  CORRIDOR_COMPLETION_PCT: 0.5,
  CORRIDOR_GPS_TOLERANCE_M: 15
};

// R12 — the single source of truth for activity key->label, shared by
// Home's activity picker and the Leaderboard's activity tabs, so adding a
// 6th activity later only ever means editing this one list.
const QUEST_ACTIVITIES = [
  { key: "ski", label: "Ski" },
  { key: "hike", label: "Hike" },
  { key: "xcski", label: "XC Ski" },
  { key: "bike", label: "Bike" },
  { key: "drive", label: "Drive" }
];

const QGeo = {
  R: 6371000,
  mPerDegLat: 111320,
  mPerDegLon(lat){ return 111320*Math.cos(lat*Math.PI/180); },
  toXY(p, ref){ return { x:(p[1]-ref[1])*this.mPerDegLon(ref[0]), y:(p[0]-ref[0])*this.mPerDegLat }; },
  haversineM(a,b){ const p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,
            dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180;
            const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
            return 2*this.R*Math.asin(Math.sqrt(x)); },
  segDist(P,A,B){ const vx=B.x-A.x, vy=B.y-A.y, wx=P.x-A.x, wy=P.y-A.y;
            const c1=vx*wx+vy*wy; if(c1<=0) return Math.hypot(wx,wy);
            const c2=vx*vx+vy*vy; if(c2<=c1) return Math.hypot(P.x-B.x,P.y-B.y);
            const t=c1/c2; return Math.hypot(P.x-(A.x+t*vx), P.y-(A.y+t*vy)); },
  // signed distance from p [lat,lon] to a corridor polyline `path` ([lat,lon]
  // pairs), minus half its width — same formula as geofence-engine.html's
  // Geofencer.sd() corridor branch.
  corridorDist(p, corridor, ref){
    const P=this.toXY(p,ref);
    const pts=corridor.path.map(c=>this.toXY(c,ref));
    let best=Infinity;
    for(let i=1;i<pts.length;i++) best=Math.min(best, this.segDist(P,pts[i-1],pts[i]));
    return best - (corridor.widthM||10)/2;
  },
  // Resamples a [lat,lon] polyline into ~stepM-spaced points — same
  // technique Quest.simulateWalk() already uses for synthetic-fix pacing,
  // pulled out here as a shared pure helper for corridorCoverage below.
  resamplePath(path, stepM){
    const pts=[];
    for(let i=1;i<path.length;i++){
      const a=path[i-1], b=path[i];
      const segM=this.haversineM(a,b);
      const steps=Math.max(1, Math.round(segM/stepM));
      for(let s=0;s<steps;s++){
        const f=s/steps;
        pts.push([ a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f ]);
      }
    }
    pts.push(path[path.length-1]);
    return pts;
  },
  // R9 — what fraction of `corridor`'s own length (sampled every stepM) did
  // this crossing's buffer track actually pass within corridor-width/2 +
  // toleranceM of? Distinguishes "skied the whole chute" from "traverse
  // clipped its edge for a few seconds" — both used to log identically as
  // long as they crossed the band at all. Deliberately point-to-buffer-
  // POLYLINE distance (not point-to-nearest-fix): a fast mover's fixes are
  // sparse (~10-15m apart at speed with ~1s GPS intervals), so measuring
  // against raw fix points would under-count a genuine fast descent between
  // fixes; the polyline the fixes trace out doesn't have that gap.
  corridorCoverage(corridor, buffer, stepM, toleranceM){
    const ref = corridor.ref;
    const samples = this.resamplePath(corridor.path, stepM);
    const bufXY = buffer.map(p=>this.toXY([p.lat,p.lon], ref));
    const halfWidth = (corridor.widthM||10)/2;
    let covered=0;
    samples.forEach(s=>{
      const S=this.toXY(s, ref);
      let best=Infinity;
      for(let i=1;i<bufXY.length;i++) best=Math.min(best, this.segDist(S, bufXY[i-1], bufXY[i]));
      if(best <= halfWidth + toleranceM) covered++;
    });
    return samples.length ? covered/samples.length : 0;
  }
};

const Quest = {
  corridors: [],       // [{zoneId,name,difficulty,runType,widthM,path,lengthM,ref}]
  ref: null,            // [lat,lon] project reference point (R2 map center) — set by loadCorridors() regardless of whether any corridor exists
  allowedActivities: null, // R12: this project's activity-relevance filter — null=all, else array of activity strings — set by loadCorridors()
  states: {},           // zoneId -> {phase:"idle"|"inRun", buffer:[fix,...], cooldownUntil}
  fogCells: new Map(),  // R2/R4: h3Cell -> state (2="Visible"/skied; 1="Fog"/seen-from-a-viewpoint) — the player's own local mirror of player_fog_cell
  viewpoints: [],        // R4: [{zoneId,name,center:[lat,lon],cells:[h3cell,...]}]
  enteredViewpoints: new Set(), // zoneId set — a viewpoint grants once per session; the server's upgrade-only upsert makes a duplicate POST harmless but wasteful, so this avoids re-sending every fix while lingering at a viewpoint
  watchId: null,
  onRunLogged: null,    // callback(run) — fired after a run is successfully posted
  onFogUpdated: null,   // callback() — fired whenever fogCells grows, so an open map screen can redraw live
  onStatus: null,       // callback({ok,acc,t}|{ok:false,message}) — fired on every real fix AND on a geolocation error, so Home can show something other than silence when tracking "does nothing" (e.g. permission denied)
  onCoverage: null,     // R9 — callback(corridorName, pct, passed) — fired once per band exit (whether it logged a run or was discarded), so a partial/clipped crossing isn't silent the way a below-threshold discard otherwise would be

  async loadCorridors(){
    try{
      const bundle = await (await fetch(API+"/api/projects/"+encodeURIComponent(RQ_PROJECT_ID)+"/bundle")).json();
      if(bundle.error){ this.corridors=[]; this.viewpoints=[]; return; }
      const ref = bundle.ref || [0,0];
      this.ref = ref;
      // R12 — the per-project "relevant activities" filter, injected
      // server-side into the bundle at read time (it's a project-row
      // column, not part of the published JSON — see worker.js's
      // GET /bundle handler). null = every activity allowed (backward
      // compat default, matches every project that predates this filter).
      this.allowedActivities = bundle.questActivities || null;
      this.corridors = (bundle.zones||[]).map(z=>{
        const target = (z.layers||[]).find(l=>l.kind==="target" && l.geometry && l.geometry.type==="corridor");
        if(!target) return null;
        const path = target.geometry.path;
        let lengthM=0;
        for(let i=1;i<path.length;i++) lengthM += QGeo.haversineM(path[i-1], path[i]);
        return { zoneId:z.id, name:z.name||"Run", difficulty:z.difficulty||null, runType:z.runType||"run",
                 widthM:target.geometry.widthM||10, path, lengthM, ref };
      }).filter(Boolean);
      // R4 — Viewpoint zones: a plain circle stop flagged isViewpoint, with
      // a precomputed viewshedCells list (staff-computed in Fence Editor,
      // never per-player/per-tick). center comes straight from zo.center
      // ([lat,lon], same convention every other zone here already uses).
      this.viewpoints = (bundle.zones||[]).filter(z=>z.isViewpoint && z.center && (z.viewshedCells||[]).length)
        .map(z=>({ zoneId:z.id, name:z.name||"Viewpoint", center:z.center, cells:z.viewshedCells }));
    }catch(e){ this.corridors=[]; this.viewpoints=[]; }
  },

  // R2 — loads the player's already-revealed cells once (session start /
  // map open) so _revealFog() only ever POSTs genuinely NEW cells, not the
  // same disk every tick a player lingers in one spot.
  async loadFogCells(playerId){
    try{
      const j = await api("/api/players/"+playerId+"/fog");
      this.fogCells = new Map((j.cells||[]).map(c=>[c.h3_cell, c.state]));
    }catch(e){ /* keep whatever was already loaded (or empty) — a failed fetch here shouldn't block tracking */ }
  },

  start(onRunLogged, onFogUpdated, onStatus, selectedActivity, onCoverage){
    this.onRunLogged = onRunLogged;
    this.onFogUpdated = onFogUpdated || null;
    this.onStatus = onStatus || null;
    this.onCoverage = onCoverage || null;
    // R8 — defaults to "ski" so anyone who never touches the activity
    // picker (or an older cached page) gets today's exact existing
    // behavior, unchanged.
    this.selectedActivity = selectedActivity || "ski";
    this.states = {};
    GPSFilter.reset();
    if(!navigator.geolocation) return false;
    this.watchId = navigator.geolocation.watchPosition(
      pos=>this._onFix(pos),
      // A denied/unavailable permission used to vanish silently here — the
      // button flips to "Stop tracking" and nothing ever happens again,
      // indistinguishable from a real bug. Surface it instead.
      err=>{ if(this.onStatus) this.onStatus({ok:false, message: err && err.message ? err.message : "location error (code "+(err&&err.code)+")"}); },
      { enableHighAccuracy:true, maximumAge:2000, timeout:15000 }
    );
    return true;
  },
  stop(){
    if(this.watchId!=null){ navigator.geolocation.clearWatch(this.watchId); this.watchId=null; }
  },
  active(){ return this.watchId!=null; },

  _onFix(pos){
    const c=pos.coords;
    const fix = { lat:c.latitude, lon:c.longitude, acc:c.accuracy||30, t:pos.timestamp||Date.now(),
                  alt: c.altitude!=null ? c.altitude : null, altAcc: c.altitudeAccuracy!=null ? c.altitudeAccuracy : null };
    const p = GPSFilter.push(fix);
    this.corridors.forEach(corridor=>this._tick(corridor, p, this.selectedActivity));
    this._revealFog(p, fix.acc);
    this._tickViewpoints(p);
    if(this.onStatus) this.onStatus({ok:true, acc:fix.acc, t:fix.t});
  },

  // ---- DEV/TEST-ONLY: simulate a walk without real GPS -----------------
  // Requested directly ("we need to be able to test this... in the edit
  // test code") after "start tracking does nothing" turned out to mean
  // "nothing happens at a desk with no real movement" — expected, not a
  // bug, but there was no way to exercise the game loop without walking
  // outside. Deliberately built HERE, not as a Fence Editor Test Mode
  // integration: Test Mode driving this would need its own copy of the
  // corridor detector (the exact 3-file-mirror trap this repo's CLAUDE.md
  // already warns about), and still wouldn't exercise the real page, the
  // real player auth, or the real /api/quest-runs + fog persistence calls.
  // Feeding synthetic fixes through the SAME _onFix() the real GPS path
  // uses (including through GPSFilter, not bypassing it) exercises the
  // actual shipped code end-to-end instead of a parallel simulation.
  _simCancelled: false,
  simulateWalk(speedMps, onProgress, onDone, selectedActivity){
    this._simCancelled = false;
    // R8 — defaults to whatever a prior start() set (or "ski") so existing
    // callers/tests that don't pass a fourth arg keep working unchanged.
    this.selectedActivity = selectedActivity || this.selectedActivity || "ski";
    const corridor = this.corridors[0];
    if(!corridor || !corridor.path || corridor.path.length<2){ onDone && onDone("no corridor loaded to walk"); return; }
    const path = corridor.path; // [[lat,lon],...]
    // Resample the path into ~5m steps so speed/timing is controllable,
    // independent of however densely the authored path was drawn.
    const STEP_M = 5;
    const pts=[];
    for(let i=1;i<path.length;i++){
      const a=path[i-1], b=path[i];
      const segM = QGeo.haversineM(a,b);
      const steps = Math.max(1, Math.round(segM/STEP_M));
      for(let s=0;s<steps;s++){
        const f=s/steps;
        pts.push([ a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f ]);
      }
    }
    pts.push(path[path.length-1]);
    this.states = {};
    GPSFilter.reset();
    let i=0, simT=Date.now();
    const stepDtMs = (STEP_M/speedMps)*1000; // simulated time between resampled points
    const tick=()=>{
      if(this._simCancelled) return;
      if(i>=pts.length){ onDone && onDone(null); return; }
      const [lat,lon]=pts[i];
      simT += stepDtMs;
      this._onFix({ coords:{ latitude:lat, longitude:lon, accuracy:8, altitude:null, altitudeAccuracy:null }, timestamp: simT });
      i++;
      if(onProgress) onProgress(i, pts.length);
      setTimeout(tick, 120); // wall-clock pace — fast enough a 400m walk finishes in seconds
    };
    tick();
  },
  cancelSim(){ this._simCancelled = true; },

  // R4 — Viewpoint entry: a plain distance-to-center check (a viewpoint is
  // a spot to stand at, not a zone to cross — no corridor-style band
  // needed). Fires the grant once per session per viewpoint via
  // enteredViewpoints; the server's own upgrade-only upsert would make a
  // repeat POST harmless, this just avoids sending one on every fix while
  // lingering there.
  _tickViewpoints(p){
    this.viewpoints.forEach(vp=>{
      if(this.enteredViewpoints.has(vp.zoneId)) return;
      if(QGeo.haversineM([p.lat,p.lon], vp.center) > QUEST_TUNING.VIEWPOINT_RADIUS_M) return;
      this.enteredViewpoints.add(vp.zoneId);
      this._grantViewshed(vp);
    });
  },

  // R4 — grants a viewpoint's precomputed cell-set at state=1 ("Fog"/seen).
  // Local dedupe must be STATE-AWARE and must never downgrade: a cell
  // already locally at state 2 (actually skied) stays 2 — Math.max, not an
  // overwrite. The server's own MAX() upsert protects the DB regardless,
  // but the local fogCells Map is what the map renderer trusts, so it needs
  // the same invariant. Chunked to FOG_CELLS_POST_CHUNK per call —
  // /api/fog-cells caps at 500 cells/request and a full viewshed can be
  // 1000-2000 cells.
  _grantViewshed(vp){
    const newCells = vp.cells.filter(cell => (this.fogCells.get(cell)||0) < 1);
    if(!newCells.length) return;
    newCells.forEach(cell => this.fogCells.set(cell, Math.max(this.fogCells.get(cell)||0, 1)));
    if(this.onFogUpdated) this.onFogUpdated();
    for(let i=0; i<newCells.length; i+=QUEST_TUNING.FOG_CELLS_POST_CHUNK){
      const chunk = newCells.slice(i, i+QUEST_TUNING.FOG_CELLS_POST_CHUNK);
      api("/api/fog-cells", { method:"POST", body: JSON.stringify({ cells:chunk, state:1 }) }).catch(()=>{});
    }
  },

  // R2 — H3 disk-reveal: mark the fix's own cell plus its k=1 ring (7 cells,
  // ~200m across — the "torch radius" absorbing normal GPS jitter, per the
  // plan's Fog-of-World precedent) as state=2 ("Visible"). Confidence-gated
  // on fix.acc, same "no data = pass, don't act on garbage" convention
  // TUNING.ACCURACY_CAP_M already uses in geofence-engine.html. Only NEW
  // cells (not already in this.fogCells) get POSTed — revisiting already-
  // revealed terrain is a local no-op, not a wasted network call.
  _revealFog(p, acc){
    if(acc > QUEST_TUNING.ACCURACY_CAP_M) return;
    if(typeof h3 === "undefined") return; // CDN script blocked/offline — fail safe, no reveal rather than throw
    const origin = h3.latLngToCell(p.lat, p.lon, QUEST_TUNING.FOG_RESOLUTION);
    const disk = h3.gridDisk(origin, 1);
    const newCells = disk.filter(cell => (this.fogCells.get(cell)||0) < 2);
    if(!newCells.length) return;
    newCells.forEach(cell => this.fogCells.set(cell, 2));
    if(this.onFogUpdated) this.onFogUpdated();
    api("/api/fog-cells", { method:"POST", body: JSON.stringify({ cells:newCells, state:2 }) }).catch(()=>{});
  },

  _tick(corridor, p, selectedActivity){
    const st = this.states[corridor.zoneId] || (this.states[corridor.zoneId] = { phase:"idle", buffer:[], cooldownUntil:0 });
    if(Date.now() < st.cooldownUntil) return;
    const inBand = QGeo.corridorDist([p.lat,p.lon], corridor, corridor.ref) < 0;
    if(st.phase==="idle" && inBand){
      st.phase="inRun"; st.buffer=[p];
    } else if(st.phase==="inRun" && inBand){
      st.buffer.push(p);
    } else if(st.phase==="inRun" && !inBand){
      st.buffer.push(p);
      this._classifyAndLog(corridor, st.buffer, selectedActivity);
      st.phase="idle"; st.buffer=[]; st.cooldownUntil=Date.now()+QUEST_TUNING.COOLDOWN_MS;
    }
  },

  _classifyAndLog(corridor, buffer, selectedActivity){
    if(buffer.length<2) return;
    const first=buffer[0], last=buffer[buffer.length-1];
    const durationS = (last.t-first.t)/1000;
    // R12 — MAX_DURATION_S alone (90 min) silently discarded real long
    // corridor crossings: a genuinely long trail confirmed to take longer
    // than 90 min at a plausible pace (demonstrated live, 2026-08-19, on a
    // ~9.9km corridor at ski pace) would exceed it and vanish with no
    // feedback, indistinguishable from a real GPS-stuck failure. Scale the
    // cap by the corridor's OWN length instead of discarding on a fixed
    // ceiling — 0.5 m/s (~1.8 km/h) is an implausibly slow floor pace, so
    // this only ever RAISES the cap for long corridors, never lowers it for
    // short ones (Math.max keeps the original 90-min floor).
    const maxDurationS = Math.max(QUEST_TUNING.MAX_DURATION_S, (corridor.lengthM||0) / 0.5);
    if(durationS < QUEST_TUNING.MIN_DURATION_S || durationS > maxDurationS) return;

    // R9 — tripline fix: gate on how much of THIS corridor's own length the
    // crossing actually covered, not just whether the band was entered and
    // exited at all. A bowl traverse that clips 3 nearby chutes' bands only
    // covers a sliver of each one's length; a real descent of one covers
    // nearly all of it. See QUEST_TUNING.CORRIDOR_* for the tunable knobs.
    const coverage = QGeo.corridorCoverage(corridor, buffer, QUEST_TUNING.CORRIDOR_SAMPLE_STEP_M, QUEST_TUNING.CORRIDOR_GPS_TOLERANCE_M);
    const coveragePassed = coverage >= QUEST_TUNING.CORRIDOR_COMPLETION_PCT;
    if(this.onCoverage) this.onCoverage(corridor.name, coverage, coveragePassed);
    if(!coveragePassed) return;

    // Direction: which drawn endpoint (path[0]="top" vs path[last]="bottom",
    // by authoring convention) the player was nearer to at entry vs exit —
    // no authored top/bottom triplines needed (R1's scope simplification).
    const endTop = corridor.path[0], endBottom = corridor.path[corridor.path.length-1];
    const nearTop = (pt)=> QGeo.haversineM([pt.lat,pt.lon], endTop) < QGeo.haversineM([pt.lat,pt.lon], endBottom);
    const descending = nearTop(first) && !nearTop(last);
    const ascending = !nearTop(first) && nearTop(last);

    let distanceM=0;
    for(let i=1;i<buffer.length;i++) distanceM += QGeo.haversineM([buffer[i-1].lat,buffer[i-1].lon],[buffer[i].lat,buffer[i].lon]);
    const speeds = buffer.map(p=>p.speed||0);
    const avgSpeedMps = speeds.reduce((a,b)=>a+b,0)/speeds.length;
    const maxSpeedMps = Math.max.apply(null, speeds);
    // Net vertical delta using the EKF's own smoothed altitude (null if no
    // fix in this run ever carried a device altitude reading).
    const verticalM = (first.alt!=null && last.alt!=null) ? (last.alt-first.alt) : null;

    // R8 — selectedActivity is the player's own manual choice (Ski/Hike/
    // Bike/Drive on Home) and is now the PRIMARY driver of classification,
    // with two exceptions that stay authoritative regardless of what was
    // selected: a lift is mechanized transport, physically detected by
    // ascending a runType:"lift" corridor, not something you can "select"
    // your way out of; and a corridor the author explicitly marked
    // runType:"hike" (a real hiking-only trail) stays hike even if a fast
    // trail-runner briefly clears the ski-speed threshold on it.
    let activity;
    if(corridor.runType==="lift"){
      if(!ascending) return; // downhill lift-line foot traffic isn't a lift ride
      activity="lift";
    } else if(corridor.runType==="hike"){
      activity="hike";
    } else if(selectedActivity==="hike" || selectedActivity==="drive" || selectedActivity==="xcski"){
      // xcski (Nordic/cross-country) goes here, not in the ski branch below:
      // Nordic terrain is flat/rolling, so the ski branch's `descending &&`
      // speed-gate would misclassify a real xc outing as hike almost every
      // time — like hike/drive, it's a manual selection with no auto-detect.
      activity=selectedActivity; // manual override, no speed check
    } else if(selectedActivity==="bike"){
      activity = (descending && avgSpeedMps >= QUEST_TUNING.BIKE_SPEED_MIN_MPS) ? "bike" : "hike";
    } else {
      activity = (descending && avgSpeedMps >= QUEST_TUNING.SKI_SPEED_MIN_MPS) ? "ski" : "hike";
    }

    const run = {
      zoneId: corridor.zoneId, runName: corridor.name, difficulty: corridor.difficulty, runType: corridor.runType,
      activity, startedAt: new Date(first.t).toISOString(), endedAt: new Date(last.t).toISOString(),
      durationS, verticalM, distanceM: Math.round(distanceM), avgSpeedMps, maxSpeedMps
    };
    // A failed save here used to vanish silently (bare .catch(()=>{})) — the
    // ONLY feedback a player got about this crossing was onCoverage firing
    // moments ago with passed:true, which is now misleading if the save
    // itself then fails (network blip, server error). onSaveError lets Home
    // correct that with a visible message instead of a run just disappearing
    // with no explanation.
    api("/api/quest-runs", { method:"POST", body: JSON.stringify(run) })
      .then(()=>{ if(this.onRunLogged) this.onRunLogged(run); })
      .catch(()=>{ if(this.onSaveError) this.onSaveError(corridor.name); });
  }
};

/* ============================ HOME ============================ */
function fmtDuration(s){
  s=Math.round(s); const m=Math.floor(s/60), r=s%60;
  return m+":"+String(r).padStart(2,"0");
}
// R3-core — mirrors worker.js's questDateBucket() exactly (fixed -7h,
// non-DST-aware — see the plan's day-bucket note): used client-side only to
// find "today's" row in the /stats response, not to compute anything sent
// to the server.
function questDateBucketClient(date){
  return new Date(date.getTime()-7*3600000).toISOString().slice(0,10);
}
function runRowHtml(r){
  const activity = r.activity;
  const verticalM = r.vertical_m!=null ? r.vertical_m : r.verticalM;
  const distanceM = r.distance_m!=null ? r.distance_m : r.distanceM;
  const meta = [
    fmtDuration(r.duration_s!=null?r.duration_s:r.durationS),
    // R8 — bike/drive score by distance, not vertical (verticalM is null
    // for them) — show whichever the activity actually earned points from.
    (verticalM!=null ? Math.abs(Math.round(verticalM))+"m vert"
      : (distanceM!=null ? (Math.round(distanceM/100)/10)+"km" : null)),
  ].filter(Boolean).join(" · ");
  const points = r.points!=null ? r.points : null;
  const powder = (r.snow_bonus!=null?r.snow_bonus:1) > 1;
  const activityLabel = (QUEST_ACTIVITIES.find(a=>a.key===activity)||{}).label || activity;
  return '<div class="runrow"><span class="badge '+esc(activity)+'">'+esc(activityLabel)+'</span>'
    +'<span class="name">'+esc(r.run_name||r.runName||"Run")+(powder?' ❄':'')+'</span>'
    +'<span class="meta">'+esc(meta)+(points?' · +'+points+' pts':'')+'</span></div>';
}
async function refreshRuns(playerId){
  const listEl=document.getElementById("todayRuns");
  if(!listEl) return;
  try{
    const j = await api("/api/players/"+playerId+"/runs");
    const today = new Date().toDateString();
    const todays = (j.runs||[]).filter(r=>new Date(r.started_at).toDateString()===today);
    listEl.innerHTML = todays.length
      ? todays.map(runRowHtml).join("")
      : '<div class="empty">No runs logged yet today.</div>';
  }catch(e){
    listEl.innerHTML = '<div class="empty">Couldn’t load runs.</div>';
  }
}
// R3-core — today's points/vertical tiles + current streak, both derived
// client-side from GET /api/players/:id/stats's day rows (not stored/
// computed server-side — see the plan's streak-derivation note).
async function refreshStats(playerId){
  const tilesEl=document.getElementById("statsTiles");
  const streakEl=document.getElementById("statsStreak");
  if(!tilesEl) return;
  try{
    const j = await api("/api/players/"+playerId+"/stats");
    const days = j.days||[];
    const byDate = {}; days.forEach(d=>{ byDate[d.date]=d; });
    const todayKey = questDateBucketClient(new Date());
    const today = byDate[todayKey] || { points:0, vertical_m:0 };
    let streak=0, cursor=new Date();
    for(;;){
      const key = questDateBucketClient(cursor);
      const row = byDate[key];
      if(!row || (row.runs_count<=0 && row.lift_rides<=0 && row.hikes<=0)) break;
      streak++;
      cursor = new Date(cursor.getTime()-24*3600000);
    }
    tilesEl.innerHTML =
      '<div class="now">'
      +'<div class="stat"><b>'+Math.round(today.points||0)+'</b><span>Points today</span></div>'
      +'<div class="stat"><b>'+Math.round(Math.abs(today.vertical_m||0))+'m</b><span>Vertical today</span></div>'
      +'</div>';
    if(streakEl) streakEl.textContent = streak>0 ? streak+"-day streak" : "";
  }catch(e){
    tilesEl.innerHTML='';
  }
}
function renderHome(){
  const s=getSession();
  app.innerHTML =
    '<div class="card welcome">'
    +'<p class="go">You’re in.</p>'
    +'<p class="lead">Welcome, '+esc(s.player.displayName||s.player.email)+'. Track runs, reveal the mountain, and climb the leaderboard.</p>'
    +'<div id="statsTiles"></div>'
    +'<p class="scrollhint" id="statsStreak" style="margin-bottom:14px"></p>'
    +'<div class="activityPicker" id="activityPicker" style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">'
      +QUEST_ACTIVITIES.map(a=>'<button class="ghost" data-activity="'+a.key+'" style="flex:1;margin:0">'+a.label+'</button>').join('')
    +'</div>'
    +'<button class="primary trackBtn" id="btnTrack">Start tracking</button>'
    +'<p class="scrollhint" id="gpsStatus" style="margin:6px 0"></p>'
    +'<p class="scrollhint" id="coverageStatus" style="margin:0 0 14px"></p>'
    +(IS_SIM_MODE ? '<button class="ghost" id="btnSim">Simulate walk (test mode)</button>' : '')
    +'<button class="ghost" id="btnMap">My map</button>'
    +'<p class="scrollhint" id="exploredPct" style="margin:6px 0 10px"></p>'
    +'<button class="ghost" id="btnLeaderboard">Leaderboard</button>'
    +'<div class="runlist"><h3>Today</h3><div id="todayRuns"><div class="empty">Loading…</div></div></div>'
    +'<button class="ghost" id="btnConditions">Check conditions again</button>'
    +'<button class="ghost" id="btnSwitchResort">Switch resort</button>'
    +'<button class="ghost" id="btnLogout">Log out</button>'
    +'<button class="danger" id="btnDelete">Delete my account &amp; data</button>'
    +'</div>';
  refreshRuns(s.player.id);
  refreshStats(s.player.id);
  // R11 — completion % needs BOTH corridors (the denominator) and fog
  // cells (the numerator) actually loaded, not just fired off — awaited
  // here instead of the old fire-and-forget pair so the stat has real data
  // by the time it paints, without fetching either one twice.
  (async ()=>{
    await Promise.all([Quest.loadCorridors(), Quest.loadFogCells(s.player.id)]);
    const el = document.getElementById("exploredPct");
    if(!el) return; // navigated away before this resolved
    const pct = questCompletionPct(corridorPreviewCells(), Quest.fogCells);
    el.textContent = pct==null ? "" : Math.round(pct*100)+"% of this map explored (lifetime)";
    // R12 — corridors just (re)loaded, so Quest.allowedActivities now
    // reflects THIS project. Re-apply the filter now that it's fresh (the
    // earlier synchronous call below used whatever was cached from a
    // previous project, if any — harmless flash, corrected here).
    if(typeof applyActivityFilter==="function") applyActivityFilter();
  })();
  const trackBtn=document.getElementById("btnTrack");
  const statusEl=document.getElementById("gpsStatus");
  const coverageEl=document.getElementById("coverageStatus");
  const onStatus=(st)=>{
    if(!statusEl) return;
    statusEl.textContent = st.ok
      ? "last fix "+new Date(st.t).toLocaleTimeString()+", ±"+Math.round(st.acc)+"m"
      : "location error: "+st.message+" — check your browser's location permission for this site";
  };
  // R9 — surfaces every band-exit's coverage check, not just the ones that
  // logged a run: a clipped/partial crossing used to vanish silently the
  // same way a too-short flicker always has, with no way to tell them
  // apart. Sticks until the next crossing (not cleared on Stop) so a player
  // who just finished sees the result of their last run before it scrolls
  // into Today's list.
  const onCoverage=(name, pct, passed)=>{
    if(!coverageEl) return;
    const pctStr = Math.round(pct*100)+"%";
    coverageEl.textContent = passed
      ? name+" — "+pctStr+" ✓ logged"
      : name+" — "+pctStr+" (not enough of it covered to count)";
  };
  // Debug audit, 2026-08-21 — POST /api/quest-runs failing used to be a
  // silent no-op (bare .catch(()=>{})): a real crossing (real vertical/
  // distance/points) would just never appear in Today's list or the
  // leaderboard, with onCoverage having already told the player "✓ logged"
  // moments earlier. Corrects that message rather than leaving it wrong.
  Quest.onSaveError = (name)=>{
    if(!coverageEl) return;
    coverageEl.textContent = name+" — couldn't save to the server (check your connection); this run may not count.";
  };
  // R8 — manual activity choice, remembered across visits so re-selecting
  // "Bike" every session isn't required. Buttons are disabled while
  // tracking is active: switching mid-run would split one crossing's
  // classification across two activities, which _classifyAndLog has no way
  // to reconcile (it only sees the buffer, not a mid-buffer activity change).
  let selectedActivity = localStorage.getItem("rq.activity") || "ski";
  const activityBtns = [...document.querySelectorAll("#activityPicker button")];
  function paintActivityButtons(){
    activityBtns.forEach(b=>{ b.style.borderColor = (b.dataset.activity===selectedActivity) ? "var(--coral)" : ""; });
  }
  // R12 — hides activity buttons this project's staff-set quest_activities
  // filter excludes (null = show all, unchanged default). If the player's
  // REMEMBERED choice (localStorage, could've been set at a different
  // project) isn't in this project's allowed list, fall back to the first
  // allowed one — otherwise the picker would show no selected button at
  // all, and tracking would silently classify under a hidden activity.
  function applyActivityFilter(){
    const allowed = Quest.allowedActivities;
    activityBtns.forEach(b=>{ b.style.display = (!allowed || allowed.includes(b.dataset.activity)) ? "" : "none"; });
    if(allowed && allowed.length && !allowed.includes(selectedActivity)){
      selectedActivity = allowed[0];
      localStorage.setItem("rq.activity", selectedActivity);
    }
    paintActivityButtons();
  }
  applyActivityFilter();
  activityBtns.forEach(b=>{
    b.onclick=()=>{
      if(Quest.active()) return; // disabled while tracking, see comment above
      selectedActivity = b.dataset.activity;
      localStorage.setItem("rq.activity", selectedActivity);
      paintActivityButtons();
    };
  });
  trackBtn.onclick=()=>{
    if(Quest.active()){
      Quest.stop();
      trackBtn.textContent="Start tracking"; trackBtn.classList.remove("tracking");
      statusEl.textContent="";
      activityBtns.forEach(b=>b.style.opacity="1");
    } else {
      statusEl.textContent="waiting for GPS…";
      coverageEl.textContent="";
      const ok=Quest.start(()=>{ refreshRuns(s.player.id); refreshStats(s.player.id); }, null, onStatus, selectedActivity, onCoverage);
      if(!ok){ alert("This device/browser doesn’t support GPS tracking."); return; }
      trackBtn.textContent="Stop tracking"; trackBtn.classList.add("tracking");
      activityBtns.forEach(b=>b.style.opacity="0.4");
    }
  };
  if(IS_SIM_MODE){
    const simBtn=document.getElementById("btnSim");
    simBtn.onclick=()=>{
      if(simBtn.dataset.running){ Quest.cancelSim(); simBtn.textContent="Simulate walk (test mode)"; delete simBtn.dataset.running; statusEl.textContent=""; return; }
      simBtn.dataset.running="1"; simBtn.textContent="Simulating… (tap to cancel)";
      // simulateWalk() doesn't route through start(), so onCoverage needs
      // setting directly here to see the coverage readout during a sim run.
      Quest.onCoverage = onCoverage;
      // Bike needs a pace above BIKE_SPEED_MIN_MPS to actually classify as
      // bike rather than falling back to hike; ski/hike/drive keep the
      // original walking-pace default (drive doesn't speed-gate at all).
      const simSpeed = selectedActivity==="bike" ? 4 : 1.5;
      Quest.simulateWalk(simSpeed,
        (i,total)=>{ statusEl.textContent="simulating: "+i+"/"+total; },
        (err)=>{
          simBtn.textContent="Simulate walk (test mode)"; delete simBtn.dataset.running;
          statusEl.textContent = err ? "simulation: "+err : "simulation complete";
          refreshRuns(s.player.id); refreshStats(s.player.id);
        }, selectedActivity);
    };
  }
  document.getElementById("btnMap").onclick=()=>renderFogMap();
  document.getElementById("btnLeaderboard").onclick=()=>renderLeaderboard();
  document.getElementById("btnConditions").onclick=()=>renderConditions(renderHome);
  document.getElementById("btnSwitchResort").onclick=()=>{ Quest.stop(); renderWorkspacePicker(); };
  document.getElementById("btnLogout").onclick=async()=>{
    Quest.stop();
    try{ await api("/api/players/logout",{method:"POST"}); }catch(e){}
    clearSession(); renderAuth("login");
  };
  document.getElementById("btnDelete").onclick=async()=>{
    if(!confirm("This permanently deletes your Ridge Quest account and everything derived from it. This cannot be undone. Continue?")) return;
    try{
      Quest.stop();
      await api("/api/players/"+s.player.id+"/forget", {method:"POST"});
      clearSession(); renderAuth("login");
    }catch(e){ alert(e.message); }
  };
}

/* ========================= LEADERBOARD (R3-core) ========================= */
// activityFilter drives which stat shows next to points — the API always
// returns both verticalM and distanceM on a per-activity board (never on
// the combined "All" board, which has no distanceM at all), but a per-
// activity row's OTHER field isn't necessarily zero (a ski run's own
// distanceM is real ground covered, just not what scored it) — so which
// one to show is a property of the ACTIVITY, not of which field happens
// to be nonzero. "All" shows points only, same as before this existed.
function leaderboardRowHtml(row, meId, rank, activityFilter){
  const mine = row.playerId===meId;
  const parts = [Math.round(row.points)+' pts'];
  if(activityFilter){
    const usesDistance = activityFilter==="bike"||activityFilter==="drive"||activityFilter==="xcski";
    if(usesDistance && row.distanceM!=null) parts.push((Math.round(row.distanceM/100)/10)+'km');
    else if(!usesDistance && row.verticalM!=null) parts.push(Math.abs(Math.round(row.verticalM))+'m vert');
    if(row.runsCount!=null) parts.push(row.runsCount+(row.runsCount===1?' run':' runs'));
  }
  return '<div class="runrow"'+(mine?' style="border-color:var(--coral)"':'')+'>'
    +'<span class="badge" style="background:var(--rim)">#'+rank+'</span>'
    +'<span class="name">'+esc(row.name)+(mine?' (you)':'')+'</span>'
    +'<span class="meta">'+esc(parts.join(' · '))+'</span></div>';
}
async function renderLeaderboard(mode, activityFilter){
  mode = mode || "daily";
  const s=getSession();
  app.innerHTML =
    '<div class="card">'
    +'<h2>Leaderboard</h2>'
    +'<div style="display:flex;gap:10px;margin-bottom:10px">'
      +'<button class="ghost" id="lbDailyBtn" style="margin:0;'+(mode==="daily"?"border-color:var(--coral)":"")+'">Today</button>'
      +'<button class="ghost" id="lbSeasonBtn" style="margin:0;'+(mode==="season"?"border-color:var(--coral)":"")+'">Season</button>'
    +'</div>'
    // R8 — optional per-activity view, reusing R6's ?activity= filter.
    // "All" (no filter) stays the default, unchanged combined board. R12 —
    // tabs are filtered by this project's quest_activities the same way
    // Home's picker is (null=all); "All" itself always shows regardless,
    // since it's the combined board, not a single activity.
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">'
      +[{key:"",label:"All"}].concat(QUEST_ACTIVITIES.filter(a=>!Quest.allowedActivities || Quest.allowedActivities.includes(a.key)))
        .map(a=>'<button class="ghost" data-act="'+a.key+'" style="margin:0;font-size:12px;padding:6px 10px;'+((activityFilter||"")===a.key?"border-color:var(--coral)":"")+'">'+a.label+'</button>').join('')
    +'</div>'
    +'<div id="lbList"><div class="empty">Loading…</div></div>'
    +'<button class="ghost" id="lbBack">← Back</button>'
    +'</div>';
  document.getElementById("lbBack").onclick=renderHome;
  document.getElementById("lbDailyBtn").onclick=()=>renderLeaderboard("daily", activityFilter);
  document.getElementById("lbSeasonBtn").onclick=()=>renderLeaderboard("season", activityFilter);
  document.querySelectorAll("button[data-act]").forEach(btn=>{
    btn.onclick=()=>renderLeaderboard(mode, btn.dataset.act || null);
  });
  const listEl=document.getElementById("lbList");
  try{
    const base = mode==="daily" ? "/api/leaderboard/daily" : "/api/leaderboard/season";
    const j = await api(activityFilter ? base+"?activity="+encodeURIComponent(activityFilter) : base);
    const board = j.board||[];
    listEl.innerHTML = board.length
      ? board.map((row,i)=>leaderboardRowHtml(row, s.player.id, i+1, activityFilter)).join("")
      : '<div class="empty">No runs logged yet '+(mode==="daily"?"today":"this season")+'.</div>';
  }catch(e){
    listEl.innerHTML = '<div class="empty">Couldn’t load the leaderboard.</div>';
  }
}

/* =========================== FOG MAP (R2) ===========================
   Personal fog-of-war map — renders Quest.fogCells (already loaded/kept
   live by the Quest module, tracking or not) as a MapLibre fill layer over
   the same Esri World_Imagery raster basemap geofence-engine.html already
   uses (plain OSM raster tiles have no CORS headers and silently fail —
   see the discovery-osm-tile-cors-block memory, already worked around
   elsewhere in this codebase). A fixed full-viewport overlay, deliberately
   outside .wrap's 520px card width — a map needs the whole screen. */
function fogFeatureCollection(){
  const features=[];
  Quest.fogCells.forEach((state, cell)=>{
    const ring = h3.cellToBoundary(cell, true); // geoJson:true -> [lon,lat] pairs, already closed
    features.push({ type:"Feature", properties:{ state }, geometry:{ type:"Polygon", coordinates:[ring] } });
  });
  return { type:"FeatureCollection", features };
}
// The actual "fog of war" look: fogFeatureCollection() above only ever
// emits a shape for cells you've ALREADY revealed — unrevealed terrain has
// no feature at all, so it just showed the plain satellite basemap,
// indistinguishable from "nothing is fogged." This draws the inverse: one
// world-covering polygon with a hole punched out for every revealed cell,
// so unexplored terrain reads as genuinely dark and revealed terrain shows
// the basemap through (plus the colored fog-fill/fog-line layers on top
// for the skied/seen tint). One hole per cell is fine as disjoint H3 hexes
// never overlap, so nothing here needs union/dissolve logic.
function shroudFeatureCollection(){
  const world = [[-180,-85],[180,-85],[180,85],[-180,85],[-180,-85]];
  const holes=[];
  Quest.fogCells.forEach((state, cell)=>{ holes.push(h3.cellToBoundary(cell, true)); });
  return { type:"FeatureCollection", features:[
    { type:"Feature", properties:{}, geometry:{ type:"Polygon", coordinates:[world, ...holes] } }
  ]};
}
// R10 — "normalize the project so the tiles are over the entire project":
// a player who's only ever walked ONE of a project's several corridors used
// to see one bright hex strip floating alone in an otherwise featureless
// black void — no sense of the project's actual size/shape. Precomputes
// every corridor's own H3 footprint (same k=1 "torch radius" disk
// _revealFog() would eventually paint if you walked it, so the shape never
// jumps when a preview cell later gets genuinely revealed) and renders it as
// a dim, always-on outline UNDER the real fog-fill/fog-line layers. Purely
// client-side/visual — never touches Quest.fogCells, never written to
// player_fog_cell, so R4's viewpoint semantics (state=1 = "seen from a
// viewpoint") stay exactly what they were; this is a third, visually
// distinct layer, not a new fog state.
function corridorPreviewCells(){
  const cells = new Set();
  if(typeof h3 === "undefined") return cells;
  Quest.corridors.forEach(corridor=>{
    QGeo.resamplePath(corridor.path, QUEST_TUNING.CORRIDOR_SAMPLE_STEP_M).forEach(([lat,lon])=>{
      const origin = h3.latLngToCell(lat, lon, QUEST_TUNING.FOG_RESOLUTION);
      h3.gridDisk(origin, 1).forEach(c=>cells.add(c));
    });
  });
  return cells;
}
// cells is optional — pass the already-computed Set when a caller (like
// renderFogMap()) needs both this and questCompletionPct() in the same
// pass, so a project's whole corridor network (every corridor resampled +
// h3'd) isn't walked twice per map open. Falls back to computing it fresh
// so this still works as a standalone call.
function corridorPreviewFeatureCollection(cells){
  const features=[];
  (cells || corridorPreviewCells()).forEach(cell=>{
    const ring = h3.cellToBoundary(cell, true);
    features.push({ type:"Feature", properties:{}, geometry:{ type:"Polygon", coordinates:[ring] } });
  });
  return { type:"FeatureCollection", features };
}
// R11 — "complete %": what fraction of THIS project's own corridor network
// (previewCells — same set corridorPreviewCells() above already computes)
// has this player actually skied/walked (state===2), not just seen from a
// viewpoint (state===1, R4) — a viewpoint grant must never let someone
// "complete" a swath they never set foot on. previewCells IS the
// denominator deliberately (not a looser/tighter buffer): it's the exact
// same k=1-disk shape _revealFog() paints when you actually walk a
// corridor, so 100% is genuinely reachable (a real GPS track is denser
// than the 25m sampling that builds previewCells) without being trivially
// overshootable. Returns null (not 0) for an empty set — a project with no
// corridors, or a bundle that hasn't loaded yet, has no meaningful
// percentage, and null lets the caller hide the stat instead of showing a
// misleading "0%". Pure/no h3 dependency — takes the already-built sets as
// plain arguments so this needs no stubbing to unit-test.
function questCompletionPct(previewCells, fogCells){
  if(!previewCells.size) return null;
  let revealed=0;
  previewCells.forEach(cell=>{ if((fogCells.get(cell)||0)===2) revealed++; });
  return revealed/previewCells.size;
}
// A revealed patch can be a handful of ~66m hexes — easy to miss entirely
// against a fixed zoom:13 view of the whole resort. Fits the initial view to
// the UNION of the corridor network's full extent (so the whole project is
// always in frame, per the same "normalize... entire project" request
// corridorPreviewCells() above addresses) and any actually-revealed cells
// (so real progress reachable outside a corridor — plain GPS wandering,
// _revealFog() has no proximity check — is never cropped out even though it
// isn't part of that union on its own). Falls back to null (caller keeps
// the old fixed ref/zoom view) only when the project has neither.
function questMapBounds(){
  const lonlats=[];
  Quest.corridors.forEach(c=>(c.path||[]).forEach(([lat,lon])=>lonlats.push([lon,lat])));
  Quest.fogCells.forEach((state, cell)=>{ h3.cellToBoundary(cell, true).forEach(pt=>lonlats.push(pt)); });
  if(!lonlats.length) return null;
  let minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
  lonlats.forEach(([lon,lat])=>{
    if(lon<minLon)minLon=lon; if(lon>maxLon)maxLon=lon;
    if(lat<minLat)minLat=lat; if(lat>maxLat)maxLat=lat;
  });
  return [[minLon,minLat],[maxLon,maxLat]];
}
function renderFogMap(){
  if(!Quest.ref){
    app.innerHTML =
      '<div class="fogMapOverlay"><button class="ghost fogMapBack" id="fogBack">← Back</button>'
      +'<div class="msg" style="padding-top:120px">Map isn’t available yet — this resort’s runs haven’t been configured.</div></div>';
    document.getElementById("fogBack").onclick=renderHome;
    return;
  }
  // R11 — completion % is a number derived from tracking (Quest.fogCells),
  // not a fog VISUAL — deliberately NOT gated behind RQ_FOG_ENABLED the way
  // the legend below is, matching R5's own contract that fog tracking never
  // stops, only the shroud/hex drawing does. Both sets are already loaded
  // by the time this screen can even be reached (Home awaits them before
  // "My map" is clickable), so this is a plain sync call, no fetch needed.
  const previewCells = corridorPreviewCells();
  const completionPct = questCompletionPct(previewCells, Quest.fogCells);
  app.innerHTML =
    '<div class="fogMapOverlay"><div id="fogMap"></div>'
    +'<button class="ghost fogMapBack" id="fogBack">← Back</button>'
    +(completionPct!=null ? '<div class="fogMapLegend" style="left:auto;right:14px">'+Math.round(completionPct*100)+'% explored</div>' : '')
    +(RQ_FOG_ENABLED ? '<div class="fogMapLegend"><span><i style="background:var(--go)"></i>Skied</span><span><i style="background:var(--ice)"></i>Seen</span><span><i style="background:var(--ice);opacity:.3"></i>Trail map</span></div>' : '')
    +'</div>';
  // Bind Back FIRST, before anything that can throw (maplibregl failing to
  // load over a spotty connection, WebGL unavailable, etc.) — otherwise an
  // exception here aborts the script before the button's handler is ever
  // attached, leaving a dead "← Back" button with no way out of the map.
  document.getElementById("fogBack").onclick=()=>{ Quest.onFogUpdated=null; renderHome(); };
  try{
    const map = new maplibregl.Map({
      container:"fogMap",
      style:{ version:8,
        sources:{ base:{ type:"raster",
          tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
          tileSize:256, attribution:"Esri, Maxar" } },
        layers:[{ id:"base", type:"raster", source:"base" }] },
      center:[Quest.ref[1], Quest.ref[0]], zoom:13
    });
    map.addControl(new maplibregl.NavigationControl());
    const initialBounds = questMapBounds();
    if(initialBounds) map.fitBounds(initialBounds, { padding:70, maxZoom:17, duration:0 });
    function syncSource(){
      const shroudSrc = map.getSource("shroud");
      if(shroudSrc) shroudSrc.setData(shroudFeatureCollection());
      const src = map.getSource("fog");
      if(src) src.setData(fogFeatureCollection());
    }
    map.on("load", ()=>{
      // R5 — admin-gated: fogFeatureCollection()/shroudFeatureCollection()
      // stay pure/untouched either way (Quest.fogCells itself is never
      // gated — only whether it gets DRAWN here is). When off, this whole
      // block is simply skipped: just the plain satellite basemap shows.
      if(!RQ_FOG_ENABLED) return;
      // Shroud goes in FIRST (and its layer added first) so it paints
      // underneath the colored fog-fill/fog-line layers below.
      map.addSource("shroud", { type:"geojson", data: shroudFeatureCollection() });
      map.addLayer({ id:"shroud-fill", type:"fill", source:"shroud",
        paint:{ "fill-color":"#050810", "fill-opacity":0.72 } });
      // R10 — dim, always-on corridor-network outline, drawn ON TOP of the
      // shroud (so it's visible through the dark) but UNDER the real
      // fog-fill/fog-line below (so actually-earned progress stays the most
      // prominent thing on screen). Static for the life of this map screen —
      // Quest.corridors doesn't change mid-session, so unlike shroud/fog
      // this never needs a place in syncSource()'s live-redraw.
      map.addSource("corridorPreview", { type:"geojson", data: corridorPreviewFeatureCollection(previewCells) });
      map.addLayer({ id:"corridorPreview-fill", type:"fill", source:"corridorPreview",
        paint:{ "fill-color":"#8fb6d4", "fill-opacity":0.14 } });
      map.addLayer({ id:"corridorPreview-line", type:"line", source:"corridorPreview",
        paint:{ "line-color":"#8fb6d4", "line-width":1, "line-opacity":0.3 } });
      map.addSource("fog", { type:"geojson", data: fogFeatureCollection() });
      map.addLayer({ id:"fog-fill", type:"fill", source:"fog",
        paint:{ "fill-color":["match",["get","state"],2,"#38e0a6",1,"#8fb6d4","transparent"], "fill-opacity":0.5 } });
      map.addLayer({ id:"fog-line", type:"line", source:"fog",
        paint:{ "line-color":["match",["get","state"],2,"#38e0a6",1,"#8fb6d4","transparent"], "line-width":1.5, "line-opacity":0.8 } });
    });
    // Live redraw as new cells get revealed WHILE this screen is open
    // (tracking may already be running from Home) — cleared on back-out so
    // a later fix, after navigating away, doesn't try to touch a torn-down
    // map instance. Left null when fog is admin-disabled: there's no source
    // to sync into (map.on("load") returned early above), and Quest itself
    // keeps tracking regardless — this only controls the redraw callback.
    if(RQ_FOG_ENABLED) Quest.onFogUpdated = syncSource;
  }catch(e){
    document.getElementById("fogMap").outerHTML =
      '<div class="msg" style="padding-top:120px">Map couldn’t load (connection or device issue) — try again from a better signal.</div>';
  }
}

/* ============================== BOOT ============================== */
async function boot(){
  // R7 resolution, in order: explicit URL params always win (unchanged from
  // before this phase) > a remembered rq.workspace pick > an existing
  // session's own appId (so a player who's already active before this
  // phase shipped isn't dropped back to a picker on their next visit — it
  // only needs to ask for a PROJECT, not force a fresh login). A
  // project-only URL (?project= with no ?app=) — the exact shape of every
  // link handed out earlier this session — keeps resolving to
  // "golden-nordic" as a narrow backward-compat default, so those links
  // don't break; a truly bare /quest with NEITHER param falls through to
  // the full picker instead, which is the actual point of this phase.
  if(!RQ_APP_ID || !RQ_PROJECT_ID){
    const w = getWorkspace();
    if(w){
      if(!RQ_APP_ID && w.appId) RQ_APP_ID = w.appId;
      if(!RQ_PROJECT_ID && w.projectId) RQ_PROJECT_ID = w.projectId;
    }
  }
  if(!RQ_APP_ID){
    const existing = getSession();
    if(existing && existing.token && existing.player && existing.player.appId) RQ_APP_ID = existing.player.appId;
  }
  if(!RQ_APP_ID && RQ_PROJECT_ID) RQ_APP_ID = "golden-nordic";
  if(!RQ_APP_ID || !RQ_PROJECT_ID){ renderWorkspacePicker(); return; }

  const s=getSession();
  if(!s || !s.token){ renderAuth("login"); return; }
  app.innerHTML = '<div class="msg">Loading…</div>';
  let me;
  try{
    me = await api("/api/players/me"); // validates the session is still live
  }catch(e){
    clearSession(); renderAuth("login"); return;
  }
  RQ_FOG_ENABLED = me.fogEnabled !== false;
  // Session/reconciliation: player_account is unique per (app_id,email),
  // not globally — switching workspace means switching account. If the
  // session's own appId no longer matches the currently-resolved
  // RQ_APP_ID (e.g. just picked a different resort), there's no cross-app
  // account linking by design — force fresh login/signup under the new app.
  if(me.appId !== RQ_APP_ID){ clearSession(); renderAuth("login"); return; }
  const gateOk = await runGate();
  if(!gateOk) return; // runGate's own screens handle re-entry
  renderConditions(renderHome);
}
boot();
</script>
