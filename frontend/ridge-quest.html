function renderGateScreen(g, onDone){
  const idx = GATE_SCOPES.indexOf(g);
  app.innerHTML =
    '<div class="card">'
    +'<div class="steps">'+GATE_SCOPES.map((s,i)=>'<span class="'+(i<idx?"done":i===idx?"active":"")+'"></span>').join('')+'</div>'
    +'<h2>'+esc(g.title)+'</h2>'
    +'<p class="lead">Step '+(idx+1)+' of '+GATE_SCOPES.length+' — required before you can play.</p>'
    +'<div class="doc" id="docBody">'+g.body+'</div>'
    +'<div class="scrollhint" id="scrollHint">Scroll to the bottom to continue</div>'
    +'<button class="primary" id="btnAccept" disabled>I have read and accept</button>'
    +'</div>';
  const doc=document.getElementById("docBody");
  const btn=document.getElementById("btnAccept");
  const hint=document.getElementById("scrollHint");
  function checkScrolled(){
    // 4px slack for sub-pixel rounding across browsers.
    const atBottom = doc.scrollTop + doc.clientHeight >= doc.scrollHeight - 4;
    if(atBottom){ btn.disabled=false; hint.style.visibility="hidden"; }
  }
  doc.addEventListener("scroll", checkScrolled);
  // A short document that never needs scrolling shouldn't trap the player —
  // check once on render too.
  checkScrolled();
  btn.onclick=async()=>{
    btn.disabled=true;
    try{
      const s=getSession();
      await api("/api/players/"+s.player.id+"/consent", {method:"POST", body:JSON.stringify({scope:g.scope})});
      onDone();
    }catch(e){
      btn.disabled=false;
      const errDiv=document.createElement("div"); errDiv.className="err"; errDiv.textContent=e.message;
      doc.parentElement.insertBefore(errDiv, hint);
    }
  };
}

async function runGate(){
  const s=getSession();
  const status = await api("/api/players/"+s.player.id+"/consent");
  if(status.complete){ return true; }
  return new Promise((resolve)=>{
    function next(){
      const pending = GATE_SCOPES.find(g=>status.missing.includes(g.scope));
      if(!pending){ resolve(true); return; }
      renderGateScreen(pending, ()=>{
        status.missing = status.missing.filter(sc=>sc!==pending.scope);
        next();
      });
    }
    next();
  });
}

/* ============================ CONDITIONS ============================ */
// ww_* fields (weather_cache/snow_history) are the White Wall top station —
// confirmed against the scraper (backend/worker.js's scrapeWeather()
// column comment) rather than assumed. Simple 4-way compass direction, per
// request — not the raw degree bearing.
const COMPASS4 = ["N","E","S","W"];
function compass4(deg){ return deg==null ? null : COMPASS4[Math.round(deg/90)%4]; }
function sumSnow(rows,n){
  const slice = rows.slice(0, n); // rows arrive newest-first from /api/snow-history
  if(!slice.length || slice.every(r=>r.hn24_cm==null)) return null;
  return Math.round(slice.reduce((s,r)=>s+(r.hn24_cm||0),0)*10)/10;
}

async function renderConditions(onContinue){
  app.innerHTML = '<div class="card"><h2>Conditions</h2><p class="lead">Loading…</p></div>';
  let now=null, history=[];
  try{ now = await api("/api/weather"); }catch(e){}
  try{ history = await api("/api/snow-history"); }catch(e){ history=[]; }
  const snow24 = history.length ? history[0].hn24_cm : null;
  const snow7 = sumSnow(history,7);
  const snow14 = sumSnow(history,14);
  const dir = now && !now.error ? compass4(now.ww_wind_dir_deg) : null;
  app.innerHTML =
    '<div class="card">'
    +'<h2>Conditions</h2>'
    +'<p class="lead">Check before you head out. Only look at this while stopped and off the trail — see the risk notice you just accepted.</p>'
    +'<div class="now">'
      +'<div class="stat"><b>'+(now&&!now.error&&now.ww_temp_c!=null?now.ww_temp_c+'°':'—')+'</b><span>White Wall top</span></div>'
      +'<div class="stat"><b>'+(now&&!now.error&&now.ww_wind_spd_kph!=null?Math.round(now.ww_wind_spd_kph):'—')+'</b><span>Wind kph'+(dir?' '+dir:'')+'</span></div>'
      +'</div>'
    +'<div class="now">'
      +'<div class="stat"><b>'+(snow24!=null?snow24+'cm':'—')+'</b><span>Last 24h</span></div>'
      +'<div class="stat"><b>'+(snow7!=null?snow7+'cm':'—')+'</b><span>Last 7 days</span></div>'
      +'<div class="stat"><b>'+(snow14!=null?snow14+'cm':'—')+'</b><span>Last 14 days</span></div>'
      +'</div>'
    +'<button class="primary" id="btnCont">Continue</button>'
    +'</div>';
  document.getElementById("btnCont").onclick=onContinue;
}

/* ================ CORRIDOR CROSSING DETECTOR (R1) ================
   Self-contained — local copies of the corridor signed-distance math and
   haversine (same math Geofencer.sd()'s corridor branch and Geo.hav() use
   in geofence-engine.html, copied not imported), same "no coupling to a
   host page's globals" pattern ar-view.js already established. GPSFilter
   (kalman-filter.js) IS reused as-is — that's a real shared module every
   GPS-consuming page in this codebase already loads, not a local copy.

   Zero changes to geofence-engine.html/geofence-sim.html/fence-editor.html:
   this reads corridor geometry from the existing PUBLIC bundle endpoint
   (the same one Fence Editor publishes to and the tour engine reads), and
   classification (ski/lift/hike, direction, speed, vertical) happens here,
   client-side — the server just stores what this reports, same trust model
   this whole platform already uses for zone behavior (Pipeline System:
   "executed locally on the visitor's device", per CLAUDE.md). */

// Which project's corridors to read — separate from RQ_APP_ID (that's the
// player-account app; a project's corridors can live in any project under
// it). Needs a real project id once the mountain's runs are drawn in Fence
// Editor — not a blocker to building this detector.
// R7 — let, not const: renderProjectPicker()'s button handler and boot()'s
// localStorage-fallback resolution both reassign this after the picker
// ships. RQ_APP_ID got the same const->let change at the time (see below);
// this one was missed, so every picker project button silently threw
// "Assignment to constant variable" the instant it tried to reassign this —
// the click handler died right there, RQ_APP_ID had already been set (it's
// the first of the two assignments on that line) but RQ_PROJECT_ID never
// updated, and boot() was never reached. From the outside this looked like
// the button doing nothing at all.
// Real bug found in a 2026-08-21 QA pass: this used to default to the
// literal placeholder string "REPLACE_WITH_QUEST_PROJECT_ID" (a leftover
// from before R7's public picker existed, when a developer had to
// hand-edit this file per deployment). That string is truthy, so boot()'s
// `if(!RQ_APP_ID || !RQ_PROJECT_ID){ renderWorkspacePicker(); return; }`
// check never fired for a genuinely fresh visitor (no URL params, no
// localStorage) — they'd skip the picker entirely and silently try to
// load corridors for a project id that doesn't exist. null matches
// RQ_APP_ID's own default one line above and lets that check work as
// R7 intended.
let RQ_PROJECT_ID = new URLSearchParams(location.search).get("project") || null;
// ?sim=1 reveals the dev-only "Simulate walk" button on Home (Quest.simulateWalk) —
// never shown to a real player by default, opt-in via URL only.
const IS_SIM_MODE = new URLSearchParams(location.search).get("sim") === "1";
// R5 — per-app admin toggle (GET /api/players/me's fogEnabled), set once at
// boot(). Gates ONLY renderFogMap()'s visual layers; Quest._revealFog()'s H3
// tracking and POST /api/fog-cells persistence are never gated by this.
let RQ_FOG_ENABLED = true;
// "Share my location with friends today" state — player_account.share_until
// (epoch ms) mirrored client-side: set by boot() from /api/players/me and by
// Home's toggle (POST /api/share). While it's in the future AND tracking is
// running, Quest.onShare piggybacks the fix stream to POST /api/presence.
// rqLastShareAt throttles that POST to ~7s (matches geofence-engine's ping).
let RQ_SHARE_UNTIL = null;
let rqLastShareAt = 0;
// Friends checked for live map tracking — capped, persisted like rq.activity.
const RQ_MAX_TRACK = 6;
function getTrackFriends(){ try{ return JSON.parse(localStorage.getItem("rq.trackFriends")||"[]"); }catch(e){ return []; } }
function setTrackFriends(ids){ localStorage.setItem("rq.trackFriends", JSON.stringify(ids.slice(0, RQ_MAX_TRACK))); }

// Corridor Guard per-chute selection (press-and-hold a run on "My map" to
// arm/disarm it, 2026-09-20) — a rider typically only wants ONE chute
// watched at a time (drop in, ride the lift back up, disarm, pick a new
// one), not a tone firing for every incidental crossing on a project with
// dozens of runs. Persisted per-device (survives an app reload between
// runs/lift rides), same "small localStorage set" precedent as
// rq.trackFriends above. Purely a runtime OUTPUT filter — chute-guard.js
// keeps tracking every corridor's real state regardless (see
// ChuteGuard.getActiveAlarm(isEligible)'s own comment: this is the same
// Battery Saver lesson — filter the alarm output, not chute-guard.js's
// input, or isOnLift() breaks too).
function getGuardedCorridors(){ try{ return JSON.parse(localStorage.getItem("rq.guardedCorridors")||"[]"); }catch(e){ return []; } }
function setGuardedCorridors(ids){ try{ localStorage.setItem("rq.guardedCorridors", JSON.stringify(ids)); }catch(e){} }

// Battery Saver ("lift mode") — how long the raw ChuteGuard.isOnLift()
// signal has to hold steady, one way or the other, before Quest._onFix
// actually flips liftModeActive in "auto" mode. Real fixes land roughly
// every 1-2s (watchPosition's own maximumAge:2000), so this is ~4-8
// consistent fixes — long enough to ignore a momentary edge-graze (e.g.
// walking past a lift's base station without boarding), short enough to
// engage well within a normal multi-minute lift ride.
const LIFT_MODE_DEBOUNCE_MS = 8000;

// Elevation-checkpoint running total — persisted so an app reload mid-day
// doesn't lose it. Shape: {day, total, lastElevM, lastAt, lastZoneId}, where
// `day` is a questDateBucketClient() string; a different `day` on read means
// a new ski day and the total resets. Same "persist like rq.activity" idea
// as rq.trackFriends above.
function getCheckpointVert(){ try{ return JSON.parse(localStorage.getItem("rq.checkpointVert")||"null"); }catch(e){ return null; } }
function setCheckpointVert(o){ try{ localStorage.setItem("rq.checkpointVert", JSON.stringify(o)); }catch(e){} }

const QUEST_TUNING = {
  MIN_DURATION_S: 8,       // shorter than this = flicker/false start, discard (no run logged)
  MAX_DURATION_S: 5400,    // 90 min — something went wrong (GPS stuck in-band), discard
  SKI_SPEED_MIN_MPS: 2.5,  // ~9 km/h; below this while descending a run = skinning/walking it, not skiing it
  BIKE_SPEED_MIN_MPS: 3.0, // R8 — ~11 km/h; below this while descending a trail = walking/pushing the bike, not riding it
  COOLDOWN_MS: 4000,       // avoid double-counting a lingering crossing at the band edge
  NARRATE_HYSTERESIS_M: 3, // in-band test used a hard dist<0 boundary with zero tolerance, so GPS jitter right at a corridor's edge (e.g. lingering near the far end before actually leaving) could flip idle<->inRun rapidly and re-speak the corridor's narration on what was really just noise, not a genuine re-entry. Schmitt-trigger margin: entering needs dist< -this (clearly inside), staying entered only exits once dist>=this (clearly outside) — see _tick() below.
  ACCURACY_CAP_M: 40,      // R2: fixes worse than this don't drive fog reveal — same value/reasoning as geofence-engine.html's TUNING.ACCURACY_CAP_M
  FOG_RESOLUTION: 10,      // R2: H3 resolution for fog cells (~66m edge) — see the plan's GPS-accuracy-vs-grid-size reasoning
  VIEWPOINT_RADIUS_M: 15,  // R4: a viewpoint is a spot to stand at, not a zone to cross — small trigger radius
  FOG_CELLS_POST_CHUNK: 500, // R4: /api/fog-cells caps at 500 cells/call; a full viewshed grant is chunked to this size
  // R9 — tripline fix: a corridor only counts as "run" (points logged) once
  // this fraction of ITS OWN length was actually traversed by the crossing,
  // not just clipped. Sampled every CORRIDOR_SAMPLE_STEP_M along the
  // corridor's authored path; a sample counts as hit if the crossing's
  // buffer track passed within corridor width/2 + CORRIDOR_GPS_TOLERANCE_M
  // of it. Fixes the "traverse a bowl, clip 3 chutes" over-crediting bug —
  // a brief clip covers only a sliver of any one chute's own length, well
  // under this threshold, while actually descending it covers nearly all
  // of it. 0.5 is a starting point, not measured: it zeros mid-run drop-ins
  // (traverse in, ski only the bottom half) by design — tune after field
  // testing, same as every other QUEST_TUNING constant.
  CORRIDOR_SAMPLE_STEP_M: 25,
  CORRIDOR_COMPLETION_PCT: 0.5,
  CORRIDOR_GPS_TOLERANCE_M: 15,
  // --- Elevation checkpoints (headline vertical, _tickCheckpoints) ---
  CHECKPOINT_RADIUS_M: 20,        // a pass-through spot on a lift/run line — a touch wider than VIEWPOINT_RADIUS_M since you're moving through it, not standing
  CHECKPOINT_COOLDOWN_MS: 60000,  // per-checkpoint: a lingering GPS hit can't re-credit the same lap
  CHECKPOINT_STALE_MS: 1200000    // 20 min — beyond this gap, two checkpoint elevations aren't one trustworthy descent (lunch, lift maze, overnight)
};

// R12 — the single source of truth for activity key->label, shared by
// Home's activity picker and the Leaderboard's activity tabs, so adding a
// 6th activity later only ever means editing this one list.
const QUEST_ACTIVITIES = [
  { key: "ski", label: "Ski" },
  { key: "hike", label: "Hike" },
  { key: "xcski", label: "XC Ski" },
  { key: "bike", label: "Bike" },
  { key: "drive", label: "Drive" }
];

const QGeo = {
  R: 6371000,
  mPerDegLat: 111320,
  mPerDegLon(lat){ return 111320*Math.cos(lat*Math.PI/180); },
  toXY(p, ref){ return { x:(p[1]-ref[1])*this.mPerDegLon(ref[0]), y:(p[0]-ref[0])*this.mPerDegLat }; },
  haversineM(a,b){ const p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,
            dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180;
            const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
            return 2*this.R*Math.asin(Math.sqrt(x)); },
  segDist(P,A,B){ const vx=B.x-A.x, vy=B.y-A.y, wx=P.x-A.x, wy=P.y-A.y;
            const c1=vx*wx+vy*wy; if(c1<=0) return Math.hypot(wx,wy);
            const c2=vx*vx+vy*vy; if(c2<=c1) return Math.hypot(P.x-B.x,P.y-B.y);
            const t=c1/c2; return Math.hypot(P.x-(A.x+t*vx), P.y-(A.y+t*vy)); },
  // signed distance from p [lat,lon] to a corridor polyline `path` ([lat,lon]
  // pairs), minus half its width — same formula as geofence-engine.html's
  // Geofencer.sd() corridor branch.
  corridorDist(p, corridor, ref){
    const P=this.toXY(p,ref);
    const pts=corridor.path.map(c=>this.toXY(c,ref));
    let best=Infinity;
    for(let i=1;i<pts.length;i++) best=Math.min(best, this.segDist(P,pts[i-1],pts[i]));
    return best - (corridor.widthM||10)/2;
  },
  // Resamples a [lat,lon] polyline into ~stepM-spaced points — same
  // technique Quest.simulateWalk() already uses for synthetic-fix pacing,
  // pulled out here as a shared pure helper for corridorCoverage below.
  resamplePath(path, stepM){
    const pts=[];
    for(let i=1;i<path.length;i++){
      const a=path[i-1], b=path[i];
      const segM=this.haversineM(a,b);
      const steps=Math.max(1, Math.round(segM/stepM));
      for(let s=0;s<steps;s++){
        const f=s/steps;
        pts.push([ a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f ]);
      }
    }
    pts.push(path[path.length-1]);
    return pts;
  },
  // R9 — what fraction of `corridor`'s own length (sampled every stepM) did
  // this crossing's buffer track actually pass within corridor-width/2 +
  // toleranceM of? Distinguishes "skied the whole chute" from "traverse
  // clipped its edge for a few seconds" — both used to log identically as
  // long as they crossed the band at all. Deliberately point-to-buffer-
  // POLYLINE distance (not point-to-nearest-fix): a fast mover's fixes are
  // sparse (~10-15m apart at speed with ~1s GPS intervals), so measuring
  // against raw fix points would under-count a genuine fast descent between
  // fixes; the polyline the fixes trace out doesn't have that gap.
  corridorCoverage(corridor, buffer, stepM, toleranceM){
    const ref = corridor.ref;
    const samples = this.resamplePath(corridor.path, stepM);
    const bufXY = buffer.map(p=>this.toXY([p.lat,p.lon], ref));
    const halfWidth = (corridor.widthM||10)/2;
    let covered=0;
    samples.forEach(s=>{
      const S=this.toXY(s, ref);
      let best=Infinity;
      for(let i=1;i<bufXY.length;i++) best=Math.min(best, this.segDist(S, bufXY[i-1], bufXY[i]));
      if(best <= halfWidth + toleranceM) covered++;
    });
    return samples.length ? covered/samples.length : 0;
  }
};

const Quest = {
  corridors: [],       // [{zoneId,name,difficulty,runType,widthM,path,lengthM,ref}]
  _offsite: false,     // set by the "My map" HereMarker site gate — true => device is >10 km outside the run network; _onFix pauses ticks/fog/sharing
  ref: null,            // [lat,lon] project reference point (R2 map center) — set by loadCorridors() regardless of whether any corridor exists
  allowedActivities: null, // R12: this project's activity-relevance filter — null=all, else array of activity strings — set by loadCorridors()
  threeDEnabled: false, // workspace 3D-terrain flag (bundle.threeDEnabled, injected server-side) — gates 3D terrain on "My map"
  season: null,         // project.season (bundle.season, injected server-side) — My map applies the winter treatment only when this is 'winter' (same rule as every other map view)
  states: {},           // zoneId -> {phase:"idle"|"inRun", buffer:[fix,...], cooldownUntil}
  fogCells: new Map(),  // R2/R4: h3Cell -> state (2="Visible"/skied; 1="Fog"/seen-from-a-viewpoint) — the player's own local mirror of player_fog_cell
  viewpoints: [],        // R4: [{zoneId,name,center:[lat,lon],cells:[h3cell,...]}]
  enteredViewpoints: new Set(), // zoneId set — a viewpoint grants once per session; the server's upgrade-only upsert makes a duplicate POST harmless but wasteful, so this avoids re-sending every fix while lingering at a viewpoint
  checkpoints: [],       // [{zoneId,name,center:[lat,lon],elevM}] — authored known-elevation spots; _tickCheckpoints subtracts between them for the headline daily vertical
  resortFullVerticalM: 0, // max(checkpointElevM) - min(checkpointElevM); 0 when <2 checkpoints => Layer 2 inert. Also the single-delta cap (a bigger drop between two hits = a missed checkpoint)
  checkpointVert: null,  // {day,total,lastElevM,lastAt,lastZoneId} mirror of localStorage["rq.checkpointVert"]; loaded in start()
  _cpCooldownUntil: {},  // zoneId -> ts; session-only per-checkpoint cooldown so one lingering pass can't re-credit a lap
  watchId: null,
  onRunLogged: null,    // callback(run) — fired after a run is successfully posted
  onFogUpdated: null,   // callback() — fired whenever fogCells grows, so an open map screen can redraw live
  onPosition: null,     // callback(p) — p = GPSFilter.push() output ({lon,lat,headingTravel,acc,…}); fired every fix so an open map can draw the live "you are here" avatar
  onShare: null,        // callback(p) — same p as onPosition; set by renderHome to POST /api/presence (throttled) while sharing-with-friends is on. Independent of onPosition so it survives Home<->Map navigation.
  onStatus: null,       // callback({ok,acc,t}|{ok:false,message}) — fired on every real fix AND on a geolocation error, so Home can show something other than silence when tracking "does nothing" (e.g. permission denied)
  onCoverage: null,     // R9 — callback(corridorName, pct, passed) — fired once per band exit (whether it logged a run or was discarded), so a partial/clipped crossing isn't silent the way a below-threshold discard otherwise would be
  onCheckpointVertical: null, // callback(totalM) — fired when _tickCheckpoints credits a descent, so Home's "Vertical today" tile ticks up live
  onNarrate: null,       // callback(sayText, zoneId) — fired once per band entry for a corridor with narration authored, wired up regardless of which screen (Home/My map) is showing

  // Battery Saver ("lift mode") — see setLiftModeOverride()/_setLiftModeActive().
  liftModeOverride: "auto", // "auto"|"on"|"off" — mirror of localStorage rq.liftMode, restored in start()
  liftModeActive: false,    // effective battery-saver state right now — the one thing consumers actually read
  onLiftModeChange: null,   // callback(active:boolean, reason:"auto"|"on"|"off") — set by renderFogMap() to pause/resume 3D+DeviceHeading while "My map" is open, nulled on #fogBack teardown; same on-slot convention as onShare/onStatus
  _liftRaw: false,          // last raw ChuteGuard.isOnLift() reading, pre-debounce — see _onFix()
  _liftRawSinceT: 0,        // fix.t the raw reading last changed — debounce clock, in fix time (not wall time) so it works the same for real GPS and simulateWalk()

  // Corridor Guard per-chute selection — see getGuardedCorridors()'s own
  // comment. Set of zoneIds (chute-guard.js corridorIds); restored from
  // localStorage in start(). This default (empty) only matters before
  // start() has run once.
  guardedCorridors: new Set(),
  // Toggles one corridor's armed state, persists it, and returns the new
  // state — the single choke point renderFogMap()'s press-and-hold handler
  // calls, so the map redraw + persistence always stay in sync.
  toggleGuardedCorridor(zoneId){
    if(this.guardedCorridors.has(zoneId)) this.guardedCorridors.delete(zoneId);
    else this.guardedCorridors.add(zoneId);
    setGuardedCorridors(Array.from(this.guardedCorridors));
    return this.guardedCorridors.has(zoneId);
  },

  async loadCorridors(){
    try{
      const bundle = await (await fetch(API+"/api/projects/"+encodeURIComponent(RQ_PROJECT_ID)+"/bundle")).json();
      if(bundle.error){ this.corridors=[]; this.viewpoints=[]; this.checkpoints=[]; this.resortFullVerticalM=0; return; }
      const ref = bundle.ref || [0,0];
      this.ref = ref;
      // R12 — the per-project "relevant activities" filter, injected
      // server-side into the bundle at read time (it's a project-row
      // column, not part of the published JSON — see worker.js's
      // GET /bundle handler). null = every activity allowed (backward
      // compat default, matches every project that predates this filter).
      this.allowedActivities = bundle.questActivities || null;
      // Workspace flag (same bundle.chuteGuardEnabled geofence-engine.html's
      // Tour Player already reads) — gates the off-course vibration/tone
      // warning wired into _onFix() below via chute-guard.js.
      this.chuteGuardEnabled = !!bundle.chuteGuardEnabled;
      // Injected server-side into the bundle at read time (worker.js's
      // GET /bundle handler) — "My map" draws the all-runs overlay only when
      // fog AND tile art are both off for the project.
      this.tileArtEnabled = !!bundle.tileArtEnabled;
      // Same live-owner injection — the workspace's 3D-terrain toggle. When
      // on, renderFogMap() drapes the fog/runs over DEM terrain and opens
      // the map pitched.
      this.threeDEnabled = !!bundle.threeDEnabled;
      // Same live-owner injection — 'summer' | 'winter' | null. My map applies
      // its winter treatment unless this is explicitly 'summer'.
      this.season = bundle.season || null;
      this.corridors = (bundle.zones||[]).map(z=>{
        const target = (z.layers||[]).find(l=>l.kind==="target" && l.geometry && l.geometry.type==="corridor");
        if(!target) return null;
        const path = target.geometry.path;
        let lengthM=0;
        for(let i=1;i<path.length;i++) lengthM += QGeo.haversineM(path[i-1], path[i]);
        return { zoneId:z.id, name:z.name||"Run", difficulty:z.difficulty||null, runType:z.runType||"run",
                 // activityType (hike/bike/xcountry/ski_chute/walking_city) sets the
                 // dash pattern on the fog-off "all runs" map. Authored in the Fence
                 // Editor; unused by scoring.
                 activityType:z.activityType||null,
                 // Authored descent (m) for this run — the corridor library's
                 // elev_loss_m, baked into geometry.descentM by the Fence
                 // Editor. A skied crossing scores on this x its coverage
                 // fraction, not a noisy GPS-altitude delta. null until
                 // Backfill Elevation has been run on the row.
                 descentM: target.geometry.descentM!=null ? target.geometry.descentM : null,
                 // Spoken narration (2026-09-17) — authored the same way as
                 // any other stop's say text (zoneToEngine bakes it onto the
                 // zone's own trigger, not corridor-specific), null if none
                 // was ever recorded/typed for this run. Spoken once per band
                 // entry by _tick() below.
                 say: (z.triggers && z.triggers[0] && z.triggers[0].say) || null,
                 widthM:target.geometry.widthM||10, path, lengthM, ref };
      }).filter(Boolean);
      // R4 — Viewpoint zones: a plain circle stop flagged isViewpoint, with
      // a precomputed viewshedCells list (staff-computed in Fence Editor,
      // never per-player/per-tick). center comes straight from zo.center
      // ([lat,lon], same convention every other zone here already uses).
      this.viewpoints = (bundle.zones||[]).filter(z=>z.isViewpoint && z.center && (z.viewshedCells||[]).length)
        .map(z=>({ zoneId:z.id, name:z.name||"Viewpoint", center:z.center, cells:z.viewshedCells }));
      // Elevation checkpoints — circle stops flagged isElevCheckpoint with a
      // numeric checkpointElevM. _tickCheckpoints subtracts a skier's
      // successive checkpoint elevations for the headline daily vertical.
      // resortFullVerticalM (max-min) is both the "is Layer 2 usable" gate
      // and the per-delta sanity cap.
      this.checkpoints = (bundle.zones||[]).filter(z=>z.isElevCheckpoint && z.center && typeof z.checkpointElevM==="number")
        .map(z=>({ zoneId:z.id, name:z.name||"Checkpoint", center:z.center, elevM:z.checkpointElevM }));
      const _ce = this.checkpoints.map(c=>c.elevM);
      this.resortFullVerticalM = _ce.length>=2 ? (Math.max.apply(null,_ce) - Math.min.apply(null,_ce)) : 0;
    }catch(e){ this.corridors=[]; this.viewpoints=[]; this.checkpoints=[]; this.resortFullVerticalM=0; }
  },

  // R2 — loads the player's already-revealed cells once (session start /
  // map open) so _revealFog() only ever POSTs genuinely NEW cells, not the
  // same disk every tick a player lingers in one spot.
  async loadFogCells(playerId){
    try{
      const j = await api("/api/players/"+playerId+"/fog");
      this.fogCells = new Map((j.cells||[]).map(c=>[c.h3_cell, c.state]));
    }catch(e){ /* keep whatever was already loaded (or empty) — a failed fetch here shouldn't block tracking */ }
  },

  start(onRunLogged, onFogUpdated, onStatus, selectedActivity, onCoverage){
    this.onRunLogged = onRunLogged;
    this.onFogUpdated = onFogUpdated || null;
    this.onStatus = onStatus || null;
    this.onCoverage = onCoverage || null;
    // R8 — defaults to "ski" so anyone who never touches the activity
    // picker (or an older cached page) gets today's exact existing
    // behavior, unchanged.
    this.selectedActivity = selectedActivity || "ski";
    this.states = {};
    // Elevation-checkpoint running total: restore what was persisted (a
    // reload mid-day resumes it); _tickCheckpoints resets it itself when the
    // stored day-bucket no longer matches. Per-checkpoint cooldowns are
    // session-only — a fresh session may legitimately re-hit a checkpoint.
    this.liftModeOverride = localStorage.getItem("rq.liftMode") || "auto";
    this.liftModeActive = false;
    this._liftRaw = false;
    this._liftRawSinceT = 0;
    this.guardedCorridors = new Set(getGuardedCorridors());
    this.checkpointVert = getCheckpointVert();
    this._cpCooldownUntil = {};
    this._cpLastPostAt = 0;
    GPSFilter.reset();
    if(!navigator.geolocation) return false;
    this.watchId = navigator.geolocation.watchPosition(
      pos=>this._onFix(pos),
      // A denied/unavailable permission used to vanish silently here — the
      // button flips to "Stop tracking" and nothing ever happens again,
      // indistinguishable from a real bug. Surface it instead.
      //
      // Real bug, 2026-09-17: watchPosition() (above) already returns a real
      // watch id SYNCHRONOUSLY the moment it's called, before the browser has
      // even asked for permission — so this.watchId gets set, active()
      // reports true, and the Home screen's activity picker permanently
      // disables itself (see its own "disabled while tracking" comment),
      // regardless of whether the fix ever actually arrives. PERMISSION_DENIED
      // (code 1) is unrecoverable without the visitor changing a browser/OS
      // setting — watchPosition keeps re-firing this same error forever, so
      // without this, the activity picker (confirmed live: "stuck" on
      // whichever activity was selected when the prompt was denied/dismissed)
      // and the Start/Stop button both stay wedged in "tracking" state with
      // no way out except reloading the page. stop() here clears watchId so
      // active() correctly reports false again; stopped:true on the status
      // payload lets the host page's onStatus reset the button/picker UI to
      // match. POSITION_UNAVAILABLE/TIMEOUT (codes 2/3) are left alone — those
      // are often transient mid-walk GPS dropouts the watch can still recover
      // from on its own, and killing tracking on the first one would be worse
      // than the bug this fixes.
      err=>{
        const denied = err && err.code===1;
        if(denied) this.stop();
        if(this.onStatus) this.onStatus({ok:false, message: err && err.message ? err.message : "location error (code "+(err&&err.code)+")", stopped:denied});
      },
      { enableHighAccuracy:true, maximumAge:2000, timeout:15000 }
    );
    return true;
  },
  stop(){
    if(this.watchId!=null){ navigator.geolocation.clearWatch(this.watchId); this.watchId=null; }
    // Flush the checkpoint total one last time (unthrottled) so a session
    // that ends between throttled posts still lands its final number.
    if(this.checkpointVert && this.checkpointVert.total>0) this._reportCheckpointVertical(this.checkpointVert.total, true);
  },
  active(){ return this.watchId!=null; },

  // Battery Saver ("lift mode") — user-facing 3-way override, driven from
  // the #fogBattery button on "My map". Always toasts (via rqToast) on a
  // real change of mode, since this is a deliberate user action — distinct
  // from _setLiftModeActive's own toast, which only fires for an AUTO
  // transition (the effective on/off state actually flipping).
  setLiftModeOverride(mode){
    if(mode!=="auto" && mode!=="on" && mode!=="off") return;
    this.liftModeOverride = mode;
    localStorage.setItem("rq.liftMode", mode);
    if(typeof rqToast==="function") rqToast(
      mode==="on" ? "🔋 Battery Saver: Always On" :
      mode==="off" ? "Battery Saver: Always Off" :
      "Battery Saver: Auto"
    );
    if(mode==="on") this._setLiftModeActive(true, "on");
    else if(mode==="off") this._setLiftModeActive(false, "off");
    // "auto" is left alone here — the debounced check in _onFix() (driven
    // by real position, via the already-warm _liftRaw/_liftRawSinceT) picks
    // the effective state back up on its own, no need to force it here.
  },

  // The one place liftModeActive actually changes. No-ops if the state
  // isn't actually changing (both to avoid redundant onLiftModeChange calls
  // every single fix while override is "on"/"off", and so an "auto"
  // transition's toast only fires on a genuine flip, not every tick that
  // happens to re-confirm the same state).
  _setLiftModeActive(active, reason){
    if(this.liftModeActive === active) return;
    this.liftModeActive = active;
    // Chute Guard's own 200ms sync poll (chuteGuardStartSync/Stop) is pure
    // waste while on a lift — ChuteGuard itself already refuses to sound an
    // alarm in that state (see chute-guard.js's lift gate), this just stops
    // spending CPU checking. Only restart it if tracking is actually still
    // on — a lift-mode flip landing right as/after Stop tracking shouldn't
    // resurrect the interval.
    if(typeof chuteGuardStopSync==="function" && typeof chuteGuardStartSync==="function"){
      if(active) chuteGuardStopSync();
      else if(this.active()) chuteGuardStartSync();
    }
    if(reason==="auto" && typeof rqToast==="function"){
      rqToast(active ? "🔋 Battery Saver on — lift detected" : "Battery Saver off — tracking resumed");
    }
    if(this.onLiftModeChange) this.onLiftModeChange(active, reason);
  },

  _onFix(pos){
    const c=pos.coords;
    const fix = { lat:c.latitude, lon:c.longitude, acc:c.accuracy||30, t:pos.timestamp||Date.now(),
                  alt: c.altitude!=null ? c.altitude : null, altAcc: c.altitudeAccuracy!=null ? c.altitudeAccuracy : null };
    const p = GPSFilter.push(fix);
    // Feed the avatar FIRST — its site gate flips Quest._offsite and keeps
    // re-evaluating the boundary so tracking resumes on return.
    if(this.onPosition) this.onPosition(p);   // live avatar on an open map
    if(Quest._offsite){
      if(this.onStatus) this.onStatus({ok:true, acc:fix.acc, t:fix.t, offsite:true});
      return;   // off the run network: no corridor ticks, no fog reveal, no sharing
    }
    this.corridors.forEach(corridor=>this._tick(corridor, p, this.selectedActivity));
    // Off-course chute warning — travel heading, not device compass, same
    // "phone in a pocket" reasoning Guidance Bot already uses elsewhere in
    // this codebase (a stationary/paused compass reading would falsely gate
    // "engaged" on or off regardless of whether the skier is actually moving
    // along the line).
    if(typeof ChuteGuard!=="undefined"){
      ChuteGuard.tick({lat:p.lat,lon:p.lon,acc:p.acc,speed:p.speed,t:fix.t}, p.headingTravel);
      // Battery Saver ("lift mode") — keep the raw on-lift reading warm on
      // EVERY real fix regardless of override, so switching the override
      // back to "auto" later reflects near-real-time state rather than
      // starting the debounce window cold. Only actually drives
      // liftModeActive when override is "auto" — "on"/"off" force it
      // unconditionally every tick (cheap no-op via _setLiftModeActive's own
      // equality check once already in that state).
      const onLift = ChuteGuard.isOnLift();
      if(onLift !== this._liftRaw){ this._liftRaw = onLift; this._liftRawSinceT = fix.t; }
      if(this.liftModeOverride==="on") this._setLiftModeActive(true, "on");
      else if(this.liftModeOverride==="off") this._setLiftModeActive(false, "off");
      else if(fix.t - this._liftRawSinceT >= LIFT_MODE_DEBOUNCE_MS) this._setLiftModeActive(this._liftRaw, "auto");
      // Sync eagerly on every real fix, not just the 200ms poll timer — see
      // fence-editor.html's identical call site for the bug this fixes (a
      // real back-inside tick landed but the tone didn't stop for ~1.7s,
      // since nothing forced an immediate re-check). The timer stays as the
      // staleness backstop for when fixes STOP arriving.
      syncCgAlarm();
    }
    this._revealFog(p, fix.acc);
    this._tickViewpoints(p);
    this._tickCheckpoints(p);
    if(this.onStatus) this.onStatus({ok:true, acc:fix.acc, t:fix.t});
    if(this.onShare) this.onShare(p);         // share own position with friends (throttled inside)
  },

  // ---- DEV/TEST-ONLY: simulate a walk without real GPS -----------------
  // Requested directly ("we need to be able to test this... in the edit
  // test code") after "start tracking does nothing" turned out to mean
  // "nothing happens at a desk with no real movement" — expected, not a
  // bug, but there was no way to exercise the game loop without walking
  // outside. Deliberately built HERE, not as a Fence Editor Test Mode
  // integration: Test Mode driving this would need its own copy of the
  // corridor detector (the exact 3-file-mirror trap this repo's CLAUDE.md
  // already warns about), and still wouldn't exercise the real page, the
  // real player auth, or the real /api/quest-runs + fog persistence calls.
  // Feeding synthetic fixes through the SAME _onFix() the real GPS path
  // uses (including through GPSFilter, not bypassing it) exercises the
  // actual shipped code end-to-end instead of a parallel simulation.
  _simCancelled: false,
  simulateWalk(speedMps, onProgress, onDone, selectedActivity){
    this._simCancelled = false;
    // R8 — defaults to whatever a prior start() set (or "ski") so existing
    // callers/tests that don't pass a fourth arg keep working unchanged.
    this.selectedActivity = selectedActivity || this.selectedActivity || "ski";
    const corridor = this.corridors[0];
    if(!corridor || !corridor.path || corridor.path.length<2){ onDone && onDone("no corridor loaded to walk"); return; }
    const path = corridor.path; // [[lat,lon],...]
    // Resample the path into ~5m steps so speed/timing is controllable,
    // independent of however densely the authored path was drawn.
    const STEP_M = 5;
    const pts=[];
    for(let i=1;i<path.length;i++){
      const a=path[i-1], b=path[i];
      const segM = QGeo.haversineM(a,b);
      const steps = Math.max(1, Math.round(segM/STEP_M));
      for(let s=0;s<steps;s++){
        const f=s/steps;
        pts.push([ a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f ]);
      }
    }
    pts.push(path[path.length-1]);
    this.states = {};
    GPSFilter.reset();
    let i=0, simT=Date.now();
    const stepDtMs = (STEP_M/speedMps)*1000; // simulated time between resampled points
    const tick=()=>{
      if(this._simCancelled) return;
      if(i>=pts.length){ onDone && onDone(null); return; }
      const [lat,lon]=pts[i];
      simT += stepDtMs;
      this._onFix({ coords:{ latitude:lat, longitude:lon, accuracy:8, altitude:null, altitudeAccuracy:null }, timestamp: simT });
      i++;
      if(onProgress) onProgress(i, pts.length);
      setTimeout(tick, 120); // wall-clock pace — fast enough a 400m walk finishes in seconds
    };
    tick();
  },
  cancelSim(){ this._simCancelled = true; },

  // R4 — Viewpoint entry: a plain distance-to-center check (a viewpoint is
  // a spot to stand at, not a zone to cross — no corridor-style band
  // needed). Fires the grant once per session per viewpoint via
  // enteredViewpoints; the server's own upgrade-only upsert would make a
  // repeat POST harmless, this just avoids sending one on every fix while
  // lingering there.
  _tickViewpoints(p){
    this.viewpoints.forEach(vp=>{
      if(this.enteredViewpoints.has(vp.zoneId)) return;
      if(QGeo.haversineM([p.lat,p.lon], vp.center) > QUEST_TUNING.VIEWPOINT_RADIUS_M) return;
      this.enteredViewpoints.add(vp.zoneId);
      this._grantViewshed(vp);
    });
  },

  // R4 — grants a viewpoint's precomputed cell-set at state=1 ("Fog"/seen).
  // Local dedupe must be STATE-AWARE and must never downgrade: a cell
  // already locally at state 2 (actually skied) stays 2 — Math.max, not an
  // overwrite. The server's own MAX() upsert protects the DB regardless,
  // but the local fogCells Map is what the map renderer trusts, so it needs
  // the same invariant. Chunked to FOG_CELLS_POST_CHUNK per call —
  // /api/fog-cells caps at 500 cells/request and a full viewshed can be
  // 1000-2000 cells.
  _grantViewshed(vp){
    const newCells = vp.cells.filter(cell => (this.fogCells.get(cell)||0) < 1);
    if(!newCells.length) return;
    newCells.forEach(cell => this.fogCells.set(cell, Math.max(this.fogCells.get(cell)||0, 1)));
    if(this.onFogUpdated) this.onFogUpdated();
    for(let i=0; i<newCells.length; i+=QUEST_TUNING.FOG_CELLS_POST_CHUNK){
      const chunk = newCells.slice(i, i+QUEST_TUNING.FOG_CELLS_POST_CHUNK);
      api("/api/fog-cells", { method:"POST", body: JSON.stringify({ cells:chunk, state:1 }) }).catch(()=>{});
    }
  },

  // Headline daily vertical, measured by SUBTRACTION between authored
  // known-elevation checkpoints the skier passes — GPS altitude is never
  // consulted. Keeps a guarded "last known elevation": each new checkpoint
  // credits (lastElevM - thisElevM) to the day total if that's a descent,
  // then re-anchors. Guards: only descent counts (a lift/bootpack up credits
  // nothing); a single delta is capped at resortFullVerticalM (a bigger drop
  // ⇒ a checkpoint was missed); a gap over CHECKPOINT_STALE_MS just
  // re-anchors (lunch / lift maze / overnight aren't one descent); the total
  // resets when the day-bucket rolls. Persisted so a mid-day reload resumes.
  _tickCheckpoints(p){
    if(this.resortFullVerticalM <= 0 || !this.checkpoints.length) return; // <2 checkpoints authored — Layer 2 inert
    const now = p.t || Date.now();
    const dayKey = questDateBucketClient(new Date(now));
    let st = this.checkpointVert;
    if(!st || st.day !== dayKey){
      st = { day: dayKey, total: 0, lastElevM: null, lastAt: null, lastZoneId: null };
      this.checkpointVert = st;
    }
    let credited = false;
    for(const cp of this.checkpoints){
      if(QGeo.haversineM([p.lat,p.lon], cp.center) > QUEST_TUNING.CHECKPOINT_RADIUS_M) continue;
      if(now < (this._cpCooldownUntil[cp.zoneId] || 0)) continue;
      this._cpCooldownUntil[cp.zoneId] = now + QUEST_TUNING.CHECKPOINT_COOLDOWN_MS;
      if(st.lastElevM != null && st.lastZoneId !== cp.zoneId && (now - st.lastAt) <= QUEST_TUNING.CHECKPOINT_STALE_MS){
        const drop = st.lastElevM - cp.elevM;                 // descent positive
        if(drop > 0){ st.total += Math.min(drop, this.resortFullVerticalM); credited = true; }
      }
      st.lastElevM = cp.elevM; st.lastAt = now; st.lastZoneId = cp.zoneId;
    }
    setCheckpointVert(st);
    if(credited){
      if(this.onCheckpointVertical) this.onCheckpointVertical(st.total);
      this._reportCheckpointVertical(st.total, true);
    } else if(st.total > 0){
      this._reportCheckpointVertical(st.total, false); // throttled keep-alive so a dropped credit-POST still lands
    }
  },

  // POST the running day total. Throttled ~10s like the presence ping;
  // `force` (a credit just happened, or stop()) bypasses the throttle. The
  // server upserts with MAX(), so a dropped or out-of-order post is harmless.
  _reportCheckpointVertical(totalM, force){
    const now = Date.now();
    if(!force && (now - (this._cpLastPostAt || 0) < 10000)) return;
    this._cpLastPostAt = now;
    api("/api/quest-day-vertical", { method:"POST", body: JSON.stringify({ verticalM: Math.round(totalM) }) }).catch(()=>{});
  },

  // R2 — H3 disk-reveal: mark the fix's own cell plus its k=1 ring (7 cells,
  // ~200m across — the "torch radius" absorbing normal GPS jitter, per the
  // plan's Fog-of-World precedent) as state=2 ("Visible"). Confidence-gated
  // on fix.acc, same "no data = pass, don't act on garbage" convention
  // TUNING.ACCURACY_CAP_M already uses in geofence-engine.html. Only NEW
  // cells (not already in this.fogCells) get POSTed — revisiting already-
  // revealed terrain is a local no-op, not a wasted network call.
  _revealFog(p, acc){
    if(acc > QUEST_TUNING.ACCURACY_CAP_M) return;
    if(typeof h3 === "undefined") return; // CDN script blocked/offline — fail safe, no reveal rather than throw
    const origin = h3.latLngToCell(p.lat, p.lon, QUEST_TUNING.FOG_RESOLUTION);
    const disk = h3.gridDisk(origin, 1);
    const newCells = disk.filter(cell => (this.fogCells.get(cell)||0) < 2);
    if(!newCells.length) return;
    newCells.forEach(cell => this.fogCells.set(cell, 2));
    if(this.onFogUpdated) this.onFogUpdated();
    api("/api/fog-cells", { method:"POST", body: JSON.stringify({ cells:newCells, state:2 }) }).catch(()=>{});
  },

  _tick(corridor, p, selectedActivity){
    const st = this.states[corridor.zoneId] || (this.states[corridor.zoneId] = { phase:"idle", buffer:[], cooldownUntil:0 });
    if(Date.now() < st.cooldownUntil) return;
    // Hysteresis (see QUEST_TUNING.NARRATE_HYSTERESIS_M): while already
    // in-run, a fix has to be clearly PAST the edge (dist >= +margin) to
    // count as exiting; while idle, a fix has to be clearly INSIDE
    // (dist < -margin) to count as (re-)entering. A single dist<0 boundary
    // with no tolerance let ordinary GPS jitter right at the line flip
    // idle<->inRun back and forth, re-speaking the corridor's narration on
    // what was really just noise near the far edge, not a genuine re-entry.
    //
    // Bug fixed 2026-09 (field report: "the voice does not announce the
    // corridor" — a real road test on a narrow corridor): corridorDist()'s
    // minimum possible value is -halfWidth (standing exactly on the
    // centerline), so a FIXED 3m entry margin made entry mathematically
    // impossible for any corridor narrower than 6m wide — this project's
    // "test Chute" is only 4m wide (halfWidth 2m), so dist could never go
    // below -2, and the entry condition (dist< -3) never once fired. Margin
    // is now capped to half the corridor's own half-width, so entry always
    // has room to be satisfied regardless of how narrow the corridor is.
    const halfW = (corridor.widthM||10)/2;
    const margin = Math.min(QUEST_TUNING.NARRATE_HYSTERESIS_M, halfW*0.5);
    const dist = QGeo.corridorDist([p.lat,p.lon], corridor, corridor.ref);
    const inBand = st.phase==="inRun"
      ? dist < margin
      : dist < -margin;
    if(st.phase==="idle" && inBand){
      st.phase="inRun"; st.buffer=[p];
      // Spoken narration (2026-09-17) — fires once per band entry, same
      // moment the Tour Player's own zone.fires_on:"enter" trigger would.
      // Cooldown-gated the same as everything else in this state machine
      // (st.cooldownUntil, set on exit below), so re-entering right after
      // leaving doesn't re-speak.
      if(corridor.say && this.onNarrate) this.onNarrate(corridor.say, corridor.zoneId);
    } else if(st.phase==="inRun" && inBand){
      st.buffer.push(p);
    } else if(st.phase==="inRun" && !inBand){
      st.buffer.push(p);
      this._classifyAndLog(corridor, st.buffer, selectedActivity);
      st.phase="idle"; st.buffer=[]; st.cooldownUntil=Date.now()+QUEST_TUNING.COOLDOWN_MS;
    }
  },

  _classifyAndLog(corridor, buffer, selectedActivity){
    if(buffer.length<2) return;
    const first=buffer[0], last=buffer[buffer.length-1];
    const durationS = (last.t-first.t)/1000;
    // R12 — MAX_DURATION_S alone (90 min) silently discarded real long
    // corridor crossings: a genuinely long trail confirmed to take longer
    // than 90 min at a plausible pace (demonstrated live, 2026-08-19, on a
    // ~9.9km corridor at ski pace) would exceed it and vanish with no
    // feedback, indistinguishable from a real GPS-stuck failure. Scale the
    // cap by the corridor's OWN length instead of discarding on a fixed
    // ceiling — 0.5 m/s (~1.8 km/h) is an implausibly slow floor pace, so
    // this only ever RAISES the cap for long corridors, never lowers it for
    // short ones (Math.max keeps the original 90-min floor).
    const maxDurationS = Math.max(QUEST_TUNING.MAX_DURATION_S, (corridor.lengthM||0) / 0.5);
    if(durationS < QUEST_TUNING.MIN_DURATION_S || durationS > maxDurationS) return;

    // R9 — tripline fix: gate on how much of THIS corridor's own length the
    // crossing actually covered, not just whether the band was entered and
    // exited at all. A bowl traverse that clips 3 nearby chutes' bands only
    // covers a sliver of each one's length; a real descent of one covers
    // nearly all of it. See QUEST_TUNING.CORRIDOR_* for the tunable knobs.
    const coverage = QGeo.corridorCoverage(corridor, buffer, QUEST_TUNING.CORRIDOR_SAMPLE_STEP_M, QUEST_TUNING.CORRIDOR_GPS_TOLERANCE_M);
    const coveragePassed = coverage >= QUEST_TUNING.CORRIDOR_COMPLETION_PCT;
    if(this.onCoverage) this.onCoverage(corridor.name, coverage, coveragePassed);
    if(!coveragePassed) return;

    // Direction: which drawn endpoint (path[0]="top" vs path[last]="bottom",
    // by authoring convention) the player was nearer to at entry vs exit —
    // no authored top/bottom triplines needed (R1's scope simplification).
    const endTop = corridor.path[0], endBottom = corridor.path[corridor.path.length-1];
    const nearTop = (pt)=> QGeo.haversineM([pt.lat,pt.lon], endTop) < QGeo.haversineM([pt.lat,pt.lon], endBottom);
    const descending = nearTop(first) && !nearTop(last);
    const ascending = !nearTop(first) && nearTop(last);

    let distanceM=0;
    for(let i=1;i<buffer.length;i++) distanceM += QGeo.haversineM([buffer[i-1].lat,buffer[i-1].lon],[buffer[i].lat,buffer[i].lon]);
    const speeds = buffer.map(p=>p.speed||0);
    const avgSpeedMps = speeds.reduce((a,b)=>a+b,0)/speeds.length;
    const maxSpeedMps = Math.max.apply(null, speeds);
    // verticalM (which feeds POINTS) is assigned after the activity block
    // below — it depends on the classified activity.

    // R8 — selectedActivity is the player's own manual choice (Ski/Hike/
    // Bike/Drive on Home) and is now the PRIMARY driver of classification,
    // with three exceptions that stay authoritative regardless of what was
    // selected: a lift is mechanized transport, physically detected by
    // ascending a runType:"lift" corridor, not something you can "select"
    // your way out of; a corridor the author explicitly marked
    // runType:"hike" (a real hiking-only trail) stays hike even if a fast
    // trail-runner briefly clears the ski-speed threshold on it; and a
    // corridor marked runType:"chute" (expert-only technical ski terrain by
    // definition — Chute Guard exists specifically because these are narrow
    // and consequential) always counts as ski, the same way — real bug,
    // 2026-09-17: without this, the generic speed/direction heuristic below
    // silently downgraded a completed chute to "hike" any time it was
    // skied cautiously/slowly (sideslipping a tight line, a low-vis lap) or
    // walked for testing, confirmed live on a real chute corridor that
    // registered as a hike in the leaderboard despite being authored and
    // rendered as a chute everywhere else.
    let activity;
    if(corridor.runType==="lift"){
      if(!ascending) return; // downhill lift-line foot traffic isn't a lift ride
      activity="lift";
    } else if(corridor.runType==="hike"){
      activity="hike";
    } else if(corridor.runType==="chute"){
      activity="ski";
    } else if(selectedActivity==="hike" || selectedActivity==="drive" || selectedActivity==="xcski"){
      // xcski (Nordic/cross-country) goes here, not in the ski branch below:
      // Nordic terrain is flat/rolling, so the ski branch's `descending &&`
      // speed-gate would misclassify a real xc outing as hike almost every
      // time — like hike/drive, it's a manual selection with no auto-detect.
      activity=selectedActivity; // manual override, no speed check
    } else if(selectedActivity==="bike"){
      activity = (descending && avgSpeedMps >= QUEST_TUNING.BIKE_SPEED_MIN_MPS) ? "bike" : "hike";
    } else {
      activity = (descending && avgSpeedMps >= QUEST_TUNING.SKI_SPEED_MIN_MPS) ? "ski" : "hike";
    }

    // Vertical for scoring. Ski/hike score on descent, so use the corridor's
    // AUTHORED descent (corridor.descentM, the library's elev_loss_m) scaled
    // by how much of the run was actually covered — deterministic, GPS-
    // altitude-independent, and never null when the run has an authored
    // descent (which killed the old "no altitude fix => 0 points" bug). Sign
    // is negative to match every Math.abs() consumer downstream. Falls back
    // to the legacy smoothed-GPS-altitude delta only for corridors with no
    // authored descent yet. lift = transport (0 pts regardless); bike/drive/
    // xcski score on distanceM, so vertical is deliberately null for them.
    let verticalM;
    if(activity==="lift" || activity==="bike" || activity==="drive" || activity==="xcski"){
      verticalM = null;
    } else if(corridor.descentM != null){
      verticalM = -Math.round(corridor.descentM * coverage);
    } else {
      verticalM = (first.alt!=null && last.alt!=null) ? (last.alt-first.alt) : null;
    }

    const run = {
      zoneId: corridor.zoneId, runName: corridor.name, difficulty: corridor.difficulty, runType: corridor.runType,
      activity, startedAt: new Date(first.t).toISOString(), endedAt: new Date(last.t).toISOString(),
      durationS, verticalM, distanceM: Math.round(distanceM), avgSpeedMps, maxSpeedMps
    };
    // A failed save here used to vanish silently (bare .catch(()=>{})) — the
    // ONLY feedback a player got about this crossing was onCoverage firing
    // moments ago with passed:true, which is now misleading if the save
    // itself then fails (network blip, server error). onSaveError lets Home
    // correct that with a visible message instead of a run just disappearing
    // with no explanation.
    api("/api/quest-runs", { method:"POST", body: JSON.stringify(run) })
      .then(()=>{ if(this.onRunLogged) this.onRunLogged(run); })
      .catch(()=>{ if(this.onSaveError) this.onSaveError(corridor.name); });
  }
};

/* ============================ HOME ============================ */
function fmtDuration(s){
  s=Math.round(s); const m=Math.floor(s/60), r=s%60;
  return m+":"+String(r).padStart(2,"0");
}
// R3-core — mirrors worker.js's questDateBucket() exactly (fixed -7h,
// non-DST-aware — see the plan's day-bucket note): used client-side only to
// find "today's" row in the /stats response, not to compute anything sent
// to the server.
function questDateBucketClient(date){
  return new Date(date.getTime()-7*3600000).toISOString().slice(0,10);
}
// Mirrors worker.js's questSeasonId() exactly (same fixed -7h shift, Sept
// rollover): used client-side only to sum "this season" from the /stats
// day rows, not for anything sent to the server.
function questSeasonIdClient(date){
  const d = new Date(date.getTime()-7*3600000);
  const y = d.getUTCFullYear(), m = d.getUTCMonth()+1;
  return m>=9 ? (y+"-"+(y+1)) : ((y-1)+"-"+y);
}
// Groups same-named runs into one row with a ×N counter (2026-09-17) —
// previously every lap of the same run got its own full line, which read as
// noisy repetition rather than "you skied this N times" the way the
// existing "Your chutes" screen (chuteRowHtml, Today/Season toggle) already
// shows chutes specifically. This brings the same treatment to Home's plain
// "Today" list, which covers every activity, not just chutes. Order is
// preserved from the input (most-recent-first, same as the server's own
// ORDER BY started_at DESC) — the first occurrence of a name sets its
// display fields (activity/difficulty), later occurrences just add to the
// running totals.
function groupRuns(runs){
  const map = new Map();
  (runs||[]).forEach(r=>{
    const name = r.run_name || r.runName || "Run";
    const verticalM = r.vertical_m!=null ? r.vertical_m : r.verticalM;
    const distanceM = r.distance_m!=null ? r.distance_m : r.distanceM;
    const durationS = r.duration_s!=null ? r.duration_s : r.durationS;
    let g = map.get(name);
    if(!g){
      g = { name, activity:r.activity, count:0, pointsSum:0, durationSum:0,
            // null stays null (not 0) when this activity never carries a
            // vertical/distance figure at all, so groupedRunRowHtml's own
            // R8 "which one did this activity actually earn from" choice
            // still works the same way runRowHtml's did per-run.
            verticalSum: verticalM!=null ? 0 : null, distanceSum: distanceM!=null ? 0 : null,
            anyPowder:false };
      map.set(name, g);
    }
    g.count++;
    g.pointsSum += (r.points||0);
    g.durationSum += (durationS||0);
    if(g.verticalSum!=null && verticalM!=null) g.verticalSum += Math.abs(verticalM);
    if(g.distanceSum!=null && distanceM!=null) g.distanceSum += distanceM;
    if((r.snow_bonus!=null?r.snow_bonus:1) > 1) g.anyPowder = true;
  });
  return [...map.values()];
}
function groupedRunRowHtml(g){
  const meta = [
    fmtDuration(g.durationSum),
    (g.verticalSum!=null ? Math.round(g.verticalSum)+"m vert"
      : (g.distanceSum!=null ? (Math.round(g.distanceSum/100)/10)+"km" : null)),
  ].filter(Boolean).join(" · ");
  const activityLabel = (QUEST_ACTIVITIES.find(a=>a.key===g.activity)||{}).label || g.activity;
  return '<div class="runrow"><span class="badge '+esc(g.activity)+'">'+esc(activityLabel)+'</span>'
    +'<span class="name">'+esc(g.name)+(g.anyPowder?' ❄':'')+(g.count>1?' ×'+g.count:'')+'</span>'
    +'<span class="meta">'+esc(meta)+(g.pointsSum?' · +'+g.pointsSum+' pts':'')+'</span></div>';
}
async function refreshRuns(playerId){
  const listEl=document.getElementById("todayRuns");
  if(!listEl) return;
  try{
    const j = await api("/api/players/"+playerId+"/runs");
    const today = new Date().toDateString();
    const todays = (j.runs||[]).filter(r=>new Date(r.started_at).toDateString()===today);
    const grouped = groupRuns(todays);
    listEl.innerHTML = grouped.length
      ? grouped.map(groupedRunRowHtml).join("")
      : '<div class="empty">No runs logged yet today.</div>';
  }catch(e){
    listEl.innerHTML = '<div class="empty">Couldn’t load runs.</div>';
  }
}
// R3-core — today's points/vertical tiles + current streak, both derived
// client-side from GET /api/players/:id/stats's day rows (not stored/
// computed server-side — see the plan's streak-derivation note).
async function refreshStats(playerId){
  const tilesEl=document.getElementById("statsTiles");
  const streakEl=document.getElementById("statsStreak");
  if(!tilesEl) return;
  try{
    const j = await api("/api/players/"+playerId+"/stats");
    const days = j.days||[];
    const byDate = {}; days.forEach(d=>{ byDate[d.date]=d; });
    const todayKey = questDateBucketClient(new Date());
    const today = byDate[todayKey] || { points:0, checkpoint_vertical_m:0 };
    let streak=0, cursor=new Date();
    for(;;){
      const key = questDateBucketClient(cursor);
      const row = byDate[key];
      if(!row || (row.runs_count<=0 && row.lift_rides<=0 && row.hikes<=0)) break;
      streak++;
      cursor = new Date(cursor.getTime()-24*3600000);
    }
    // Headline vertical is checkpoint-measured (see Quest._tickCheckpoints),
    // not the run-summed vertical_m — the latter still feeds points and the
    // per-activity leaderboard "m vert". "This season" sums the same
    // checkpoint column across the current season's day rows (the /stats
    // response already carries a whole season, ~200 rows max).
    const seasonId = questSeasonIdClient(new Date());
    const seasonVert = days.filter(d=>d.season_id===seasonId)
                           .reduce((sum,d)=>sum+(d.checkpoint_vertical_m||0), 0);
    tilesEl.innerHTML =
      '<div class="now">'
      +'<div class="stat"><b>'+Math.round(today.points||0)+'</b><span>Points today</span></div>'
      +'<div class="stat vtoday"><b>'+Math.round(Math.abs(today.checkpoint_vertical_m||0))+'m</b><span>Vertical today</span></div>'
      +'<div class="stat"><b>'+Math.round(seasonVert)+'m</b><span>This season</span></div>'
      +'</div>';
    if(streakEl) streakEl.textContent = streak>0 ? streak+"-day streak" : "";
  }catch(e){
    tilesEl.innerHTML='';
  }
}
// Chute Guard, wired into Ridge Quest's own live tracking (2026-09-17) —
// previously only ever ran inside the separate narrated Tour Player
// (geofence-engine.html), so it never fired for anyone just using Ridge
// Quest's own Start Tracking / My map flow, confirmed live as "no vibration
// when I go out of bounds" even on a corridor correctly authored as a chute.
//
// Adapts Quest.corridors' own flat {runType,widthM,path,...} shape (see its
// own comment at the top of the Quest object) into the {id,name,runType,
// layers:[{geometry:{type:'corridor',path,widthM}}]} shape chute-guard.js's
// load() expects — the exact shape a published bundle's zones already have,
// which Quest.corridors was itself built FROM (loadCorridors() reads
// target.geometry.path/widthM out of the same zones array), so this is a
// re-wrap, not a re-fetch or a re-derivation.
function chuteGuardZonesFor(corridors){
  return (corridors||[]).map(c=>({ id:c.zoneId, name:c.name, runType:c.runType, activityType:c.activityType,
    layers:[{ geometry:{ type:"corridor", path:c.path, widthM:c.widthM } }] }));
}
// Corridor Guard audio — a continuous alarm while the player is outside a
// corridor, not a one-shot blip. See chute-guard.js for the detection state
// machine (per-fix "still outside" signal + escalation level + committed-
// exit detection); everything below is the host's job of turning that
// per-fix signal into something actually audible/felt, and keeping it
// sounding continuously between GPS fixes (which can be several seconds
// apart) until chute-guard.js says to stop.
//
// iOS Safari/Chrome have no Vibration API at all (Apple has never
// implemented it) — same fallback geofence-engine.html's Audio.rumble()
// already uses there, reimplemented here standalone since this page has no
// shared Audio object of its own (no spatial voice, no ambient beds — the
// narration playback below is separate and simpler, just one <audio>
